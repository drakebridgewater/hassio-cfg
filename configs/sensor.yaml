###########################################
# rest integration
###########################################
- platform: rest
  name: YeeSite Bar State
  resource: "http://10.0.0.10:5003/api/lamps/yeesite-bar"
  value_template: "{{ value_json.state }}"
  json_attributes:
    - brightness
    - color
    - white
    - effect
    - effect_list
    - effect_speed
    - rgb_dimmer
    - white_dimmer
    - color_strobe_rate
    - white_strobe_rate
  scan_interval: 5

###########################################
# Next Holiday integration
###########################################
- platform: next_holiday
  min_future_holidays: 3
  custom_holidays:
    "1-4": "Ethan's Birthday"
    "2-7": "Drake's Birthday"
    "2-14": "Valentines Day"
    "10-13": "Shawna's Birthday"
    "10-31": "Halloween"
  sources:
    - country: "USA"
      state: "OR"
      exclude:
        - "washington's birthday"
        - "veterans day"

###########################################
# Power usage
###########################################
- platform: min_max
  name: Current Power Hog
  entity_ids:
    - sensor.always_on_usage
    - sensor.dryer_usage
    - sensor.fridge_usage
    - sensor.oven_usage
    - sensor.stove_usage

###########################################
# Indoor Temperatures
###########################################
- platform: min_max
  name: Max Temperature Indoors
  type: max
  round_digits: 1
  entity_ids:
    - sensor.acurite_tower_family_room_temperature
    - sensor.thermostat_temperature
    - sensor.outdoor_sensor_display_in_office_temperature
    - sensor.living_room_temperature_sensor_temperature
    - sensor.wirelesstag_main_freezer_temperature
    - sensor.master_bedroom_temperature_temperature
    - sensor.ethans_bedroom_temperature_sensor_temperature
    - sensor.family_room_smartsensor_temperature

- platform: min_max
  name: Min Temperature Indoors
  type: min
  round_digits: 1
  entity_ids:
    - sensor.acurite_tower_family_room_temperature
    - sensor.thermostat_temperature
    - sensor.outdoor_sensor_display_in_office_temperature
    - sensor.living_room_temperature_sensor_temperature
    - sensor.wirelesstag_main_freezer_temperature
    - sensor.master_bedroom_temperature_temperature
    - sensor.ethans_bedroom_temperature_sensor_temperature
    - sensor.family_room_smartsensor_temperature

###########################################
# Date time display options
###########################################
- platform: time_date
  display_options:
    - "time"
    - "date"
    - "date_time"
    - "date_time_utc"
    - "date_time_iso"
    - "time_date"
    - "time_utc"

- platform: wirelesstag
  monitored_conditions:
    - temperature
    - humidity

