# Drake work time tracking
- platform: history_stats
  name: Time at work this week (Drake)
  entity_id: person.drake
  state: Work
  type: time
  start: "{{ today_at() - timedelta(days=now().weekday()) }}"
  end: "{{ now() }}"

- platform: history_stats
  name: Time at work today (Drake)
  entity_id: person.drake
  state: Work
  type: time
  start: "{{ today_at() }}"
  duration:
    hours: 24

- platform: history_stats
  name: Time at work on Monday (Drake)
  entity_id: person.drake
  state: Work
  type: time
  duration:
    hours: 24
  start: >
    {% set day = now().weekday() - 0 %}
    {% if day < 0 %}{% set day = day + 7 %}{% endif %}
    {{ today_at() - timedelta(days=day) }}

