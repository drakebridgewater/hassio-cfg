# How many times the fridge was opened today
- platform: history_stats
  name: "Fridge Opens Today"
  entity_id: binary_sensor.fridge_door
  state: "on"
  type: count
  start: "{{ today_at() }}"
  end: "{{ now() }}"

# Total time spent in the bathroom (if you have motion sensors)
- platform: history_stats
  name: "Bathroom Time This Week"
  entity_id: binary_sensor.bathroom_motion
  state: "on"
  type: time
  start: "{{ today_at() - timedelta(days=now().weekday()) }}"
  end: "{{ now() }}"

# How long the TV has been on today
- platform: history_stats
  name: "TV Time Today"
  entity_id: media_player.living_room_tv
  state: "playing"
  type: time
  start: "{{ today_at() }}"
  end: "{{ now() }}"

# How many times someone checked the front door camera
- platform: history_stats
