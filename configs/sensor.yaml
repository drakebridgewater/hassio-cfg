# Ethan daycare time tracking by day
- platform: history_stats
  name: Time at daycare on Monday (Ethan)
  entity_id: binary_sensor.ethan_at_daycare
  state: "on"
  type: time
  start: >
    {% set today = now().weekday() %}
    {% set days_to_subtract = (today - 0) if today >= 0 else (today + 7 - 0) %}
    {{ today_at() - timedelta(days=days_to_subtract) }}
  end: >
    {% set today = now().weekday() %}
    {% set days_to_subtract = (today - 0) if today >= 0 else (today + 7 - 0) %}
    {{ today_at() - timedelta(days=days_to_subtract) + timedelta(days=1) }}

