- name: "Household Announcement"
  platform: group
  services:
    - service: alexa_media_all_echo_devices
  
# Per-person phone notifications go through Ticker (ticker.notify + categories),
# not notify groups. The STD_*/all_iphones/drake/shawna groups were retired
# 2026-09-28 (they still pointed at the removed mobile_app_drakes_iphone).

- platform: html5
  vapid_pub_key: !secret firebase_public_key
  vapid_prv_key: !secret firebase_private_key
  vapid_email: !secret firebase_service_account
