# Storage for Bubble Card Modules
- trigger:
  - trigger: event
    event_type: bubble_card_update_modules
  sensor:
    - name: "Bubble Card Modules"
      state: "saved"
      icon: "mdi:puzzle"
      attributes:
        modules: "{{ trigger.event.data.modules }}"
        last_updated: "{{ trigger.event.data.last_updated }}"
- trigger:
    - trigger: time_pattern
      hours: "/1"
    - trigger: state
      entity_id: weather.pirateweather
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.pirateweather
      data:
        type: daily
      response_variable: daily
  sensor:
    - name: "Daily Weather Forecast"
      unique_id: daily_weather_forecast
      state: "{{ states('weather.pirateweather') }}"
      attributes:
        forecast: "{{ daily['weather.pirateweather'].forecast }}"
        
# Ethan at school: a grown-up's stop at the School zone (2+ minutes, so driving
# past doesn't count) before noon is the drop-off; a stop after noon is the
# pickup. Off again at midnight. (It used to count the day's School visits,
# odd = at school, so one drive-by flipped it.)
- triggers:
    - trigger: state
      entity_id:
        - person.drake
        - person.shawna
      to: School
      for: "00:02:00"
      id: visit
    - trigger: time
      at: "00:00:00"
      id: reset
  binary_sensor:
    - name: Ethan at School
      state: >
        {% if trigger.id == 'reset' %}false
        {%- elif now().hour < 12 %}true
        {%- else %}false{% endif %}

# Abby at daycare: a grown-up's stop at the Dog Daycare zone (3+ minutes, so the
# morning commute through the zone doesn't count) before noon is the drop-off; a
# stop after noon is the pickup. Off again at midnight. (It used to count the
# day's zone visits, odd = at daycare, so every drive-by turned it on.)
- triggers:
    - trigger: state
      entity_id:
        - person.drake
        - person.shawna
      to: Dog Daycare
      for: "00:03:00"
      id: visit
    - trigger: time
      at: "00:00:00"
      id: reset
  binary_sensor:
    - name: Abby at Daycare
      state: >
        {% if trigger.id == 'reset' %}false
        {%- elif now().hour < 12 %}true
        {%- else %}false{% endif %}

- binary_sensor:
  - name: "Ethan at School Helper"
    state: >
      {%- if now().hour < 17 or (now().hour == 17 and now().minute < 30) -%}
        {{ states('binary_sensor.ethan_at_school') == 'on' }}
      {%- else -%}
        false
      {%- endif -%}
  - name: Home Occupied
    device_class: presence
    state: >
      {{ is_state('person.drake', 'home') 
      or is_state('person.shawna', 'home')
      or is_state('input_boolean.guest_mode', 'on')
      or is_state('person.named_guest', 'home') }}
    delay_off: 00:00:10
  - name: Parents Asleep
    state: >-
      {% if is_state('input_boolean.drake_awake', 'on') and is_state('input_boolean.shawna_awake', 'on') %}
        off
      {% elif is_state('input_boolean.drake_awake', 'off') and is_state('input_boolean.shawna_awake', 'off') %}
        on
      {% else %}
        on
      {% endif %}
  - name: Tomorrow Monday
    state: >
      {{ now().strftime('%a') in ('Sun') }}
  - name: Tomorrow Tuesday
    state: >
      {{ now().strftime('%a') in ('Mon') }}
  - name: Tomorrow Wednesday
    state: >
      {{ now().strftime('%a') in ('Tue') }}
  - name: Tomorrow Thursday
    state: >
      {{ now().strftime('%a') in ('Wed') }}
  - name: Tomorrow Friday
    state: >
      {{ now().strftime('%a') in ('Thu') }}
  - name: Tomorrow Saturday
    state: >
      {{ now().strftime('%a') in ('Fri') }}
  - name: Tomorrow Sunday
    state: >
      {{ now().strftime('%a') in ('Sat') }}
  - name: Any motion detected in last hour
    state: >
      {{ is_state("binary_sensor.whole_house_motion_group", "on") }}
    delay_off: "01:00:00"
  - name: Someone in the house in the last hour
    state: >
      {{ is_state("binary_sensor.any_motion_detected_in_last_hour", "on")
          or is_state("group.persons", "home") }}
  - name: Activity in the living room
    state: >
      {{ is_state("binary_sensor.living_room_presence_sensor_occupancy", "on")
          or is_state("media_player.living_room", "on") }}
    delay_off: "00:20:00"
  - name: Activity in the kitchen
    state: >
      {{ is_state("binary_sensor.kitchen_motion_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Master Bedroom
    state: >
      {{ is_state("binary_sensor.master_bathroom_motion_sensor_occupancy", "on")
          or is_state("binary_sensor.master_bedroom_motion_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Ethan's Bedroom
    state: >
      {{ is_state("binary_sensor.ethan_bedroom_occupancy", "on")
          or is_state("binary_sensor.ethans_bedroom_presence_sensor_pir_sensor", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Family Room
    state: >
      {{ is_state("binary_sensor.athom_family_room_presence_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Office
    state: >
      {{ is_state("binary_sensor.office_multi_sensor_home_security_motion_detection", "on") }}
    delay_off: "00:10:00"
  - name: Ridwell Pickup Tomorrow
    state: >
        {{ ((now().date() + timedelta(days=1)) | string == states('sensor.ridwell_ridwell_pickup_4659_se_meadowcrest_ct')) }}
  - name: Christmas Season
    state: >
      {%- set month, week, day = 11, 4, 3 %}
      {%- set today = now().date() %}
      {%- set temp = today.replace(month=month, day=1) %}
      {%- set adjust = (day - temp.weekday()) % 7 %}
      {%- set temp = temp + timedelta(days=adjust) %}
      {%- set thanksgiving = temp + timedelta(weeks = week - 1) %}
      {%- set jan3rd = temp.replace(month=1, day=3) %}
      {{ today <= jan3rd or today > thanksgiving }}
  - name: Worked enough today
    state: >
      {{ states("sensor.time_at_work_today_drake") | float(0) > 8 }}
  
  # "The house has been buttoned up long enough to run the HVAC."
  # Turns off the instant anything opens; needs 20 uninterrupted minutes with
  # every door AND window shut before it comes back on. Used by the HVAC
  # Schedule automation as the resume trigger.
  - name: House Sealed
    unique_id: house_sealed
    icon: mdi:home-lock
    delay_on: "00:20:00"
    availability: >
      {{ has_value('binary_sensor.window_open_group')
         and has_value('binary_sensor.any_door_open_group') }}
    state: >
      {{ not (is_state('binary_sensor.window_open_group', 'on')
              or is_state('binary_sensor.any_door_open_group', 'on')) }}

  # A package Frigate has seen for 2 straight minutes at the front door, porch or
  # deck. The deck zone flickers on a white object on the steps (scores ~0.7), so
  # the raw occupancy sensors are never shown on the dashboard directly.
  - name: Package Delivered
    unique_id: package_delivered
    icon: mdi:package-variant-closed
    delay_on: "00:02:00"
    delay_off: "00:05:00"
    state: >
      {{ is_state('binary_sensor.frontdoor_package_occupancy', 'on')
         or is_state('binary_sensor.porch_package_occupancy', 'on')
         or is_state('binary_sensor.frontdeck_package_occupancy', 'on') }}
    attributes:
      where: >
        {{ 'front door' if is_state('binary_sensor.frontdoor_package_occupancy', 'on')
           else 'porch' if is_state('binary_sensor.porch_package_occupancy', 'on')
           else 'deck' if is_state('binary_sensor.frontdeck_package_occupancy', 'on')
           else this.attributes.get('where', 'front door') }}


  # - name: "Any Light On"
  #   device_class: light
  #   state: >
  #     {{ states.light | selectattr('state','eq','on') | list | count > 0 }}

  
- sensor:
    - name: "Ethan Alarm Countdown"
      unique_id: ethan_alarm_countdown
      unit_of_measurement: "min"
      state: >
        {# Get the time string (e.g., "07:30:00") #}
        {% set time_str = states('input_datetime.ethan_s_alarm_clock') %}
        
        {% if time_str != 'unknown' and time_str != 'unavailable' %}
          {# Combine today's date with the input time #}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set target = as_timestamp(today ~ ' ' ~ time_str) %}
          {% set current = as_timestamp(now()) %}
          
          {# If the time has already passed today, assume it's for tomorrow #}
          {% if target < current %}
            {% set target = target + 86400 %}
          {% endif %}
          
          {% set remaining = (target - current) / 60 %}
          {{ remaining | int }}
        {% else %}
          0
        {% endif %}
      # This attribute helps the UI update more reliably
      attributes:
        target_time: "{{ states('input_datetime.ethan_s_alarm_clock') }}"
        
    - name: "Ethan's Bedtime Countdown"
      unique_id: ethan_s_bedtime_countdown
      unit_of_measurement: "min"
      state: >
        {# Get the time string (e.g., "07:30:00") #}
        {% set time_str = states('input_datetime.ethan_s_bedtime') %}
        
        {% if time_str != 'unknown' and time_str != 'unavailable' %}
          {# Combine today's date with the input time #}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set target = as_timestamp(today ~ ' ' ~ time_str) %}
          {% set current = as_timestamp(now()) %}
          
          {# If the time has already passed today, assume it's for tomorrow #}
          {% if target < current %}
            {% set target = target + 86400 %}
          {% endif %}
          
          {% set remaining = (target - current) / 60 %}
          {{ remaining | int }}
        {% else %}
          0
        {% endif %}
      # This attribute helps the UI update more reliably
      attributes:
        target_time: "{{ states('input_datetime.ethan_s_alarm_clock') }}"
    # Timestamp sensors
    - name: "Timestamp Start of Today"
      state: "{{ today_at().isoformat() }}"
      device_class: timestamp

    # Work prognosis sensors
    - name: "Time at Work Prognosis Drake"
      unit_of_measurement: h
      state: >
        {% set day = [now().weekday(), 4] | min %}
        {% set t_total = states("sensor.time_at_work_this_week_drake") | float(0) %}
        {% set t_today = states("sensor.time_at_work_today_drake") | float(0) %}
        {% set hours_per_day_including_today = t_total / (day + 1) %}
        {% set hours_per_day_excluding_today = (t_total - t_today) / (day + 10**-16) %}
        {% set seven_oclock = today_at("19:00").timestamp() %}

        {% if t_today > hours_per_day_excluding_today
              or (not is_state("person.drake", "Work") and t_today > 0)
              or (now().timestamp() > seven_oclock)
              or day == 0
              or now().weekday() > 4
              or 5 * hours_per_day_including_today > 40 %}
          {% set hours_per_day = hours_per_day_including_today %}
        {% else %}
          {% set hours_per_day = hours_per_day_excluding_today %}
        {% endif %}

        {{ (5 * hours_per_day) | round(2) }}

    - name: "Time at Work Prognosis Shawna"
      unit_of_measurement: h
      state: >
        {% set day = [now().weekday(), 4] | min %}
        {% set t_total = states("sensor.time_at_work_this_week_shawna") | float(0) %}
        {% set t_today = states("sensor.time_at_work_today_shawna") | float(0) %}
        {% set hours_per_day_including_today = t_total / (day + 1) %}
        {% set hours_per_day_excluding_today = (t_total - t_today) / (day + 10**-16) %}
        {% set seven_oclock = today_at("19:00").timestamp() %}

        {% if t_today > hours_per_day_excluding_today
              or (not is_state("person.shawna", "Work") and t_today > 0)
              or (now().timestamp() > seven_oclock)
              or day == 0
              or now().weekday() > 4
              or 5 * hours_per_day_including_today > 40 %}
          {% set hours_per_day = hours_per_day_including_today %}
        {% else %}
          {% set hours_per_day = hours_per_day_excluding_today %}
        {% endif %}

        {{ (5 * hours_per_day) | round(2) }}

    - name: "N Days Last Month"
      state: >
        {% set start_of_month = now().replace(day=1) %}
        {% set start_of_last_month = start_of_month.replace(month=now().month-1) %}
        {{ ((start_of_month - start_of_last_month).total_seconds() / 86400) | round }}

    # Alarm time sensors
    - name: "Half Hour Before Alarm"
      state: >
        {% set t_alarm = state_attr("input_datetime.drake_s_alarm_clock", "timestamp") | int %}
        {% set t_start = today_at().timestamp() | int %}
        {% set half_hour_before_alarm = t_alarm + t_start - 60 * 30 %}
        {{ half_hour_before_alarm | timestamp_custom("%H:%M", true) }}

    - name: "Ten Minutes Before Alarm"
      state: >
        {% set t_alarm = state_attr("input_datetime.drake_s_alarm_clock", "timestamp") | int %}
        {% set t_start = today_at().timestamp() | int %}
        {% set before_alarm = t_alarm + t_start - 60 * 10 %}
        {{ before_alarm | timestamp_custom("%H:%M", true) }}

    # Quarantine hours outside sensors
    - name: "Hours Outside Per Day Shawna"
      state: >
        {% set value = state_attr("sensor.quarantine_meter_shawna", "value") %}
        {% if value != None %}
          {% set nargs = 1 + (value | length) - (value.replace(' ', '') | length) %}
          {% if nargs < 2 %}{% set value = "0h " ~ value %}{% endif %}
          {% if nargs < 3 %}{% set value = "0d " ~ value %}{% endif %}

          {% set d, h, m = value.split() %}
          {% set d, h, m = d[:-1] | int, h[:-1] | int, m[:-1] | int %}
          {% set hours_outside = ((14 - d) * 86400 - h * 3600 - m * 60) / 3600 %}
          {{ (hours_outside / 14) | round(1) }}
        {% endif %}

    - name: "Hours Outside Per Day Drake"
      state: >
        {% set value = state_attr("sensor.quarantine_meter_drake", "value") %}
        {% if value != None %}
          {% set nargs = 1 + (value | length) - (value.replace(' ', '') | length) %}
          {% if nargs < 2 %}{% set value = "0h " ~ value %}{% endif %}
          {% if nargs < 3 %}{% set value = "0d " ~ value %}{% endif %}

          {% set d, h, m = value.split() %}
          {% set d, h, m = d[:-1] | int, h[:-1] | int, m[:-1] | int %}
          {% set hours_outside = ((14 - d) * 86400 - h * 3600 - m * 60) / 3600 %}
          {{ (hours_outside / 14) | round(1) }}
        {% endif %}

    # Days until next birthday
    - name: "Days Until Next Birthday"
      state: >
        {% set birthdays = [
          ('2026-01-04', 'Ethan'),
          ('2026-02-07', 'Drake'),
          ('2026-10-13', 'Shawna')
        ] %}
        {% set today = now().date() %}
        {% set next_birthday = namespace(date=None, name='', days=999) %}
        {% for date_str, name in birthdays %}
          {% set bday = strptime(date_str, '%Y-%m-%d').date() %}
          {% set days = (bday - today).days %}
          {% if days < 0 %}
            {% set bday = bday.replace(year=bday.year + 1) %}
            {% set days = (bday - today).days %}
          {% endif %}
          {% if days < next_birthday.days %}
            {% set next_birthday.days = days %}
            {% set next_birthday.name = name %}
          {% endif %}
        {% endfor %}
        {{ next_birthday.days }}
      attributes:
        whose: >
          {% set birthdays = [
            ('2026-01-04', 'Ethan'),
            ('2026-02-07', 'Drake'),
            ('2026-10-13', 'Shawna')
          ] %}
          {% set today = now().date() %}
          {% set next_birthday = namespace(name='') %}
          {% set min_days = 999 %}
          {% for date_str, name in birthdays %}
            {% set bday = strptime(date_str, '%Y-%m-%d').date() %}
            {% set days = (bday - today).days %}
            {% if days < 0 %}
              {% set bday = bday.replace(year=bday.year + 1) %}
              {% set days = (bday - today).days %}
            {% endif %}
            {% if days < min_days %}
              {% set min_days = days %}
              {% set next_birthday.name = name %}
            {% endif %}
          {% endfor %}
          {{ next_birthday.name }}


