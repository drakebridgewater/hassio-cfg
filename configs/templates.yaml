# Dashboard ambient edge glow (palette logic in custom_templates/dashboard_glow.jinja).
# Read by the glow card at the bottom of the /lovelace-mushroom/dashboard view.
- sensor:
    - name: "Dashboard Glow"
      unique_id: dashboard_glow
      icon: mdi:gradient-horizontal
      state: >
        {% from 'dashboard_glow.jinja' import glow_key %}{{ glow_key() }}
      attributes:
        colors: >
          {% from 'dashboard_glow.jinja' import glow_key, glow_colors %}{{ glow_colors(glow_key()) }}
        opacity: >
          {% from 'dashboard_glow.jinja' import glow_key, glow_opacity %}{{ glow_opacity(glow_key()) }}

# Entity counts for the admin view. A domain-wide template (states.sensor | count)
# re-renders on every state change in that domain, so refresh these on a timer instead.
- trigger:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Count Automations"
      icon: mdi:autorenew
      state: "{{ states.automation | count }}"

    - name: "Count Scripts"
      icon: mdi:script-text-outline
      state: "{{ states.script | count }}"

    - name: "Count Device Trackers"
      icon: mdi:map-marker
      state: "{{ states.device_tracker | count }}"

    - name: "Count Binary Sensors"
      icon: mdi:unfold-more-horizontal
      state: "{{ states.binary_sensor | count }}"

    - name: "Count Sensors"
      icon: mdi:resistor
      state: "{{ states.sensor | count }}"

    - name: "Count Switches"
      icon: mdi:light-switch
      state: "{{ states.switch | count }}"

    - name: "Count Zones"
      icon: mdi:map-marker-radius
      state: "{{ states.zone | count }}"

    - name: "Count Input Booleans"
      icon: mdi:toggle-switch
      state: "{{ states.input_boolean | count }}"

    - name: "Count Input Numbers"
      icon: mdi:numeric
      state: "{{ states.input_number | count }}"

    - name: "Count Input Texts"
      icon: mdi:alphabetical
      state: "{{ states.input_text | count }}"

    - name: "Count Input Selects"
      icon: mdi:view-list
      state: "{{ states.input_select | count }}"

    - name: "Count Input Datetimes"
      icon: mdi:calendar-clock
      state: "{{ states.input_datetime | count }}"

# Room lights on (custom_templates/lights.jinja leaves out groups, status LEDs and
# screens), and how many are off (lights_off). The status tile and the #lights
# pop-up read this instead of scanning every entity in the browser on each state change.
- sensor:
    - name: "Lights On Count"
      unique_id: lights_on_count
      icon: mdi:lightbulb-multiple
      state: >
        {% from 'lights.jinja' import light_skip %}
        {{ states.light | rejectattr('entity_id', 'search', light_skip() | trim)
           | selectattr('state', 'eq', 'on') | list | count }}
      attributes:
        lights_off: >
          {% from 'lights.jinja' import light_skip %}
          {{ states.light | rejectattr('entity_id', 'search', light_skip() | trim)
             | selectattr('state', 'eq', 'off') | list | count }}
