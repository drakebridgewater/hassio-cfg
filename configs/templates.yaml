# Storage for Bubble Card Modules
- trigger:
  - trigger: event
    event_type: bubble_card_update_modules
  sensor:
    - name: "Bubble Card Modules"
      state: "saved"
      icon: "mdi:puzzle"
      attributes:
        modules: "{{ trigger.event.data.modules }}"
        last_updated: "{{ trigger.event.data.last_updated }}"
- trigger:
    - trigger: time_pattern
      hours: "/1"
    - trigger: state
      entity_id: weather.pirateweather
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.pirateweather
      data:
        type: daily
      response_variable: daily
  sensor:
    - name: "Daily Weather Forecast"
      unique_id: daily_weather_forecast
      state: "{{ states('weather.pirateweather') }}"
      attributes:
        forecast: "{{ daily['weather.pirateweather'].forecast }}"
        
- binary_sensor:
  - name: Ethan at Daycare
    state: >
      {% set db = states("sensor.visited_daycare_drake") | int(0) %}
      {% set sb = states("sensor.visited_daycare_shawna") | int(0) %}
      {% set jk  = states("sensor.visited_daycare_jk") | int(0) %}

      {% set visits  = db + sb + jk %}
      {% if visits == 0 -%}
        false
      {%- elif visits == 1 -%}
        true
      {%- else -%}
        false
      {%- endif %}
  - name: "Ethan at Daycare Helper"
    state: >
      {%- if now().hour < 17 or (now().hour == 17 and now().minute < 30) -%}
        {{ states('binary_sensor.ethan_at_daycare') == 'on' }}
      {%- else -%}
        false
      {%- endif -%}
  - name: Home Occupied
    device_class: presence
    state: >
      {{ is_state('person.drake', 'home') 
      or is_state('person.shawna', 'home')
      or is_state('input_boolean.home_guest_mode', 'on') 
      or is_state('person.guest', 'home') 
      or is_state('person.named_guest', 'home') }}
    delay_off: 00:00:10
  - name: Parents Asleep
    state: >-
      {% if is_state('input_boolean.drake_awake', 'on') and is_state('input_boolean.shawna_awake', 'on') %}
        off
      {% elif is_state('input_boolean.drake_awake', 'off') and is_state('input_boolean.shawna_awake', 'off') %}
        on
      {% else %}
        on
      {% endif %}
  - name: Tomorrow Monday
    state: >
      {{ now().strftime('%a') in ('Sun') }}
  - name: Tomorrow Tuesday
    state: >
      {{ now().strftime('%a') in ('Mon') }}
  - name: Tomorrow Wednesday
    state: >
      {{ now().strftime('%a') in ('Tue') }}
  - name: Tomorrow Thursday
    state: >
      {{ now().strftime('%a') in ('Wed') }}
  - name: Tomorrow Friday
    state: >
      {{ now().strftime('%a') in ('Thu') }}
  - name: Tomorrow Saturday
    state: >
      {{ now().strftime('%a') in ('Fri') }}
  - name: Tomorrow Sunday
    state: >
      {{ now().strftime('%a') in ('Sat') }}
  - name: Any motion detected in last hour
    state: >
      {{ is_state("binary_sensor.whole_house_motion_group", "on") }}
    delay_off: "01:00:00"
  - name: Someone in the house in the last hour
    state: >
      {{ is_state("binary_sensor.motion_detected_in_last_hour", "on")
          or is_state("group.persons", "home") }}
  - name: Activity in the living room
    state: >
      {{ is_state("binary_sensor.living_room_presence_sensor_occupancy", "on")
          or is_state("media_player.living_room", "on")
          or is_state("media_player.marantz_sr5012_2", "on") }}
    delay_off: "00:20:00"
  - name: Activity in the kitchen
    state: >
      {{ is_state("binary_sensor.kitchen_motion_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Master Bedroom
    state: >
      {{ is_state("binary_sensor.master_bathroom_motion_sensor_occupancy", "on")
          or is_state("binary_sensor.master_bedroom_motion_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Ethan's Bedroom
    state: >
      {{ is_state("binary_sensor.ethans_smartsensor_occupancy", "on")
          or is_state("binary_sensor.ethan_s_bedroom_occupancy", "on")
          or is_state("binary_sensor.ethans_bedroom_presence_sensor_pir_sensor", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Family Room
    state: >
      {{ is_state("binary_sensor.athom_family_room_presence_sensor_occupancy", "on") }}
    delay_off: "00:10:00"
  - name: Activity in the Office
    state: >
      {{ is_state("binary_sensor.office_multi_sensor_home_security_motion_detection", "on") }}
    delay_off: "00:10:00"
  - name: Ridwell Pickup Tomorrow
    state: >
        {{ ((now().date() + timedelta(days=1)) | string == states('sensor.ridwell_ridwell_pickup_4659_se_meadowcrest_ct')) }}
  - name: Christmas Season
    state: >
      {%- set month, week, day = 11, 4, 3 %}
      {%- set today = now().date() %}
      {%- set temp = today.replace(month=month, day=1) %}
      {%- set adjust = (day - temp.weekday()) % 7 %}
      {%- set temp = temp + timedelta(days=adjust) %}
      {%- set thanksgiving = temp + timedelta(weeks = week - 1) %}
      {%- set jan3rd = temp.replace(month=1, day=3) %}
      {{ today <= jan3rd or today > thanksgiving }}
  - name: Worked enough today
    state: >
      {{ states("sensor.time_at_work_today_drake") | float(0) > 8 }}
  - name: Abby at Daycare
    state: >
      {% set db = states("sensor.visited_dog_daycare_drake") | int(0) %}
      {% set sb = states("sensor.visited_dog_daycare_shawna") | int(0) %}

      {% set visits  = db + sb %}
      {% if visits == 0 -%}
        false
      {%- elif visits == 1 -%}
        true
      {%- else -%}
        false
      {%- endif %}
  - name: Time to Pick Ethan up
    state: >
      {{( (today_at(states('input_datetime.daycare_closes')) | as_timestamp - now()|as_timestamp)) <= (states('sensor.drake_iphone_idevice_travel_time_min_daycare')|float(0)*60)+5}}


  # - name: "Any Light On"
  #   device_class: light
  #   state: >
  #     {{ states.light | selectattr('state','eq','on') | list | count > 0 }}

  
- sensor:
    - name: "Ethan Alarm Countdown"
      unique_id: ethan_alarm_countdown
      unit_of_measurement: "min"
      state: >
        {# Get the time string (e.g., "07:30:00") #}
        {% set time_str = states('input_datetime.ethan_s_alarm_clock') %}
        
        {% if time_str != 'unknown' and time_str != 'unavailable' %}
          {# Combine today's date with the input time #}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set target = as_timestamp(today ~ ' ' ~ time_str) %}
          {% set current = as_timestamp(now()) %}
          
          {# If the time has already passed today, assume it's for tomorrow #}
          {% if target < current %}
            {% set target = target + 86400 %}
          {% endif %}
          
          {% set remaining = (target - current) / 60 %}
          {{ remaining | int }}
        {% else %}
          0
        {% endif %}
      # This attribute helps the UI update more reliably
      attributes:
        target_time: "{{ states('input_datetime.ethan_s_alarm_clock') }}"
        
    - name: "Ethan's Bedtime Countdown"
      unique_id: ethan_s_bedtime_countdown
      unit_of_measurement: "min"
      state: >
        {# Get the time string (e.g., "07:30:00") #}
        {% set time_str = states('input_datetime.ethan_s_bedtime') %}
        
        {% if time_str != 'unknown' and time_str != 'unavailable' %}
          {# Combine today's date with the input time #}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set target = as_timestamp(today ~ ' ' ~ time_str) %}
          {% set current = as_timestamp(now()) %}
          
          {# If the time has already passed today, assume it's for tomorrow #}
          {% if target < current %}
            {% set target = target + 86400 %}
          {% endif %}
          
          {% set remaining = (target - current) / 60 %}
          {{ remaining | int }}
        {% else %}
          0
        {% endif %}
      # This attribute helps the UI update more reliably
      attributes:
        target_time: "{{ states('input_datetime.ethan_s_alarm_clock') }}"
    # Entity counting sensors
    - name: "Count Automations"
      icon: mdi:autorenew
      state: "{{ states.automation | count }}"

    - name: "Count Scripts"
      icon: mdi:script-text-outline
      state: "{{ states.script | count }}"

    - name: "Count Device Trackers"
      icon: mdi:map-marker
      state: "{{ states.device_tracker | count }}"

    - name: "Count Binary Sensors"
      icon: mdi:unfold-more-horizontal
      state: "{{ states.binary_sensor | count }}"

    - name: "Count Sensors"
      icon: mdi:resistor
      state: "{{ states.sensor | count }}"

    - name: "Count Switches"
      icon: mdi:light-switch
      state: "{{ states.switch | count }}"

    - name: "Count Zones"
      icon: mdi:map-marker-radius
      state: "{{ states.zone | count }}"

    - name: "Count Input Booleans"
      icon: mdi:toggle-switch
      state: "{{ states.input_boolean | count }}"

    - name: "Count Input Numbers"
      icon: mdi:numeric
      state: "{{ states.input_number | count }}"

    - name: "Count Input Texts"
      icon: mdi:alphabetical
      state: "{{ states.input_text | count }}"

    - name: "Count Input Selects"
      icon: mdi:view-list
      state: "{{ states.input_select | count }}"

    - name: "Count Input Datetimes"
      icon: mdi:calendar-clock
      state: "{{ states.input_datetime | count }}"

    # Timestamp sensors
    - name: "Timestamp Start of Today"
      state: "{{ today_at().timestamp() }}"
      device_class: timestamp

    # Work prognosis sensors
    - name: "Time at Work Prognosis Drake"
      unit_of_measurement: h
      state: >
        {% set day = [now().weekday(), 4] | min %}
        {% set t_total = states("sensor.time_at_work_this_week_drake") | float(0) %}
        {% set t_today = states("sensor.time_at_work_today_drake") | float(0) %}
        {% set hours_per_day_including_today = t_total / (day + 1) %}
        {% set hours_per_day_excluding_today = (t_total - t_today) / (day + 10**-16) %}
        {% set seven_oclock = today_at("19:00").timestamp() %}

        {% if t_today > hours_per_day_excluding_today
              or (not is_state("person.drake", "Work") and t_today > 0)
              or (now().timestamp() > seven_oclock)
              or day == 0
              or now().weekday() > 4
              or 5 * hours_per_day_including_today > 40 %}
          {% set hours_per_day = hours_per_day_including_today %}
        {% else %}
          {% set hours_per_day = hours_per_day_excluding_today %}
        {% endif %}

        {{ (5 * hours_per_day) | round(2) }}

    - name: "Time at Work Prognosis Shawna"
      unit_of_measurement: h
      state: >
        {% set day = [now().weekday(), 4] | min %}
        {% set t_total = states("sensor.time_at_work_this_week_shawna") | float(0) %}
        {% set t_today = states("sensor.time_at_work_today_shawna") | float(0) %}
        {% set hours_per_day_including_today = t_total / (day + 1) %}
        {% set hours_per_day_excluding_today = (t_total - t_today) / (day + 10**-16) %}
        {% set seven_oclock = today_at("19:00").timestamp() %}

        {% if t_today > hours_per_day_excluding_today
              or (not is_state("person.shawna", "Work") and t_today > 0)
              or (now().timestamp() > seven_oclock)
              or day == 0
              or now().weekday() > 4
              or 5 * hours_per_day_including_today > 40 %}
          {% set hours_per_day = hours_per_day_including_today %}
        {% else %}
          {% set hours_per_day = hours_per_day_excluding_today %}
        {% endif %}

        {{ (5 * hours_per_day) | round(2) }}

    - name: "N Days Last Month"
      state: >
        {% set start_of_month = now().replace(day=1) %}
        {% set start_of_last_month = start_of_month.replace(month=now().month-1) %}
        {{ ((start_of_month - start_of_last_month).total_seconds() / 86400) | round }}

    # Alarm time sensors
    - name: "Half Hour Before Alarm"
      state: >
        {% set t_alarm = state_attr("input_datetime.drake_s_alarm_clock", "timestamp") | int %}
        {% set t_start = today_at().timestamp() | int %}
        {% set half_hour_before_alarm = t_alarm + t_start - 60 * 30 %}
        {{ half_hour_before_alarm | timestamp_custom("%H:%M", true) }}

    - name: "Ten Minutes Before Alarm"
      state: >
        {% set t_alarm = state_attr("input_datetime.drake_s_alarm_clock", "timestamp") | int %}
        {% set t_start = today_at().timestamp() | int %}
        {% set before_alarm = t_alarm + t_start - 60 * 10 %}
        {{ before_alarm | timestamp_custom("%H:%M", true) }}

    # Quarantine hours outside sensors
    - name: "Hours Outside Per Day Shawna"
      state: >
        {% set value = state_attr("sensor.quarantine_meter_shawna", "value") %}
        {% if value != None %}
          {% set nargs = 1 + (value | length) - (value.replace(' ', '') | length) %}
          {% if nargs < 2 %}{% set value = "0h " ~ value %}{% endif %}
          {% if nargs < 3 %}{% set value = "0d " ~ value %}{% endif %}

          {% set d, h, m = value.split() %}
          {% set d, h, m = d[:-1] | int, h[:-1] | int, m[:-1] | int %}
          {% set hours_outside = ((14 - d) * 86400 - h * 3600 - m * 60) / 3600 %}
          {{ (hours_outside / 14) | round(1) }}
        {% endif %}

    - name: "Hours Outside Per Day Drake"
      state: >
        {% set value = state_attr("sensor.quarantine_meter_drake", "value") %}
        {% if value != None %}
          {% set nargs = 1 + (value | length) - (value.replace(' ', '') | length) %}
          {% if nargs < 2 %}{% set value = "0h " ~ value %}{% endif %}
          {% if nargs < 3 %}{% set value = "0d " ~ value %}{% endif %}

          {% set d, h, m = value.split() %}
          {% set d, h, m = d[:-1] | int, h[:-1] | int, m[:-1] | int %}
          {% set hours_outside = ((14 - d) * 86400 - h * 3600 - m * 60) / 3600 %}
          {{ (hours_outside / 14) | round(1) }}
        {% endif %}

    # Days until next birthday
    - name: "Days Until Next Birthday"
      state: >
        {% set birthdays = [
          ('2026-01-04', 'Ethan'),
          ('2026-02-07', 'Drake'),
          ('2026-10-13', 'Shawna')
        ] %}
        {% set today = now().date() %}
        {% set next_birthday = namespace(date=None, name='', days=999) %}
        {% for date_str, name in birthdays %}
          {% set bday = strptime(date_str, '%Y-%m-%d').date() %}
          {% set days = (bday - today).days %}
          {% if days < 0 %}
            {% set bday = bday.replace(year=bday.year + 1) %}
            {% set days = (bday - today).days %}
          {% endif %}
          {% if days < next_birthday.days %}
            {% set next_birthday.days = days %}
            {% set next_birthday.name = name %}
          {% endif %}
        {% endfor %}
        {{ next_birthday.days }}
      attributes:
        whose: >
          {% set birthdays = [
            ('2026-01-04', 'Ethan'),
            ('2026-02-07', 'Drake'),
            ('2026-10-13', 'Shawna')
          ] %}
          {% set today = now().date() %}
          {% set next_birthday = namespace(name='') %}
          {% set min_days = 999 %}
          {% for date_str, name in birthdays %}
            {% set bday = strptime(date_str, '%Y-%m-%d').date() %}
            {% set days = (bday - today).days %}
            {% if days < 0 %}
              {% set bday = bday.replace(year=bday.year + 1) %}
              {% set days = (bday - today).days %}
            {% endif %}
            {% if days < min_days %}
              {% set min_days = days %}
              {% set next_birthday.name = name %}
            {% endif %}
          {% endfor %}
          {{ next_birthday.name }}

    # Family dinner nights this month
    - name: "Family Dinners This Month"
      state: >
        {{ states('sensor.family_dinner_counter') | int(0) }}

    # Date night tracker
    - name: "Days Since Last Date Night"
      state: >
        {% set last_date = states('input_datetime.last_date_night') %}
        {% if last_date not in ['unknown', 'unavailable'] %}
          {{ (now() - strptime(last_date, '%Y-%m-%d %H:%M:%S')).days }}
        {% else %}
          Unknown
        {% endif %}

    # Percentage of life spent at work (assuming 40 years working)
    - name: "Drake - Percentage of Life at Work"
      state: >
        {% set work_hours = states('sensor.time_at_work_this_week_drake') | float(0) %}
        {% set total_hours = 168 %}
        {{ ((work_hours / total_hours) * 100) | round(1) }}
      unit_of_measurement: "%"

    - name: "Shawna - Percentage of Life at Work"
      state: >
        {% set work_hours = states('sensor.time_at_work_this_week_shawna') | float(0) %}
        {% set total_hours = 168 %}
        {{ ((work_hours / total_hours) * 100) | round(1) }}
      unit_of_measurement: "%"

    # How many times the doorbell rang this week
    - name: "Doorbell Rings This Week"
      state: >
        {{ states('sensor.doorbell_counter') | int(0) }}

    # Most visited room today
    - name: "Most Active Room Today"
      state: >
        {% set rooms = {
          'living_room': states('sensor.living_room_motion_count') | int(0),
          'kitchen': states('sensor.kitchen_motion_count') | int(0),
          'bedroom': states('sensor.bedroom_motion_count') | int(0)
        } %}
        {{ rooms | dictsort(by='value', reverse=true) | first | first }}


# ===== 1. COLOR (RGB) LIGHT =====
- light:
  - name: "YeeSite Bar Color"
    unique_id: yeesite_bar_color

    # ---- State ----
    state: >-
      {{ states('sensor.yeesite_bar_state') }}

    availability: >-
      {{ states('sensor.yeesite_bar_state') not in ['unavailable', 'unknown'] }}

    # ---- Brightness (0-255) ----
    level: >-
      {{ state_attr('sensor.yeesite_bar_state', 'brightness') | int(0) }}

    # ---- RGB color from the sensor's color dict ----
    rgb: >-
      {% set c = state_attr('sensor.yeesite_bar_state', 'color') %}
      {% if c %}
        ({{ c.r | int(0) }}, {{ c.g | int(0) }}, {{ c.b | int(0) }})
      {% else %}
        (0, 0, 0)
      {% endif %}

    # ---- Effect ----
    # Only show the current effect if it's an RGB effect (not a w_ prefixed one)
    effect: >-
      {% set eff = state_attr('sensor.yeesite_bar_state', 'effect') %}
      {% if eff and not eff.startswith('w_') %}
        {{ eff }}
      {% else %}
        {{ none }}
      {% endif %}

    # ---- Effect list: only RGB effects ----
    effect_list: >-
      {% set all = state_attr('sensor.yeesite_bar_state', 'effect_list') %}
      {% if all %}
        {{ all | reject('match', '^w_') | list }}
      {% else %}
        []
      {% endif %}

    # ---- Actions ----
    turn_on:
      - action: rest_command.yeesite_turn_on
        data:
          brightness: "{{ brightness | default(255) }}"

    turn_off:
      - action: rest_command.yeesite_turn_off

    set_level:
      - action: rest_command.yeesite_set_brightness
        data:
          value: "{{ brightness }}"

    set_rgb:
      - action: rest_command.yeesite_set_color
        data:
          r: "{{ r }}"
          g: "{{ g }}"
          b: "{{ b }}"
          w: 0

    set_effect:
      - action: rest_command.yeesite_set_effect
        data:
          effect: "{{ effect }}"
          speed: 1.0

# ===== 2. WHITE LIGHT =====
- light:
  - name: "YeeSite Bar White"
    unique_id: yeesite_bar_white

    # ---- State ----
    # White is "on" if the overall fixture is on AND white has some value
    # or a white effect is running.
    state: >-
      {% set lamp_on = is_state('sensor.yeesite_bar_state', 'on') %}
      {% set w_val = state_attr('sensor.yeesite_bar_state', 'white') | int(0) %}
      {% set eff = state_attr('sensor.yeesite_bar_state', 'effect') | default('', true) %}
      {% if lamp_on and (w_val > 0 or eff.startswith('w_')) %}
        on
      {% else %}
        off
      {% endif %}

    availability: >-
      {{ states('sensor.yeesite_bar_state') not in ['unavailable', 'unknown'] }}

    # ---- Brightness: derived from white_dimmer (0-100 from API → 0-255) ----
    level: >-
      {% set wd = state_attr('sensor.yeesite_bar_state', 'white_dimmer') | int(0) %}
      {{ (wd / 100 * 255) | int }}

    # ---- Effect: only white effects ----
    effect: >-
      {% set eff = state_attr('sensor.yeesite_bar_state', 'effect') %}
      {% if eff and eff.startswith('w_') %}
        {{ eff }}
      {% else %}
        {{ none }}
      {% endif %}

    # ---- Effect list: only white effects ----
    effect_list: >-
      {% set all = state_attr('sensor.yeesite_bar_state', 'effect_list') %}
      {% if all %}
        {{ all | select('match', '^w_') | list }}
      {% else %}
        []
      {% endif %}

    # ---- Actions ----
    turn_on:
      # Turn on solid white at full brightness
      - action: rest_command.yeesite_set_color
        data:
          r: 0
          g: 0
          b: 0
          w: "{{ brightness | default(255) }}"

    turn_off:
      # Set white to 0 (don't blackout the entire fixture)
      - action: rest_command.yeesite_set_color
        data:
          r: 0
          g: 0
          b: 0
          w: 0

    set_level:
      - action: rest_command.yeesite_set_color
        data:
          r: 0
          g: 0
          b: 0
          w: "{{ brightness }}"

    set_effect:
      - action: rest_command.yeesite_set_effect
        data:
          effect: "{{ effect }}"
          speed: 1.0