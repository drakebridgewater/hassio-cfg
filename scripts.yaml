panic_stand_down:
  alias: Panic - Stand Down
  description: Cleans up after a panic event. Turns off sirens/strobes, stops TTS,
    restores lights from pre-panic scene, returns alarm to pre-panic mode, sends stand-down
    notifications. Does NOT auto-close garage or re-lock doors — those are conscious
    decisions after a real event.
  icon: mdi:check-decagram
  mode: restart
  sequence:
  - parallel:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.drivewaycam_dahua_siren
    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id: light.drivewaycam_dahua_security_light
    - action: media_player.media_stop
      continue_on_error: true
      target:
        entity_id: media_player.all_echo_devices
  - if:
    - condition: template
      value_template: '{{ states(''scene.pre_panic_lights'') not in [''unavailable'',
        ''unknown''] }}'
    then:
    - action: scene.turn_on
      continue_on_error: true
      target:
        entity_id: scene.pre_panic_lights
  - choose:
    - conditions:
      - condition: state
        entity_id: input_text.pre_panic_alarm_state
        state: armed_away
      sequence:
      - action: alarmo.arm
        continue_on_error: true
        data:
          code: '3627'
          entity_id: alarm_control_panel.default
          force: true
          mode: away
          skip_delay: true
    - conditions:
      - condition: state
        entity_id: input_text.pre_panic_alarm_state
        state: armed_home
      sequence:
      - action: alarmo.arm
        continue_on_error: true
        data:
          code: '3627'
          entity_id: alarm_control_panel.default
          force: true
          mode: home
          skip_delay: true
    - conditions:
      - condition: state
        entity_id: input_text.pre_panic_alarm_state
        state: armed_night
      sequence:
      - action: alarmo.arm
        continue_on_error: true
        data:
          code: '3627'
          entity_id: alarm_control_panel.default
          force: true
          mode: night
          skip_delay: true
    default:
    - action: alarmo.disarm
      continue_on_error: true
      data:
        code: '3627'
        entity_id: alarm_control_panel.default
  - parallel:
    - action: notify.drake
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: active
        message: '{{ states(''input_text.last_panic_type'') | title }} panic stood
          down at {{ now().strftime(''%I:%M %p'') }}. Sirens off, lights restored,
          alarm returned to {{ states(''input_text.pre_panic_alarm_state'') }}. Garage
          and locks left as-is — reset manually if needed.'
        title: ✅ Stand Down
    - action: notify.shawna
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: active
        message: '{{ states(''input_text.last_panic_type'') | title }} panic stood
          down at {{ now().strftime(''%I:%M %p'') }}. Sirens off, lights restored,
          alarm returned to {{ states(''input_text.pre_panic_alarm_state'') }}. Garage
          and locks left as-is — reset manually if needed.'
        title: ✅ Stand Down
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.panic_active
  - action: input_text.set_value
    data:
      value: none
    target:
      entity_id: input_text.last_panic_type
security_critical_alert:
  alias: Security - Critical Alarm Alert
  description: Critical actionable push for Alarmo. pending = Drake only; triggered
    = Drake + Shawna. Camera + Disarm button.
  icon: mdi:shield-alert
  mode: restart
  fields:
    phase:
      name: Phase
      description: pending or triggered
      selector:
        text: {}
  sequence:
  - variables:
      panel: alarm_control_panel.default
      sensor_name: '{% set open = state_attr(''alarm_control_panel.default'',''open_sensors'')
        or {} %}{% set sid = (open.keys()|list|first) if open else none %}{{ state_attr(sid,''friendly_name'')
        if sid else ''an interior sensor'' }}'
      title: "{{ '\U0001F6A8 ALARM TRIGGERED' if phase == 'triggered' else '⏳ Alarm
        Countdown' }}"
      body: '{% if phase == ''triggered'' %}Alarm is sounding — tripped by {{ sensor_name
        }}.{% else %}{{ sensor_name }} tripped. {{ state_attr(''alarm_control_panel.default'',''delay'')
        or 60 }}s to disarm.{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ phase == ''triggered'' }}'
      sequence:
      - parallel:
        - action: notify.mobile_app_drake_s_pixel_11_pro
          data:
            title: '{{ title }}'
            message: '{{ body }}'
            data:
              tag: alarmo_security
              group: security
              url: /lovelace-security/main-floor-security
              entity_id: camera.camera1_fluent
              push:
                interruption-level: critical
                sound:
                  name: default
                  critical: 1
                  volume: 1
              actions:
              - action: ALARMO_DISARM
                title: Disarm Alarm
                authenticationRequired: true
                destructive: true
              - action: ALARMO_VIEW
                title: View Cameras
        - action: notify.mobile_app_shawnas_iphone
          data:
            title: '{{ title }}'
            message: '{{ body }}'
            data:
              tag: alarmo_security
              group: security
              url: /lovelace-security/main-floor-security
              entity_id: camera.camera1_fluent
              push:
                interruption-level: critical
                sound:
                  name: default
                  critical: 1
                  volume: 1
              actions:
              - action: ALARMO_DISARM
                title: Disarm Alarm
                authenticationRequired: true
                destructive: true
              - action: ALARMO_VIEW
                title: View Cameras
          enabled: false
    default:
    - action: notify.mobile_app_drake_s_pixel_11_pro
      data:
        title: '{{ title }}'
        message: '{{ body }}'
        data:
          tag: alarmo_security
          group: security
          url: /lovelace-security/main-floor-security
          entity_id: camera.camera1_fluent
          push:
            interruption-level: critical
            sound:
              name: default
              critical: 1
              volume: 1
          actions:
          - action: ALARMO_DISARM
            title: Disarm Alarm
            authenticationRequired: true
            destructive: true
          - action: ALARMO_VIEW
            title: View Cameras
