      headers:
        Content-Type: application/json
      body: "{% set todo_items = my_list['todo.default']['items'] if my_list['todo.default']
        is defined else [] %} {% set ns = namespace(items=[]) %}\n{% for item in todo_items
        %}\n  {% set parts = item.summary.split(' ', 1) %}\n  {% if parts|length >
        1 and parts[0] | int(default=-1) != -1 %}\n    {% set ns.items = ns.items
        + [{\"name\": parts[1], \"quantity\": parts[0]}] %}\n  {% else %}\n    {%
        set ns.items = ns.items + [item.summary] %}\n  {% endif %}\n{% endfor %}\n{{
        {\n  \"title\": \"Grocery Shopping\",\n  \"items\": ns.items\n} | to_json
        }}"
    response_variable: api_response
  mode: single
led_set:
  alias: LED Set (Tier-aware Inovelli Wrapper)
  description: 'Semantic wrapper around the Zanix Inovelli Blue LED script. Tier 0=mode
    (LED 4 center), Tier 1=spatial (LED 7 top), Tier 2=global (LED 1 bottom), Tier
    3=critical (full bar via ''All''). LED numbering: LED 1=bottom, LED 7=top.


    NIGHT BRIGHTNESS CAP: When sun.sun is below_horizon (night) AND active_critical_notification
    is NOT ''Triggered'', sanctuary switches (Master Bedroom, Master Closet, Master
    Bathroom, Ethan''s Bedroom) get brightness=1 regardless of caller intent. Wrapper
    splits entity list into sanctuary and non-sanctuary subsets, sends two Zanix calls.
    Triggered alarm bypasses the cap (real emergency).


    IMPORTANT LED FORMAT: Zanix accepts strings (''Led 1'') or integers (1) but they
    map differently. Always use string format. Earlier integer-based wrapper was silently
    writing to wrong LEDs.


    FIRMWARE QUIRK: ''Clear Effect'' rejected by firmware when color/level/duration
    are present. Wrapper branches: clear path = minimal params; active path = full
    params + brightness cap logic.'
  fields:
    brightness:
      description: Optional brightness override. Leave blank for tier default.
      name: Brightness override (1-100)
      required: false
      selector:
        number:
          max: 100
          min: 1
          mode: box
          step: 1
    color:
      default: green
      description: Semantic color name. Optional when effect is 'off' or 'clear'.
        magenta maps to Pink in Zanix vocabulary. Blue is reserved for firmware default
        state.
      name: Color
      required: false
      selector:
        select:
          options:
          - red
          - orange
          - yellow
          - green
          - blue
          - purple
          - magenta
          - teal
          - white
          - 'off'
    duration_minutes:
      default: 0
      description: How long the effect runs. Use 0 for tier default. Use -1 for indefinite.
      name: Duration (minutes)
      required: false
      selector:
        number:
          max: 60
          min: -1
          mode: box
          step: 1
    effect:
      default: pulse
      description: LED effect. 'off' shows black state. 'clear' cancels notification
        overlay (use this when a notification ends).
      name: Effect
      required: false
      selector:
        select:
          options:
          - solid
          - pulse
          - fast_blink
          - slow_blink
          - 'off'
          - clear
    switch_entity:
      description: One or more Inovelli light entity IDs. Accepts a single entity
        string OR a list. Wrapper normalizes to a list for Zanix.
      name: Switch entity
      required: true
      selector:
        entity:
          domain: light
          integration: mqtt
          multiple: true
    tier:
      default: spatial
      description: mode | spatial | global | critical
      name: Tier
      required: true
      selector:
        select:
          options:
          - mode
          - spatial
          - global
          - critical
    duration_seconds:
      name: Duration (seconds)
      description: Optional. How long the effect runs in seconds. Takes precedence
        over duration_minutes if both are set. Useful for short effects like broadcast
        flashes (15-30 seconds).
      required: false
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          mode: box
  icon: mdi:led-strip-variant
  max: 25
  mode: parallel
  sequence:
  - alias: 'Branch on effect: Clear Effect uses minimal params (firmware quirk); active
      effects use full params'
    choose:
    - alias: 'Clear path: omit color, level, duration (firmware silently rejects Clear
        Effect when these are present)'
      conditions:
      - condition: template
        value_template: '{{ effect | default(''pulse'') == ''clear'' }}'
      sequence:
      - action: script.inovelli_blue_led_zigbee2mqtt
        data:
          led: '{% set m = {''mode'':''Led 4'',''spatial'':''Led 7'',''global'':''Led
            1'',''critical'':''All''} %}{{ m[tier] }}'
          effect: Clear Effect
          target: '{% set s = switch_entity %}{% if s is string %}{{ {''entity_id'':
            [s]} }}{% else %}{{ {''entity_id'': s | list} }}{% endif %}'
    default:
    - alias: 'At night + non-triggered: send to sanctuary subset at brightness=1'
      if:
      - condition: template
        value_template: '{% set is_night = is_state(''sun.sun'', ''below_horizon'')
          %}{% set is_triggered = is_state(''sensor.active_critical_notification'',
          ''Triggered'') %}{% set s = switch_entity %}{% set entities = [s] if s is
          string else (s | list) %}{% set sanctuary = [''light.master_bedroom_wall_switch'',
          ''light.master_bedroom_closet_wall_switch'', ''light.master_bathroom_wall_switch'',
          ''light.ethan_s_bedroom_wall_switch''] %}{% set filtered = entities | select(''in'',
          sanctuary) | list %}{{ is_night and not is_triggered and filtered | length
          > 0 }}'
      then:
      - action: script.inovelli_blue_led_zigbee2mqtt
        data:
          color: '{% set m = {''red'':''Red'',''orange'':''Orange'',''yellow'':''Yellow'',''green'':''Green'',''blue'':''Blue'',''purple'':''Purple'',''magenta'':''Pink'',''teal'':''Teal'',''white'':''White'',''off'':''Off''}
            %}{% set c = color | default(''green'') %}{{ m[c] }}'
          duration: '{% set tdd = {''mode'':-1,''spatial'':5,''global'':-1,''critical'':-1}
            %} {% set ds = duration_seconds | default(0) | int(0) %} {% set dm = duration_minutes
            | default(0) | int(0) %} {% if ds > 0 %} {{ ds }} {% elif dm > 0 %} {{
            dm * 60 }} {% else %} {% set m = tdd[tier] %} {{ ''Indefinitely'' if m
            == -1 else (m * 60) }} {% endif %}'
          effect: '{% set m = {''solid'':''Solid'',''pulse'':''Pulse'',''fast_blink'':''Fast
            Blink'',''slow_blink'':''Slow Blink'',''off'':''Off'',''clear'':''Clear
            Effect''} %}{{ m[effect | default(''pulse'')] }}'
          led: '{% set m = {''mode'':''Led 4'',''spatial'':''Led 1'',''global'':''Led
            4'',''critical'':''All''} %}{{ m[tier] }}'
          level: 1
          target: '{% set s = switch_entity %}{% set entities = [s] if s is string
            else (s | list) %}{% set sanctuary = [''light.master_bedroom_wall_switch'',
            ''light.master_bedroom_closet_wall_switch'', ''light.master_bathroom_wall_switch'',
            ''light.ethan_s_bedroom_wall_switch''] %}{% set filtered = entities |
            select(''in'', sanctuary) | list %}{{ {''entity_id'': filtered} }}'
    - alias: Send to non-sanctuary entities (or all entities if not night/triggered)
      if:
      - condition: template
        value_template: '{% set is_night = is_state(''sun.sun'', ''below_horizon'')
          %}{% set is_triggered = is_state(''sensor.active_critical_notification'',
          ''Triggered'') %}{% set should_dim = is_night and not is_triggered %}{%
          set s = switch_entity %}{% set entities = [s] if s is string else (s | list)
          %}{% set sanctuary = [''light.master_bedroom_wall_switch'', ''light.master_bedroom_closet_wall_switch'',
          ''light.master_bathroom_wall_switch'', ''light.ethan_s_bedroom_wall_switch'']
          %}{% if should_dim %}{% set filtered = entities | reject(''in'', sanctuary)
          | list %}{% else %}{% set filtered = entities %}{% endif %}{{ filtered |
          length > 0 }}'
      then:
      - action: script.inovelli_blue_led_zigbee2mqtt
        data:
          color: '{% set m = {''red'':''Red'',''orange'':''Orange'',''yellow'':''Yellow'',''green'':''Green'',''blue'':''Blue'',''purple'':''Purple'',''magenta'':''Pink'',''teal'':''Teal'',''white'':''White'',''off'':''Off''}
            %}{% set c = color | default(''green'') %}{{ m[c] }}'
          duration: '{% set tdd = {''mode'':-1,''spatial'':5,''global'':-1,''critical'':-1}
            %} {% set ds = duration_seconds | default(0) | int(0) %} {% set dm = duration_minutes
            | default(0) | int(0) %} {% if ds > 0 %} {{ ds }} {% elif dm > 0 %} {{
            dm * 60 }} {% else %} {% set m = tdd[tier] %} {{ ''Indefinitely'' if m
            == -1 else (m * 60) }} {% endif %}'
          effect: '{% set m = {''solid'':''Solid'',''pulse'':''Pulse'',''fast_blink'':''Fast
            Blink'',''slow_blink'':''Slow Blink'',''off'':''Off'',''clear'':''Clear
            Effect''} %}{{ m[effect | default(''pulse'')] }}'
          led: '{% set m = {''mode'':''Led 4'',''spatial'':''Led 1'',''global'':''Led
            4'',''critical'':''All''} %}{{ m[tier] }}'
          level: '{% set tdb = {''mode'':15,''spatial'':100,''global'':100,''critical'':100}
            %}{% set b = brightness | default(none) %}{{ (b if b is not none else
            tdb[tier]) | int }}'
          target: '{% set is_night = is_state(''sun.sun'', ''below_horizon'') %}{%
            set is_triggered = is_state(''sensor.active_critical_notification'', ''Triggered'')
            %}{% set should_dim = is_night and not is_triggered %}{% set s = switch_entity
            %}{% set entities = [s] if s is string else (s | list) %}{% set sanctuary
            = [''light.master_bedroom_wall_switch'', ''light.master_bedroom_closet_wall_switch'',
            ''light.master_bathroom_wall_switch'', ''light.ethan_s_bedroom_wall_switch'']
            %}{% if should_dim %}{{ {''entity_id'': entities | reject(''in'', sanctuary)
            | list} }}{% else %}{{ {''entity_id'': entities} }}{% endif %}'
panic_police:
  alias: Panic - Police
  icon: mdi:police-badge
  mode: single
  description: 'Police panic button: triggers Alarmo, sounds keypad sirens, lights
    everything up, locks doors, alerts family, broadcasts deterrent TTS.'
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.pre_panic_alarm_state
    data:
      value: '{{ states(''alarm_control_panel.default'') }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.last_panic_type
    data:
      value: police
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.panic_active
  - action: scene.create
    data:
      scene_id: pre_panic_lights
      snapshot_entities: '{{ states.light | selectattr(''state'',''eq'',''on'') |
        map(attribute=''entity_id'') | list }}'
    continue_on_error: true
  - action: alarmo.arm
    data:
      entity_id: alarm_control_panel.default
      mode: away
      skip_delay: true
      force: true
      code: '3627'
    continue_on_error: true
  - delay:
      seconds: 1
  - action: alarm_control_panel.alarm_trigger
    target:
      entity_id: alarm_control_panel.default
    continue_on_error: true
  - parallel:
    - action: light.turn_on
      target:
        floor_id:
        - main
        - basement
        - outdoors
      data:
        brightness_pct: 100
      continue_on_error: true
    - action: switch.turn_on
      target:
        entity_id: switch.drivewaycam_dahua_siren
      continue_on_error: true
    - action: light.turn_on
      target:
        entity_id: light.drivewaycam_dahua_security_light
      continue_on_error: true
    - action: lock.lock
      target:
        entity_id: lock.og_u_bolt_pro
      continue_on_error: true
  - action: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      media_player_entity_id: media_player.all_echo_devices
      message: Police have been called. Police have been called. Police have been
        called.
      cache: true
    continue_on_error: true
  - parallel:
    - action: notify.drake
      data:
        title: "\U0001F6A8 POLICE PANIC TRIGGERED"
        message: Panic button pressed at {{ now().strftime('%I:%M %p') }}. Alarm armed
          and triggered. All lights on. Doors locked.
        data:
          priority: high
          ttl: 0
          push:
            sound:
              critical: 1
              name: default
              volume: 1.0
            interruption-level: critical
      continue_on_error: true
    - action: notify.shawna
      data:
        title: "\U0001F6A8 POLICE PANIC TRIGGERED"
        message: Panic button pressed at {{ now().strftime('%I:%M %p') }}. Alarm armed
          and triggered. All lights on. Doors locked.
        data:
          priority: high
          ttl: 0
          push:
            sound:
              critical: 1
              name: default
              volume: 1.0
            interruption-level: critical
      continue_on_error: true
