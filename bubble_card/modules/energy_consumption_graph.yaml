                  value: history
          default: statistics
        - label: Statistics Period (Statistics source only; ignored for History)
          name: statistics_period
          selector:
            select:
              mode: dropdown
              options:
                - label: Auto
                  value: auto
                - label: Auto Detailed
                  value: auto_detailed
                - label: 5 Minutes
                  value: 5minute
                - label: Hour
                  value: hour
                - label: Day
                  value: day
                - label: Week
                  value: week
                - label: Month
                  value: month
          default: auto
        - label: Collection Key (e.g., energy_test, energy_custom_yearly)
          name: collection_key
          selector:
