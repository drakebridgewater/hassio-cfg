triggers:
- trigger: time
  id: t0
  at: !input on_time
- trigger: numeric_state
  id: t1
  entity_id: sun.sun
  attribute: elevation
  below: !input sun_elevation
- trigger: numeric_state
  id: t2
  entity_id: !input ambient_light_sensor
  below: !input ambient_light_value
- trigger: state
  id: t3
  entity_id: !input entity_state_on
  from: 'off'
  to: 'on'
- trigger: state
  id: t4
  entity_id: !input entity_state_off
  from: 'on'
  to: 'off'
condition:
- condition: or
  conditions:
  - condition: template
    value_template: '{{ automation_control == ''disable_automation_control'' }}'
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ automation_control == ''enable_entity_state'' }}'
    - condition: state
      entity_id: !input automation_control_entity
      state: 'on'
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ automation_control == ''enable_start_end_date'' }}'
    - condition: template
      value_template: '{% set start_date = automation_control_start_date | as_datetime
        %} {% set end_date = automation_control_end_date | as_datetime %} {% set now
        = now().replace(tzinfo=None) %} {{ start_date <= now <= end_date }}

        '
  - condition: and
    conditions:
    - '{{ automation_control == ''enable_zone'' }}'
    - condition: numeric_state
      entity_id: !input automation_control_zone
      below: 1
  - condition: and
    conditions:
    - '{{ automation_control == ''enable_people'' }}'
    - '{{ (state_attr(automation_control_zone, ''persons'') | list | select(''in'',
      automation_control_people) | list | length) == 0 }}'
- condition: and
  conditions: !input global_conditions
- condition: or
  conditions:
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''time_on'' }}'
    - condition: trigger
      id: t0
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''sun_elevation'' }}'
    - condition: trigger
      id: t1
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''ambient_light'' }}'
    - condition: trigger
      id: t2
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''entity_state_on'' }}'
    - condition: trigger
      id: t3
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''entity_state_off'' }}'
    - condition: trigger
      id: t4
- condition: or
  conditions:
  - condition: template
    value_template: '{{ include_weekdays == ''weekday_disabled'' }}'
  - condition: and
    conditions:
    - condition: time
      weekday: !input weekday_options
    - condition: template
      value_template: '{{ include_weekdays == ''weekday_enabled'' }}'
action:
- choose:
  - alias: Check if turn ON time is enabled
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''time_on'' }}'
    sequence:
    - delay:
        minutes: "{% if on_time_delay > 0 %}\n  {{ range(1, on_time_delay + 1) | random
          }}\n{% else %}\n  0\n{% endif %}\n"
  - alias: Check if entity state ON is enabled
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''entity_state_on'' }}'
    sequence:
    - delay:
        seconds: "{% if entity_state_on_time_delay > 0 %}\n  {{ range(1, (entity_state_on_time_delay
          * 60) + 1) | random }}\n{% else %}\n  0\n{% endif %}\n"
  - alias: Check if entity state OFF is enabled
    conditions:
    - condition: template
      value_template: '{{ trigger_selection == ''entity_state_off'' }}'
    sequence:
    - delay:
        seconds: "{% if entity_state_off_time_delay > 0 %}\n  {{ range(1, entity_state_off_time_delay
          + 1) | random }}\n{% else %}\n  0\n{% endif %}\n"
- choose:
  - alias: Used for - Minimum / Maximum ON Time - Earliest and Latest Time Range -
      Entity State ON & OFF
    conditions:
    - condition: template
      value_template: '{{ time_off_selection != ''random_activity_window'' }}'
    sequence:
    - choose:
      - alias: Turn ON actions
        conditions:
        - condition: template
          value_template: '{{ entity_order_on in [''entities_on_in_sequence'', ''entities_on_in_reverse_order'',
            ''entities_on_shuffled'', ''entities_on_same_time''] }}'
        sequence:
        - choose:
          - alias: Check if in sequence is selected
            conditions:
            - condition: template
              value_template: '{{ entity_order_on == ''entities_on_in_sequence'' }}'
            sequence:
            - alias: Entities ON In Sequence Order
              repeat:
                count: '{{ entities | length }}'
                sequence:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ repeat.index > 1 }}'
                    sequence:
                    - delay: "{% if random_on_delay > 0 %}\n  {{ range(1, random_on_delay
                        + 1) | random }}\n{% else %}\n  0\n{% endif %}\n"
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ entities[repeat.index - 1].id.split(''.'')[0]
                        == ''light'' }}'
                    sequence:
                    - action: light.turn_on
                      target:
                        entity_id: '{{ entities[repeat.index - 1].id }}'
                      data: "{% if entities[repeat.index - 1].data is defined %}\n
                        \ {{ entities[repeat.index - 1].data }}\n{% else %}\n  {}\n{%
                        endif %}\n"
                  - conditions:
                    - condition: template
                      value_template: '{{ entities[repeat.index - 1].id.split(''.'')[0]
                        != ''light'' }}'
                    sequence:
                    - action: homeassistant.turn_on
                      data:
                        entity_id: '{{ entities[repeat.index - 1].id }}'
          - alias: Check if reverse order is selected
            conditions:
            - condition: template
              value_template: '{{ entity_order_on == ''entities_on_in_reverse_order''
                }}'
            sequence:
            - alias: Entities ON in Reverse Order
              repeat:
                count: '{{ entities_inv | length }}'
                sequence:
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ repeat.index > 1 }}'
                    sequence:
                    - delay: "{% if random_on_delay > 0 %}\n  {{ range(1, random_on_delay
                        + 1) | random }}\n{% else %}\n  0\n{% endif %}\n"
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ entities_inv[repeat.index - 1].id.split(''.'')[0]
                        == ''light'' }}'
                    sequence:
