blueprint:
  name: Holiday & Away Lighting
  description: "# ✈️ Holiday & Away Lighting\n**Version: 1.4**\n\nMake your home glow,
    no matter where you go! \U0001F697 \U0001F4A8\n\n**If you like my blueprints,
    and would like to show your support or just say thank you?** [Click Here](https://www.paypal.com/donate/?hosted_button_id=WAZS3QSDTPGA8)
    \U0001F642\n\n<details> <summary><b>The Automation Process:</b> \U0001F448</summary>\n\nThis
    automation allows you to control lights or other entities based on various triggers,
    with customizable Behaviour for turning them ON and OFF. Here's how it works step
    by step:\n\n  - **Automation Activation:**\n    - **Entity-based control:** If
    you've selected an entity for automation control, the automation will be activated
    when the entity is turned ON. If the entity is turned OFF, the automation will
    be disabled.\n    - **Date Range Control:** The automation can be enabled or disabled
    based on a defined start and end date.\n    - **Device Tracker - Zone:** The automation
    will only activate when no tracked devices are in the selected zone.\n    - **Device
    Tracker - Zone + People:** The automation will only activate when no selected
    people are in the chosen zone.\n\n  - **Trigger Conditions:**\n    - You can set
    up a variety of triggers for turning the lights ON:\n      1. **Time-based trigger**
    - Lights turn ON at a specific time.\n      2. **Sun Elevation** - Lights turn
    ON when the sun reaches a certain angle.\n      3. **Ambient Light Level** - Lights
    turn ON when the ambient light level falls below a set threshold.\n      4. **Entity
    State (ON)** - Lights turn ON when a selected entity is turned ON.\n      5. **Entity
    State (OFF)** - Lights turn ON when a selected entity is turned OFF, creating
    a sequence effect across multiple automations.\n\n  - **Lights ON Behaviour:**\n
    \   - **Order of Lights Turning ON:** Lights can turn ON in sequence, reverse
    order, shuffled, or at the same time, depending on your preference.\n    - **Staggered
    ON Behaviour:** If you've selected sequence, reverse order, or shuffled, the lights
    can be staggered with a random delay to create a more natural effect.\n    - **Lights:**
    For selected light entities, you can adjust brightness, colour temperature, colour,
    and transition time.\n\n  - **Lights ON Duration:**\n    - **Duration Method:**
    You can choose how long the lights stay ON before turning OFF.\n      1. **Minimum
    / Maximum ON Time:** Lights stay ON for a random duration between the set minimum
    and maximum ON time.\n      2. **Earliest and Latest Time Range:** Lights turn
    OFF at a random time within the defined earliest and latest OFF time range.\n
    \     3. **Entity State - ON**: Lights stay ON for a random duration after an
    entity is turned ON before they turn OFF.\n      4. **Entity State - OFF**: Lights
    stay ON for a random duration after an entity is turned OFF before they turn OFF.\n
    \     5. **Random Activity Window**: Lights will turn ON and OFF multiple times
    at random intervals within the defined duration and cycle settings.\n\n  - **Lights
    OFF Behaviour:**\n\n    - Just like the ON behaviour, you can define how lights
    will turn OFF:\n      - **Order of Lights Turning OFF:** You can turn them OFF
    in sequence, reverse order, shuffled, or all at the same time.\n      - **Staggered
    OFF Behaviour:** If sequence, reverse order, or shuffled is selected, lights will
    turn OFF with a random delay between each light.\n      - **Lights:** For selected
    light entities, you can adjust transition time.\n\n  - **Weekday Control (Optional):**\n\n
    \   - You can specify that the automation only runs on certain weekdays, offering
    flexibility to limit the automation to weekdays or weekends.\n\n  - **Global Conditions
    (Optional):**\n\n    - You can apply global conditions that affect the automation's
    behaviour, ensuring it only runs under specific circumstances.\n</details>\n\nNeed
    help?\n- FAQ: [Click Here](https://community.home-assistant.io/t/871550/2)\n-
    Community Support Including Updates: [Click Here](https://community.home-assistant.io/t/871550)\n\nRequired
    = *\n"
  domain: automation
  input:
    automation_control:
      name: Automation Control
      icon: mdi:auto-mode
      collapsed: true
      input:
        automation_control:
          name: Automation Control (Optional)
          description: 'This optional control allows you to activate the automation
            based on an entity''s ON state, a specified date range, or the presence
            of devices and people in a zone.

            - **Entity State** - Use an entity to activate the automation. This could
            be a simple toggle helper in a dashboard to easily turn your holiday lighting
            automations ON or OFF.

            - **Start & End Date** - Set a date range to determine when this automation
            is active.

            - **Device Tracker - Zone** - This tracks your devices and will only trigger
            when no devices are present in the selected zone.

            - **Device Tracker - Zone + People** - This tracks the selected people
            and will only trigger when none of the selected people are present in
            the chosen zone.

            '
          default: disable_automation_control
          selector:
            select:
              options:
              - label: Entity State
                value: enable_entity_state
              - label: Start & End Date
                value: enable_start_end_date
              - label: Device Tracker - Zone
                value: enable_zone
              - label: Device Tracker - Zone + People
                value: enable_people
              - label: Disable Automation Control
                value: disable_automation_control
              multiple: false
              sort: false
              custom_value: false
        automation_control_entity:
          name: Entity State
          description: 'Select the entity to use for enabling or disabling the automation.
            When the entity is ON, the automation is active; when it is OFF, the automation
            is inactive.

            '
          default: []
          selector:
            entity:
              filter:
              - domain:
                - input_boolean
              multiple: false
              reorder: false
        automation_control_start_date:
          name: Start Date
          description: 'The date when the automation should start running.

            '
          default: 2025-01-01 00:00:00
          selector:
            datetime: {}
        automation_control_end_date:
          name: End Date
          description: 'The date when the automation should stop running.

            '
          default: 2025-01-01 00:00:00
          selector:
            datetime: {}
        automation_control_zone:
          name: Device Tracker - Zone
          description: 'Select the zone that will be used to track the presence of
            devices and/or people.

            '
          default: []
          selector:
            entity:
              filter:
              - domain:
                - zone
              multiple: false
              reorder: false
        automation_control_people:
          name: Device Tracker - People
          description: "Choose the people you want to track within the selected zone.
            \n\n**Note:** A zone must be selected above for this option to function.\n"
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - person
              reorder: false
    trigger_settings:
      name: Trigger Settings
      icon: mdi:cog-play-outline
      collapsed: true
      input:
        trigger_selection:
          name: Trigger Type
          description: 'Select how the lighting should be triggered ON:


            - **Time** - Turn the lights ON at a specific time.

            - **Sun Elevation** - Turn the lights ON when the sun elevation falls
            below the ''Sun Elevation Falling'' setpoint.

            - **Ambient Lighting** - Turn the lights ON when the ambient light sensor
            falls below the ''Ambient Light Lux Threshold''.

            - **Entity State - ON** - Turn the lights ON when a selected entity turns
            ON.

            - **Entity State - OFF** - Turn the lights ON when a selected entity turns
            OFF.


            The settings to each option are provided below.

            '
          default: time_on
          selector:
            select:
              options:
              - label: Time
                value: time_on
              - label: Sun Elevation
                value: sun_elevation
              - label: Ambient Light
                value: ambient_light
              - label: Entity State - ON
                value: entity_state_on
              - label: Entity State - OFF
                value: entity_state_off
              multiple: false
              sort: false
              custom_value: false
        on_time:
          name: Turn ON Time
          description: 'The time when the lights should turn ON.

            '
          default: 00:00:00
          selector:
            time: {}
        on_time_delay:
          name: Turn ON Time Delay
          description: 'When the time passes and triggers the automation, a random
            delay (up to the set number of minutes) is added before the lights activate.


            This helps the lighting feel more natural and prevents the lights from
            turning ON at the exact same time every day, avoiding the “time-clock”
            effect.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 60.0
              unit_of_measurement: minutes
              mode: slider
              step: 1.0
        sun_elevation:
          name: Sun Elevation Falling
          description: 'The sun elevation falling refers to the angle between the
            sun and the horizon when the sun is setting.

            - **Negative values** indicate the sun is below the horizon (e.g., -1.5
            for dusk).

            - **Positive values** indicate the sun is above the horizon.

            '
          default: -1.5
          selector:
            number:
              min: -10.0
              max: 5.0
              step: 0.5
              unit_of_measurement: degrees
              mode: slider
        ambient_light_sensor:
          name: Ambient Light Sensor
          description: 'Select the ambient light sensor used to determine lighting
            conditions.

            '
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
                device_class:
                - illuminance
              multiple: false
              reorder: false
        ambient_light_value:
          name: Ambient Light Lux Threshold
          description: 'Set the lux level at which the lights will turn ON. **Guide:**
            20 lux corresponds to dusk conditions.

            '
          default: 20
          selector:
            number:
              min: 0.0
              max: 500.0
              step: 10.0
              unit_of_measurement: lux
              mode: slider
        entity_state_on:
          name: Entity State - ON
          description: 'Select an entity that, when turned ON, will trigger the lighting.

            '
          default: []
          selector:
            entity:
              multiple: false
              reorder: false
        entity_state_on_time_delay:
          name: Entity State - ON - Time Delay
          description: 'After the entity turns ON, a random delay (up to the set number
            of minutes) is applied before the lights turn ON.


            This helps the lighting feel more natural and prevents the lights from
            turning ON at the exact same time every day, avoiding the “time-clock”
            effect.

            '
          default: 15
          selector:
            number:
              min: 0.0
              max: 30.0
              unit_of_measurement: minutes
              mode: slider
              step: 1.0
        entity_state_off:
          name: Entity State - OFF
          description: 'Select an entity that, when turned OFF, will trigger the lighting.
            This is useful when using multiple automations to create a natural lighting
            sequence.


            For example, turning OFF your family room lights could trigger your hallway
            lights to turn ON, followed by your bedroom lights, making it appear as
            if someone is moving through the house.

            '
          default: []
          selector:
            entity:
              multiple: false
              reorder: false
        entity_state_off_time_delay:
          name: Entity State - OFF - Time Delay
          description: 'After the entity turns OFF, a random delay (up to the set
            number of seconds) is applied before the next lights turn ON.


            This creates a smoother, more natural transition between rooms and prevents
            the lighting sequence from feeling mechanical.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 60.0
              unit_of_measurement: seconds
              mode: slider
              step: 1.0
    automation_settings:
      name: Automation Settings
      icon: mdi:head-lightbulb-outline
      collapsed: true
      input:
        entity_order_on:
          name: Lights ON Order
          description: 'Choose the order in which the lights will turn ON.


            - **In Sequence** - Lights will turn ON in order (Light 1, 2, 3, 4, etc.).

            - **Reverse Order** - Lights will turn ON in reverse order (Light 10,
            9, 8, 7, etc.).

            - **Shuffled** - Lights will turn ON in a random order each time.

            - **At the Same Time** - Lights will turn ON together at the same time.

            '
          default: entities_on_same_time
          selector:
            select:
              options:
              - label: In Sequence
                value: entities_on_in_sequence
              - label: Reverse Order
                value: entities_on_in_reverse_order
              - label: Shuffled
                value: entities_on_shuffled
              - label: At the Same Time
                value: entities_on_same_time
              multiple: false
              sort: false
              custom_value: false
        random_on_delay:
          name: Random ON Delay
          description: 'If you selected ''In Sequence,'' ''Reverse Order,'' or ''Shuffled''
            in ''Lights ON Order'' above, set the maximum random delay (in seconds)
            to stagger the lights turning ON.


            **Example:**

            - **In Sequence, Reverse Order & Shuffled Only**: When the automation
            is triggered, the first light will turn ON immediately. Then, a random
            delay (within the ''Random ON Delay'') will be applied before the next
            light turns ON. This continues for each subsequent light, creating a staggered
            effect with random delays between each light turning ON, as if you were
            manually turning the lights ON one by one.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 300.0
              unit_of_measurement: seconds
              mode: slider
              step: 1.0
        time_off_selection:
          name: Lights ON Duration Method
          description: 'Choose the method for determining how long the lights should
            stay ON before turning OFF:


            1. **Minimum / Maximum ON Time** - Lights will start turning OFF at a
            random time between the set minimum and maximum ON time.


            2. **Earliest and Latest Time Range** - Lights will start turning OFF
            at a random time within the defined earliest and latest OFF time range.


            3. **Entity State - ON** - Lights will start turning OFF at a random time
            delay when a selected entity turns ON.


            4. **Entity State - OFF** - Lights will start turning OFF at a random
            time delay when a selected entity turns OFF.


            5. **Random Activity Window** - Lights will turn ON and OFF multiple times
            at random intervals within the defined duration and cycle settings.


            The settings to each method are provided below.

            '
          default: min_max_on_time
          selector:
            select:
              options:
              - label: Use Minimum / Maximum ON Time
                value: min_max_on_time
              - label: Use Earliest and Latest Time Range
                value: earliest_latest_time_range
              - label: Entity State - ON
                value: entity_on_state
              - label: Entity State - OFF
                value: entity_off_state
              - label: Random Activity Window
                value: random_activity_window
              multiple: false
              sort: false
              custom_value: false
        min_on_time:
          name: Minimum ON Time
          description: '**Method 1** - Once all the lights are on, set the minimum
            time they should stay ON before turning OFF.

            '
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:
              enable_second: true
        max_on_time:
          name: Maximum ON Time
          description: '**Method 1** - Once all the lights are on, set the maximum
            time the lights should stay ON before turning OFF.

            '
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
              enable_second: true
        start_time_range:
          name: Earliest OFF Time
          description: '**Method 2** - The earliest time the automation can start
            turning the lights OFF.


            **Note:** Ensure that your lights will be ON based on your trigger selection
            and that they are not scheduled to turn ON after this time.

            '
          default: '22:30:00'
          selector:
            time: {}
        end_time_range:
          name: Latest OFF Time
          description: '**Method 2** - The latest time the automation can start turning
            the lights OFF.


            **Note:** Ensure that your lights will be ON based on your trigger selection
            and that they are not scheduled to turn ON after this time.

            '
          default: '23:00:00'
          selector:
            time: {}
        entity_on_state:
          name: Entity State - ON
          description: '**Method 3** - Select an entity that, when turned ON, will
            initiate turning the lights OFF.

            '
          default: []
          selector:
            entity:
              multiple: false
              reorder: false
        entity_on_state_time_delay:
          name: Entity State - ON - Time Delay
          description: '**Method 3** - Once the above entity turns ON, introduce a
            random delay (up to the set number of seconds) before turning the lights
            OFF. This prevents the lights from turning OFF immediately when the entity
            turns ON, creating a more natural effect.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 60.0
              unit_of_measurement: seconds
              mode: slider
              step: 1.0
        entity_off_state:
          name: Entity State - OFF
          description: '**Method 4** - Select an entity that, when turned OFF, will
            initiate turning the lights OFF.

            '
          default: []
          selector:
            entity:
              multiple: false
              reorder: false
        entity_off_state_time_delay:
          name: Entity State - OFF - Time Delay
          description: '**Method 4** - Once the above entity turns OFF, introduce
            a random delay (up to the set number of seconds) before turning the lights
            OFF. This prevents the lights from turning OFF immediately when the entity
            turns OFF, creating a more natural effect.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 60.0
              unit_of_measurement: seconds
              mode: slider
              step: 1.0
        activity_window_duration:
          name: Activity Window - Duration
          description: '**Method 5** - The total time period during which random lighting
            activity can occur.


            This defines the full activity window used to distribute all lighting
            cycles after the automation starts.


            **Example:**

            * Simulate normal overnight movement between bedtime and morning.

            * Simulate presence in the home while occupants are asleep.

            * Longer durations create larger gaps between random lighting events.


            ⚠️ Recommended range: 8 to 10 hours for realistic overnight simulation.


            Although not required for most setups, you can fully validate your configuration
            using the formula below: This confirms your settings fit within the Activity
            Window (all calculations are based on seconds).


            (Cycle Count x Maximum ON Time) + ((Cycle Count - 1) x Maximum OFF Time)
            ≤ Duration

            '
          default:
            hours: 9
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_second: true
        activity_cycle_count:
          name: Activity Window - Number Of Cycles
          description: '**Method 5** - The total number of light activation cycles
            during the activity window.


            The first cycle occurs when the automation is triggered (bedtime start),
            with the remaining cycles distributed randomly throughout the activity
            window.


            ⚠️ A minimum of 2 cycles is recommended. Using only 1 cycle will result
            in no additional random activity, as the first cycle occurs immediately
            when the automation starts. In this case, another **Lights ON Duration
            Method** would be more suitable.


            **Example:**

            * 2 cycles = bedtime + one additional night-time movement

            * 3-4 cycles = typical household night activity (bedtime + multiple movements)

            * 5 cycles = higher activity levels or multiple occupants

            '
          default: 3
          selector:
            number:
              min: 2.0
              max: 5.0
              mode: slider
              step: 1.0
        activity_min_on_time:
          name: Activity Window - Minimum ON Time
          description: '**Method 5** - The minimum amount of time the lights will
            stay ON during each cycle.


            **Example:**

            * Quick bathroom trip (toilet visit and return to bed)

            * Brief hallway or kitchen movements

            '
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
              enable_second: true
        activity_max_on_time:
          name: Activity Window - Maximum ON Time
          description: '**Method 5** - The maximum amount of time the lights will
            stay ON during each cycle.


            **Example:**

            * Slower night movement through the house (e.g. toilet + drink of water)

            * Brief extended activity before returning to bed

            '
          default:
            hours: 0
            minutes: 4
            seconds: 0
          selector:
            duration:
              enable_second: true
        activity_min_off_time:
          name: Activity Window - Minimum OFF Time
          description: '**Method 5** - The minimum amount of time the lights will
            stay OFF between light activations.


            **Example:**

            * Short sleep period between wake-ups

            * Light sleep before another brief movement (e.g. toilet trip)

            '
          default:
            hours: 3
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_second: true
        activity_max_off_time:
          name: Activity Window - Maximum OFF Time
          description: '**Method 5** - The maximum amount of time the lights will
            stay OFF between light activations.


            **Example:**

            * Deep sleep period with no interruptions

            * Long rest period before any further movement occurs

            '
          default:
            hours: 4
            minutes: 20
            seconds: 0
          selector:
            duration:
              enable_second: true
        entity_order_off:
          name: Lights OFF Order
          description: 'Choose the order in which the lights will turn OFF.


            - **In Sequence** - Lights will turn OFF in order (Light 1, 2, 3, 4, etc.).

            - **Reverse Order** - Lights will turn OFF in reverse order (Light 10,
            9, 8, 7, etc.).

            - **Shuffled** - Lights will turn OFF in a random order each time.

            - **At the Same Time** - Lights will turn OFF together at the same time.

            '
          default: entities_off_same_time
          selector:
            select:
              options:
              - label: In Sequence
                value: entities_off_in_sequence
              - label: Reverse Order
                value: entities_off_in_reverse_order
              - label: Shuffled
                value: entities_off_shuffled
              - label: At the Same Time
                value: entities_off_same_time
              multiple: false
              sort: false
              custom_value: false
        random_off_delay:
          name: Random OFF Delay
          description: 'If you selected ''In Sequence,'' ''Reverse Order,'' or ''Shuffled''
            in ''Lights OFF Order'' above, set the maximum random delay (in seconds)
            to stagger the lights turning OFF.


            **Example:**

            - **In Sequence, Reverse Order & Shuffled Only**: When the automation
            has met its ''Lights ON Duration Method,'' the first light will turn OFF
            immediately. Then, a random delay (within the ''Random OFF Delay'') is
            applied before the next light turns OFF. This continues for each subsequent
            light, creating a staggered effect with random delays between each light
            turning OFF, simulating the effect of manually turning off the lights
            one by one.

            '
          default: 30
          selector:
            number:
              min: 0.0
              max: 300.0
              unit_of_measurement: seconds
              mode: slider
              step: 1.0
    light_1:
      name: Light 1 *
      icon: mdi:lightbulb-outline
      collapsed: true
      input:
        entity_1:
          name: Light 1 *
          description: "First light, switch or toggle helper.\n\n**Applies to each
            light input:**\nIf you're using my\U0001F4A1[Sensor Light Blueprint](https://community.home-assistant.io/t/481048)
            to control your lights, it's recommended to use a toggle helper here,
            as well as in the bypass option 1 of your Sensor Light automations. This
            setup will allow you to control all your lights, switches, scenes, or
            scripts via the Sensor Light Blueprint, enhancing the user experience.\n\nEven
            though only lights, switches, and toggle helpers are displayed in the
            selection, the automation can turn ON and OFF any entity. If you're unable
            to select your entity (e.g., TV, media player, etc.), simply copy and
            paste its entity ID into the input field.\n"
          default: []
          selector:
            entity:
              filter:
              - domain:
                - light
                - switch
                - input_boolean
              multiple: false
              reorder: false
        entity_1_include_light_control:
          name: Light Control Options (Optional)
          description: 'Select if you would like to use brightness or transition.
            These settings will only affect a ''light'' entity that supports each
            selected option. The settings for brightness and transition are provided
            below.

            '
          default: []
          selector:
            select:
              multiple: true
              options:
              - label: Use Brightness
                value: use_brightness
              - label: Use Transition
                value: use_transition
              sort: false
              custom_value: false
        entity_1_light_brightness:
          name: Brightness
          description: 'The brightness setting for the lights when they are turned
            ON.

            '
          default: 100
          selector:
            number:
              min: 1.0
              max: 100.0
              mode: slider
              step: 1.0
              unit_of_measurement: '%'
        entity_1_light_transition_on:
          name: Transition - ON
          description: 'The transition setting for the lights when they are turned
            ON.

            '
          default: 1
          selector:
            number:
              min: 0.0
              max: 5.0
              mode: slider
              step: 0.5
              unit_of_measurement: seconds
        entity_1_light_transition_off:
          name: Transition - OFF
          description: 'The transition setting for the lights when they are turned
            OFF.

            '
          default: 1
          selector:
            number:
              min: 0.0
              max: 30.0
              mode: slider
              step: 1.0
              unit_of_measurement: seconds
        entity_1_include_light_colour_control:
          name: Light Colour Control Options (Optional)
          description: 'Select if you would like to use colour temperature, RGB, RGBW
            or RGBWW colour. These settings will only affect a ''light'' entity that
            supports each selected option. The settings for colour temperature, RGB,
            RGBW and RGBWW colour are provided below.

            '
          default: disable_colour_control
          selector:
            select:
              options:
              - label: Use Colour Temperature
                value: use_colour_temperature
              - label: Use RGB Colour
                value: use_rgb_colour
              - label: Use RGBW Colour
                value: use_rgbw_colour
              - label: Use RGBWW Colour
                value: use_rgbww_colour
              - label: Disable Colour Control
                value: disable_colour_control
              multiple: false
              sort: false
              custom_value: false
        entity_1_light_colour_temperature:
          name: Colour Temperature
          description: 'The colour temperature setting for the lights when they are
            turned ON.

            '
          default: 5000
          selector:
            number:
              min: 2000.0
              max: 8000.0
              mode: slider
              step: 100.0
              unit_of_measurement: kelvin
        entity_1_light_rgb_colour:
          name: RGB Colour
          description: 'The RGB colour setting for the lights when they are turned
            ON.

            '
          default:
          - 255
          - 255
          - 255
          selector:
            color_rgb: {}
        entity_1_light_rgbw_colour:
          name: RGBW Colour
          description: 'The RGBW colour setting for the lights when they are turned
            ON. Enter four integers between 0 and 255 to define the values for Red,
            Green, Blue, and White.

            '
          default:
          - 255
          - 255
