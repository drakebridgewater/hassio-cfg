                          - if:
                              - condition: template
                                value_template: >-
                                  {{ light_percent > 0 }}
                            then:
                              - service: light.turn_on
                                data_template:
                                  entity_id: !input light_entity
                                  brightness_pct: "{{ light_percent }}"
                                alias: Turn ON the light with brightness
                            else:
                              - service: light.turn_on
                                data: {}
                                target:
