blueprint:
  name: Cover Control Automation (CCA)
  description: "# ⭐ Cover Control Automation (CCA) ⭐\nCover Control Automation is
    a comprehensive Home Assistant blueprint which automatically manages your window
    coverings (such as roller shutters and blinds) based on time, the position of
    the sun, and weather conditions. It adapts intelligently to your preferences,
    largely eliminating the need for manual adjustments.\n\n**Version**: 2026.08.25
    V2\n\n### \U0001F517 Resources & Support\n\U0001F4E2 **Latest Changes**: [Changelog](https://hvorragend.github.io/ha-blueprints/CHANGELOG)
    | ✨ **Highlights**: [Key Features](https://hvorragend.github.io/ha-blueprints/#key-features)\n\U0001F680
    **Setup**: [Quick Start Guide](https://hvorragend.github.io/ha-blueprints/#quick-start-5-steps)
    | [Prerequisites](https://hvorragend.github.io/ha-blueprints/#essential-prerequisites)\n\U0001F4DA
    **Docs**: \U0001F4D6 [Handbook](https://hvorragend.github.io/ha-blueprints/handbook/)
    | ❓ [FAQ](https://hvorragend.github.io/ha-blueprints/FAQ) | ☀️ [Dynamic Sun Elevation](https://hvorragend.github.io/ha-blueprints/DYNAMIC_SUN_ELEVATION)
    | ⏰ [Time Control Visualization](https://hvorragend.github.io/ha-blueprints/TIME_CONTROL_VISUALIZATION)\n\U0001F527
    **Validator**: Validate YAML for errors, typos, and deprecated parameters with
    the [CCA Configuration Validator](https://hvorragend.github.io/ha-blueprints/validator/)\n✨
    **Online Tools**:  \U0001F50D [CCA Trace Analyzer](https://hvorragend.github.io/ha-blueprints/trace-analyzer/)
    | \U0001F4C8 [CCA Trace Compare](https://hvorragend.github.io/ha-blueprints/trace-compare/)\n\U0001F4AC
    **Get Help**: [Forum Thread](https://community.home-assistant.io/t/cover-control-automation-cca-a-comprehensive-and-highly-configurable-roller-blind-blueprint/680539)
    | [GitHub Issues](https://github.com/hvorragend/ha-blueprints/issues) | [Source
    Code](https://github.com/hvorragend/ha-blueprints/blob/main/blueprints/automation/cover_control_automation.yaml)\n❤️
    **Enjoying my work?** [Buy me a Coffee](https://buymeacoffee.com/herr.vorragend)
    or tip via [PayPal](https://www.paypal.com/donate/?hosted_button_id=NQE5MFJXAA8BQ).
    Thank you! \U0001F64C\n<sub>License: Open-source. Attribution and original repo
    link required for modifications. \"Take Control\" copies are unsupported.</sub>\n"
  source_url: https://github.com/hvorragend/ha-blueprints/blob/main/blueprints/automation/cover_control_automation.yaml
  domain: automation
  homeassistant:
    min_version: 2025.4.0
  input:
    blind:
      name: "\U0001FA9F Cover"
      description: "Which blind or roller shutter should be automated?\nUsing a cover
        group? See [FAQ: Can I use a cover group?](https://hvorragend.github.io/ha-blueprints/FAQ#q-can-i-use-a-cover-group)\nWhile
        the cover is unavailable (e.g. during a restart), the automation pauses —
        without a position it cannot decide anything. To catch up on missed events
        once the cover is back, enable **\U0001F504 Recovery after a restart or an
        outage** in the *Automation Options*."
      selector:
        entity:
          filter:
          - domain:
            - cover
          multiple: false
          reorder: false
    cover_status_helper:
      name: "\U0001F524 Cover Status Helper"
      description: Helper used to store the last cover event data (in JSON format).
        A separate helper must be created for each CCA automation. *Attention:* You
        will need to manually create an [input_text](https://my.home-assistant.io/redirect/helpers/)
        entity with a <ins>length of 254 chars</ins> for this.
      default: []
      selector:
        entity:
          domain:
          - input_text
          multiple: false
          reorder: false
    feature_section:
      name: Automation Options
      icon: mdi:window-shutter-cog
      collapsed: true
      description: "<center><p><small>\n  Configure what CCA controls and how it behaves.
        Most settings use safe defaults. Expand the descriptions below only if you
        need details.\n</small></p></center>"
      input:
        auto_options:
          name: "\U0001F449 What should CCA control?"
          description: "Select which opening, closing, and special behaviors CCA should
            manage.\n*Not sure? The defaults (Morning Opening, Evening Closing, Time
            Control) work for most setups.*\n*⚠️ For a fixed-time schedule (open/close
            at set times, no sensors), **⏲️ Time Control must stay checked** — it
            is the only trigger for Morning Opening and Evening Closing then. Unchecking
            it disables both entirely.*\n\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#auto_options)."
          default:
          - auto_up_enabled
          - auto_down_enabled
          - time_control_enabled
          selector:
            select:
              options:
              - label: "\U0001F53C Morning Opening — Automatically open the cover
                  each morning"
                value: auto_up_enabled
              - label: "\U0001F53B Evening Closing — Automatically close the cover
                  each evening"
                value: auto_down_enabled
              - label: ⏲️ Time Control — Open/close at the Early/Late times; without
                  Brightness/Sun sensors this is the only opening/closing trigger
                value: time_control_enabled
              - label: "\U0001F505 Brightness Control — Trigger opening/closing based
                  on ambient brightness sensor"
                value: auto_brightness_enabled
              - label: ☀️ Sun Elevation Control — Trigger opening/closing based on
                  sun position (sunrise/sunset)
                value: auto_sun_enabled
              - label: "\U0001F4A8 Ventilation Mode — React to open/tilted windows,
                  prevent lockout"
                value: auto_ventilate_enabled
              - label: "\U0001F975 Sun Protection / Shading — Partially close when
                  sun shines directly on window"
                value: auto_shading_enabled
              multiple: true
              sort: false
              custom_value: false
              mode: list
        time_control:
          name: ⏲️ Time Control Type
          description: "Select how time-based opening and closing is scheduled. *(Only
            relevant when **⏲️ Time Control** is checked in the **\U0001F449 What
            should CCA control?** list above — uncheck it there to disable the time
            windows entirely. Careful: without Brightness/Sun sensors the time windows
            are the only opening/closing trigger, so unchecking stops automatic opening
            and closing altogether.)*\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#time_control)."
          default: time_control_input
          selector:
            select:
              options:
              - label: ✏️ Use the time input fields in this blueprint section
                value: time_control_input
              - label: "\U0001F4C5 Use a Home Assistant calendar"
                value: time_control_calendar
              sort: false
              multiple: false
              custom_value: false
        brightness_sun_operator:
          name: "\U0001F500 Condition Logic: Brightness & Sun Elevation"
          description: "How should Brightness and Sun Elevation conditions be combined
            when **both** are active?\n\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#brightness_sun_operator)."
          default: or
          selector:
            select:
              options:
              - label: ⚡ OR — Either condition triggers the action (default)
                value: or
              - label: "\U0001F512 AND — Both conditions must be met simultaneously"
                value: and
              mode: dropdown
              sort: false
              custom_value: false
              multiple: false
        individual_config:
          name: ⚙️ Behavior Customization
          description: "**Fine-tune automation behavior for your specific hardware
            and preferences.**\n\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#individual_config).\n\n</details>"
          default: []
          selector:
            select:
              options:
              - label: ↕️ Don't raise cover when closing for the evening
                value: prevent_higher_position_closing
              - label: ⬇️ Keep shading position during evening close (don't lower
                  further)
                value: prevent_lowering_when_closing_if_shaded
              - label: ☀️ Don't end shading if cover is already closed
                value: prevent_shading_end_if_closed
              - label: '☀️ Stay shaded: Don''t open cover when sun shading ends'
                value: prevent_opening_after_shading_end
              - label: "\U0001FA9F Keep closed: Don't open cover when ventilation
                  ends"
                value: prevent_opening_after_ventilation_end
              - label: "\U0001F527 Use custom actions only (disable default set_cover_position/set_cover_tilt_position)"
                value: prevent_default_cover_actions
              - label: ⏱️ Open cover only once per day
                value: prevent_opening_multiple_times
              - label: ⏱️ Close cover only once per day
                value: prevent_closing_multiple_times
              - label: ⏱️ Shade cover only once per day
                value: prevent_shading_multiple_times
              multiple: true
              sort: false
              custom_value: false
              mode: list
        enable_recovery:
          name: "\U0001F504 Catch up on what a restart or an outage swallowed"
          description: "While a required entity (the cover, the status helper, a window
            contact) has no usable state, CCA stops — and the events of that period
            are lost: a scheduled closing never fires again, sun shading never starts
            that day. This setting decides whether CCA catches those events up once
            everything is usable again. Catching up **can move the cover**, and a
            caught-up movement also runs the action you configured for it (a closing
            that was swallowed is still a closing).\n**Never** (default) — nothing
            is ever caught up. A closing that fell into the outage simply does not
            happen until the next regular trigger fires.\n**Only after an outage of
            a device or integration** — when a cover, a sensor or a gateway was unreachable
            and comes back, CCA recalculates and catches up. A Home Assistant restart,
            a reload, or saving this automation does **not** move the cover. This
            is the setting to pick if what you dislike is covers moving after a restart
            — a Zigbee stick that dropped out for ten minutes over your closing time
            is a different event. A device that was already unreachable when Home
            Assistant started still counts as part of the restart, however long it
            then takes to answer.\n**Always** — also after a Home Assistant restart,
            a reload, and after saving this automation. **This can move the cover
            right after a restart, and every time you change a setting here.**\nIndependent
            of this setting, CCA always cleans up its status helper when it comes
            back: a sun shading left over from an earlier day, a waiting period that
            can no longer run, an override reset that came due in the meantime, and
            a force function whose switch dropped out are corrected. That never moves
            the cover — it only stops the automation from acting on an outdated status
            later on.\n\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#enable_recovery)."
          default: never
          selector:
            select:
              options:
              - label: "\U0001F6AB Never catch up"
                value: never
              - label: "\U0001F50C Only after an outage of a device or integration"
                value: outage
              - label: "\U0001F504 Always (also after a Home Assistant restart or
                  a save)"
                value: always
              multiple: false
              sort: false
              custom_value: false
              mode: list
        instance_active:
          name: "\U0001F39A️ Only run this automation while this switch is on"
          description: "While the switch is off, CCA does nothing at all for this
            cover — and it does not record movements made by others as a manual override
            either. That makes it safe to run **several CCA automations for the same
            cover** (say, one for summer and one for winter), each with its own status
            helper and its own settings, as long as only one is on at a time. Switching
            one on is a full take-over: it re-reads everything and positions the cover
            where *its* settings say — **regardless of the setting above**.\n**The
            switching automation must not move the cover itself** — the incoming automation
            would read that as a manual override and leave the cover alone.\nLeave
            this empty (the default) if you only run one CCA automation for this cover.\n\U0001F4D6
            Setup recipes (one shared dropdown, a calendar as the switch, a \"re-sync
            now\" button) in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/features#instance_active)."
          default: []
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - input_boolean
              - domain:
                - binary_sensor
              - domain:
                - switch
              - domain:
                - schedule
              - domain:
                - input_select
              - domain:
                - select
              - domain:
                - calendar
              reorder: false
        instance_active_value:
          name: "\U0001F39A️ ... and it counts as on while it shows this value"
          description: 'Only used together with the switch above; leave it empty for
            a normal on/off switch.

            With a value here, the automation is in charge exactly **while the entity
            above shows this value** (matched exactly — for a dropdown: the option
            text, case and all). One shared *Dropdown* helper with one option per
            automation then guarantees that exactly one automation is in charge —
            no switching automation needed. Recipes in the handbook (link above).'
          default: ''
          selector:
            text:
              multiple: false
              multiline: false
    position_section:
      name: Cover Position Settings
      icon: mdi:window-shutter-settings
      description: "<center><p><small>\n  <strong>Important notes on configuring the
        position values</strong>\n  <br />\n  Please ensure that all position values
        are unique and do not conflict with each other.\n  <br />\n  <strong>Position
        Logic:</strong><br />\n  - For Blinds/Shutters: open_position (100%) > shading_position
        (25%) > close_position (0%)<br />\n  - For Awnings: open_position (0%) < shading_position
        (75%) < close_position (100%)<br />\n</small></p></center>"
      collapsed: true
      input:
        position_source:
          name: "\U0001F4CD Position Source Type"
          description: "How does your cover provide position information? \U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/positions#position_source)."
          default: current_position_attr
          selector:
            select:
              options:
              - label: Use current_position attribute (standard)
                value: current_position_attr
              - label: Use position attribute
                value: position_attr
              - label: Use custom position sensor
                value: custom_sensor
              mode: dropdown
              multiple: false
              sort: false
              custom_value: false
        custom_position_sensor:
          name: "\U0001F4CD Custom Position Sensor"
          description: Select sensor that provides position (0-100%). Only used if
            'Custom sensor' selected above
          default: []
          selector:
            entity:
              domain:
              - sensor
              multiple: false
              reorder: false
        cover_type:
          name: "\U0001F3AF Cover Type"
          description: "Select the type of cover you want to control. <br /><br />
            <strong>Blind/Roller Shutter:</strong> On the cover entity, 0% = closed
            (down), 100% = open (up) — matching CCA's Open Position (100%) and Close
            Position (0%). Shading uses lower positions. <br /><br /> <strong>Awning/Sunshade:</strong>
            On the cover entity, 0% = retracted (closed), 100% = extended (open).
            Shading uses higher positions. <br /><br /> ⚠️ <strong>Note:</strong>
            For an awning, CCA's Open Position is the <em>retracted</em> state — enter
            Open Position = 0% and Close Position = 100% (mirrored compared to a blind).
            <br /><br /> ⚠️ <strong>Note:</strong> Ventilation and tilt features are
            not available for awnings. <br /><br /> \U0001F4D6 More details in the
            [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/positions#cover_type)."
          default: blind
          selector:
            select:
              options:
              - label: "\U0001FA9F Blind / Roller Shutter (Standard)"
                value: blind
              - label: ☂️ Awning / Sunshade (Inverted)
                value: awning
              mode: dropdown
              multiple: false
              sort: false
              custom_value: false
        open_position:
          name: "\U0001F53C Open Position"
          description: What position should the cover be moved into when opening?
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        close_position:
          name: "\U0001F53B Close Position"
          description: What position should the cover be moved into when closing?
          default: 0
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        ventilate_position:
          name: "\U0001F4A8 Ventilate Position"
          description: What position should the cover move to when the window is tilted?
            If closing is triggered and the contact sensor is 'on', the cover will
            move to this position instead of closing completely. <br /><br />Should
            not be 100. In this case please use 99. And please also note the information
            in the position tolerance.
          default: 30
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        lockout_position:
          name: "\U0001F4A8 Full Ventilation Position"
          description: Optional position for the fully opened window. When the window
            opens completely, the cover moves to this position (lockout protection)
            instead of the Open Position. Useful when the Open Position keeps the
            cover lowered — for example a blind that normally stays down with open
            slats — but a fully opened terrace door should still drive the cover all
            the way up. <br /><br />Leave empty to use the Open Position.
          default: []
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_position:
          name: "\U0001F975 Sun Shading Position"
          description: To which position should the cover be moved for shading?
          default: 25
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_position_alt:
          name: "\U0001F975 Alternate Sun Shading Position"
          description: An optional second shading position. When the gating entity
            below is 'on', the cover moves to this position for shading instead of
            the normal shading position. <br /><br />Leave empty to disable the alternate
            shading position.
          default: []
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_position_alt_entity:
          name: "\U0001F975 Alternate Sun Shading Position Trigger"
          description: While this entity is 'on', the cover shades to the alternate
            shading position above instead of the normal shading position. While it
            is 'off' (or unset), the normal shading position is used. If the cover
            is already shading when this entity changes, the cover is re-driven to
            the matching position. <br /><br />Leave empty to disable the alternate
            shading position.
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - binary_sensor
              - input_boolean
              reorder: false
        position_tolerance:
          name: 〰️ Position Tolerance
          description: Tolerance to be applied when comparing the current position
            with the to be position. These are absolute values. Not relative to the
            previous position values.
          default: 0
          selector:
            number:
              min: 0.0
              max: 20.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        drive_time:
          name: ⏲️ Cover Drive Time
          description: Can be used to recognise manual control. Please round up a
            little and do not adjust too precisely. Is used to delay the trigger if
            too much or incorrect position data is sent back. <br /><br /> Within
            this time, it is assumed that CCA has carried out the last action. Otherwise,
            CCA would react to its own commands and recognize them as manual intervention.
          default: 90
          selector:
            number:
              min: 0.0
              max: 180.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
    tilt_position_section:
      name: Cover Tilt Position Settings
      icon: mdi:image-filter-tilt-shift
      collapsed: true
      input:
        cover_tilt_wait_mode:
          name: "\U0001F504 Tilt Wait Mode"
          description: 'Choose how CCA waits before sending tilt commands:

            **Fixed Delay (Standard)**: Uses the configured tilt delay value. Works
            well for most devices.

            **Wait Until Idle (Z-Wave)**: Waits until cover reports ''open'' or ''closed''
            state before sending tilt. Prevents tilt commands from being ignored on
            devices that block tilt during motor movement (e.g., Shelly Qubino Wave
            Shutter).

            **Tilt First, Then Position (Somfy J4 IO)**: For motors that ignore tilt
            commands while fully open and return to the last tilt target after every
            positioning run (e.g., Somfy J4 IO). Before the position command the slats
            are aligned with the travel direction — a cover resting fully open is
            briefly started downwards first, so that it accepts tilt commands again.
            After the movement has stopped, the final tilt target is sent.

            If your tilt positions are unreliable, try switching to ''Wait Until Idle''
            mode.'
          default: fixed_delay
          selector:
            select:
              options:
              - label: ⏱️ Fixed Delay (Standard)
                value: fixed_delay
              - label: ⏸️ Wait Until Idle (Z-Wave devices)
                value: wait_idle
              - label: "\U0001F503 Tilt First, Then Position (Somfy J4 IO)"
                value: tilt_before_position
              mode: dropdown
              multiple: false
              sort: false
              custom_value: false
        cover_tilt_wait_timeout:
          name: "\U0001F504 Tilt Wait Timeout"
          description: Maximum time to wait for cover to become idle before sending
            tilt command. Used when 'Wait Until Idle' or 'Tilt First, Then Position'
            mode is selected.
          default: 30
          selector:
            number:
              min: 5.0
              max: 60.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        tilt_delay:
          name: "\U0001F55B Default Tilt Delay"
          description: Delay between <em>set_cover_position</em> and <em>set_cover_tilt_position</em>.
            Only necessary when using the tilt functions. This separates the two commands
            in terms of time. In 'Tilt First, Then Position' mode the delay is applied
            between the preliminary slat alignment and the following position command
            instead. <br /><br />`Optional`
          default: 0
          selector:
            number:
              min: 0.0
              max: 600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        cover_tilt_config:
          name: "\U0001F4D0 Tilt Position Feature"
          description: ⚠️ <strong>Note:</strong> Tilt control is only available for
            blinds/shutters, not for awnings. <br /><br /> If the cover and the integration
            support it, the tilt position of the cover can be set. The standard attribute
            ‘current_tilt_position’ is used for this.
          default: cover_tilt_disabled
          selector:
            select:
              options:
              - label: ✅ Enable Tilt Position Control
                value: cover_tilt_enabled
              - label: ❌ Disable Tilt Position Control
                value: cover_tilt_disabled
              multiple: false
              sort: false
              custom_value: false
              mode: list
        cover_tilt_reposition_config:
          name: "\U0001F4D0 Tilt Reposition Feature"
          description: If Tilt Reposition Feature is enabled you can choose if the
            blinds are closed before tilting to a new position. In some cases tilting
            the blinds in small steps can lead to false positions. This is because
            of the minimum time the motor needs to run. If the runtime between current
            tilt position and target tilt position is to small the motor will not
            stop at the right position. Thus the blinds will be preclosed to 0 and
            then run to the target position.
          default: cover_tilt_reposition_disabled
          selector:
            select:
              options:
              - label: ✅ Enable Tilt Reposition Control
                value: cover_tilt_reposition_enabled
              - label: ❌ Disable Tilt Reposition Control
                value: cover_tilt_reposition_disabled
              multiple: false
              sort: false
              custom_value: false
              mode: list
        open_tilt_position:
          name: "\U0001F53C Open Tilt Position"
          description: To which tilt position should the cover be moved when opening?
          default: 50
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        close_tilt_position:
          name: "\U0001F53B Close Tilt Position"
          description: To which tilt position should the cover be moved when closing?
          default: 50
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        ventilate_tilt_position:
          name: "\U0001F4A8 Ventilate Tilt Position"
          description: To which tilt position should the cover be moved for ventilation?
          default: 50
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        tilt_position_tolerance:
          name: 〰️ Tilt Position Tolerance
          description: Tolerance to be applied when comparing the current tilt position
            with the to be tilt position. These are absolute values, analogous to
            the position tolerance. Use this when several states share the same cover
            position and can only be told apart by their tilt angle (e.g. closed/shading/ventilate
            all at position 0), or to absorb small tilt motor inaccuracies.
          default: 0
          selector:
            number:
              min: 0.0
              max: 20.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_tilt_position_0:
          name: "\U0001F975 Sun Shading Tilt Position"
          description: Minimum tilt position for shading. The cover will be tilted
            to this position if the sun elevation is below the value of elevation
            1.
          default: 0
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_tilt_position_1:
          name: "\U0001F975 Sun Shading Tilt Position 1"
          description: To which tilt position should the cover be moved for shading
            when the sun is above elevation 1?
          default: 20
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_tilt_elevation_1:
          name: "\U0001F975 Sun Shading Tilt Elevation 1"
          description: Sun elevation for tilt position 1.
          default: 20
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0
        shading_tilt_position_2:
          name: "\U0001F975 Sun Shading Tilt Position 2"
          description: To which tilt position should the cover be moved for shading
            when the sun is above elevation 2?
          default: 37
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_tilt_elevation_2:
          name: "\U0001F975 Sun Shading Tilt Elevation 2"
          description: Sun elevation for tilt position 2.
          default: 30
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0
        shading_tilt_position_3:
          name: "\U0001F975 Sun Shading Tilt Position 3"
          description: To which tilt position should the cover be moved for shading
            when the sun is above elevation 3?
          default: 50
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        shading_tilt_elevation_3:
          name: "\U0001F975 Sun Shading Tilt Elevation 3"
          description: Sun elevation for tilt position 3.
          default: 48
          selector:
            number:
              min: 0.0
              max: 90.0
              unit_of_measurement: °
              mode: slider
              step: 1.0
    time_section:
      name: Time Control Configuration
      icon: mdi:clock-time-two-outline
      collapsed: true
      description: "<center><p><small>\n  Configure the time windows for morning opening
        and evening closing.<br />\n  Time control can be enabled and the type selected
        in the <strong>Automation Options</strong> section above.\n  <br />\n  For
        comprehensive explanations, examples, and timing diagrams, see:\n  <a href=\"https://hvorragend.github.io/ha-blueprints/TIME_CONTROL_VISUALIZATION\">Time
        Control Guide</a>\n</small></p></center>"
      input:
        time_up_early:
          name: "\U0001F53C Time For Drive Up - Early On Workdays"
          description: 'The earliest time at which the cover may be opened. The cover
            will be opened if <ins>AFTER</ins> this time the defined brightness or
            sun-elevation value is high enough. (**NOTE**: A resident must also be
            awake if one is defined).'
          default: 06:00:00
          selector:
            time: {}
        time_up_early_non_workday:
          name: "\U0001F53C Time For Drive Up - Early On Non-Workdays"
          description: As directly above, but for non-workdays.
          default: 07:00:00
          selector:
            time: {}
        time_up_late:
          name: "\U0001F53C Time For Drive Up - Late On Workdays"
          description: 'The latest time at which the cover should be opened. If the
            required brightness or sun-elevation value has <ins>NOT</ins> yet been
            reached by this time, the cover will still be opened. (**NOTE**: If a
            resident has been defined and the resident is still asleep, then the cover
            will NOT be opened.)'
          default: 08:00:00
          selector:
            time: {}
        time_up_late_non_workday:
          name: "\U0001F53C Time For Drive Up - Late On Non-Workdays"
          description: As directly above, but for non-workdays.
          default: 08:00:00
          selector:
            time: {}
        time_down_early:
          name: "\U0001F53B Time For Drive Down - Early On Workdays"
          description: The earliest time at which the cover may be closed. The cover
            will be closed if <ins>AFTER</ins> this time the defined brightness or
            sun-elevation value is low enough.
          default: '16:00:00'
          selector:
            time: {}
        time_down_early_non_workday:
          name: "\U0001F53B Time For Drive Down - Early On Non-Workdays"
          description: As directly above, but for non-workdays.
          default: '16:00:00'
          selector:
            time: {}
        time_down_late:
          name: "\U0001F53B Time For Drive Down - Late On Workdays"
          description: The latest time at which the cover should be closed. If the
            required brightness or sun-elevation value has <ins>NOT</ins> yet been
            reached by this time, the cover will still be closed. <br /> Please do
            not enter 0:00, because that would be the next day!
          default: '22:00:00'
          selector:
            time: {}
        time_down_late_non_workday:
          name: "\U0001F53B Time For Drive Down - Late On Non-Workdays"
          description: As directly above, but for non-workdays. <br /> Please do not
            enter 0:00, because that would be the next day!
          default: '22:00:00'
          selector:
            time: {}
        workday_sensor:
          name: "\U0001F4BC Sensor For Workday Today"
          description: 'It may be desired to open a cover at a different time on work
            days than on non-work days. The corresponding binary sensor can be defined
            here. If not set, the cover will open every time at time_up_early. <br
            /><br /> I recommend using the [Workday integration](https://www.home-assistant.io/integrations/workday/).
            <br /><br /> Example: `binary_sensor.workday_today` <br /><br />`Optional`'
          default: []
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
              multiple: false
              reorder: false
        workday_sensor_tomorrow:
          name: "\U0001F4BC Sensor For Workday Tomorrow (only for closing)"
          description: 'When <ins>closing</ins> the blinds, you have the option of
            checking the times for tomorrow rather than the current day. This has
            the advantage that you can <ins>close</ins> the blinds earlier if <ins>tomorrow</ins>
            is a working day. This makes sense if, for example, there is school tomorrow
            but today is actually still the weekend. But the child has to go to bed
            earlier.<br /> If this field is not configured here, the normal working
            day sensor is used. <br /><br /> I recommend using the [Workday integration](https://www.home-assistant.io/integrations/workday/).
            <br /><br /> Example: `binary_sensor.workday_tomorrow` <br /><br />`Optional`'
          default: []
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
              multiple: false
              reorder: false
        calendar_entity:
          name: "\U0001F4C5 Calendar Entity"
          description: "Select a Home Assistant calendar for time control.\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/time#calendar_entity)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - calendar
              multiple: false
              reorder: false
        calendar_open_title:
          name: "\U0001F4C2 Open Event Title"
          description: 'Title of calendar events that define the daytime window (exact
            match, ignoring upper/lower case and surrounding spaces). Default: "Open
            Cover".'
          default: Open Cover
          selector:
            text:
              multiple: false
              multiline: false
        calendar_close_title:
          name: "\U0001F4C1 Close Event Title"
          description: 'Title of calendar events that define the evening/close window
            (exact match, ignoring upper/lower case and surrounding spaces). Default:
            "Close Cover".'
          default: Close Cover
          selector:
            text:
              multiple: false
              multiline: false
    brightness_section:
      name: Brightness Configuration
      description: "<center><p><small>\n  <strong>Only for morning opening &amp; evening
        closing!</strong><br />\n  This condition allows the cover to open earlier
        in the morning or close earlier in the evening,<br />\n  triggered by ambient
        brightness reaching its threshold.<br />\n  <strong>This is NOT related to
        sun protection / shading.</strong>\n</small></p></center>"
      icon: mdi:brightness-5
      collapsed: true
      input:
        default_brightness_sensor:
          name: "\U0001F505 Default Brightness Sensor"
          description: This default brightness sensor can be defined here, which is
            used for daily up and down.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        brightness_time_duration:
          name: "\U0001F505 Brightness Time Duration"
          description: Defines the time to given brightness sensor must be stay above/below
            the thresholds.
          default: 30
          selector:
            number:
              min: 0.0
              max: 600.0
              mode: slider
              step: 1.0
              unit_of_measurement: seconds
        brightness_up:
          name: "\U0001F505 Brightness Value For Opening The Cover"
          description: At what brightness value should the cover be opened?
          default: 0
          selector:
            number:
              min: 0.0
              max: 100000.0
              unit_of_measurement: lx
              step: 1.0
              mode: slider
        brightness_down:
          name: "\U0001F505 Brightness Value For Closing The Cover"
          description: At what brightness value should the cover be closed? Must be
            lower then the brightness up value.
          default: 0
          selector:
            number:
              min: 0.0
              max: 100000.0
              unit_of_measurement: lx
              step: 1.0
              mode: slider
        brightness_hysteresis:
          name: "\U0001F505 Brightness Hysteresis Value"
          description: Cover will open only when brightness exceeds (brightness_up
            + hysteresis), and close only when it drops below (brightness_down - hysteresis).
            Prevents frequent open/close cycles.
          default: 0
          selector:
            number:
              min: 0.0
              max: 10000.0
              step: 100.0
              mode: slider
              unit_of_measurement: lx
    sun_section:
      name: Sun Elevation Settings
      description: "<center><p><small>\n  <strong>Only for morning opening &amp; evening
        closing!</strong><br />\n  This condition opens the cover when the sun rises
        above a threshold and closes it when the sun drops below a threshold.<br />\n
        \ <strong>This is NOT sun protection / shading</strong> (which controls midday
        partial closing).\n</small></p></center>"
      icon: mdi:weather-sunny
      collapsed: true
      input:
        default_sun_sensor:
          name: ☀️ Sun Sensor
          description: Which sensors provides attributes with current azimuth and
            elevation of sun. I strongly suggest to use sun.sun ([Sun integration](https://www.home-assistant.io/integrations/sun/)).
            Please make sure that the integration is activated and provides the attributes.
            This sensor is also used for sun protection / sunshade control. <br /><br
            /> <ins>A few examples of threshold values:</ins> <ul> <li>+18° Astronomical
            Dusk</li> <li>+12° Nautical Dusk</li> <li>+6° Dusk</li> <li>0° Sunrise/Sunset
            (Default)</li> <li>-6° Civil Dawn</li> <li>-12° Nautical Dawn</li> <li>-18°
            Astronomical Dawn/Night</li> </ul> <br />`Optional` / `Shading`
          default: sun.sun
          selector:
            entity:
              filter:
              - domain:
                - sun
              multiple: false
              reorder: false
        sun_time_duration:
          name: ☀️ Sun Time Duration
          description: Defines the time to given sun sensor must be stay above/below
            the thresholds.
          default: 30
          selector:
            number:
              min: 0.0
              max: 600.0
              mode: slider
              step: 1.0
              unit_of_measurement: seconds
        sun_elevation_mode:
          name: ☀️ Sun Elevation Mode
          description: "How the elevation thresholds are determined: **\U0001F512
            Fixed** uses only the fixed values below, **\U0001F4CA Dynamic** uses
            only the Up/Down sensors, **\U0001F504 Hybrid** adds the fixed value to
            the sensor value as an offset (e.g. 2.0° + 1.5° = 3.5°). <br /> \U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/sun#sun_elevation_mode)."
          default: fixed
          selector:
            select:
              options:
              - label: "\U0001F512 Fixed - Use only fixed values"
                value: fixed
              - label: "\U0001F4CA Dynamic - Use only sensor values"
                value: dynamic
              - label: "\U0001F504 Hybrid - Sensor + fixed value as offset"
                value: hybrid
              sort: false
              multiple: false
              custom_value: false
        sun_elevation_up:
          name: ☀️ Sun Elevation Value For Opening The Cover
          description: '**Fixed Mode**: Direct threshold value for opening. <br />
            **Dynamic Mode**: Ignored (sensor value is used). <br /> **Hybrid Mode**:
            Added as offset to sensor value. <br /><br /> The cover will be <ins>opened</ins>
            if the sun elevation is over the calculated threshold.'
          default: 0
          selector:
            number:
              min: -90.0
              max: 90.0
              unit_of_measurement: °
              step: 0.1
              mode: slider
        sun_elevation_down:
          name: ☀️ Sun Elevation Value For Closing The Cover
          description: '**Fixed Mode**: Direct threshold value for closing. <br />
            **Dynamic Mode**: Ignored (sensor value is used). <br /> **Hybrid Mode**:
            Added as offset to sensor value. <br /><br /> The cover will be <ins>closed</ins>
            if the sun elevation is under the calculated threshold.'
          default: 0
          selector:
            number:
              min: -90.0
              max: 90.0
              unit_of_measurement: °
              step: 0.1
              mode: slider
        sun_elevation_up_sensor:
          name: ☀️ Sun Elevation Up Sensor (Dynamic/Hybrid - Optional)
          description: "Optional sensor (template sensor or Input Number) that provides
            a **dynamic, seasonal elevation threshold** for opening. Required for
            Dynamic Mode, combined with the fixed value in Hybrid Mode, ignored in
            Fixed Mode. The cover opens when the current sun elevation rises above
            the threshold. <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/sun#sun_elevation_up_sensor)
            and the [Dynamic Sun Elevation Guide](https://hvorragend.github.io/ha-blueprints/DYNAMIC_SUN_ELEVATION)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
                - input_number
              multiple: false
              reorder: false
        sun_elevation_down_sensor:
          name: ☀️ Sun Elevation Down Sensor (Dynamic/Hybrid - Optional)
          description: "Optional sensor (template sensor or Input Number) that provides
            a **dynamic, seasonal elevation threshold** for closing. Required for
            Dynamic Mode, combined with the fixed value in Hybrid Mode, ignored in
            Fixed Mode. The cover closes when the current sun elevation sets below
            the threshold. <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/sun#sun_elevation_down_sensor)
            and the [Dynamic Sun Elevation Guide](https://hvorragend.github.io/ha-blueprints/DYNAMIC_SUN_ELEVATION)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
                - input_number
              multiple: false
              reorder: false
    contacts_section:
      name: Contact Sensors for Ventilation
      description: "<center><p><small>\n  Settings if the feature ‘\U0001F4A8 - Ventilation
        Mode — React to open/tilted windows, prevent lockout’ has been activated above.\n
        \ <br />\n  All these settings are optional.\n</small></p></center>"
      icon: mdi:door-closed-lock
      collapsed: true
      input:
        contact_window_opened:
          name: "\U0001F6AA Contact Sensor For Open Window (Full Ventilation)"
          description: "Contact sensor of a door or window handle for detecting <ins>total
            opening</ins>. If this sensor switches to on/true and the Additional Ventilation
            Condition permits it, the cover is <ins>fully opened</ins> (to the Open
            Position, or to the '\U0001F4A8 Full Ventilation Position' if configured).
            Independently of that proactive movement, lockout protection is <ins>always</ins>
            activated. The cover is not closed and the sun shading is not activated
            when the contact is open.\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/contacts#contact_window_opened)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
                - input_boolean
              multiple: false
              reorder: false
        contact_window_tilted:
          name: "\U0001F4A8 Contact Sensor For Tilted Window (Partial Ventilation)"
          description: "The contact sensor is required for the <ins>partial</ins>
            ventilation mode. If the contact changes to on/true, the cover is moved
            to the <ins>ventilation</ins> position. The prerequisite is that the cover
            is already closed. After the status changes to off/false, the close position
            is activated again. The same applies in the shading-out situation.\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/contacts#contact_window_tilted)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
                - input_boolean
              multiple: false
              reorder: false
        lockout_tilted_options:
          name: "\U0001F4A8 Lockout protection for window tilted"
          description: For the tilted window (or door, of course), you can individually
            specify where a lockout protection should be used.
          default: []
          selector:
            select:
              options:
              - label: "\U0001F6E1️ Lockout protection when closing the cover"
                value: lockout_tilted_closing
              - label: "\U0001F6E1️ Lockout protection when starting the sun shading"
                value: lockout_tilted_shading_start
              - label: "\U0001F6E1️ Lockout protection when the sun shading is ended"
                value: lockout_tilted_shading_end
              sort: false
              multiple: true
              custom_value: false
        auto_ventilate_options:
          name: "\U0001F4A8 Ventilation Configuration"
          description: "Various different ventilation options.\n\U0001F4D6 More details
            in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/contacts#auto_ventilate_options)."
          default: []
          selector:
            select:
              options:
              - label: "\U0001F4A8 Disables the drive delay when ventilation starts
                  (window opens/tilts)"
                value: ventilation_start_no_delay
              - label: "\U0001F4A8 Enables a calculated delay after the window is
                  closed"
                value: ventilation_delay_enabled
              - label: "\U0001F4A8 Lower cover to ventilation position when window
                  tilts and cover is above"
                value: ventilation_if_lower_enabled
              - label: "\U0001F4A8 Using the ventilation position when the sun shading
                  is ended (instead of opening it completely)"
                value: ventilation_after_shading_end
              - label: "\U0001F4A8 Keep cover at open position when window goes from
                  fully opened to tilted"
                value: ventilation_keep_open_on_full_to_tilt
              - label: "\U0001F975 Sun shading is more important than ventilation:
                  shade even while the window is tilted"
                value: shading_over_ventilation
              multiple: true
              sort: false
              custom_value: false
              mode: list
        contact_delay_trigger:
          name: "\U0001F55B Contact Trigger Delay"
          description: 'How many seconds must the status of the contact sensors be
            valid for the automation to trigger?

            ⚠️ **Race Condition Protection:** If you have multiple contact sensors
            (e.g., window sensor + lock sensor) that can change simultaneously, increase
            this value to prevent race conditions.

            **Symptoms of race conditions:** - Cover closes despite lockout sensor
            being active - Check Home Assistant logs for "max_exceeded: warning" messages
            - If you see these warnings frequently, increase this delay'
          default: 2
          selector:
            number:
              min: 0.0
              max: 10.0
              unit_of_measurement: seconds
              step: 0.1
              mode: slider
        contact_delay_status:
          name: "\U0001F55B Contact Sensor Status Delay"
          description: "How long the automation waits after a contact sensor trigger
            before re-evaluating all sensor states. After the delay, CCA reads the
            **live state** of all sensors, so the routing decision reflects the actual
            situation. Increase to 0.5–1 s if window contact and resident sensor change
            in quick succession or your sensor briefly reports intermediate states.
            <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/contacts#contact_delay_status)."
          default: 3
          selector:
            number:
              min: 0.0
              max: 10.0
              unit_of_measurement: seconds
              step: 0.1
              mode: slider
    shading_section:
      name: Sun Shading / Sun Protection
      description: "<center><p><small>\n  Settings if the feature '\U0001F975 - Sun
        Protection / Shading — Partially close when sun shines on window' has been
        activated above.\n  <br />\n  All these settings are optional / The attributes
        of default sun sensor (configured above) is used.\n  <br />\n  \U0001F4D6
        More details in the <a href=\"https://hvorragend.github.io/ha-blueprints/handbook/shading\">CCA
        Handbook</a>.\n</small></p></center>"
      icon: mdi:shield-sun-outline
      collapsed: true
      input:
        shading_conditions_start_and:
          name: "\U0001F31E Shading START - Required Conditions (AND)"
          description: "**Conditions that MUST ALL be met to START shading**\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_conditions_start_and)."
          default:
          - cond_azimuth
          - cond_elevation
          - cond_brightness
          - cond_temp1
          - cond_temp2
          - cond_forecast_temp
          - cond_forecast_weather
          - cond_custom
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
              - label: "\U0001F4D0 Sun Azimuth (within configured range)"
                value: cond_azimuth
              - label: "\U0001F4C8 Sun Elevation (within configured range)"
                value: cond_elevation
              - label: "\U0001F506 Brightness (above start threshold)"
                value: cond_brightness
              - label: 1️⃣ Temperature Sensor 1 (above threshold)
                value: cond_temp1
              - label: 2️⃣ Temperature Sensor 2 (above threshold)
                value: cond_temp2
              - label: "\U0001F4CA Forecast Temperature (above threshold)"
                value: cond_forecast_temp
              - label: "\U0001F326️ Forecast Weather Conditions (matching configured
                  conditions)"
                value: cond_forecast_weather
              - label: "\U0001F9E9 Custom Condition Sensor (state is 'on')"
                value: cond_custom
              sort: false
              custom_value: false
        shading_conditions_start_or:
          name: "\U0001F31E Shading START - Optional Conditions (OR)"
          description: "**Conditions where AT LEAST ONE must be met to START shading**\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_conditions_start_or)."
          default: []
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
              - label: "\U0001F4D0 Sun Azimuth (within configured range)"
                value: cond_azimuth
              - label: "\U0001F4C8 Sun Elevation (within configured range)"
                value: cond_elevation
              - label: "\U0001F506 Brightness (above start threshold)"
                value: cond_brightness
              - label: 1️⃣ Temperature Sensor 1 (above threshold)
                value: cond_temp1
              - label: 2️⃣ Temperature Sensor 2 (above threshold)
                value: cond_temp2
              - label: "\U0001F4CA Forecast Temperature (above threshold)"
                value: cond_forecast_temp
              - label: "\U0001F326️ Forecast Weather Conditions (matching configured
                  conditions)"
                value: cond_forecast_weather
              - label: "\U0001F9E9 Custom Condition Sensor (state is 'on')"
                value: cond_custom
              sort: false
              custom_value: false
        shading_conditions_end_and:
          name: "\U0001F325️ Shading END - Required Conditions (AND)"
          description: "**Conditions that MUST ALL become invalid to END shading**\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_conditions_end_and)."
          default: []
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
              - label: "\U0001F4D0 Sun Azimuth (outside configured range)"
                value: cond_azimuth
              - label: "\U0001F4C8 Sun Elevation (outside configured range)"
                value: cond_elevation
              - label: "\U0001F506 Brightness (below end threshold)"
                value: cond_brightness
              - label: 1️⃣ Temperature Sensor 1 (below threshold)
                value: cond_temp1
              - label: 2️⃣ Temperature Sensor 2 (below threshold)
                value: cond_temp2
              - label: "\U0001F4CA Forecast Temperature (below threshold)"
                value: cond_forecast_temp
              - label: "\U0001F326️ Forecast Weather Conditions (no longer matching
                  configured conditions)"
                value: cond_forecast_weather
              - label: "\U0001F9E9 Custom Condition Sensor (state is 'off')"
                value: cond_custom
              sort: false
              custom_value: false
        shading_conditions_end_or:
          name: "\U0001F325️ Shading END - Optional Conditions (OR)"
          description: "**Conditions where AT LEAST ONE must become invalid to END
            shading**\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_conditions_end_or)."
          default:
          - cond_azimuth
          - cond_elevation
          - cond_brightness
          - cond_temp1
          - cond_temp2
          - cond_forecast_temp
          - cond_forecast_weather
          - cond_custom
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
              - label: "\U0001F4D0 Sun Azimuth (outside configured range)"
                value: cond_azimuth
              - label: "\U0001F4C8 Sun Elevation (outside configured range)"
                value: cond_elevation
              - label: "\U0001F506 Brightness (below end threshold)"
                value: cond_brightness
              - label: 1️⃣ Temperature Sensor 1 (below threshold)
                value: cond_temp1
              - label: 2️⃣ Temperature Sensor 2 (below threshold)
                value: cond_temp2
              - label: "\U0001F4CA Forecast Temperature (below threshold)"
                value: cond_forecast_temp
              - label: "\U0001F326️ Forecast Weather Conditions (no longer matching
                  configured conditions)"
                value: cond_forecast_weather
              - label: "\U0001F9E9 Custom Condition Sensor (state is 'off')"
                value: cond_custom
              sort: false
              custom_value: false
        shading_custom_sensor:
          name: "\U0001F9E9 Sun Shading - Custom Condition Sensor"
          description: "Optional binary sensor (or toggle helper) evaluated as an
            additional shading condition.<br /> When the sensor is **on**, the custom
            START condition is met; when it is **off**, the custom END condition is
            met. Add \"\U0001F9E9 Custom Condition Sensor\" to the AND/OR lists above
            to combine it with the built-in conditions — for example, put it into
            the START (OR) list together with the forecast weather condition to shade
            when the forecast matches **or** your own sensor says so.<br /> You can
            point this to a Template Sensor with your own logic, or to a toggle helper
            (input_boolean) you switch manually."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - binary_sensor
                - input_boolean
              multiple: false
              reorder: false
        shading_azimuth_start:
          name: "\U0001F4D0 Sun Shading - Azimuth Start Value"
          description: What is the minimum azimuth at which the sun hits the window?
            (Shading will start)
          default: 95
          selector:
            number:
              min: 0.0
              max: 365.0
              unit_of_measurement: °
              step: 1.0
              mode: slider
        shading_azimuth_end:
          name: "\U0001F4D0 Sun Shading - Azimuth End Value"
          description: What is the maximum azimuth at which the sun hits the window?
            (Shading will stop)
          default: 265
          selector:
            number:
              min: 0.0
              max: 365.0
              unit_of_measurement: °
              step: 1.0
              mode: slider
        shading_elevation_min:
          name: "\U0001F4C8 Sun Shading - Elevation Minimum Value"
          description: Starting from which elevation of the sun should the window
            be shaded? (Here it makes sense to consider surrounding buildings, trees,
            etc.).
          default: 25
          selector:
            number:
              min: -90.0
              max: 90.0
              unit_of_measurement: °
              step: 0.1
              mode: slider
        shading_elevation_max:
          name: "\U0001F4C8 Sun Shading - Elevation Maximum Value"
          description: What is the maximal elevation for elevation? (In most cases,
            90 degrees is probably the most reasonable value. However, this can also
            be different due to surrounding buildings, etc.).
          default: 90
          selector:
            number:
              min: -90.0
              max: 90.0
              unit_of_measurement: °
              step: 0.1
              mode: slider
        shading_brightness_sensor:
          name: "\U0001F506 Sun Shading - Brightness Sensor"
          description: This sensor is only used for shading.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        shading_sun_brightness_start:
          name: "\U0001F506 Sun Shading - Brightness Start Value"
          description: The minimum brightness value from which shading should start.
            (Must be above the value of brightness end!)
          default: 35000
          selector:
            number:
              min: 0.0
              max: 100000.0
              unit_of_measurement: lx
              step: 1.0
              mode: slider
        shading_sun_brightness_end:
          name: "\U0001F506 Sun Shading - Brightness End Value"
          description: The brightness value from which shading is no longer necessary.
            (Must be below the value of brightness start!).
          default: 25000
          selector:
            number:
              min: 0.0
              max: 100000.0
              unit_of_measurement: lx
              step: 1.0
              mode: slider
        shading_sun_brightness_hysteresis:
          name: "\U0001F506 Sun Shading - Brightness Hysteresis"
          description: 'Hysteresis value to prevent flickering. The brightness must
            exceed (start + hysteresis) to activate shading and fall below (end -
            hysteresis) to deactivate it. See: [FAQ: How does hysteresis work?](https://hvorragend.github.io/ha-blueprints/FAQ#q-how-does-hysteresis-work)'
          default: 0
          selector:
            number:
              min: 0.0
              max: 10000.0
              unit_of_measurement: lx
              step: 100.0
              mode: slider
        shading_temperatur_sensor1:
          name: 1️⃣ Sun Shading - Temperature Sensor 1 (eg. indoor)
          description: This is the first temperature sensor used for sun shading logic.<br
            /> For example, you can use the current **indoor temperature** as a condition
            to trigger shading.
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
          default: []
        shading_min_temperatur1:
          name: 1️⃣ Sun Shading - Temperature Sensor 1 Minimum Value
          description: Minimum temperature for sensor 1 above which shading should
            occur.
          default: 18
          selector:
            number:
              min: 0.0
              max: 50.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_temperature_hysteresis1:
          name: 1️⃣ Sun Shading - Temperature Sensor 1 Hysteresis Value
          description: 'Shading will end only when temperature drops below (minimum
            - hysteresis value) to prevent frequent open/close cycles. See: [FAQ:
            How does hysteresis work?](https://hvorragend.github.io/ha-blueprints/FAQ#q-how-does-hysteresis-work)'
          default: 0.2
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_temperatur_sensor2:
          name: 2️⃣ Sun Shading - Temperature Sensor 2 (eg. outdoor)
          description: This is an optional secondary temperature sensor, typically
            used for **outdoor temperature**. <br /> It can serve as an additional
            condition for sun shading logic. <br /><br /> This sensor also plays a
            role in the calculation of the <ins>Sun Shading - Forecast Temperature
            Value</ins>. Please refer to that section for more details.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        shading_min_temperatur2:
          name: 2️⃣ Sun Shading - Temperature Sensor 2 Minimum Value
          description: Minimum temperature for sensor 2 above which shading should
            occur.
          default: 18
          selector:
            number:
              min: 0.0
              max: 50.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_temperature_hysteresis2:
          name: 2️⃣ Sun Shading - Temperature Sensor 2 Hysteresis Value
          description: 'Shading will end only when temperature drops below (minimum
            - hysteresis value) to prevent frequent open/close cycles. See: [FAQ:
            How does hysteresis work?](https://hvorragend.github.io/ha-blueprints/FAQ#q-how-does-hysteresis-work)'
          default: 0.2
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_forecast_sensor:
          name: "\U0001F4CA Sun Shading - Forecast Weather Entity"
          description: "Weather entity for forecast data (temperature & conditions).
            This is the primary and recommended method for forecast-based shading.\n\U0001F4D6
            More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_forecast_sensor)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - weather
              multiple: false
              reorder: false
        shading_forecast_type:
          name: "\U0001F4CA Sun Shading - Forecast Source"
          description: "Use the **daily** (recommended) or **hourly** weather forecast,
            or the current weather attributes instead of the forecast service. Requires
            the weather entity configured above; ignored when using the direct temperature
            sensor below. <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_forecast_type)."
          default: daily
          selector:
            select:
              options:
              - label: Use the daily weather forecast service
                value: daily
              - label: Use the hourly weather forecast service
                value: hourly
              - label: Do not use a weather forecast, but the current weather attributes
                value: weather_attributes
              multiple: false
              sort: false
              custom_value: false
        shading_forecast_temp_sensor:
          name: "\U0001F4CA Sun Shading - Direct Temperature Sensor (Alternative)"
          description: "**Alternative method:** Use a sensor that directly provides
            forecasted max temperature.\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_forecast_temp_sensor)."
          default: []
          selector:
            entity:
              filter:
              - domain:
                - sensor
              multiple: false
              reorder: false
        shading_forecast_temp:
          name: "\U0001F4CA Sun Shading - Forecast Temperature Value"
          description: "This setting defines the <strong>minimum temperature threshold</strong>
            based on the forecast at which shading should be activated. If the forecasted
            temperature exceeds this value, the shading system will respond accordingly.\n-
            Minimum temperature threshold for shading activation.\n- Works with both
            weather entity and temperature sensor.\n- Leave empty to disable temperature-based
            forecast shading.\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_forecast_temp)."
          default: []
          selector:
            number:
              min: 0.0
              max: 50.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_forecast_temp_hysteresis:
          name: "\U0001F4CA Sun Shading - Forecast Temperature Hysteresis"
          description: 'Prevents frequent on/off cycles near threshold.

            - Shading starts: forecast > (threshold + hysteresis)

            - Shading ends: forecast < (threshold - hysteresis)


            See: [FAQ: How does hysteresis work?](https://hvorragend.github.io/ha-blueprints/FAQ#q-how-does-hysteresis-work)'
          default: 0
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.1
              mode: slider
              unit_of_measurement: °C
        shading_weather_conditions:
          name: "\U0001F326️ Sun Shading - Weather Conditions"
          description: 'Check the following weather conditions when activating the
            shading. Be cautious when making your selection, as weather forecasts
            may not always be accurate and could lead to incorrect shading decisions.
            And as mentioned above, weather conditions can only be checked if a weather
            entity has been configured under ‘Forecast Weather Sensor’. <br /><br
            /> **Only works with weather entity, not with temperature sensor.** <br
            /> Be cautious: weather forecasts may not always be accurate.'
          default: []
          selector:
            select:
              multiple: true
              options:
              - clear-night
              - clear
              - cloudy
              - fog
              - hail
              - lightning
              - lightning-rainy
              - partlycloudy
              - pouring
              - rainy
              - snowy
              - snowy-rainy
              - sunny
              - windy
              - windy-variant
              - exceptional
              sort: false
              custom_value: false
        shading_config:
          name: "\U0001F975 Sun Shading - Configuration"
          description: "These options allow you to fine-tune how the system handles
            temperature-based shading. <br /><br /> <em>\"Keep shading active while
            the temperature threshold is exceeded\"</em>: On hot days an active sun
            shading does not end during the day (e.g. when the sun leaves the azimuth
            range) as long as the forecasted temperature or (if enabled) <em>\"Temperature
            Sensor 2\"</em> stays above the <em>\"Independent Temperature Threshold\"</em>.
            The cover then stays shaded until the normal closing time or the nightly
            reset. Requires <em>\"Independent Shading via Temperature Comparison\"</em>.
            <p><em>Click on the titles to get further help.</em></p> \U0001F4D6 More
            details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_config).
            <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_config)."
          default: []
          selector:
            select:
              options:
              - label: Independent Shading via Temperature Comparison
                value: shading_temp_comparison_independent
              - label: Also trigger if 'Temperature Sensor 2' exceeds 'Forecast Temperature
                  Value'
                value: shading_compare_forecast_with_sensor2
              - label: 'Independent Shading: Keep shading active while the temperature
                  threshold is exceeded'
                value: shading_independent_holds_end
              multiple: true
              sort: false
              custom_value: false
              mode: list
        shading_independent_temp:
          name: "\U0001F975 Sun Shading - Independent Temperature Threshold"
          description: Temperature threshold used exclusively by the <em>"Independent
            Shading via Temperature Comparison"</em> mode. Shading is activated independently
            of all other conditions (brightness, sun azimuth <em>and</em> elevation,
            etc.) when either the forecasted temperature or (if enabled) <em>"Temperature
            Sensor 2"</em> exceeds this value. <br /><br /> Set this lower than <em>"Forecast
            Temperature Value"</em> to allow the independent path to trigger on warmer-than-average
            days without tightening the normal forecast gate.
          default: 25
          selector:
            number:
              min: 0.0
              max: 50.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        shading_waitingtime_start:
          name: "\U0001F975 Sun Shading - Start Waiting Time"
          description: Waiting time between the initial shading trigger and the actual
            cover movement. After this time expires, <ins>all</ins> configured start
            conditions (AND + OR) are re-checked. The cover only moves if conditions
            are <strong>still valid</strong> at execution time. This waiting time
            is also used for the periodic condition checks within the retry loop.
            <br /><br /> <strong>If shading stays at "pending" and never executes:</strong>
            The conditions were no longer met after the waiting time expired. Check
            the automation trace for <em>t_shading_start_execution</em>.
          default: 300
          selector:
            number:
              min: 0.0
              max: 3600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        shading_start_max_duration:
          name: "\U0001F975 Sun Shading - Maximum duration for shading start retry
            loop"
          description: 'Maximum time to keep retrying shading start conditions after
            initial trigger.

            The Start Waiting Time is used for the periodic condition checks during
            this retry loop.

            If conditions remain unstable for longer than this timeout, the retry
            loop is stopped.

            Shading will not start and waits for a new shading start trigger.


            **Use case:** Prevents automation from being stuck in "waiting for stable
            conditions"

            when weather is highly unstable (rapidly changing clouds).


            **0 = disabled** (no periodic retry, stops immediately - old "trigger_reset"
            behavior)

            **Recommended: 3600-7200 seconds (1-2 hours)**

            '
          default: 7200
          selector:
            number:
              min: 0.0
              max: 14400.0
              step: 300.0
              unit_of_measurement: seconds
              mode: slider
        shading_waitingtime_end:
          name: "\U0001F975 Sun Shading - End Waiting Time"
          description: To avoid excessive load on the motor, a waiting time can be
            defined here before the shading is ended. Shading ends if one of the conditions
            is not fulfilled for the entire waiting time. This waiting time is also
            used for the periodic condition checks within the retry loop.
          default: 300
          selector:
            number:
              min: 0.0
              max: 3600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        shading_end_max_duration:
          name: "\U0001F975 Sun Shading - Maximum duration for shading end retry loop"
          description: 'Maximum time to keep retrying shading end conditions after
            initial trigger.

            The End Waiting Time is used for the periodic condition checks during
            this retry loop.

            If conditions remain unstable for longer than this timeout, the retry
            loop is stopped.

            Shading remains active and waits for a new shading end trigger.


            **Use case:** Prevents automation from being stuck in "waiting for stable
            conditions"

            when weather is highly unstable (rapidly changing clouds).


            **0 = disabled** (no periodic retry, behaves like old version)

            **Recommended: 3600-7200 seconds (1-2 hours)**

            '
          default: 7200
          selector:
            number:
              min: 0.0
              max: 14400.0
              step: 300.0
              unit_of_measurement: seconds
              mode: slider
        shading_end_immediate_by_sun_position:
          name: "\U0001F975 End Sun Shading - Immediately When Out Of Range"
          description: "Speeds up the END of shading: once the sun leaves the azimuth
            or elevation range, shading ends after only a few seconds instead of waiting
            for the configured end waiting time. Only affects the *timing* — \"Sun
            Azimuth\" and/or \"Sun Elevation\" must still be part of your END conditions.
            <br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/shading#shading_end_immediate_by_sun_position)."
          default: false
          selector:
            boolean: {}
    resident_section:
      name: Resident Settings
      description: "<center><p><small>\n  <br />\n  (1) The purpose of resident mode
        is to the close the cover (without checking the defined times) when the resident
        sensor switches to ‘on/true’. For example, when a resident goes to sleep.\n
        \ <br />\n  (2) The cover will stay closed as long as the sensor remains in
        this state.\n  <br />\n  (3) When the resident sensor switches to ‘off/false’,
        the cover is automatically opened in the morning.\n  <br />\n  (4) In addition,
        the usual automatic opening of the cover is prevented as long as the sensor
        is set to ‘on/true’ or the resident.\n  <br /><br />\n  All these settings
        are optional.\n</small></p></center>"
      icon: mdi:human-male-female
      collapsed: true
      input:
        resident_sensor:
          name: "\U0001F6CC Resident Sensor"
          description: 'You can use this to define a resident for the room.

            If the sensor has no status (e.g. after a restart), the automation continues
            with the last known presence instead of assuming that nobody is there.'
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              - switch
              multiple: false
              reorder: false
        resident_config:
          name: "\U0001F6CC Resident Configuration"
          description: 'Configure how the automation responds to resident sensor changes.


            - **Opening enabled**: Cover opens when resident wakes up, but only if
            time, brightness, and sun elevation conditions are met

            - **Closing enabled**: Cover closes when resident goes to sleep (immediate,
            ignores other conditions)

            '
          default: []
          selector:
            select:
              options:
              - label: "\U0001F53C Enable automatic opening when resident wakes up
                  (respects all opening conditions)"
                value: resident_opening_enabled
              - label: "\U0001F53B Enable automatic closing when resident goes to
                  sleep (immediate)"
                value: resident_closing_enabled
              - label: "\U0001F975 Allow sun protection when resident is still present"
                value: resident_allow_shading
              - label: "\U0001F53C Allow opening the cover when resident is still
                  present"
                value: resident_allow_opening
              - label: "\U0001F4A8 Allow ventilation when resident is still present"
                value: resident_allow_ventilation
              multiple: true
              sort: false
              custom_value: false
              mode: list
    override_section:
      name: Manual Override
      description: <br />
      icon: mdi:debug-step-over
      collapsed: true
      input:
        ignore_after_manual_config:
          name: "\U0001F590️ Automatic movements blocked during Manual Override"
          description: "Select the automatic movements that must not move the cover
            while a Manual Override is active. Selected means the manual position
            wins. Not selected means that automatic movement may take control; an
            actual CCA movement then clears the Manual Override. CCA continues tracking
            the current schedule, sun shading, window and resident state in the background
            either way. These choices govern scheduled opening/closing, sun shading
            and contact-triggered ventilation. Configured resident transitions and
            Force/Resume commands explicitly hand control back to CCA.\n⚠️ **Leave
            none selected and a Manual Override protects nothing:** the very next
            relevant automatic movement simply overrides it, ending the override in
            the process — no separate reset needed for that movement type. Select
            a type here only if you want the manual position to stick until an explicit
            reset (below) instead.\n\U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/override#ignore_after_manual_config)."
          default: []
          selector:
            select:
              options:
              - label: "\U0001F53C Block automatic opening during Manual Override"
                value: ignore_opening_after_manual
              - label: "\U0001F53B Block automatic closing during Manual Override"
                value: ignore_closing_after_manual
              - label: "\U0001F4A8 Block automatic ventilation during Manual Override"
                value: ignore_ventilation_after_manual
              - label: "\U0001F975 Block automatic sun shading during Manual Override"
                value: ignore_shading_after_manual
              multiple: true
              sort: false
              custom_value: false
              mode: list
        manual_schedule_adoption:
          name: "\U0001F590️ Manual movement inside the schedule window counts as
            the scheduled event"
          description: "When you open the cover by hand while the morning opening
            window is still running (between the early and late opening times, or
            during the calendar opening event), CCA can treat that as if the scheduled
            opening itself had already happened: the internal day state advances to
            \"open\", so later automatic events — a Manual Override reset, the end
            of sun shading, a restart catch-up — no longer act as if the cover had
            never opened that day. The same is available for closing the cover by
            hand during the evening closing window. <br /><br /> Only the internal
            state advances — the manual movement is still recorded as a Manual Override
            and never moves the cover by itself. Requires the matching feature (\"\U0001F53C
            Morning Opening\" / \"\U0001F53B Evening Closing\") and a time schedule
            or calendar for that direction; without a time window nothing is adopted.
            <br /><br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/override#manual_schedule_adoption)."
          default: []
          selector:
            select:
              options:
              - label: "\U0001F53C Manual opening during the opening window counts
                  as the scheduled opening"
                value: manual_adopt_opening
              - label: "\U0001F53B Manual closing during the closing window counts
                  as the scheduled closing"
                value: manual_adopt_closing
              multiple: true
              sort: false
              custom_value: false
              mode: list
        reset_override_config:
          name: "\U0001F5D1️ Reset manual override"
          description: If the detection of the manual position change was activated
            above, you may need a way to reset this status. Otherwise, the next cover
            movements will be permanently ignored or overridden. Or you have not activated
            an individual action, e.g. when closing the covers, which resets the status.
            <br /><br /> You can select **multiple** reset mechanisms — the first
            one whose condition is met clears the override. Leave empty to disable
            all timed resets. <br /><br /> A reset always hands control back to CCA
            and clears the override status. Whether it also moves the cover right
            away is controlled separately below ("Return to Target State After Manual
            Override Reset").
          default: []
          selector:
            select:
              options:
              - label: Reset at a specified time (see below)
                value: reset_fixed_time
              - label: Reset after a timeout in minutes (see below)
                value: reset_timeout
              - label: Reset in position (see below)
                value: reset_in_position
              multiple: true
              sort: false
              custom_value: false
              mode: list
        auto_recover_after_manual_reset:
          name: "\U0001F519 Return to Target State After Manual Override Reset"
          description: "When a reset above fires, should the cover immediately move
            to the automatic target that is valid then? <br /><br /> **Disabled (default):**
            the reset only clears the override status. The cover stays where it is
            until the next regular automatic event (opening/closing, shading, ventilation)
            naturally moves it. This matches CCA's behavior before the reset itself
            started driving the cover. <br /><br /> **Enabled:** the reset re-derives
            the currently correct target from your schedule and drives there immediately
            — even if that differs a lot from the manually set position. It still
            will not open the cover if no opening automation is configured for this
            instance (see \"\U0001F550 Enable Time Control\" / the opening-related
            inputs) — that specific case is always treated as \"stay put\". There
            is no equivalent guard for closing: if this instance's closing schedule
            was later disabled after having closed the cover at least once, an enabled
            reset here can still drive it closed on stale grounds. If you rely on
            this option, keep the automatic closing schedule that matches it enabled
            too. <br /><br /> \U0001F4D6 More details in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/override#auto_recover_after_manual_reset)."
          default: auto_recover_disabled
          selector:
            select:
              options:
              - label: ✅ Enable Automatic Return to Target State
                value: auto_recover_enabled
              - label: ❌ Disable Automatic Return to Target State
                value: auto_recover_disabled
              multiple: false
              sort: false
              custom_value: false
              mode: list
        reset_override_time:
          name: "\U0001F5D1️ Time to reset manual override"
          description: At what time do you want the manual detection to be reset?
          default: 00:01:00
          selector:
            time: {}
        reset_override_timeout:
          name: "\U0001F5D1️ Number of minutes until reset manual override"
          description: After how many minutes should the override status be cleared?
            Whether the cover then also moves depends on "Return to Target State After
            Manual Override Reset" above.
          default: 5
          selector:
            number:
              min: 0.0
              max: 1440.0
              unit_of_measurement: minutes
              step: 1.0
              mode: slider
        reset_override_position:
          name: "\U0001F5D1️ Position for reset manual override"
          description: At which position (+- tolerance) should it be reset? Typically,
            these are 'open' or 'closed' positions.
          default: 100
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        reset_override_position_dwell:
          name: "\U0001F5D1️ Dwell time at reset position (minutes)"
          description: How long must the cover stay at the reset position (± tolerance)
            before the manual override is cleared? Only applies to the 'Reset in position'
            option.
          default: 5
          selector:
            number:
              min: 0.0
              max: 1440.0
              unit_of_measurement: minutes
              step: 1.0
              mode: slider
    delay_section:
      description: "<center><p><small>\n  Take into account that, for example, waiting
        times are added when brightness changes or shading is started.\n  <br />\n
        \ It is therefore better to use smaller values here. It is only a matter of
        separating the different covers in terms of time.\n</small></p></center>"
      name: Delay Settings
      icon: mdi:timer-outline
      collapsed: true
      input:
        drive_delay_fix:
          name: "\U0001F55B Fixed Drive Delay"
          description: Fixed drive delay to avoid radio interferences. <br /><br />`Optional`
          default: 0
          selector:
            number:
              min: 0.0
              max: 600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
        drive_delay_random:
          name: "\U0001F55B Random Drive Delay"
          description: Additional random delay. <br /><br />`Optional`
          default: 5
          selector:
            number:
              min: 0.0
              max: 600.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
    condition_section:
      name: Additional Conditions
      description: "<center><p><small>\n  All these settings are optional\n</small></p></center>"
      icon: mdi:help-rhombus-outline
      collapsed: true
      input:
        auto_global_condition:
          name: ❓ Additional Condition for the entire automation
          description: This condition allows you to control the execution of the <ins>entire</ins>
            automation dynamically and outside of the blueprint configuration. With
            this option you could enable a party mode. <br /><br /> If the result
            of this condition is <ins>true</ins>, the automation will continue.<br
            /> The result of the conditions must be <ins>false</ins>, for the automation
            to stop in this sequence. <br /><br /> Forcing Open/Close/Shading/Ventilation
            is therefore only possible if this condition remains empty or becomes
            valid. <br /><br /> ⚠️ **While this condition is false, nothing runs at
            all — not even the background state tracking.** Skipping today's opening
            this way leaves the helper believing it never happened, which can make
            a later automatic movement (e.g. shading ending) return the cover to the
            wrong position. If you only want to suspend automatic movement for a while
            and have it resume correctly afterwards, use "⏸️ Force Pause" further
            down instead — it keeps the background state current while blocking movement.
          default: []
          selector:
            condition: {}
        auto_up_condition:
          name: "\U0001F53C Additional Condition For Opening The Cover"
          description: This condition can be used to dynamically control the <ins>opening</ins>
            of the cover. You can use this, for example, if the covers normally don't
            open, but you really want to do it on vacation. <br /><br /> If the result
            of this condition is <ins>true</ins>, the automation will continue.<br
            /> The result of the conditions must be <ins>false</ins>, for the automation
            to stop in this sequence.
          default: []
          selector:
            condition: {}
        auto_down_condition:
          name: "\U0001F53B Additional Condition For Closing The Cover"
          description: This condition can be used to dynamically control the <ins>closing</ins>
            of the cover. You can use this, for example, at Christmas time or if you
            want the covers to behave differently while on vacation. <br /><br />
            If the result of this condition is <ins>true</ins>, the automation will
            continue.<br /> The result of the conditions must be <ins>false</ins>,
            for the automation to stop in this sequence.
          default: []
          selector:
            condition: {}
        auto_ventilate_condition:
          name: "\U0001F4A8 Additional Condition For Activating Ventilation"
          description: 'This condition can be used to dynamically control the <ins>start
            of the ventilation</ins> of the cover, including the proactive movement
            to the Full Ventilation Position when a window is fully opened. A false
            result does not disable the open-window lockout itself: CCA still records
            the open window and prevents later closing or sun-shading movement while
            it remains open. <br /><br /> If the result of this condition is <ins>true</ins>,
            the automation will continue.<br /> The result of the conditions must
            be <ins>false</ins>, for the automation to stop in this sequence.'
          default: []
          selector:
            condition: {}
        auto_ventilate_end_condition:
          name: "\U0001F4A8 Additional Condition For Disabling Ventilation"
          description: This condition can be used to dynamically control the <ins>end
            of the ventilation</ins> of the cover. <br /><br /> If the result of this
            condition is <ins>true</ins>, the automation will continue.<br /> The
            result of the conditions must be <ins>false</ins>, for the automation
            to stop in this sequence.
          default: []
          selector:
            condition: {}
        auto_shading_start_condition:
          name: "\U0001F975 Additional Condition When Activating Sun Shading"
          description: 'This condition can be used to dynamically control the <ins>shading-IN-automation</ins>
            of the cover. This can be useful if you want to temporarily disable automation
            (e.g. because of control by other automations). <br /><br /> If the result
            of this condition is <ins>true</ins>, the automation will continue.<br
            /> The result of the conditions must be <ins>false</ins>, for the automation
            to stop in this sequence. <br /> Another example: Here you could also
            set that the shading is only triggered in the summer season.'
          default: []
          selector:
            condition: {}
        auto_shading_tilt_condition:
          name: "\U0001F975 Additional Condition For Sun Shading Tilt"
          description: 'This condition can be used to dynamically control the <ins>shading_tilt-IN-automation</ins>
            of the cover. This can be useful if you want to temporarily disable automation
            (e.g. because of control by other automations). <br /> Another example:
            Here you could also set that the tilting is only triggered in the summer
            season. <br /><br /> If the result of this condition is <ins>true</ins>,
            the automation will continue.<br /> The result of the conditions must
            be <ins>false</ins>, for the automation to stop in this sequence.'
          default: []
          selector:
            condition: {}
        auto_shading_end_condition:
          name: "\U0001F975 Additional Condition When Deactivating Sun Shading"
          description: This condition can be used to dynamically control the <ins>shading-OUT-automation</ins>
            of the cover. This can be useful if you want to temporarily disable automation
            (e.g. because of control by other automations). <br /> If the result of
            this condition is <ins>true</ins>, the automation will continue.<br />
            The result of the conditions must be <ins>false</ins>, for the automation
            to stop in this sequence.
          default: []
          selector:
            condition: {}
    force_section:
      name: Force Features
      description: "<center><p><small>\n  Emergency override controls for weather
        protection and special scenarios\n  <br />\n  Force functions allow you to
        immediately move covers to specific positions, overriding all other automation
        logic.\n  <br />\n  Use cases include: rain protection, wind protection, frost
        prevention, or temporary manual control.\n  <br />\n  \U0001F4D6 See: <a href=\"https://hvorragend.github.io/ha-blueprints/FAQ#q-how-does-a-force-function-work\">FAQ:
        How does a force function work?</a>\n  <br />\n  <br />\n  All settings in
        this section are optional\n</small></p></center>"
      icon: mdi:arm-flex
      collapsed: true
      input:
        force_pause:
          name: ⏸️ Force Pause (Suspend Automatic Actions)
          description: "If the status of this entity changes to on or true, all automatic
            cover movements are suspended immediately. The background state (target
            positions) is still tracked continuously in the helper — even while paused.\nWhen
            this entity turns off again, the cover **immediately returns** to its
            correct target position — no waiting for the next scheduled trigger. This
            is unconditional and independent of \"Return to Target State After Force
            Disable\" below, which only applies to the four Force functions further
            down.\n\U0001F4A1 **Tip:** Use an `input_boolean` as a manual/automatic
            toggle. Unlike putting a switch in the global condition (which blocks
            helper state updates too), this force pause only blocks cover movement.
            The helper always reflects the correct background state, so resuming is
            instant and reliable."
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - switch
              multiple: false
              reorder: false
        auto_up_force:
          name: "\U0001F53C Force Immediate Opening via Entity"
          description: 'If the status of this entity changes to on or true, the cover
            is opened immediately and without further checking.

            If the entity has no status (e.g. during a restart), the force function
            is not cancelled — the automation keeps the last known one until the entity
            reports again.'
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              - switch
              multiple: false
              reorder: false
        auto_down_force:
          name: "\U0001F53B Force Immediate Closing via Entity"
          description: 'If the status of this entity changes to on or true, the cover
            is closed immediately and without further checking.

            If the entity has no status (e.g. during a restart), the force function
            is not cancelled — the automation keeps the last known one until the entity
            reports again.'
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              - switch
              multiple: false
              reorder: false
        auto_ventilate_force:
          name: "\U0001F4A8 Force Immediate Ventilation via Entity"
          description: 'If the status of this entity changes to on or true, the cover
            is immediately set to ventilation mode and without further checking.

            If the entity has no status (e.g. during a restart), the force function
            is not cancelled — the automation keeps the last known one until the entity
            reports again.'
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              - switch
              multiple: false
              reorder: false
        auto_shading_start_force:
          name: "\U0001F975 Force Activation Sun Shading via Entity"
          description: 'If the status of this entity changes to on or true, the shading
            is immediately activated and without further checking.

            If the entity has no status (e.g. during a restart), the force function
            is not cancelled — the automation keeps the last known one until the entity
            reports again.'
          default: []
          selector:
            entity:
              domain:
              - input_boolean
              - binary_sensor
              - switch
              multiple: false
              reorder: false
        auto_recover_after_force:
          name: "\U0001F519 Return to Target State After Force Disable"
          description: "Applies only to the four Force functions above (Open/Close/Ventilate/Shading
            via entity) — not to Force Pause. Seamless control with automatic recovery:
            When enabled, the cover automatically returns to its intended position
            when one of these force functions is disabled.\n\U0001F4D6 More details
            in the [CCA Handbook](https://hvorragend.github.io/ha-blueprints/handbook/force#auto_recover_after_force)."
          default: auto_recover_disabled
          selector:
            select:
              options:
              - label: ✅ Enable Automatic Return to Target State
                value: auto_recover_enabled
              - label: ❌ Disable Automatic Return to Target State
                value: auto_recover_disabled
              multiple: false
              sort: false
              custom_value: false
              mode: list
    actions_section:
      name: Additional Actions
      description: "<center><p><small>\n  All these settings are optional\n</small></p></center>"
      icon: mdi:run
      collapsed: true
      input:
        auto_up_action_before:
          name: "\U0001F53C Additional Actions Before Opening The Cover"
          description: Additional actions to run <ins>before</ins> opening the cover
          default: []
          selector:
            action: {}
        auto_up_action:
          name: "\U0001F53C Additional Actions After Opening The Cover"
          description: Additional actions to run <ins>after</ins> opening the cover
          default: []
          selector:
            action: {}
        auto_down_action_before:
          name: "\U0001F53B Additional Actions Before Closing The Cover"
          description: Additional actions to run <ins>before</ins> closing the cover
          default: []
          selector:
            action: {}
        auto_down_action:
          name: "\U0001F53B Additional Actions After Closing The Cover"
          description: Additional actions to run <ins>after</ins> closing the cover
          default: []
          selector:
            action: {}
        auto_ventilate_action_before:
          name: "\U0001F4A8 Additional Actions Before Ventilating The Cover"
          description: Additional actions to run <ins>before</ins> ventilating the
            cover
          default: []
          selector:
            action: {}
        auto_ventilate_action:
          name: "\U0001F4A8 Additional Actions After Ventilating The Cover"
          description: Additional actions to run <ins>after</ins> ventilating the
            cover
          default: []
          selector:
            action: {}
        auto_shading_start_action_before:
          name: "\U0001F975 Additional Actions Before Activating Sun Shading"
          description: Additional actions to run <ins>before</ins> activating sun
            shading
          default: []
          selector:
            action: {}
        auto_shading_start_action:
          name: "\U0001F975 Additional Actions After Activating Sun Shading"
          description: Additional actions to run <ins>after</ins> activating sun shading
          default: []
          selector:
            action: {}
        auto_shading_end_action_before:
          name: "\U0001F975 Additional Actions Before Disabling Sun Shading"
          description: Additional actions to run <ins>before</ins> disabling sun shading
          default: []
          selector:
            action: {}
        auto_shading_end_action:
          name: "\U0001F975 Additional Actions After Disabling Sun Shading"
          description: Additional actions to run <ins>after</ins> disabling sun shading
          default: []
          selector:
            action: {}
        auto_manual_action:
          name: "\U0001F590️ Additional Actions After Manual Change"
          description: Additional actions after a manual change to the covers
          default: []
          selector:
            action: {}
        auto_override_reset_action:
          name: "\U0001F5D1️ Additional Actions After Override Reset"
          description: Additional actions to be taken after resetting the manual override
          default: []
          selector:
            action: {}
    configcheck_section:
      name: Configuration Check
      description: "<center><p><small> <strong>\U0001F517 Use the <a href=\"https://hvorragend.github.io/ha-blueprints/validator/\"
        target=\"_blank\">Online Configuration Validator</a></strong> <br /> Validate
        your YAML configuration for errors, typos, and deprecated parameters before
        deploying. <br /> ✅ Instant feedback • \U0001F50D Typo detection • ⚠️ Migration
        guidance • \U0001F512 Privacy-friendly (client-side) </small></p></center>"
      icon: mdi:invoice-text-check-outline
      collapsed: true
      input:
        check_config:
          name: ✔️ Check Configuration
          description: With this boolean, you can enable or disable the basic plausibility
            check for the configuration. The check only takes place if the automation
            is executed manually. <br /><br /> Use the <a href="https://hvorragend.github.io/ha-blueprints/validator/"
            target="_blank">online validator</a> for another validation.
          default: false
          selector:
            boolean: {}
        check_config_debuglevel:
          name: ✔️ Check Configuration - Debug level
          description: Choose the debug level for Syslog messages in case of configuration
            issues <br /> Please make sure that it suits your Home Assistant logger
            default level.
          default: info
          selector:
            select:
              multiple: false
              mode: dropdown
              options:
              - critical
              - debug
              - error
              - info
              - warning
              sort: false
              custom_value: false
    logging_section:
      name: Logging
      description: Optional logbook output for retrospective debugging. The technical
        entry lands on the automation itself and contains the trigger, the resulting
        effective state and a snapshot of all relevant sensor values. The short entry
        lands on the cover and explains in plain words what was decided. Both are
        useful when the 5-trace history is not enough to understand a cover's behavior
        over the day.
      icon: mdi:notebook-outline
      collapsed: true
      input:
        enable_logbook:
          name: "\U0001F4D3 Enable Logbook entries"
          description: When enabled, every automation run writes a single logbook
            entry with full context. Disabled by default to avoid noise in the Activities
            view. Toggle on while debugging a configuration.
          default: false
          selector:
            boolean: {}
        enable_logbook_cover:
          name: "\U0001FA9F Log decisions on the cover"
          description: When enabled, a short entry is written to the logbook of the
            cover itself whenever this automation moves it or deliberately decides
            against a movement. The entry appears in the cover's history and on its
            device page, so the reason for a movement stays visible long after the
            automation traces are gone. Purely informational runs (state synchronisation
            only) stay silent. The messages are always English, regardless of your
            Home Assistant language.
          default: false
          selector:
            boolean: {}
        trace_count:
          name: "\U0001F4DC Number of stored traces"
          description: Set how many traces Home Assistant shall keep for this automation.
          default: 5
          selector:
            number:
              min: 1.0
              max: 100.0
              step: 1.0
              mode: slider
trigger_variables:
  blind: !input blind
  cover_type: !input cover_type
  is_awning: '{{ cover_type == ''awning'' }}'
  resident_sensor: !input resident_sensor
  resident_config: !input resident_config
  position_source: !input position_source
  custom_position_sensor: !input custom_position_sensor
  open_position: !input open_position
  close_position: !input close_position
  ventilate_position: !input ventilate_position
  lockout_position: !input lockout_position
  shading_position: !input shading_position
  shading_position_alt: !input shading_position_alt
  shading_position_alt_entity: !input shading_position_alt_entity
  position_tolerance: !input position_tolerance
  open_tilt_position: !input open_tilt_position
  close_tilt_position: !input close_tilt_position
  ventilate_tilt_position: !input ventilate_tilt_position
  tilt_position_tolerance: !input tilt_position_tolerance
  shading_tilt_elevation_1: !input shading_tilt_elevation_1
  shading_tilt_elevation_2: !input shading_tilt_elevation_2
  shading_tilt_elevation_3: !input shading_tilt_elevation_3
  shading_tilt_position_0: !input shading_tilt_position_0
  shading_tilt_position_1: !input shading_tilt_position_1
  shading_tilt_position_2: !input shading_tilt_position_2
  shading_tilt_position_3: !input shading_tilt_position_3
  auto_options: !input auto_options
  cover_tilt_config: !input cover_tilt_config
  cover_tilt_reposition_config: !input cover_tilt_reposition_config
  is_cover_tilt_enabled: '{{ not is_awning and ''cover_tilt_enabled'' in cover_tilt_config
    }}'
  tilt_wait_mode: !input cover_tilt_wait_mode
  tilt_wait_timeout: !input cover_tilt_wait_timeout
  is_tilt_wait_idle_mode: '{{ tilt_wait_mode == ''wait_idle'' }}'
  is_tilt_before_position_mode: '{{ tilt_wait_mode == ''tilt_before_position'' }}'
  time_up_early: !input time_up_early
  time_up_early_non_workday: !input time_up_early_non_workday
  time_up_late: !input time_up_late
  time_up_late_non_workday: !input time_up_late_non_workday
  time_down_early: !input time_down_early
  time_down_early_non_workday: !input time_down_early_non_workday
  time_down_late: !input time_down_late
  time_down_late_non_workday: !input time_down_late_non_workday
  workday_sensor_today: !input workday_sensor
  workday_sensor_tomorrow: !input workday_sensor_tomorrow
  time_control: !input time_control
  calendar_entity: !input calendar_entity
  calendar_open_title: !input calendar_open_title
  calendar_close_title: !input calendar_close_title
  calendar_open_title_lc: '{{ (calendar_open_title | default('''')) | lower | trim
    }}'
  calendar_close_title_lc: '{{ (calendar_close_title | default('''')) | lower | trim
    }}'
  is_calendar_enabled: '{{ ''time_control_enabled'' in auto_options and ''time_control_calendar''
    in time_control and calendar_entity != [] }}'
  default_brightness_sensor: !input default_brightness_sensor
  brightness_up: !input brightness_up
  brightness_down: !input brightness_down
  brightness_hysteresis: !input brightness_hysteresis
  brightness_sun_operator: !input brightness_sun_operator
  default_sun_sensor: !input default_sun_sensor
  sun_elevation_mode: !input sun_elevation_mode
  sun_elevation_up: !input sun_elevation_up
  sun_elevation_down: !input sun_elevation_down
  sun_elevation_up_sensor: !input sun_elevation_up_sensor
  sun_elevation_down_sensor: !input sun_elevation_down_sensor
  contact_window_opened: !input contact_window_opened
  contact_window_tilted: !input contact_window_tilted
  lockout_tilted_options: !input lockout_tilted_options
  auto_ventilate_options: !input auto_ventilate_options
  shading_azimuth_start: !input shading_azimuth_start
  shading_azimuth_end: !input shading_azimuth_end
  shading_elevation_min: !input shading_elevation_min
  shading_elevation_max: !input shading_elevation_max
  shading_sun_brightness_start: !input shading_sun_brightness_start
  shading_sun_brightness_end: !input shading_sun_brightness_end
  shading_sun_brightness_hysteresis: !input shading_sun_brightness_hysteresis
  shading_brightness_sensor: !input shading_brightness_sensor
  shading_temperatur_sensor1: !input shading_temperatur_sensor1
  shading_temperatur_sensor2: !input shading_temperatur_sensor2
  shading_min_temperatur1: !input shading_min_temperatur1
  shading_min_temperatur2: !input shading_min_temperatur2
  shading_temperature_hysteresis1: !input shading_temperature_hysteresis1
  shading_temperature_hysteresis2: !input shading_temperature_hysteresis2
  shading_forecast_sensor: !input shading_forecast_sensor
  shading_forecast_temp_sensor: !input shading_forecast_temp_sensor
  shading_forecast_type_raw: !input shading_forecast_type
  shading_forecast_type: '{{ shading_forecast_type_raw if shading_forecast_type_raw
    not in ['''', none, []] else ''daily'' }}'
  shading_forecast_temp: !input shading_forecast_temp
  shading_forecast_temp_hysteresis: !input shading_forecast_temp_hysteresis
  shading_independent_temp: !input shading_independent_temp
  shading_weather_conditions: !input shading_weather_conditions
  shading_custom_sensor: !input shading_custom_sensor
  shading_conditions_start_and: !input shading_conditions_start_and
  shading_conditions_start_or: !input shading_conditions_start_or
  shading_conditions_end_and: !input shading_conditions_end_and
  shading_conditions_end_or: !input shading_conditions_end_or
  lockout_tilted_when_closing: '{{ ''lockout_tilted_closing'' in lockout_tilted_options
    }}'
  lockout_tilted_when_shading_starts: '{{ ''lockout_tilted_shading_start'' in lockout_tilted_options
    }}'
  lockout_tilted_when_shading_ends: '{{ ''lockout_tilted_shading_end'' in lockout_tilted_options
    }}'
  shading_over_ventilation: '{{ ''shading_over_ventilation'' in auto_ventilate_options
    }}'
  is_shading_enabled: '{{ ''auto_shading_enabled'' in auto_options }}'
  is_up_enabled: '{{ ''auto_up_enabled'' in auto_options }}'
  is_down_enabled: '{{ ''auto_down_enabled'' in auto_options }}'
  is_brightness_enabled: '{{ ''auto_brightness_enabled'' in auto_options }}'
  is_sun_elevation_enabled: '{{ ''auto_sun_enabled'' in auto_options }}'
  use_and_operator: '{{ brightness_sun_operator == ''and'' }}'
  is_time_field_enabled: '{{ ''time_control_enabled'' in auto_options and ''time_control_input''
    in time_control }}'
  is_time_control_disabled: '{{ ''time_control_enabled'' not in auto_options }}'
  is_opening_scheduled: "{{ is_up_enabled and (\n     is_time_field_enabled or\n     is_calendar_enabled
    or\n     (is_brightness_enabled and default_brightness_sensor != []) or\n     (is_sun_elevation_enabled
    and default_sun_sensor != []) or\n     ('resident_opening_enabled' in resident_config
    and resident_sensor != [])) }}"
  is_closing_scheduled: "{{ is_down_enabled and (\n     is_time_field_enabled or\n
    \    is_calendar_enabled or\n     (is_brightness_enabled and default_brightness_sensor
    != []) or\n     (is_sun_elevation_enabled and default_sun_sensor != [])) }}"
  is_ventilation_enabled: '{{ not is_awning and ''auto_ventilate_enabled'' in auto_options
    }}'
  recovery_config: !input enable_recovery
  recovery_mode: "{{ 'always' if recovery_config in [true, 'true', 'always']\n   else
    ('outage' if recovery_config == 'outage' else 'never') }}"
  is_recovery_enabled: '{{ recovery_mode != ''never'' }}'
  reset_override_config: !input reset_override_config
  reset_override_time: !input reset_override_time
  reset_override_timeout: !input reset_override_timeout
  reset_override_position: !input reset_override_position
  reset_override_position_dwell: !input reset_override_position_dwell
  is_reset_fixed_time: '{{ ''reset_fixed_time'' in reset_override_config }}'
  is_reset_timeout: '{{ ''reset_timeout'' in reset_override_config }}'
  is_reset_position: '{{ ''reset_in_position'' in reset_override_config }}'
  is_reset_disabled: '{{ not is_reset_fixed_time and not is_reset_timeout and not
    is_reset_position }}'
  auto_recover_after_manual_reset: !input auto_recover_after_manual_reset
  is_manual_reset_recovery_enabled: '{{ ''auto_recover_enabled'' in auto_recover_after_manual_reset
    }}'
  auto_up_force: !input auto_up_force
  auto_down_force: !input auto_down_force
