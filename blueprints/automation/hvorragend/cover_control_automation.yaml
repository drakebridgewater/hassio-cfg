- trigger: state
  entity_id: !input instance_active
  from:
  - 'off'
  - 'false'
  to:
  - 'on'
  - 'true'
  id: t_instance_activated
  enabled: '{{ instance_active != [] and instance_active_value | trim == '''' }}'
- trigger: state
  entity_id: !input instance_active
  not_from: *id001
  not_to: *id001
  id: t_instance_activated
  enabled: '{{ instance_active != [] and instance_active_value | trim != '''' }}'
- trigger: state
  entity_id: !input instance_active
  from: *id001
  not_to: *id001
  id: t_recovery
  for: *id002
  enabled: '{{ instance_active != [] }}'
- trigger: template
  value_template: "{% set automation_state = states[automation_entity] if automation_entity
    != '' else none %} {% set attached = as_timestamp(automation_state.last_changed,
    0)\n     if automation_state is not none and automation_state.state == 'on' else
    0 %}\n{% set helper_state = states(cover_status_helper) %} {% set helper = helper_state
    | from_json(default={}) if helper_state not in invalid_states and helper_state
    | regex_match(\"((\\[[^\\}]+)?\\{\\s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\") else
    {} %} {% set critical_ready = states(blind) not in invalid_states and\n     (position_source
    != 'custom_sensor' or custom_position_sensor == [] or\n      states(custom_position_sensor)
    not in invalid_states) %}\n{% set contact_missing = is_ventilation_enabled and
    (\n     (contact_window_opened != [] and states(contact_window_opened) in invalid_states
    and\n      helper.win | default('cls') == 'opn') or\n     (contact_window_tilted
    != [] and states(contact_window_tilted) in invalid_states)) %}\n{% set contact_ready
    = helper.win | default('cls') == 'cls' or not contact_missing %} {{ attached >
    0 and\n   (helper.t | default(0) | int) > 0 and\n   as_timestamp(now()) > attached
    + 60 and\n   (helper.t | default(0) | int) < attached and\n   critical_ready and
    contact_ready }}"
  enabled: '{{ cover_status_helper != [] }}'
  id: t_recovery
- trigger: event
  event_type: automation_reloaded
  id: t_automation_reloaded
  enabled: '{{ cover_status_helper != [] }}'
- trigger: template
  value_template: '{{ now() >= today_at(reset_override_time) }}'
  enabled: '{{ is_reset_fixed_time }}'
  id: t_reset_fixedtime
  for:
    minutes: 2
- trigger: template
  value_template: "{% set helper_state = states(cover_status_helper) %} {% set helper
    = helper_state | from_json(default={}) if helper_state not in invalid_states and
    helper_state | regex_match(\"((\\[[^\\}]+)?\\{\\s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    else {} %} {% if helper.v | default(0) == 6 %}\n  {{ helper.man | default(0) |
    int == 1 and\n     helper.ts.man | default(0) | int > 0 and\n     now() >= (helper.ts.man
    + 60 * reset_override_timeout) | as_datetime | as_local }}\n{% else %}\n  {{ false
    }}\n{% endif %}"
  enabled: '{{ is_reset_timeout and cover_status_helper != [] }}'
  id: t_reset_timeout
  for:
    seconds: 2
- trigger: template
  value_template: "{% set helper_state = states(cover_status_helper) %} {% set helper
    = helper_state | from_json(default={}) if helper_state not in invalid_states and
    helper_state | regex_match(\"((\\[[^\\}]+)?\\{\\s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    else {} %} {% set pos = state_attr(blind, 'current_position') | float(-100) %}
    {{ helper.man | default(0) | int == 1 and\n   (pos - (reset_override_position
    | float(0))) | abs <= (position_tolerance | float(5)) }}"
  enabled: '{{ is_reset_position and cover_status_helper != [] }}'
  id: t_reset_position
  for:
    minutes: !input reset_override_position_dwell
conditions:
- condition: !input auto_global_condition
- condition: template
  value_template: "{{ instance_active == [] or states[instance_active] is none or\n
    \  states(instance_active) in (['on', 'true'] if instance_active_value | trim
    == ''\n                               else [instance_active_value | trim]) }}"
- or:
  - '{{ trigger.to_state is not defined }}'
  - '{{ trigger.to_state is defined and trigger.to_state.state not in invalid_states
    }}'
- condition: template
  value_template: "{% set ns = namespace(ready=true) %} {% for entity in critical_entities
    if states[entity] is not none %}\n  {% if states(entity) in invalid_states %}{%
    set ns.ready = false %}{% endif %}\n{% endfor %} {{ ns.ready }}"
- condition: template
  value_template: '{{ cover_status_helper == [] or states(cover_status_helper) !=
    ''unavailable'' }}'
- condition: template
  value_template: "{% set helper = states(cover_status_helper) if cover_status_helper
    != [] else 'unavailable' %} {% set last_window_closed = helper in invalid_states
    or helper | regex_search('\"win\"\\s*:\\s*\"cls\"') %} {% set last_window_open
    = helper not in invalid_states and helper | regex_search('\"win\"\\s*:\\s*\"opn\"')
    %} {% set contact_missing = is_ventilation_enabled and (\n     (contact_window_opened
    != [] and states(contact_window_opened) in invalid_states and last_window_open)
    or\n     (contact_window_tilted != [] and states(contact_window_tilted) in invalid_states))
    %}\n{{ last_window_closed or not contact_missing or\n   trigger.id | default('')
    in ['t_contact_opened_changed', 't_contact_tilted_changed',\n                                't_manual_position',
    't_manual_tilt'] }}"
- condition: template
  value_template: "{% if trigger.id is match('^t_shading_start_pending_([1-6]|8)$')
    %}\n  {% set helper = states(cover_status_helper) if cover_status_helper != []
    else 'unavailable' %}\n  {% set is_shaded = helper not in invalid_states and helper
    | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]') %}\n  {% set is_end_pending = helper
    not in invalid_states and helper | regex_search('\"pnd\"\\s*:\\s*\"end\"') %}\n
    \ {{ not is_shaded or is_end_pending }}\n{% elif trigger.id is match('^t_shading_end_pending_[1-8]$')
    %}\n  {{ cover_status_helper != [] and states(cover_status_helper) not in invalid_states
    and states(cover_status_helper) | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]') }}\n{%
    else %}\n  true\n{% endif %}"
actions:
- variables:
    cover_move_action: &id003
      sequence:
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions }}'
      - condition: template
        value_template: '{{ not (target_position | default(101) >= current_position
          | default(101) - position_tolerance | default(0) and target_position | default(101)
          <= current_position | default(101) + position_tolerance | default(0)) }}'
      - condition: template
        value_template: '{{ 0 <= target_position | default(101) | int <= 100 }}'
      - condition: template
        value_template: "{{ not (force_pause != [] and states(force_pause) in ['on',
          'true']) and\n   (instance_active == [] or states[instance_active] is none
          or\n    states(instance_active) in instance_active_on_states) }}"
      - variables:
          drive_dispatched: true
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - choose:
            - alias: 'Cover move: full close'
              conditions: "{{ target_position | default(101) | int == 0 and\n   (not
                is_tilt_before_position_mode | default(false) or\n    not is_cover_tilt_enabled_and_possible
                | default(false) or\n    target_tilt_position | default(101) | int
                in [0, 101]) }}"
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - alias: 'Cover move: full open'
              conditions: "{{ target_position | default(101) | int == 100 and\n   (not
                is_tilt_before_position_mode | default(false) or\n    not is_cover_tilt_enabled_and_possible
                | default(false) or\n    target_tilt_position | default(101) | int
                in [100, 101]) }}"
              sequence:
              - action: cover.open_cover
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - alias: 'Cover move: position command (0-100)'
              conditions: '{{ 0 <= target_position | default(101) | int <= 100 }}'
              sequence:
              - action: cover.set_cover_position
                data:
                  position: '{{ target_position | default(101) | int }}'
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
          - delay:
              seconds: '{{ range(1, 3) | random }}'
    tilt_move_action: &id004
      sequence:
      - condition: template
        value_template: '{{ not prevent_flags.default_cover_actions and is_cover_tilt_enabled_and_possible
          }}'
      - condition: template
        value_template: "{{ not (force_pause != [] and states(force_pause) in ['on',
          'true']) and\n   (instance_active == [] or states[instance_active] is none
          or\n    states(instance_active) in instance_active_on_states) }}"
      - variables:
          drive_dispatched: true
      - repeat:
          for_each: '{{ blind_entities | list }}'
          sequence:
          - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
              is defined }}'
            then:
            - if: '{{ tilt_first | default(false) }}'
              then:
              - action: cover.set_cover_tilt_position
                data:
                  tilt_position: 0
                target:
                  entity_id: '{{ repeat.item if repeat is defined else '''' }}'
              - delay:
                  seconds: !input tilt_delay
            - choose:
              - alias: 'Tilt wait: until movement stops'
                conditions: '{{ is_tilt_wait_idle_mode | default(false) or is_tilt_before_position_mode
                  | default(false) }}'
                sequence:
                - wait_template: '{{ states(repeat.item if repeat is defined else
                    '''') in [''open'', ''closed''] }}'
                  timeout: '{{ tilt_wait_timeout | int }}'
                  continue_on_timeout: true
                - if: '{{ wait.completed if wait is defined else '''' }}'
                  then:
                  - delay: 1
              default:
              - delay:
                  seconds: !input tilt_delay
            - action: cover.set_cover_tilt_position
              data:
                tilt_position: '{{ target_tilt_position | default(101) }}'
              target:
                entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            - delay:
                seconds: '{{ range(1, 3) | random }}'
    drive_with_actions: &id005
      sequence:
      - choose:
        - conditions: '{{ drive_action_set | default('''') == ''up'' }}'
          sequence:
          - choose: []
            default: !input auto_up_action_before
        - conditions: '{{ drive_action_set | default('''') == ''down'' }}'
          sequence:
          - choose: []
            default: !input auto_down_action_before
        - conditions: '{{ drive_action_set | default('''') == ''ventilate'' }}'
          sequence:
          - choose: []
            default: !input auto_ventilate_action_before
        - conditions: '{{ drive_action_set | default('''') == ''shading_start'' }}'
          sequence:
          - choose: []
            default: !input auto_shading_start_action_before
        - conditions: '{{ drive_action_set | default('''') == ''shading_end'' }}'
          sequence:
          - choose: []
            default: !input auto_shading_end_action_before
      - condition: template
        value_template: "{{ not (force_pause != [] and states(force_pause) in ['on',
          'true']) and\n   (instance_active == [] or states[instance_active] is none
          or\n    states(instance_active) in instance_active_on_states) }}"
      - alias: Preliminary tilt alignment (tilt before position mode)
        if:
        - "{{ is_tilt_before_position_mode | default(false) and\n   is_cover_tilt_enabled_and_possible
          | default(false) and\n   not prevent_flags.default_cover_actions }}"
        - '{{ not (target_position | default(101) >= current_position | default(101)
          - position_tolerance | default(0) and target_position | default(101) <=
          current_position | default(101) + position_tolerance | default(0)) }}'
        then:
        - variables:
            drive_dispatched: true
        - repeat:
            for_each: '{{ blind_entities | list }}'
            sequence:
            - if: '{{ state_attr(repeat.item if repeat is defined else '''', ''current_tilt_position'')
                is not none }}'
              then:
              - variables:
                  align_position: '{{ state_attr(repeat.item if repeat is defined
                    else '''', ''current_position'') | int(current_position | default(101)
                    | int) }}'
              - choose:
                - alias: 'Tilt align: leave the fully-open endpoint'
                  conditions: '{{ align_position | default(101) | int >= 100 }}'
                  sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                  - delay:
                      seconds: 1
                - alias: 'Tilt align: close slats before moving down'
                  conditions: '{{ target_position | default(101) | int < align_position
                    | default(101) | int }}'
                  sequence:
                  - action: cover.set_cover_tilt_position
                    data:
                      tilt_position: 0
                    target:
                      entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                  - delay:
                      seconds: !input tilt_delay
                - alias: 'Tilt align: open slats before moving up'
                  conditions: '{{ target_position | default(101) | int > align_position
                    | default(101) | int }}'
                  sequence:
                  - action: cover.set_cover_tilt_position
                    data:
                      tilt_position: 100
                    target:
                      entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                  - delay:
                      seconds: !input tilt_delay
      - *id003
      - *id004
      - alias: 'Custom actions only: claim the user action as dispatch'
        if: '{{ prevent_flags.default_cover_actions }}'
        then:
        - variables:
            drive_dispatched: true
      - if: '{{ drive_dispatched | default(false) }}'
        then:
        - choose:
          - conditions: '{{ drive_action_set | default('''') == ''up'' }}'
            sequence:
            - choose: []
              default: !input auto_up_action
          - conditions: '{{ drive_action_set | default('''') == ''down'' }}'
            sequence:
            - choose: []
              default: !input auto_down_action
          - conditions: '{{ drive_action_set | default('''') == ''ventilate'' }}'
            sequence:
            - choose: []
              default: !input auto_ventilate_action
          - conditions: '{{ drive_action_set | default('''') == ''shading_start''
              }}'
            sequence:
            - choose: []
              default: !input auto_shading_start_action
          - conditions: '{{ drive_action_set | default('''') == ''shading_end'' }}'
            sequence:
            - choose: []
              default: !input auto_shading_end_action
    helper_update: &id006
      choose: []
      default:
      - action: input_text.set_value
        data:
          entity_id: !input cover_status_helper
          value: "{% set live_helper_state = states(cover_status_helper) if cover_status_helper
            != [] else 'unavailable' %}\n{% set live_helper_raw = live_helper_state
            | from_json(default={}) if live_helper_state not in invalid_states and
            live_helper_state | regex_match(\"((\\[[^\\}]+)?\\{\\s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
            else {} %}\n{% set current = live_helper_raw if live_helper_raw.bas is
            defined and live_helper_raw.v is defined and live_helper_raw.v == 6 else
            helper_json %}\n{% set updates = update_values | default({}) %}\n{% set
            ts_now = as_timestamp(now()) | round(0) %}\n\n{% set new_bas = updates.bas
            | default(current.bas | default('opn')) %}\n{% set new_shd = updates.shd
            | default(current.shd | default(0)) | int %}\n{% set new_pnd = updates.pnd
            | default(current.pnd | default('non')) %}\n{% set new_win = updates.win
            | default(current.win | default('cls')) %}\n{% set new_frc = updates.frc
            | default(current.frc | default('non')) %}\n{% set new_res = updates.res
            | default(current.res | default(0)) | int %}\n{% set run_drove = drive_dispatched
            | default(false) %}\n{% set new_man = updates.man | default(0 if run_drove
            else current.man | default(0)) | int %}\n{% set current_ts = current.ts
            | default({}) %}\n\n{% set merged_ts = namespace(data={}) %}\n{% for key
            in ['opn', 'cls', 'shd', 'due', 'arm', 'man'] %}\n  {% set merged_ts.data
            = dict(merged_ts.data, **{key: current_ts[key] | default(0) | int}) %}\n{%
            endfor %}\n{% if 'ts' in updates %}\n  {% for key, value in updates.ts.items()
            %}\n    {% set merged_ts.data = dict(merged_ts.data, **{key: (ts_now if
            value == 'now' else value) | int}) %}\n  {% endfor %}\n{% endif %}\n{%
            if new_shd == (current.shd | default(0) | int) and 'ts' in updates and
            'shd' in updates.ts %}\n  {% set merged_ts.data = dict(merged_ts.data,
            **{'shd': current_ts.shd | default(0) | int}) %}\n{% endif %}\n\n{% set
            dict_new = {\n  'bas': new_bas,\n  'shd': new_shd | int,\n  'pnd': new_pnd,\n
            \ 'win': new_win,\n  'frc': new_frc,\n  'res': new_res | int,\n  'man':
            new_man | int,\n  'ts': {\n    'opn': merged_ts.data.opn | default(0)
            | int,\n    'cls': merged_ts.data.cls | default(0) | int,\n    'shd':
            merged_ts.data.shd | default(0) | int,\n    'due': merged_ts.data.due
            | default(0) | int,\n    'arm': merged_ts.data.arm | default(0) | int,\n
            \   'man': merged_ts.data.man | default(0) | int\n  },\n  'v': 6,\n  't':
            ts_now | int,\n  'd': (ts_now if run_drove else current.d | default(0))
            | int\n} %}\n{{ dict_new | to_json }}"
      - if: '{{ enable_logbook }}'
        then:
        - action: logbook.log
          data:
            name: '{{ this.attributes.friendly_name }}'
            entity_id: '{{ this.entity_id }}'
            message: "Trigger: {{ trigger.id | default('manual') }} | \nEffective:
              {{ effective_state }} | \nPosition: {{ current_position }}% {% if is_cover_tilt_enabled
              %} / Tilt: {{ current_tilt_position }}%{% endif %} | \nHelper: bas={{
              helper_json.bas | default('opn') }} shd={{ helper_json.shd | default(0)
              }} pnd={{ helper_json.pnd | default('non') }} win={{ helper_json.win
              | default('cls') }} frc={{ helper_json.frc | default('non') }} res={{
              helper_json.res | default(0) }} man={{ helper_json.man | default(0)
              }} | \nStates: \nopn={{ states(contact_window_opened) if contact_window_opened
              != [] else '-' }} \ntlt={{ states(contact_window_tilted) if contact_window_tilted
              != [] else '-' }}\nres={{ state_resident }} \nsun_elev={{ current_sun_elevation
              | float(default=0) }}°({{ sun_elevation_up_current | float(default=0)
              | round(1) }}°/{{ sun_elevation_down_current | float(default=0) | round(1)
              }})° \nazim={{ current_sun_azimuth | float(default=0) | round(1) }}°\nbri={{
              states(default_brightness_sensor) if default_brightness_sensor != []
              else '-' }} \nt1={{ states(shading_temperatur_sensor1) if shading_temperatur_sensor1
              != [] else '-' }} \nt2={{ states(shading_temperatur_sensor2) if shading_temperatur_sensor2
              != [] else '-' }}\nupdate={{ update_values | default({}) | to_json }}\n{%
              if log_extra is defined and log_extra %} extra={{ log_extra }}{% endif
              %}"
    apply_transition: &id007
      sequence:
      - variables:
          target_position: '{{ (drive_plan | default({})).target | default(101) |
            int }}'
          target_tilt_position: '{{ (drive_plan | default({})).target_tilt | default(101)
            | int }}'
          tilt_first: '{{ (drive_plan | default({})).tilt_first | default(false) }}'
          drive_action_set: '{{ (drive_plan | default({})).action_set | default('''')
            }}'
          drive_required: "{%- set plan = drive_plan | default({}) -%} {%- set move
            = plan.move | default('full') -%} {%- set target = plan.target | default(101)
            | int -%} {%- set target_tilt = plan.target_tilt | default(101) | int
            -%} {%- set position_relevant = move != 'tilt' and target != 101 -%} {%-
            set tilt_relevant = is_cover_tilt_enabled_and_possible and target_tilt
            != 101 -%} {%- set position_required = position_relevant and\n      (target
            - current_position) | abs > position_tolerance | int -%}\n{%- set tilt_required
            = tilt_relevant and\n      (target_tilt - current_tilt_position) | abs
            > tilt_position_tolerance | int -%}\n{{ plan.run | default(false) and\n
            \  (tilt_required if move == 'tilt' else position_required or tilt_required)
            }}"
          drive_dispatched: false
      - if: '{{ drive_required | default(false) }}'
        then:
        - if: '{{ (drive_plan | default({})).delay_s | default(0) | int > 0 }}'
          then:
          - delay:
              seconds: '{{ (drive_plan | default({})).delay_s | default(0) | int }}'
        - if:
          - "{{ not (force_pause != [] and states(force_pause) in ['on', 'true'])
            and\n   (instance_active == [] or states[instance_active] is none or\n
            \   states(instance_active) in instance_active_on_states) }}"
          then:
          - choose:
            - conditions: '{{ (drive_plan | default({})).move | default(''full'')
                == ''tilt'' }}'
              sequence:
              - *id004
            default:
            - *id005
      - alias: 'Cover logbook: one plain-word line about this decision'
        if: "{%- set plan = drive_plan | default({}) -%} {%- set target = plan.target
          | default(101) | int -%} {%- set target_tilt = plan.target_tilt | default(101)
          | int -%} {%- set tilt_relevant = is_cover_tilt_enabled_and_possible and
          target_tilt != 101 -%} {%- set at_position = target == 101 or (target -
          current_position) | abs <= position_tolerance | int -%} {%- set at_tilt
          = (not tilt_relevant) or (current_tilt_position - target_tilt) | abs <=
          tilt_position_tolerance | int -%} {%- set nothing_would_move = (target !=
          101 or tilt_relevant) and at_position and at_tilt -%} {{ enable_logbook_cover\n
          \  and (log_user is defined or\n        drive_required | default(plan.run
          | default(false)))\n   and not nothing_would_move }}"
        then:
        - repeat:
            for_each: '{{ blind_entities | list }}'
            sequence:
            - action: logbook.log
              data:
                name: Cover Control
                domain: cover
                entity_id: '{{ repeat.item if repeat is defined else '''' }}'
                message: "{%- set plan = drive_plan | default({}) -%} {%- set moved
                  = drive_dispatched | default(plan.run | default(false)) -%} {%-
                  set fallback = {'up': 'opening as scheduled', 'down': 'closing as
                  scheduled',\n                    'ventilate': 'ventilation', 'shading_start':
                  'sun shading',\n                    'shading_end': 'sun shading
                  is over'} -%}\n{%- set why = log_user | default(fallback.get(drive_action_set
                  | default(''), 'status update')) -%} {%- set force_word = (state_labels
                  | default({})).get(helper_state_force, helper_state_force) -%} {%-
                  set blocked = ' [force pause]' if is_paused\n                  else
                  ' [manual override]' if helper_state_manual\n                  else
                  ' [force: ' ~ force_word ~ ']' if helper_state_force != 'non'\n
                  \                 else '' -%}\n{%- set target = plan.target | default(101)
                  | int -%} {%- set target_tilt = plan.target_tilt | default(101)
                  | int -%} {%- set tilt_shown = is_cover_tilt_enabled_and_possible
                  and target_tilt != 101 -%} {%- if moved and plan.move | default('full')
                  == 'tilt' -%}\n  tilt to {{ target_tilt }}%\n{%- elif moved -%}\n
                  \ moved to {{ target }}%\n  {{- ' / tilt ' ~ target_tilt ~ '%' if
                  tilt_shown else '' -}}\n{%- else -%}\n  no movement{{ blocked }}\n{%-
                  endif %} · {{ why }}"
      - *id006
- if:
  - '{{ cover_status_helper != [] }}'
  - or:
    - '{{ states(cover_status_helper) in invalid_states }}'
    - '{{ not states(cover_status_helper) | regex_match("((\[[^\}]+)?\{\s*[^\}\{]{3,}?:.*\}([^\{]+\])?)")
      }}'
  then:
  - action: input_text.set_value
    data:
      entity_id: !input cover_status_helper
      value: "{% set ts_now = as_timestamp(now()) | round(0) %} {% set dict_new =
        {\n  'bas': 'opn',\n  'shd': 0,\n  'pnd': 'non',\n  'win': 'cls',\n  'frc':
        'non',\n  'res': 0,\n  'man': 0,\n  'ts': {\n    'opn': 0,\n    'cls': 0,\n
        \   'shd': 0,\n    'due': 0,\n    'arm': 0,\n    'man': 0\n  },\n  'v': 6,\n
        \ 't': ts_now | int,\n  'd': 0\n} %} {{ dict_new | to_json }}"
- variables:
    helper_repair: "{% if cover_status_helper == [] %}\n  non\n{% else %}\n  {% set
      helper_state = states(cover_status_helper) %}\n  {% set helper_raw = helper_state
      | from_json(default={}) if helper_state not in invalid_states else {} %}\n  {%
      set raw_ts = helper_raw.ts | default({}) %}\n  {% set known_ts_keys = ['opn',
      'cls', 'shd', 'due', 'arm', 'man'] %}\n  {% set has_unknown_ts = raw_ts.keys()
      | reject('in', known_ts_keys) | list | count > 0 %}\n  {% set stored_version
      = helper_raw.v | default(0) | int %}\n  {% set is_blank = helper_state in invalid_states
      or helper_state | trim == '' %}\n  {% if stored_version == 5 %}\n    migrated\n
      \ {% elif is_blank %}\n    initialised\n  {% elif helper_raw | count == 0 or
      stored_version != 6 %}\n    rebuilt\n  {% elif has_unknown_ts %}\n    cleaned\n
      \ {% else %}\n    non\n  {% endif %}\n{% endif %}"
- if:
  - '{{ helper_repair != ''non'' }}'
  then:
  - variables:
      update_values: {}
      log_extra: 'helper repair: {{ helper_repair }}'
  - *id006
  - variables:
      log_extra: ''
  - variables:
      repair_message: "{{ {'migrated': 'status format upgraded, nothing changes for
        you',\n    'initialised': 'status set up for the first time, this cover is
        now automated',\n    'rebuilt': 'the stored status was unreadable and had
        to be rebuilt - sun shading and manual override are cleared',\n    'cleaned':
        'leftovers from an older status format cleaned up, a waiting sun shading was
        dropped'}[helper_repair] }}"
  - action: logbook.log
    data:
      name: Cover Control
      entity_id: !input cover_status_helper
      message: '{{ repair_message }}'
  - if: '{{ enable_logbook_cover }}'
    then:
    - repeat:
        for_each: '{{ blind_entities | list }}'
        sequence:
        - action: logbook.log
          data:
            name: Cover Control
            domain: cover
            entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            message: '{{ repair_message }}'
- if:
  - '{{ is_shading_enabled }}'
  - '{{ forecast_source.use_weather and not forecast_source.prevent_service }}'
  - '{{ states(shading_forecast_sensor) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - '{{ trigger.id | regex_match(''^(t_shading_start|t_shading_end|t_open|t_calendar_event_start|t_recovery|t_instance_activated|t_force_disabled)'')
    or manual_reset_event or automation_resumed or instance_activated or midnight_reset_missed
    }}'
  then:
  - action: weather.get_forecasts
    target:
      entity_id: !input shading_forecast_sensor
    data:
      type: '{{ shading_forecast_type }}'
    response_variable: weather_forecast
    continue_on_error: true
  - if:
    - '{{ shading_start_condition_enabled.forecast_temp or shading_start_condition_enabled.forecast_weather
      or shading_end_condition_enabled.forecast_temp or shading_end_condition_enabled.forecast_weather
      }}'
    - "{{\n  weather_forecast is not defined or\n  shading_forecast_sensor not in
      weather_forecast or\n  (weather_forecast[shading_forecast_sensor].forecast |
      default([]) | count == 0)\n}}"
    then:
    - action: system_log.write
      data:
        level: warning
        logger: blueprints.hvorragend.cca
        message: 'Cover Control Automation ({{ friendly_name }}): weather.get_forecasts
          for {{ shading_forecast_sensor }} (type ''{{ shading_forecast_type }}'')
          returned an empty forecast - forecast-based shading conditions cannot be
          evaluated and will be treated as not met. The weather entity is available
          but provides no forecast data (often a temporary provider-side issue, e.g.
          Met.no rate-limiting). Verify by running weather.get_forecasts for this
          entity in Developer Tools - Actions. If this persists, reload the weather
          integration or use a different weather entity / a direct forecast temperature
          sensor.'
- if:
  - '{{ is_calendar_enabled }}'
  - '{{ calendar_entity != [] }}'
  - '{{ states(calendar_entity) not in invalid_states }}'
  - '{{ trigger.id is defined }}'
  - or:
    - '{{ trigger.id | regex_match(''^t_open'') }}'
    - '{{ trigger.id | regex_match(''^t_close'') }}'
    - '{{ trigger.id | regex_match(''^t_shading_start'') }}'
    - '{{ trigger.id | regex_match(''^t_shading_end'') }}'
    - '{{ trigger.id | regex_match(''^t_calendar_event'') }}'
    - '{{ trigger.id in [''t_recovery'', ''t_instance_activated''] or manual_reset_event
      or automation_resumed or instance_activated or midnight_reset_missed }}'
    - '{{ trigger.id == ''t_manual_position'' and (adopt_flags.opening or adopt_flags.closing)
      }}'
  then:
  - action: calendar.get_events
    target:
      entity_id: !input calendar_entity
    data:
      start_date_time: '{{ today_at(''00:00:00'').isoformat() }}'
      end_date_time: '{{ (today_at(''23:59:59'') + timedelta(seconds=1)).isoformat()
        }}'
    response_variable: calendar_events
    continue_on_error: true
- variables:
    window_opened_now: '{{ contact_window_opened != [] and states(contact_window_opened)
      in [''true'', ''on''] }}'
    window_tilted_now: '{{ contact_window_tilted != [] and states(contact_window_tilted)
      in [''true'', ''on''] }}'
    window_any_now: '{{ window_opened_now or window_tilted_now }}'
    lockout_now:
      closing: '{{ window_opened_now or (lockout_tilted_when_closing and window_tilted_now)
        }}'
      shading_start: '{{ window_opened_now or (lockout_tilted_when_shading_starts
        and window_tilted_now) }}'
      shading_end: '{{ window_opened_now or (lockout_tilted_when_shading_ends and
        window_tilted_now) }}'
    shading_once_guard_ok: '{{ not prevent_flags.shading_multiple_times or now().strftime(''%Y-%m-%d'')
      != helper_ts_shade | timestamp_custom(''%Y-%m-%d'') }}'
    drive_delay_standard: '{{ range(drive_delay_fix | int(0), drive_delay_fix | int(0)
      + drive_delay_random | int(0) + 1) | random }}'
    state_targets:
      lock:
        target: '{{ effective_lockout_position | int }}'
        target_tilt: '{{ open_tilt_position | int }}'
        action_set: ventilate
      opn:
        target: '{{ open_position | int }}'
        target_tilt: '{{ open_tilt_position | int }}'
        action_set: up
      vnt:
        target: '{{ ventilate_position | int }}'
        target_tilt: '{{ ventilate_tilt_position | int }}'
        action_set: ventilate
      shd:
        target: '{{ effective_shading_position | int }}'
        target_tilt: '{{ shading_tilt_position | int }}'
        action_set: shading_start
      cls:
        target: '{{ close_position | int }}'
        target_tilt: '{{ close_tilt_position | int }}'
        action_set: down
    state_gates:
      lock: '{{ not is_paused and live_force == ''non'' and effective_state == ''lock''
        and not in_lockout_position }}'
      opn: '{{ not is_paused and force_allows_open and (effective_state != ''opn''
        or not in_open_position) }}'
      vnt: '{{ not is_paused and force_allows_ventilate and (effective_state != ''vnt''
        or not in_ventilate_position) }}'
      shd: '{{ not is_paused and force_allows_shade and (effective_state != ''shd''
        or not in_shading_position) }}'
      cls: '{{ not is_paused and force_allows_close and (effective_state != ''cls''
        or not in_close_position) }}'
    state_labels:
      lock: fully open (window open)
      opn: open
      vnt: ventilation position
      shd: sun shading position
      cls: closed
      non: no change
    forecast_temp_raw: "{% set sensor = shading_forecast_temp_sensor %} {% set weather
      = shading_forecast_sensor %} {% if sensor != [] and states(sensor) not in invalid_states
      %}\n  {{ states(sensor) | float(default=None) }}\n{% elif weather == [] or states(weather)
      in invalid_states %}\n  {{ None }}\n{% elif 'weather_attributes' in shading_forecast_type
      %}\n  {{ state_attr(weather, 'temperature') | float(default=None) }}\n{% elif
      weather_forecast is defined and weather in weather_forecast %}\n  {{ weather_forecast[weather].forecast[0].temperature
      | default(None) | float(default=None) }}\n{% else %}\n  {{ None }}\n{% endif
      %}"
    forecast_weather_condition_raw: "{% set weather = shading_forecast_sensor %} {%
      if weather == [] or states(weather) in invalid_states %}\n  {{ None }}\n{% elif
      'weather_attributes' in shading_forecast_type %}\n  {{ states(weather) }}\n{%
      elif weather_forecast is defined and weather in weather_forecast %}\n  {{ weather_forecast[weather].forecast[0].condition
      | default(None) }}\n{% else %}\n  {{ None }}\n{% endif %}"
    diag_forecast_weather_attribute_mode: "{% if forecast_source.prevent_service %}\n
      \ {{\n    {\n      'attribute_value': forecast_weather_condition_raw,\n      'in_configured_list':
      (forecast_weather_condition_raw in shading_weather_conditions)\n                            if
      forecast_weather_condition_raw is not none else none,\n      'configured_list':
      shading_weather_conditions\n    }\n  }}\n{% endif %}"
    shading_start_condition_states:
      azimuth_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.azimuth
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_azimuth | float(default=0)
        > shading_azimuth_start and\n    current_sun_azimuth | float(default=0) <
        shading_azimuth_end\n  )\n}}"
      elevation_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.elevation
        or\n  default_sun_sensor == [] or\n  (\n    current_sun_elevation | float(default=0)
        > shading_elevation_min and\n    current_sun_elevation | float(default=0)
        < shading_elevation_max\n  )\n}}"
      brightness_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.brightness
        or\n  shading_brightness_sensor == [] or\n  (\n    states(shading_brightness_sensor)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_2'\n
        \ ) or\n  (\n    states(shading_brightness_sensor) not in invalid_states and\n
        \   states(shading_brightness_sensor) | float(default=shading_sun_brightness_start)
        > (shading_sun_brightness_start + shading_sun_brightness_hysteresis)\n  )\n}}"
      temp1_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp1
        or\n  shading_temperatur_sensor1 == [] or\n  (\n    states(shading_temperatur_sensor1)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_3'\n
        \ ) or\n  (\n    states(shading_temperatur_sensor1) not in invalid_states
        and\n    states(shading_temperatur_sensor1) | float(default=shading_min_temperatur1)
        > (shading_min_temperatur1 + shading_temperature_hysteresis1)\n  )\n}}"
      temp2_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.temp2
        or\n  shading_temperatur_sensor2 == [] or\n  (\n    states(shading_temperatur_sensor2)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_4'\n
        \ ) or\n  (\n    states(shading_temperatur_sensor2) not in invalid_states
        and\n    states(shading_temperatur_sensor2) | float(default=shading_min_temperatur2)
        > (shading_min_temperatur2 + shading_temperature_hysteresis2)\n  )\n}}"
      forecast_temp_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_temp
        or\n  shading_forecast_temp == [] or\n  (\n    forecast_temp_raw is not none
        and\n    forecast_temp_raw > (shading_forecast_temp + shading_forecast_temp_hysteresis)\n
        \ ) or\n  (\n    'shading_compare_forecast_with_sensor2' in shading_config
        and\n    shading_temperatur_sensor2 != [] and\n    shading_forecast_temp !=
        [] and\n    (states(shading_temperatur_sensor2) | float(default=0) > (shading_forecast_temp
        + shading_forecast_temp_hysteresis))\n  )\n}}"
      independent_temp_valid: "{{\n  not is_shading_enabled or\n  shading_independent_temp
        == [] or\n  (\n    forecast_temp_raw is not none and\n    forecast_temp_raw
        > (shading_independent_temp + shading_forecast_temp_hysteresis)\n  ) or\n
        \ (\n    'shading_compare_forecast_with_sensor2' in shading_config and\n    shading_temperatur_sensor2
        != [] and\n    (states(shading_temperatur_sensor2) | float(default=0) > (shading_independent_temp
        + shading_forecast_temp_hysteresis))\n  )\n}}"
      forecast_weather_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.forecast_weather
        or\n  shading_weather_conditions == [] or\n  forecast_source.use_sensor or\n
        \ (\n    forecast_weather_condition_raw is not none and\n    forecast_weather_condition_raw
        not in invalid_states and\n    forecast_weather_condition_raw in shading_weather_conditions\n
        \ )\n}}"
      custom_valid: "{{\n  not is_shading_enabled or\n  not shading_start_condition_enabled.custom
        or\n  shading_custom_sensor == [] or\n  (\n    states(shading_custom_sensor)
        in invalid_states and\n    trigger is defined and trigger.id == 't_shading_start_pending_8'\n
        \ ) or\n  (\n    states(shading_custom_sensor) not in invalid_states and\n
        \   states(shading_custom_sensor) in ['on', 'true']\n  )\n}}"
    shading_start_and_result: "{{\n  (\n    ('cond_azimuth' not in shading_conditions_start_and
      or\n    default_sun_sensor == [] or\n    shading_start_condition_states.azimuth_valid)\n
      \   and\n    ('cond_elevation' not in shading_conditions_start_and or\n    default_sun_sensor
      == [] or\n    shading_start_condition_states.elevation_valid)\n    and\n    ('cond_brightness'
      not in shading_conditions_start_and or\n    shading_brightness_sensor == []
      or\n    shading_start_condition_states.brightness_valid)\n    and\n    ('cond_temp1'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor1 == []
      or\n    shading_start_condition_states.temp1_valid)\n    and\n    ('cond_temp2'
      not in shading_conditions_start_and or\n    shading_temperatur_sensor2 == []
      or\n    shading_start_condition_states.temp2_valid)\n    and\n    ('cond_forecast_temp'
      not in shading_conditions_start_and or\n    shading_forecast_temp == [] or\n
      \   shading_start_condition_states.forecast_temp_valid)\n    and\n    ('cond_forecast_weather'
      not in shading_conditions_start_and or\n    shading_weather_conditions == []
      or\n    shading_start_condition_states.forecast_weather_valid)\n    and\n    ('cond_custom'
      not in shading_conditions_start_and or\n    shading_custom_sensor == [] or\n
      \   shading_start_condition_states.custom_valid)\n  )\n}}"
    shading_start_or_result: "{{\n  (shading_conditions_start_or | count == 0) or\n
      \ (\n    ('cond_azimuth' in shading_conditions_start_or and\n    default_sun_sensor
      != [] and\n    shading_start_condition_states.azimuth_valid)\n    or\n    ('cond_elevation'
      in shading_conditions_start_or and\n    default_sun_sensor != [] and\n    shading_start_condition_states.elevation_valid)\n
      \   or\n    ('cond_brightness' in shading_conditions_start_or and\n    shading_brightness_sensor
      != [] and\n    shading_start_condition_states.brightness_valid)\n    or\n    ('cond_temp1'
      in shading_conditions_start_or and\n    shading_temperatur_sensor1 != [] and\n
      \   shading_start_condition_states.temp1_valid)\n    or\n    ('cond_temp2' in
      shading_conditions_start_or and\n    shading_temperatur_sensor2 != [] and\n
      \   shading_start_condition_states.temp2_valid)\n    or\n    ('cond_forecast_temp'
      in shading_conditions_start_or and\n    shading_forecast_temp != [] and\n    shading_start_condition_states.forecast_temp_valid)\n
      \   or\n    ('cond_forecast_weather' in shading_conditions_start_or and\n    shading_weather_conditions
      != [] and\n    shading_start_condition_states.forecast_weather_valid)\n    or\n
      \   ('cond_custom' in shading_conditions_start_or and\n    shading_custom_sensor
      != [] and\n    shading_start_condition_states.custom_valid)\n  )\n}}"
    shading_start_conditions_met: "{{\n  is_shading_enabled and\n  shading_start_and_result
      and\n  shading_start_or_result\n}}"
    shading_start_warranted: "{{\n  shading_start_conditions_met or\n  ('shading_temp_comparison_independent'
      in shading_config and\n   shading_start_condition_states.independent_temp_valid)\n}}"
    shading_end_condition_states:
      azimuth_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.azimuth
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_azimuth | float(default=999)
        <= shading_azimuth_start or\n    current_sun_azimuth | float(default=0) >=
        shading_azimuth_end\n  )\n}}"
      elevation_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.elevation
        and\n  default_sun_sensor != [] and\n  (\n    current_sun_elevation | float(default=999)
        <= shading_elevation_min or\n    current_sun_elevation | float(default=0)
        >= shading_elevation_max\n  )\n}}"
      brightness_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.brightness
        and\n  shading_brightness_sensor != [] and\n  states(shading_brightness_sensor)
        not in invalid_states and\n  states(shading_brightness_sensor) | float(default=999999)
        < (shading_sun_brightness_end - shading_sun_brightness_hysteresis)\n}}"
      temp1_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp1
        and\n  shading_temperatur_sensor1 != [] and\n  states(shading_temperatur_sensor1)
        not in invalid_states and\n  states(shading_temperatur_sensor1) | float(default=999)
        < (shading_min_temperatur1 - shading_temperature_hysteresis1)\n}}"
      temp2_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.temp2
        and\n  shading_temperatur_sensor2 != [] and\n  states(shading_temperatur_sensor2)
        not in invalid_states and\n  states(shading_temperatur_sensor2) | float(default=999)
        < (shading_min_temperatur2 - shading_temperature_hysteresis2)\n}}"
      forecast_temp_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_temp
        and\n  shading_forecast_temp != [] and\n  forecast_temp_raw is not none and\n
        \ forecast_temp_raw < (shading_forecast_temp - shading_forecast_temp_hysteresis)\n}}"
      forecast_weather_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.forecast_weather
        and\n  shading_weather_conditions != [] and\n  shading_forecast_sensor !=
        [] and\n  forecast_weather_condition_raw is not none and\n  forecast_weather_condition_raw
        not in invalid_states and\n  forecast_weather_condition_raw not in shading_weather_conditions\n}}"
      custom_invalid: "{{\n  is_shading_enabled and\n  shading_end_condition_enabled.custom
        and\n  shading_custom_sensor != [] and\n  states(shading_custom_sensor) not
        in invalid_states and\n  states(shading_custom_sensor) in ['off', 'false']\n}}"
    shading_end_and_result: "{{\n  shading_conditions_end_and | count > 0 and\n  (\n
      \   ('cond_azimuth' not in shading_conditions_end_and or\n    default_sun_sensor
      == [] or\n    shading_end_condition_states.azimuth_invalid)\n    and\n    ('cond_elevation'
      not in shading_conditions_end_and or\n    default_sun_sensor == [] or\n    shading_end_condition_states.elevation_invalid)\n
      \   and\n    ('cond_brightness' not in shading_conditions_end_and or\n    shading_brightness_sensor
      == [] or\n    shading_end_condition_states.brightness_invalid)\n    and\n    ('cond_temp1'
      not in shading_conditions_end_and or\n    shading_temperatur_sensor1 == [] or\n
      \   shading_end_condition_states.temp1_invalid)\n    and\n    ('cond_temp2'
      not in shading_conditions_end_and or\n    shading_temperatur_sensor2 == [] or\n
      \   shading_end_condition_states.temp2_invalid)\n    and\n    ('cond_forecast_temp'
      not in shading_conditions_end_and or\n    shading_forecast_temp == [] or\n    shading_end_condition_states.forecast_temp_invalid)\n
      \   and\n    ('cond_forecast_weather' not in shading_conditions_end_and or\n
      \   shading_weather_conditions == [] or\n    shading_end_condition_states.forecast_weather_invalid)\n
      \   and\n    ('cond_custom' not in shading_conditions_end_and or\n    shading_custom_sensor
      == [] or\n    shading_end_condition_states.custom_invalid)\n  )\n}}"
    shading_end_or_result: "{{\n  shading_conditions_end_or | count > 0 and\n  (\n
      \   ('cond_azimuth' in shading_conditions_end_or and\n    shading_end_condition_states.azimuth_invalid)\n
      \   or\n    ('cond_elevation' in shading_conditions_end_or and\n    shading_end_condition_states.elevation_invalid)\n
      \   or\n    ('cond_brightness' in shading_conditions_end_or and\n    shading_end_condition_states.brightness_invalid)\n
      \   or\n    ('cond_temp1' in shading_conditions_end_or and\n    shading_end_condition_states.temp1_invalid)\n
      \   or\n    ('cond_temp2' in shading_conditions_end_or and\n    shading_end_condition_states.temp2_invalid)\n
      \   or\n    ('cond_forecast_temp' in shading_conditions_end_or and\n    shading_end_condition_states.forecast_temp_invalid)\n
      \   or\n    ('cond_forecast_weather' in shading_conditions_end_or and\n    shading_end_condition_states.forecast_weather_invalid)\n
      \   or\n    ('cond_custom' in shading_conditions_end_or and\n    shading_end_condition_states.custom_invalid)\n
      \ )\n}}"
    independent_shading_holds: "{{\n  'shading_independent_holds_end' in shading_config
      and\n  'shading_temp_comparison_independent' in shading_config and\n  shading_independent_temp
      != [] and\n  (\n    (\n      forecast_temp_raw is not none and\n      forecast_temp_raw
      > (shading_independent_temp - shading_forecast_temp_hysteresis)\n    ) or\n
      \   (\n      'shading_compare_forecast_with_sensor2' in shading_config and\n
      \     shading_temperatur_sensor2 != [] and\n      states(shading_temperatur_sensor2)
      not in invalid_states and\n      (states(shading_temperatur_sensor2) | float(default=0)
      > (shading_independent_temp - shading_forecast_temp_hysteresis))\n    )\n  )\n}}"
    shading_end_conditions_met: "{{\n  is_shading_enabled and\n  not independent_shading_holds
      and\n  (\n    shading_end_and_result or\n    shading_end_or_result\n  )\n}}"
    calendar_open_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_open_title_lc != '' and
      calendar_open_title_lc == summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    calendar_close_event: "{% set result = namespace(found=false, start=none, end=none)
      %} {% if is_calendar_enabled and calendar_events is defined and calendar_entity
      in calendar_events %}\n  {% set events = calendar_events[calendar_entity].events
      | default([]) %}\n  {% for event in events %}\n    {% set summary = (event.summary
      | default('')) | lower | trim %}\n    {% if calendar_close_title_lc != '' and
      calendar_close_title_lc == summary %}\n      {% set result.found = true %}\n
      \     {% set result.start = event.start %}\n      {% set result.end = event.end
      %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ {\n  'found': result.found,\n
      \ 'start': result.start,\n  'end': result.end\n} }}"
    now_ts: '{{ as_timestamp(now()) }}'
    calendar_open_start: "{% if calendar_open_event.found and calendar_open_event.start
      is not none %}\n  {{ as_timestamp(calendar_open_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_open_end: "{% if calendar_open_event.found and calendar_open_event.end
      is not none %}\n  {{ as_timestamp(calendar_open_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_start: "{% if calendar_close_event.found and calendar_close_event.start
      is not none %}\n  {{ as_timestamp(calendar_close_event.start) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    calendar_close_end: "{% if calendar_close_event.found and calendar_close_event.end
      is not none %}\n  {{ as_timestamp(calendar_close_event.end) }}\n{% else %}\n
      \ {{ none }}\n{% endif %}"
    is_opening_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_early_today)
      and\n    now() < today_at(time_up_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_start is not none and\n    calendar_open_end is not none
      and\n    now_ts >= calendar_open_start and\n    now_ts < calendar_open_end\n
      \ )\n}}"
    is_daytime_phase: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() < today_at(time_down_early_today))
      or\n  (\n    is_calendar_enabled and\n    calendar_open_start is not none and\n
      \   calendar_close_start is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts < calendar_close_start)\n}}"
    is_closing_phase: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_early_today)
      and\n    now() < today_at(time_down_late_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_close_start is not none and\n    calendar_close_end is not
      none and\n    now_ts >= calendar_close_start and\n    now_ts < calendar_close_end\n
      \ )\n}}"
    is_evening_phase: "{{\n  not is_time_control_disabled and\n  (\n    (\n      is_time_field_enabled
      and\n      now() >= today_at(time_down_early_today)\n    ) or\n    (\n      is_calendar_enabled
      and\n      calendar_close_start is not none and\n      now_ts >= calendar_close_start\n
      \   )\n  )\n}}"
    is_time_up_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_up_late_today)
      and\n    now() < today_at(time_down_early_today)\n  ) or\n  (\n    is_calendar_enabled
      and\n    calendar_open_end is not none and\n    calendar_close_start is not
      none and\n    now_ts >= calendar_open_end and\n    now_ts < calendar_close_start\n
      \ )\n}}"
    is_time_down_late: "{{\n  (\n    is_time_field_enabled and\n    now() >= today_at(time_down_late_today)\n
      \ ) or\n  (\n    is_calendar_enabled and\n    calendar_close_end is not none
      and\n    now_ts >= calendar_close_end\n  )\n}}"
    is_shading_allowed_window: "{{\n  is_time_control_disabled or\n  (\n    is_time_field_enabled
      and\n    now() >= today_at(time_up_early_today) and\n    now() <= today_at(time_down_late_today)
      + timedelta(seconds = 5)\n  ) or\n  (\n    is_calendar_enabled and\n    calendar_open_start
      is not none and\n    calendar_close_end is not none and\n    now_ts >= calendar_open_start
      and\n    now_ts <= calendar_close_end\n  )\n}}"
    environment_allows_opening: "{%- set brightness_ok = (\n  default_brightness_sensor
      == [] or\n  states(default_brightness_sensor) | float(default=brightness_up)
      > (brightness_up + brightness_hysteresis)\n) -%} {%- set sun_ok = (\n  default_sun_sensor
      == [] or\n  current_sun_elevation | float(default=sun_elevation_up_current)
      > sun_elevation_up_current\n) -%} {%- if is_brightness_enabled and is_sun_elevation_enabled
      -%}\n  {{ (brightness_ok and sun_ok) if use_and_operator else (brightness_ok
      or sun_ok) }}\n{%- elif is_brightness_enabled -%}\n  {{ brightness_ok }}\n{%-
      elif is_sun_elevation_enabled -%}\n  {{ sun_ok }}\n{%- else -%}\n  true\n{%-
      endif -%}"
    environment_allows_closing: "{%- set brightness_close = (\n  default_brightness_sensor
      == [] or\n  states(default_brightness_sensor) | float(default=brightness_down)
      < (brightness_down - brightness_hysteresis)\n) -%} {%- set sun_close = (\n  default_sun_sensor
      == [] or\n  current_sun_elevation | float(default=sun_elevation_down_current)
      < sun_elevation_down_current\n) -%} {%- if is_brightness_enabled and is_sun_elevation_enabled
      -%}\n  {{ (brightness_close and sun_close) if use_and_operator else (brightness_close
      or sun_close) }}\n{%- elif is_brightness_enabled -%}\n  {{ brightness_close
      }}\n{%- elif is_sun_elevation_enabled -%}\n  {{ sun_close }}\n{%- else -%}\n
      \ true\n{%- endif -%}"
    should_be_open_now: "{{\n  is_daytime_phase and\n  not is_evening_phase and\n
      \ (\n    (not is_brightness_enabled and not is_sun_elevation_enabled) or\n    environment_allows_opening\n
      \ )\n}}"
    should_be_closed_now: "{{\n  is_evening_phase and\n  (\n    (not is_brightness_enabled
      and not is_sun_elevation_enabled) or\n    environment_allows_closing\n  )\n}}"
    base_gates:
      opening:
        override_ok: '{{ not override_blocks.opening }}'
        once_ok: "{{ not prevent_flags.opening_multiple_times or\n   (now().strftime('%Y-%m-%d')
          != helper_ts_open | timestamp_custom('%Y-%m-%d')) or\n   helper_ts_man <=
          helper_ts_open }}"
        schedule_ok: "{{ is_time_control_disabled or\n   is_time_up_late or\n   (\n
          \    (is_opening_phase or is_daytime_phase) and\n     not is_evening_phase
          and\n     environment_allows_opening\n   ) }}"
      closing:
        override_ok: '{{ not override_blocks.closing }}'
        once_ok: "{{ not prevent_flags.closing_multiple_times or\n   (helper_ts_close
          < today_at(time_down_early_today) | as_timestamp) or\n   helper_ts_man <=
          helper_ts_close }}"
        schedule_ok: "{{ is_time_control_disabled or\n   is_time_down_late or\n   (\n
          \    (is_closing_phase or is_evening_phase) and\n     environment_allows_closing\n
          \  ) }}"
    closing_target_owned: "{{ is_closing_scheduled or\n   (state_resident and (resident_flags.closing_trigger
      or\n                        'resident_allow_opening' not in resident_config))
      }}"
    closing_position_hold: "{{ (prevent_flags.lowering_when_closing_if_shaded and\n
      \   (helper_state_is_shaded or in_shading_position) and\n    not position_comparisons.shading_above_close)
      or\n   (prevent_flags.higher_position_closing and\n    (position_comparisons.current_below_close
      or current_position == close_position)) }}"
- variables:
    missing_entities: "{% set ns = namespace(gone=[]) %} {% for entity in configured_entities
      if states[entity] is none %}\n  {% set ns.gone = ns.gone + [entity] %}\n{% endfor
      %} {{ ns.gone }}"
    missing_critical: "{% set ns = namespace(gone=[]) %} {% for entity in critical_entities
      if states[entity] is none %}\n  {% set ns.gone = ns.gone + [entity] %}\n{% endfor
      %} {{ ns.gone }}"
    missing_contacts: "{% set ns = namespace(gone=[]) %} {% for entity in [contact_window_opened,
      contact_window_tilted]\n     if entity != [] and states[entity] is none %}\n
      \ {% set ns.gone = ns.gone + [entity] %}\n{% endfor %} {{ ns.gone }}"
- alias: Configured entity is disabled or deleted
  if:
  - '{{ missing_entities | count > 0 }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): CONFIGURATION ERROR
        - configured {{ ''entity is'' if missing_entities | count == 1 else ''entities
        are'' }} disabled or deleted: {{ missing_entities | join('', '') }}. A disabled
        entity is not an outage - it never comes back, so CCA cannot fall back to
        a last known value and no recovery can correct it. Re-enable it, or remove
        it from the automation settings so CCA stops expecting it. {%- if missing_critical
        | count > 0 %} Without {{ missing_critical | join('', '') }} there is no cover
        position to decide from, so every run of this automation stops here until
        you fix it. {%- endif %} {%- if instance_active in missing_entities %} The
        switch that decides when this automation is in charge is gone, so CCA can
        no longer tell whether it owns this cover - and a second CCA automation may.
        It stops here rather than risk two automations driving the same cover against
        each other. {%- endif %} {%- if missing_contacts | count > 0 %} Window contact
        {{ missing_contacts | join('', '') }} is gone, so CCA can no longer see whether
        the window is open. The last known window state is ''{{ helper_state_window
        }}''{% if helper_state_window != ''cls'' %}, which is not closed - the cover
        therefore STAYS WHERE IT IS and no longer follows the schedule: the lockout
        protection must not lower a cover onto a window it cannot see. Close the window
        (a working contact would report it), re-enable the contact, or remove it from
        the automation settings if you want CCA to ignore this window for now - that
        also turns OFF the lockout protection for it{% else %}, so CCA keeps running
        - but the lockout protection for this window is DEAD: a gone contact can never
        report an opening, so the cover will close on the schedule even while the
        window stands open{% endif %}. {%- endif %}'
      level: '{{ ''error'' if missing_critical | count > 0 or instance_active in missing_entities
        else ''warning'' }}'
      logger: blueprints.hvorragend.cca
  - if: '{{ missing_critical | count > 0 or cover_status_helper in missing_entities
      or instance_active in missing_entities }}'
    then:
    - repeat:
        for_each: '{{ blind_entities | list }}'
        sequence:
        - action: logbook.log
          data:
            name: Cover Control
            domain: cover
            entity_id: '{{ repeat.item if repeat is defined else '''' }}'
            message: ❌ stopped - {{ (missing_critical + ([cover_status_helper] if
              cover_status_helper in missing_entities else []) + ([instance_active]
              if instance_active in missing_entities else [])) | join(', ') }} is
              switched off or deleted. This cover is not being controlled until the
              entity is back or removed from the automation settings.
    - stop: 'Configuration error: state-critical entity disabled or deleted ({{ (missing_critical
        + ([cover_status_helper] if cover_status_helper in missing_entities else [])
        + ([instance_active] if instance_active in missing_entities else [])) | join('',
        '') }})'
- alias: Cover Status Helper is not configured
  if:
  - '{{ cover_status_helper == [] }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): CONFIGURATION ERROR
        - Cover Status Helper is required but not configured. Please configure a Cover
        Status Helper (input_text entity) in the automation settings.'
      level: error
  - repeat:
      for_each: '{{ blind_entities | list }}'
      sequence:
      - action: logbook.log
        data:
          name: Cover Control
          domain: cover
          entity_id: '{{ repeat.item if repeat is defined else '''' }}'
          message: ❌ stopped - no status helper is configured. This cover is not being
            controlled until one is set in the automation settings.
  - stop: Missing Cover Status Helper configuration
- alias: Cover Status Helper max length too small
  if:
  - '{{ check_status_helper_length is not none and check_status_helper_length | int
    < 225 }}'
  then:
  - action: system_log.write
    data:
      message: 'Cover Control Automation ({{ friendly_name }}): CRITICAL CONFIGURATION
        ERROR - Cover Status Helper max length is {{ check_status_helper_length }}
        characters but at least 225 are required (recommended: 254). Helper: {{ cover_status_helper
        }} The automation cannot persist state with the current max length. Increase
        the ''Maximum length'' setting of the input_text helper.'
      level: error
  - repeat:
      for_each: '{{ blind_entities | list }}'
      sequence:
      - action: logbook.log
        data:
          name: Cover Control
          domain: cover
          entity_id: '{{ repeat.item if repeat is defined else '''' }}'
          message: ❌ stopped - the status helper can only hold {{ check_status_helper_length
            }} characters, at least 225 are needed. Raise its maximum length to 254
            in the helper settings.
  - stop: Cover Status Helper max length too small
- alias: Calendar trigger relevance check
  if:
  - '{{ trigger.id is defined and trigger.id | regex_match(''^t_calendar_event'')
    }}'
  - condition: template
    value_template: "{% set flip_to = as_timestamp(trigger.to_state.last_changed)
      %} {% set flip_from = as_timestamp(trigger.from_state.last_changed) if trigger.from_state
      is not none else 0 %} {% set boundaries = [calendar_open_start, calendar_open_end,
      calendar_close_start, calendar_close_end] %} {% set ns = namespace(relevant=false)
      %} {% for b in boundaries %}\n  {% if b is not none and (b | float(0)) > flip_from
      and (b | float(0)) <= flip_to + 60 %}\n    {% set ns.relevant = true %}\n  {%
      endif %}\n{% endfor %} {{ not ns.relevant }}"
  then:
  - stop: 'Calendar trigger ignored: No configured open/close event starts or ends
      at this calendar state change'
- alias: Recovery after restart or outage - restore target state
  if:
  - '{{ trigger.id is defined }}'
  - '{{ trigger.id in [''t_recovery'', ''t_instance_activated''] or manual_reset_event
    or ((automation_resumed or instance_activated or midnight_reset_missed) and trigger.id
    not in [''t_manual_position'', ''t_manual_tilt'']) }}'
  then:
  - variables:
      recovered_shade: '{{ helper_state_shade and not stale_day }}'
      recovered_base: "{% if is_time_control_disabled %}{{ helper_state_base }} {%
        elif is_evening_phase %}cls {% elif is_daytime_phase %}opn {% elif (is_time_field_enabled
        and now() < today_at(time_up_early_today)) or\n     (is_calendar_enabled and
        calendar_open_start is not none and now_ts < calendar_open_start) %}cls\n{%
        else %}{{ helper_state_base }}{% endif %}"
      recovered_window: '{% set s_opn = is_ventilation_enabled and contact_window_opened
        != [] and states(contact_window_opened) in [''true'', ''on''] %} {% set s_tlt
        = is_ventilation_enabled and contact_window_tilted != [] and states(contact_window_tilted)
        in [''true'', ''on''] %} {{ ''opn'' if s_opn else ''tlt'' if s_tlt else helper_state_window
        if (contact_window_opened == [] and contact_window_tilted == []) else ''cls''
        }}'
  - alias: 'Recovery: the user''s ventilation condition decides the ventilation floor'
    choose:
    - alias: 'Recovery: ventilation floor allowed'
      conditions:
      - &id011
        condition: !input auto_ventilate_condition
      sequence:
      - variables:
          recovered_vent_ok: true
      - &id009
        alias: 'Recovery: apply the additional condition to a caught-up base flip'
        choose:
        - alias: 'Recovery: catching up an opening'
          conditions:
          - '{{ recovery_catch_up and recovered_base == ''opn'' and helper_state_base
            != ''opn'' }}'
          - '{{ base_gates.opening.schedule_ok }}'
          - '{{ base_gates.opening.once_ok }}'
          - &id010
            condition: !input auto_up_condition
          sequence:
          - variables:
              new_base: opn
          - alias: 'Recovery: reconcile the cascade and drive'
            choose: []
            default: &id008
            - variables:
                caught_up_closing: '{{ new_base == ''cls'' and helper_state_base !=
                  ''cls'' }}'
                caught_up_opening: '{{ new_base == ''opn'' and helper_state_base !=
                  ''opn'' }}'
            - variables:
                recovered_cascade_window: '{{ ''cls'' if caught_up_closing and recovered_window
                  == ''tlt'' and not recovered_vent_ok else recovered_window }}'
                recovered_state: "{% if live_force != 'non' %}\n  {{ live_force }}\n{%
                  elif recovered_cascade_window == 'opn' %}\n  lock\n{% else %}\n
                  \ {% if state_resident and resident_flags.closing_trigger %}\n    {%
                  set base_target = 'cls' %}\n  {% elif recovered_shade and resident_flags.allow_shade
                  %}\n    {% set base_target = 'shd' %}\n  {% elif new_base == 'opn'
                  and not resident_flags.allow_open %}\n    {% set base_target = 'cls'
                  %}\n  {% else %}\n    {% set base_target = new_base %}\n  {% endif
                  %}\n  {% if recovered_cascade_window == 'tlt' and resident_flags.allow_ventilate
                  and not (base_target == 'opn' and is_opening_scheduled) and not
                  (base_target == 'shd' and shading_over_ventilation) %}\n    vnt\n
                  \ {% else %}\n    {{ base_target }}\n  {% endif %}\n{% endif %}"
                pending_is_stale: "{{ helper_state_pending != 'non' and\n   (stale_day
                  or helper_ts_pending_due <= as_timestamp(now()) | round(0)) }}"
            - variables:
                recovered_pending: "{% if not recovery_catch_up or not is_shading_enabled
                  or (helper_state_pending != 'non' and not pending_is_stale) %}\n
                  \ non\n{% elif not recovered_shade and shading_start_warranted and
                  shading_once_guard_ok %}\n  beg\n{% elif recovered_shade and shading_end_conditions_met
                  %}\n  end\n{% else %}\n  non\n{% endif %}"
            - variables:
                recovered_due: "{% if recovered_pending == 'beg' %}\n  {% set wait_due
                  = (as_timestamp(now()) + shading_waitingtime_start | int) | int
                  %}\n  {% if is_time_control_disabled or is_shading_allowed_window
                  %}\n    {{ wait_due }}\n  {% elif is_time_field_enabled %}\n    {{
                  [wait_due, as_timestamp(today_at(time_up_early_today)) | int + 1]
                  | max }}\n  {% elif is_calendar_enabled and calendar_open_start
                  is not none %}\n    {{ [wait_due, calendar_open_start | int + 1]
                  | max }}\n  {% else %}\n    {{ wait_due }}\n  {% endif %}\n{% elif
                  recovered_pending == 'end' %}\n  {{ (as_timestamp(now()) + shading_waitingtime_end
                  | int) | int }}\n{% elif pending_is_stale or caught_up_closing %}\n
                  \ 0\n{% else %}\n  {{ helper_ts_pending_due }}\n{% endif %}"
                recovered_arm: "{% if recovered_pending == 'beg' %}\n  {% set ts =
                  as_timestamp(now()) | int %}\n  {% if is_time_control_disabled or
                  is_shading_allowed_window %}\n    {{ ts }}\n  {% elif is_time_field_enabled
                  %}\n    {{ [ts, as_timestamp(today_at(time_up_early_today)) | int]
                  | max }}\n  {% elif is_calendar_enabled and calendar_open_start
                  is not none %}\n    {{ [ts, calendar_open_start | int] | max }}\n
                  \ {% else %}\n    {{ ts }}\n  {% endif %}\n{% elif recovered_pending
                  == 'end' %}\n  {{ as_timestamp(now()) | int }}\n{% elif pending_is_stale
                  or caught_up_closing %}\n  0\n{% else %}\n  {{ helper_ts_pending_arm
                  }}\n{% endif %}"
                lockout_blocks_shading: "{{ is_ventilation_enabled and\n   (recovered_window
                  == 'opn' or\n    (lockout_tilted_when_shading_starts and recovered_window
                  == 'tlt')) }}"
            - variables:
                new_pending: '{{ recovered_pending if recovered_pending != ''non''
                  else (''non'' if pending_is_stale or caught_up_closing else helper_state_pending)
                  }}'
                defer_to_shading: '{{ recovered_pending == ''beg'' and recovered_state
                  == ''opn'' and not lockout_blocks_shading }}'
                defer_to_shading_end: "{{ recovered_pending == 'end' and recovered_state
                  == 'shd' and\n   live_force == 'non' }}"
                target_position: '{{ state_targets[recovered_state].target | int }}'
                target_tilt_position: '{{ state_targets[recovered_state].target_tilt
                  | int }}'
            - variables:
                manual_holds_reposition: "{{ helper_state_manual and not override_expired
                  and\n   not (caught_up_closing or caught_up_opening) and\n   recovered_state
                  != 'lock' }}"
                recovery_vent_condition_hold: '{{ recovered_state in [''lock'', ''vnt'']
                  and not recovered_vent_ok }}'
                recovery_allowed: "{{ not defer_to_shading and\n   not defer_to_shading_end
                  and\n   not manual_holds_reposition and\n   (force_allows_ventilate
                  if recovered_state in ['lock', 'vnt']\n    else force_allows_open
                  if recovered_state == 'opn'\n    else force_allows_shade if recovered_state
                  == 'shd'\n    else force_allows_close) }}"
                caught_up_closing_hold: "{{ caught_up_closing and (\n     (recovered_state
                  == 'cls' and closing_position_hold) or\n     (is_ventilation_enabled
                  and lockout_tilted_when_closing and recovered_window == 'tlt') or\n
                  \    (recovered_state == 'vnt' and not is_down_enabled and live_force
                  == 'non')) }}"
                caught_up_opening_hold: "{{ caught_up_opening and recovered_state
                  == 'opn' and\n   not is_up_enabled and live_force == 'non' }}"
                transition_manual_allows: "{{ true if override_expired or recovered_state
                  == 'lock' or live_force != 'non'\n   else base_gates.opening.override_ok
                  if caught_up_opening\n   else base_gates.closing.override_ok if
                  caught_up_closing\n   else true }}"
                manual_reset_recovery_hold: "{{ manual_reset_event and (\n     not
                  is_manual_reset_recovery_enabled or\n     (recovered_state == 'opn'
                  and not is_opening_scheduled and\n      live_force == 'non')) }}"
                closing_ownership_hold: "{{ recovered_state == 'cls' and not closing_target_owned
                  and\n   live_force == 'non' }}"
                log_user: '{{ (''manual override reset, control returned to automation''
                  if manual_reset_recovery_hold else ''manual override reset, back
                  to: '' ~ state_labels[recovered_state]) if manual_reset_event and
                  override_expired else ''manual override kept, it has not expired
                  yet'' if manual_reset_event else (''this automation took charge
                  of the cover'' if instance_activated else ''catching up after a
                  restart or an outage'') ~ '', target: '' ~ state_labels[recovered_state]
                  }}'
                log_extra: '{{ ''Manual override reset reconciliation'' if manual_reset_event
                  else ''Recovery'' }}{{ '' (hygiene only, no catch-up)'' if not recovery_catch_up
                  else '''' }}{{ '' (instance activated)'' if instance_activated else
                  '''' }}{{ '' (automation resumed)'' if automation_resumed else ''''
                  }}{{ '' (restart)'' if is_restart_run else '''' }}{{ '' (new day)''
                  if stale_day else '''' }}{{ '' (missed midnight reset)'' if midnight_reset_missed
                  else '''' }}: base {{ helper_state_base }}->{{ new_base }}{{ ''
                  (schedule says '' ~ recovered_base ~ '', a live opening/closing
                  gate refused the flip)'' if recovery_catch_up and recovered_base
                  != new_base else '''' }}, frc {{ helper_state_force }}->{{ live_force
                  }}, shd {{ 1 if helper_state_shade else 0 }}->{{ 1 if recovered_shade
                  else 0 }}, pnd {{ helper_state_pending }}->{{ new_pending }}{{ ''
                  (stale cleared)'' if pending_is_stale else '''' }}, state {{ recovered_state
                  }}, target {{ target_position }}{{ '', expired manual override cleared''
                  if override_expired else '''' }}{{ '', opening deferred to shading''
                  if defer_to_shading else '''' }}{{ '', shading drive withheld (end
                  pending armed)'' if defer_to_shading_end else '''' }}{{ '', drive
                  withheld (closing hold)'' if caught_up_closing_hold else '''' }}{{
                  '', drive withheld (morning opening disabled)'' if caught_up_opening_hold
                  else '''' }}{{ '', drive withheld (manual override)'' if not transition_manual_allows
                  else '''' }}{{ '', drive withheld (ventilation condition)'' if recovery_vent_condition_hold
                  else '''' }}{{ '', drive withheld (manual reset return-to-target
                  disabled)'' if manual_reset_event and not is_manual_reset_recovery_enabled
                  else '''' }}{{ '', drive withheld (no opening automation configured)''
                  if manual_reset_event and is_manual_reset_recovery_enabled and recovered_state
                  == ''opn'' and not is_opening_scheduled else '''' }}{{ '', drive
                  withheld (no closing automation configured)'' if closing_ownership_hold
                  else '''' }}'
            - variables:
                will_drive: "{{ recovery_catch_up and not is_paused and recovery_allowed
                  and\n   not caught_up_closing_hold and not caught_up_opening_hold
                  and\n   not closing_ownership_hold and transition_manual_allows
                  and\n   not recovery_vent_condition_hold and not manual_reset_recovery_hold
                  }}"
            - variables:
                drive_plan:
                  run: '{{ will_drive }}'
                  target: '{{ target_position | int }}'
                  target_tilt: '{{ target_tilt_position | int }}'
                  action_set: "{{ ('up' if caught_up_opening and recovered_state ==
                    'lock'\n    else state_targets[recovered_state].action_set)\n
                    \  if will_drive else '' }}"
                update_values:
                  bas: '{{ new_base }}'
                  win: '{{ recovered_window }}'
                  res: '{{ 1 if state_resident else 0 }}'
                  frc: '{{ live_force }}'
                  shd: '{{ 1 if recovered_shade else 0 }}'
                  pnd: '{{ new_pending }}'
                  ts:
                    opn: '{{ ''now'' if caught_up_opening and recovered_state != ''shd''
                      else (0 if stale_day else helper_ts_open) }}'
                    cls: '{{ ''now'' if new_base == ''cls'' and helper_state_base
                      != ''cls'' else (0 if stale_day else helper_ts_close) }}'
                    due: '{{ recovered_due | int }}'
                    arm: '{{ recovered_arm | int }}'
            - if: '{{ override_expired }}'
              then:
              - variables:
                  update_values: '{{ dict(update_values, man=0) }}'
            - *id007
            - alias: Run the user's override reset action for an override the outage
                swallowed
              if: '{{ override_expired }}'
              then:
              - choose: []
                default: !input auto_override_reset_action
            - stop: 'Recovery executed (state: {{ recovered_state }}, pending: {{
                new_pending }})'
        - alias: 'Recovery: catching up a closing'
          conditions:
          - '{{ recovery_catch_up and recovered_base == ''cls'' and helper_state_base
            != ''cls'' }}'
          - '{{ not is_evening_phase or base_gates.closing.schedule_ok }}'
          - '{{ base_gates.closing.once_ok }}'
          - &id012
            condition: !input auto_down_condition
          sequence:
          - variables:
              new_base: cls
              recovered_shade: false
          - alias: 'Recovery: reconcile the cascade and drive'
            choose: []
            default: *id008
        default:
        - variables:
            new_base: '{{ helper_state_base }}'
        - alias: 'Recovery: reconcile the cascade and drive'
          choose: []
          default: *id008
    default:
    - variables:
        recovered_vent_ok: false
    - *id009
- alias: Reload event without a resume - nothing to catch up
  if:
  - '{{ trigger.id is defined and trigger.id == ''t_automation_reloaded'' }}'
  then:
  - stop: 'Reload event ignored: this automation was not resumed (helper is current)'
- choose:
  - alias: Check for opening
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_open|t_calendar_event)'') }}'
    - *id010
    - '{{ base_gates.opening.once_ok }}'
    - '{{ base_gates.opening.schedule_ok }}'
    sequence:
    - choose:
      - alias: 'Opening: Shading warranted, arm pending'
        conditions:
        - '{{ is_shading_enabled }}'
        - '{{ shading_start_warranted }}'
        - '{{ is_shading_allowed_window }}'
        - '{{ not (is_ventilation_enabled and lockout_now.shading_start) }}'
        - '{{ not helper_state_is_shaded }}'
        - '{{ not helper_state_shade }}'
        - '{{ not helper_state_pending_start }}'
        - '{{ not helper_state_pending_end }}'
        - '{{ shading_once_guard_ok }}'
        sequence:
        - variables:
            shading_start_due: '{{ (as_timestamp(now()) + shading_waitingtime_start
              | int) | int }}'
            log_user: sun shading is about to start, holding the opening back
            log_extra: 'opening: shading warranted, arming pending; wait={{ shading_waitingtime_start
              | int }}s; max_duration={{ shading_start_max_duration | int }}s'
            update_values:
              bas: opn
              shd: 0
              pnd: beg
              ts:
                opn: now
                due: '{{ shading_start_due | int }}'
                arm: now
        - *id007
        - stop: 'Opening: Shading pending armed'
      - alias: Already in open position - only update base state
        conditions:
        - '{{ effective_state == ''opn'' and in_open_position }}'
        - '{{ not helper_state_is_shaded }}'
        - '{{ not helper_state_pending_start }}'
        - '{{ not helper_state_shade }}'
        sequence:
        - if: '{{ helper_state_base != ''opn'' or now().day != helper_ts_open | timestamp_custom(''%-d'',
            true) | int }}'
          then:
          - variables:
              update_values:
                bas: opn
                ts:
                  opn: now
          else:
          - variables:
              update_values:
                bas: opn
        - *id007
        - stop: 'Open time: Already in position, base state updated'
      - alias: Shading detected. Move to shading position
        conditions:
        - or:
          - '{{ helper_state_is_shaded }}'
          - '{{ helper_state_shade }}'
        - '{{ not in_shading_position }}'
        sequence:
        - variables:
            will_drive: '{{ not is_paused and base_gates.opening.override_ok and force_allows_shade
              and effective_state == ''shd'' }}'
            log_user: moving to the sun shading position instead of opening
            drive_plan:
              run: '{{ will_drive }}'
              action_set: shading_start
              target: '{{ effective_shading_position | int }}'
              target_tilt: '{{ shading_tilt_position | int }}'
              delay_s: '{{ drive_delay_standard }}'
            update_values:
              bas: opn
              shd: 1
              pnd: non
              ts:
                shd: now
                due: 0
                arm: 0
        - *id007
        - stop: 'Opening skipped: Shading detected'
      - alias: 'Opening skipped: Shading start pending'
        conditions:
        - '{{ helper_state_pending_start }}'
        - '{{ shading_start_warranted }}'
        - '{{ not (is_ventilation_enabled and lockout_now.shading_start) }}'
        sequence:
        - variables:
            log_user: waiting to see whether sun shading starts before opening
            update_values:
              bas: opn
              ts:
                opn: now
        - *id007
        - stop: 'Opening skipped: Shading start pending'
      - alias: Normal opening of the cover
        conditions:
        - '{{ not in_shading_position or not helper_state_shade }}'
        sequence:
        - choose:
          - alias: 'Opening reconciliation: full-window lockout allowed'
            conditions:
            - '{{ effective_state == ''lock'' }}'
            - *id011
            sequence:
            - variables:
                will_drive: '{{ not is_paused and force_allows_ventilate }}'
          default:
          - variables:
              will_drive: "{{ effective_state != 'lock' and not is_paused and\n   is_up_enabled
                and\n   base_gates.opening.override_ok and resident_flags.allow_open
                and\n   (force_allows_open or trigger.id is match('^t_force_')) }}"
        - variables:
            log_user: '{{ ''opening as scheduled'' if will_drive else ''opening time
              reached'' }}'
            drive_plan:
              run: '{{ will_drive }}'
              action_set: up
              target: '{{ effective_lockout_position | int if effective_state == ''lock''
                else open_position | int }}'
              target_tilt: '{{ open_tilt_position | int }}'
              delay_s: '{{ drive_delay_standard }}'
            update_values:
              bas: opn
              shd: 0
              pnd: non
              ts:
                opn: now
                due: 0
                arm: 0
        - *id007
        - stop: Opening executed
      default:
      - variables:
          update_values:
            bas: opn
            ts:
              opn: now
      - *id007
      - stop: 'Open time: In shading position, base state updated (movement via Shading
          End)'
  - alias: Check for closing cover
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_close|t_calendar_event)'') }}'
    - *id012
    - '{{ base_gates.closing.once_ok }}'
    - '{{ base_gates.closing.schedule_ok }}'
    sequence:
    - choose:
      - alias: Lockout protection when closing
        conditions:
        - '{{ is_ventilation_enabled }}'
        - '{{ lockout_now.closing }}'
        sequence:
        - variables:
            log_user: closing time reached, but the window is open
            update_values:
              bas: cls
              shd: 0
              win: opn
              pnd: non
              ts:
                cls: now
                due: 0
                arm: 0
        - *id007
        - stop: 'Closing skipped: Lockout enabled'
      - alias: Window tilted. No lockout. Move to ventilation position instead of
          closing
        conditions:
        - '{{ is_ventilation_enabled }}'
        - '{{ resident_flags.allow_ventilate }}'
        - *id011
        - '{{ window_tilted_now }}'
        - '{{ not lockout_tilted_when_closing }}'
        - '{{ not window_opened_now }}'
        sequence:
        - variables:
            will_drive: '{{ is_down_enabled and base_gates.closing.override_ok and
              state_gates.vnt }}'
            log_user: the window is tilted, going to the ventilation position instead
              of closing
            drive_plan:
              run: '{{ will_drive }}'
              action_set: ventilate
              target: '{{ ventilate_position | int }}'
              target_tilt: '{{ ventilate_tilt_position | int }}'
              delay_s: '{{ 0 if ventilation_flags.start_no_delay else drive_delay_standard
                }}'
            update_values:
              bas: cls
              shd: 0
              win: tlt
              pnd: non
              ts:
                cls: now
                due: 0
                arm: 0
        - *id007
        - stop: 'Closing skipped: Window tilted (Ventilation activated)'
      - alias: Already in close position - only update base state
        conditions:
        - '{{ effective_state == ''cls'' and in_close_position }}'
        - or:
          - '{{ helper_state_base != ''cls'' }}'
          - '{{ now().day != helper_ts_close | timestamp_custom(''%-d'', true) | int
            }}'
        sequence:
        - variables:
            update_values:
              bas: cls
              shd: 0
              pnd: non
              ts:
                cls: now
                due: 0
                arm: 0
        - *id007
        - stop: 'Close time: Already in position, base state updated'
      - alias: Only status change if cover is shaded and lowering blocked
        conditions:
        - '{{ closing_position_hold }}'
        sequence:
        - variables:
            log_user: closing time reached, but the cover stays at the sun shading
              position
            update_values:
              bas: cls
              shd: 0
              pnd: non
              ts:
                cls: now
                due: 0
                arm: 0
        - *id007
        - stop: 'Closing skipped: Cover is shaded and lowering blocked by settings'
      default:
      - variables:
          will_drive: '{{ not is_paused and is_down_enabled and base_gates.closing.override_ok
            and force_allows_close }}'
          log_user: '{{ ''closing as scheduled'' if will_drive else ''closing time
            reached'' }}'
          drive_plan:
            run: '{{ will_drive }}'
            action_set: down
            target: '{{ close_position | int }}'
            target_tilt: '{{ close_tilt_position | int }}'
            delay_s: '{{ drive_delay_standard }}'
          update_values:
            bas: cls
            shd: 0
            pnd: non
            ts:
              cls: now
              due: 0
              arm: 0
      - *id007
      - stop: Closing executed
  - alias: Check for shading start
    conditions:
    - '{{ is_shading_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_shading_start|t_open_1)'') }}'
    - or:
      - '{{ not helper_state_is_shaded }}'
      - '{{ not window_any_now }}'
      - '{{ helper_state_pending_end }}'
    - or:
      - '{{ not is_cover_tilt_enabled_and_possible and not in_shading_position }}'
      - '{{ is_cover_tilt_enabled_and_possible }}'
      - '{{ trigger.id | regex_match(''^(t_shading_start_execution)'') }}'
      - '{{ helper_state_pending_end }}'
    - or:
      - '{{ shading_once_guard_ok }}'
      - '{{ trigger.id | regex_match(''^(t_shading_start_execution)'') }}'
      - '{{ helper_state_pending_end }}'
    sequence:
    - if:
      - or:
        - and:
          - '{{ ''shading_temp_comparison_independent'' in shading_config }}'
          - '{{ shading_start_condition_states.independent_temp_valid }}'
        - '{{ shading_start_conditions_met }}'
      - or:
        - '{{ trigger.id | regex_match(''^(t_shading_start_pending)'') }}'
        - '{{ is_shading_allowed_window }}'
      then:
      - choose:
        - alias: Shading re-detected. Cancel pending shading end
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_start_pending)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ not shading_end_conditions_met }}'
          sequence:
          - variables:
              log_extra: shading end pending canceled (start-pending event, end conditions
                no longer met); elapsed={{ (as_timestamp(now()) - helper_ts_pending_arm)
                | int }}s
              update_values:
                pnd: non
                ts:
                  due: 0
                  arm: 0
          - *id007
          - stop: 'Shading End Pending: Canceled (shading re-detected)'
        - alias: Shading detected. Save next execution time and pending status
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_start_pending)'') }}'
          - '{{ not helper_state_pending_start }}'
          - '{{ not helper_state_pending_end }}'
          - '{{ not helper_state_shade }}'
          sequence:
          - variables:
              shading_start_due: "{% set wait_due = (as_timestamp(now()) + shading_waitingtime_start
                | int) | int %} {% if is_time_control_disabled or is_shading_allowed_window
                %}\n  {{ wait_due }}\n{% elif is_time_field_enabled %}\n  {{ [wait_due,
                as_timestamp(today_at(time_up_early_today)) | int + 1] | max }}\n{%
                elif is_calendar_enabled and calendar_open_start is not none %}\n
                \ {{ [wait_due, calendar_open_start | int + 1] | max }}\n{% else %}\n
                \ {{ wait_due }}\n{% endif %}"
              shading_start_arm: "{% set ts = as_timestamp(now()) | int %} {% if is_time_control_disabled
                or is_shading_allowed_window %}\n  {{ ts }}\n{% elif is_time_field_enabled
                %}\n  {{ [ts, as_timestamp(today_at(time_up_early_today)) | int] |
                max }}\n{% elif is_calendar_enabled and calendar_open_start is not
                none %}\n  {{ [ts, calendar_open_start | int] | max }}\n{% else %}\n
                \ {{ ts }}\n{% endif %}"
              log_extra: shading start pending armed; wait={{ shading_waitingtime_start
                | int }}s; due_in={{ (shading_start_due | int - as_timestamp(now())
                | int) }}s; max_duration={{ shading_start_max_duration | int }}s;
                budget_from={{ shading_start_arm | int }}
              update_values:
                shd: 0
                pnd: beg
                ts:
                  shd: now
                  due: '{{ shading_start_due | int }}'
                  arm: '{{ shading_start_arm | int }}'
          - *id007
          - stop: 'Shading Start Pending: Waiting'
        - alias: Shading start execution
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_start_execution)'') }}'
          - '{{ helper_state_pending_start }}'
          sequence:
          - if:
            - &id014
              condition: !input auto_shading_start_condition
            then:
            - choose:
              - alias: Consider lockout protection when shading starts
                conditions:
                - '{{ is_ventilation_enabled }}'
                - '{{ lockout_now.shading_start }}'
                sequence:
                - variables:
                    log_user: sun shading is due, but the window is open
                    update_values:
                      shd: 1
                      win: opn
                      pnd: non
                      ts:
                        shd: now
                        due: 0
                        arm: 0
                - *id007
                - stop: 'Shading Start skipped: Lockout enabled'
              - alias: Shading start - hold ventilation floor (window tilted)
                conditions:
                - '{{ is_ventilation_enabled }}'
                - '{{ not shading_over_ventilation }}'
                - '{{ window_tilted_now }}'
                - '{{ not window_opened_now }}'
                - '{{ force_allows_ventilate }}'
                - '{{ resident_flags.allow_ventilate }}'
                - '{{ resident_flags.allow_shade }}'
                - '{{ is_shading_allowed_window }}'
                - '{{ position_comparisons.shading_below_ventilate }}'
                sequence:
                - variables:
                    will_drive: "{{ not is_paused and manual_allows_event.shd and\n
                      \  force_allows_ventilate and\n   not in_ventilate_position
                      }}"
                    log_user: sun shading is due, but the tilted window keeps the
                      cover higher
                    drive_plan:
                      run: '{{ will_drive }}'
                      action_set: ventilate
                      target: '{{ ventilate_position | int }}'
                      target_tilt: '{{ ventilate_tilt_position | int }}'
                      delay_s: '{{ drive_delay_standard }}'
                    update_values:
                      shd: 1
                      win: tlt
                      pnd: non
                      ts:
                        shd: now
                        due: 0
                        arm: 0
                - *id007
                - stop: 'Shading Start: ventilation floor held (window tilted)'
              - alias: Start Shading
                conditions:
                - or:
                  - and:
                    - '{{ not is_cover_tilt_enabled_and_possible }}'
                    - '{{ position_comparisons.current_above_shading }}'
                  - and:
                    - '{{ is_cover_tilt_enabled_and_possible }}'
                    - '{{ position_comparisons.current_above_shading or current_position
                      == effective_shading_position }}'
                  - and:
                    - '{{ position_comparisons.current_below_shading }}'
                    - '{{ effective_state == ''opn'' }}'
                - '{{ is_shading_allowed_window }}'
                - '{{ resident_flags.allow_shade }}'
                sequence:
                - variables:
                    will_drive: "{{ not is_paused and manual_allows_event.shd and\n
                      \  force_allows_shade }}"
                    log_user: sun shading started
                    drive_plan:
                      run: '{{ will_drive }}'
                      action_set: shading_start
                      target: '{{ effective_shading_position | int }}'
                      target_tilt: '{{ shading_tilt_position | int }}'
                      delay_s: '{{ drive_delay_standard }}'
                    update_values:
                      shd: 1
                      pnd: non
                      ts:
                        shd: now
                        due: 0
                        arm: 0
                - *id007
                - stop: Shading Start executed
              - alias: Save shading state for the future
                conditions:
                - or:
                  - '{{ effective_state == ''cls'' }}'
                  - '{{ not resident_flags.allow_shade }}'
                sequence:
                - variables:
                    log_user: sun shading noted for later ({{ 'the cover is closed'
                      if effective_state == 'cls' else 'the resident is present' }})
                    update_values:
                      shd: 1
                      pnd: non
                      ts:
                        shd: now
                        due: 0
                        arm: 0
                - *id007
                - stop: 'Shading Start skipped: State saved'
              default:
              - variables:
                  log_extra: no drive warranted (position outside drive criteria);
                    shading state recorded
                  update_values:
                    shd: 1
                    pnd: non
                    ts:
                      shd: now
                      due: 0
                      arm: 0
              - *id007
              - stop: 'Shading Start: state recorded (no drive required)'
            else:
            - variables:
                shading_start_retry_reason: blocked by=auto_shading_start_condition
            - &id013
              choose:
              - alias: Shading start retry - waiting for time window
                conditions:
                - '{{ not is_shading_allowed_window }}'
                sequence:
                - variables:
                    log_extra: '{{ shading_start_retry_reason | default('''') }};
                      waiting for time window; next_retry_in={{ shading_waitingtime_start
                      | int }}s'
                    update_values:
                      shd: 0
                      pnd: beg
                      ts:
                        due: '{{ (as_timestamp(now()) + shading_waitingtime_start
                          | int) | int }}'
                        arm: now
                - *id007
                - stop: 'Shading Start Pending: Waiting for time window'
              - alias: Shading start retry - continue waiting
                conditions:
                - '{{ shading_start_max_duration > 0 }}'
                - '{{ is_shading_allowed_window }}'
                - '{{ (as_timestamp(now()) - helper_ts_pending_arm) <= shading_start_max_duration
                  }}'
                sequence:
                - variables:
                    log_extra: '{{ shading_start_retry_reason | default('''') }};
                      elapsed={{ (as_timestamp(now()) - helper_ts_pending_arm) | int
                      }}s/{{ shading_start_max_duration | int }}s; next_retry_in={{
                      shading_waitingtime_start | int }}s'
                    update_values:
                      shd: 0
                      pnd: beg
                      ts:
                        shd: now
                        due: '{{ (as_timestamp(now()) + shading_waitingtime_start
                          | int) | int }}'
                - *id007
                - stop: 'Shading Start Pending: Continue waiting'
              default:
              - variables:
                  log_user: sun shading did not start ({{ 'the time window has passed'
                    if not is_shading_allowed_window else 'the conditions never held'
                    }})
                  log_extra: 'abort: {{ shading_start_retry_reason | default('''')
                    }}; elapsed={{ (as_timestamp(now()) - helper_ts_pending_arm) |
                    int }}s; max_duration={{ shading_start_max_duration | int }}s;
                    in_window={{ is_shading_allowed_window }}'
                  update_values:
                    shd: 0
                    pnd: non
                    ts:
                      shd: now
                      due: 0
                      arm: 0
              - *id007
              - stop: 'Shading Start aborted: Timeout or invalid'
      else:
      - if:
        - '{{ trigger.id | regex_match(''^(t_shading_start_execution)'') }}'
        - '{{ helper_state_pending_start }}'
        then:
        - variables:
            shading_start_retry_reason: shading_start_conditions_met=false
        - *id013
        else:
        - stop: 'Shading start skipped: Pending trigger fired but combined start conditions
            evaluated false.'
  - alias: Check for shading tilt
    conditions:
    - '{{ is_shading_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_shading_tilt)'') }}'
    - and:
      - '{{ helper_state_is_shaded }}'
      - '{{ not helper_state_pending_start }}'
    - '{{ is_cover_tilt_enabled_and_possible }}'
    - condition: !input auto_shading_tilt_condition
    sequence:
    - variables:
        will_drive: "{{ not is_paused and manual_allows_event.shd and force_allows_shade
          and\n   resident_flags.allow_shade and\n   not (is_ventilation_enabled and
          window_opened_now) and\n   (not (is_ventilation_enabled and window_tilted_now)
          or shading_over_ventilation) and\n   cover_status_helper != [] and\n   states(cover_status_helper)
          | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]') }}"
        log_user: 'sun shading: slat angle re-checked'
        drive_plan:
          run: '{{ will_drive }}'
          move: tilt
          target_tilt: '{{ shading_tilt_position | int }}'
          tilt_first: '{{ is_cover_tilt_reposition_enabled | bool }}'
        update_values: {}
    - *id007
    - stop: Shading Tilt executed
  - alias: Check for alternate shading position
    conditions:
    - '{{ is_shading_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^t_shading_position_alt'') }}'
    - and:
      - '{{ helper_state_is_shaded }}'
      - '{{ not helper_state_pending_start }}'
    sequence:
    - variables:
        will_drive: "{{ not is_paused and manual_allows_event.shd and force_allows_shade
          and\n   resident_flags.allow_shade and\n   not (is_ventilation_enabled and
          window_opened_now) and\n   (not (is_ventilation_enabled and window_tilted_now)
          or shading_over_ventilation) and\n   not in_shading_position and\n   cover_status_helper
          != [] and\n   states(cover_status_helper) | regex_search('\"shd\"\\s*:\\s*1\\s*[,}]')
          }}"
        log_user: 'sun shading: shading depth re-checked'
        drive_plan:
          run: '{{ will_drive }}'
          target: '{{ effective_shading_position | int }}'
          target_tilt: '{{ shading_tilt_position | int }}'
        update_values: {}
    - *id007
    - stop: Alternate shading position executed
  - alias: Check for shading end
    conditions:
    - '{{ is_shading_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id | regex_match(''^(t_shading_end)'') }}'
    - condition: !input auto_shading_end_condition
    - '{{ is_shading_allowed_window }}'
    - or:
      - '{{ helper_state_is_shaded }}'
      - '{{ in_shading_position }}'
    - or:
      - '{{ not prevent_flags.shading_end_if_closed }}'
      - '{{ prevent_flags.shading_end_if_closed and not in_close_position and not
        position_comparisons.current_below_close }}'
    sequence:
    - if:
      - '{{ shading_end_conditions_met }}'
      then:
      - variables:
          shading_end_state: "{% if helper_state_force != 'non' %}{{ helper_state_force
            }} {% elif is_ventilation_enabled and window_opened_now %}lock {% else
            %}\n  {% set base_target = 'cls' if state_resident and resident_flags.closing_trigger\n
            \                      else 'cls' if helper_state_base == 'opn' and not
            resident_flags.allow_open\n                       else helper_state_base
            %}\n  {% if is_ventilation_enabled and window_tilted_now and resident_flags.allow_ventilate
            and\n        (ventilation_flags.after_shading_end or\n         not (base_target
            == 'opn' and is_opening_scheduled)) %}vnt\n  {% else %}{{ base_target
            }}{% endif %}\n{% endif %}"
      - choose:
        - alias: Shading end detected. Save next execution time and pending status
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_pending)'') }}'
          - '{{ not helper_state_pending_end }}'
          - '{{ not helper_state_pending_start }}'
          sequence:
          - variables:
              local_waitingtime_end: '{% set local_waitingtime_end = shading_waitingtime_end
                | int %} {% if (is_shading_end_immediate_by_sun_position | default(false))
                | bool and trigger.id in [''t_shading_end_pending_5'', ''t_shading_end_pending_7'']
                %} {% set local_waitingtime_end = 20 %} {% endif %} {{ local_waitingtime_end
                }}

                '
              log_extra: shading end pending armed; wait={{ local_waitingtime_end
                | int }}s; immediate_by_sun={{ (is_shading_end_immediate_by_sun_position
                | default(false)) | bool }}
              update_values:
                shd: 1
                pnd: end
                ts:
                  shd: now
                  due: '{{ (as_timestamp(now()) + local_waitingtime_end | int) | int
                    }}'
                  arm: now
          - *id007
          - stop: 'Shading End Pending: Waiting'
        - alias: Lockout protection when shading ends
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ is_ventilation_enabled }}'
          - '{{ position_comparisons.current_below_ventilate }}'
          - '{{ lockout_now.shading_end }}'
          sequence:
          - variables:
              log_user: sun shading is over, but the window is open
              update_values:
                shd: 0
                win: opn
                pnd: non
                ts:
                  shd: now
                  due: 0
                  arm: 0
          - *id007
          - stop: 'Shading End skipped: Lockout enabled'
        - alias: Ventilation after shading ends
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ shading_end_state == ''vnt'' }}'
          - '{{ is_ventilation_enabled }}'
          - '{{ ventilation_flags.after_shading_end }}'
          - '{{ resident_flags.allow_ventilate }}'
          - *id011
          - '{{ window_tilted_now }}'
          - '{{ not window_opened_now }}'
          - or:
            - '{{ position_comparisons.current_below_ventilate }}'
            - and:
              - '{{ is_cover_tilt_enabled_and_possible }}'
              - "{{ position_comparisons.current_below_ventilate or\n   current_position
                == ventilate_position or\n   ((current_position - ventilate_position)
                | abs <= position_tolerance\n    and not in_ventilate_position) }}"
            - '{{ ventilation_flags.if_lower_enabled and (position_comparisons.current_above_ventilate
              or current_position == ventilate_position) }}'
          sequence:
          - variables:
              will_drive: "{{ not is_paused and manual_allows_event.shd and\n   force_allows_ventilate
                }}"
              log_user: sun shading is over, the window is tilted, going to the ventilation
                position
              drive_plan:
                run: '{{ will_drive }}'
                action_set: ventilate
                target: '{{ ventilate_position | int }}'
                target_tilt: '{{ ventilate_tilt_position | int }}'
                delay_s: '{{ range(0, 2) | random if (is_shading_end_immediate_by_sun_position
                  | default(false)) | bool else drive_delay_standard }}'
              update_values:
                shd: 0
                win: tlt
                pnd: non
                ts:
                  shd: now
                  due: 0
                  arm: 0
          - *id007
          - stop: 'Shading End: Ventilation activated'
        - alias: Only tilt open after shading ends
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ is_cover_tilt_enabled_and_possible }}'
          - '{{ prevent_flags.opening_after_shading_end}}'
          - '{{ shading_end_state == ''opn'' }}'
          sequence:
          - variables:
              will_drive: '{{ not is_paused and manual_allows_event.shd and not is_forced
                }}'
              log_user: sun shading is over, opening the slats only
              drive_plan:
                run: '{{ will_drive }}'
                move: tilt
                target_tilt: '{{ open_tilt_position | int }}'
              update_values:
                shd: 0
                pnd: non
                ts:
                  shd: now
                  due: 0
                  arm: 0
          - *id007
          - stop: 'Shading End: Tilt executed'
        - alias: Move cover after shading end - conditions still valid
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ shading_end_conditions_met }}'
          sequence:
          - variables:
              shading_end_force_allows: "{{ force_allows_ventilate if shading_end_state
                in ['lock', 'vnt']\n   else force_allows_open if shading_end_state
                == 'opn'\n   else force_allows_shade if shading_end_state == 'shd'\n
                \  else force_allows_close }}"
              shading_end_opening_allows: "{{ shading_end_state != 'opn' or\n   not
                prevent_flags.opening_after_shading_end }}"
              shading_end_ventilation_allows: "{{ shading_end_state != 'vnt' or\n
                \  ventilation_flags.after_shading_end }}"
          - choose:
            - alias: 'Shading end reconciliation: ventilation target allowed'
              conditions:
              - '{{ shading_end_state in [''lock'', ''vnt''] }}'
              - *id011
              sequence:
              - variables:
                  shading_end_target_condition_ok: true
            - alias: 'Shading end reconciliation: non-ventilation target'
              conditions:
              - '{{ shading_end_state not in [''lock'', ''vnt''] }}'
              sequence:
              - variables:
                  shading_end_target_condition_ok: true
            default:
            - variables:
                shading_end_target_condition_ok: false
          - variables:
              will_drive: "{{ shading_end_target_condition_ok and\n   shading_end_opening_allows
                and shading_end_ventilation_allows and\n   not is_paused and shading_end_force_allows
                and\n   (shading_end_state == 'lock' or manual_allows_event.shd) and\n
                \  (shading_end_state != 'cls' or closing_target_owned or\n    helper_state_force
                == 'cls') }}"
              log_user: '{{ ''sun shading is over, back to: '' ~ state_labels[shading_end_state]
                if will_drive else ''sun shading is over, but the cover stays where
                it is'' }}'
              log_extra: shading end; target={{ shading_end_state }}{{ '; opening_after_shading_end
                prevented' if prevent_flags.opening_after_shading_end else '' }}
              drive_plan: "{{ dict(state_targets[shading_end_state], run=will_drive,\n
                \       action_set='shading_end',\n        delay_s=range(0, 2) | random
                if (is_shading_end_immediate_by_sun_position | default(false)) | bool
                else drive_delay_standard) }}"
              update_values:
                shd: 0
                pnd: non
                ts:
                  shd: now
                  due: 0
                  arm: 0
          - if: '{{ shading_end_state == ''opn'' }}'
            then:
            - variables:
                update_values: "{{ dict(update_values, bas='opn',\n        ts=dict(update_values.ts,
                  opn='now')) }}"
          - *id007
          - stop: Shading End (Opening after shading) executed
        - alias: Shading end conditions not met - check if we should continue
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          - '{{ shading_end_max_duration > 0 }}'
          - '{{ is_shading_allowed_window }}'
          - '{{ (as_timestamp(now()) - helper_ts_pending_arm) <= shading_end_max_duration
            }}'
          sequence:
          - variables:
              log_extra: shading_end_conditions_met=false (after exec); elapsed={{
                (as_timestamp(now()) - helper_ts_pending_arm) | int }}s/{{ shading_end_max_duration
                | int }}s; next_retry_in={{ shading_waitingtime_end | int }}s
              update_values:
                shd: 1
                pnd: end
                ts:
                  shd: now
                  due: '{{ (as_timestamp(now()) + shading_waitingtime_end | int) |
                    int }}'
          - *id007
          - stop: 'Shading End Pending: Continue waiting'
        - alias: Shading end / Stop retry
          conditions:
          - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
          - '{{ helper_state_pending_end }}'
          sequence:
          - variables:
              log_user: sun shading stays on, the end conditions never held
              log_extra: 'abort: shading_end_conditions_met=false; elapsed={{ (as_timestamp(now())
                - helper_ts_pending_arm) | int }}s; max_duration={{ shading_end_max_duration
                | int }}s; in_window={{ is_shading_allowed_window }}'
              update_values:
                shd: 1
                pnd: non
                ts:
                  shd: now
                  due: 0
                  arm: 0
          - *id007
          - stop: 'Shading End aborted: Timeout or invalid'
      else:
      - if:
        - '{{ trigger.id | regex_match(''^(t_shading_end_execution)'') }}'
        - '{{ helper_state_pending_end }}'
        then:
        - variables:
            log_extra: stale pending cleared (end conditions recovered); elapsed={{
              (as_timestamp(now()) - helper_ts_pending_arm) | int }}s
            update_values:
              shd: 1
              pnd: non
              ts:
                due: 0
                arm: 0
        - *id007
        - stop: 'Shading End: cleared stale pending (conditions no longer met)'
  - alias: Contact sensor state changed
    conditions:
    - '{{ is_ventilation_enabled }}'
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id in [''t_contact_tilted_changed'', ''t_contact_opened_changed'']
      }}'
    - '{{ trigger.from_state.state not in invalid_states }}'
    - '{{ trigger.to_state.state not in invalid_states }}'
    sequence:
    - delay:
        seconds: !input contact_delay_status
    - variables:
        contact_opened_now: '{{ contact_window_opened != [] and states(contact_window_opened)
          in [''true'', ''on''] }}'
        contact_tilted_now: '{{ contact_window_tilted != [] and states(contact_window_tilted)
          in [''true'', ''on''] }}'
        resident_now: "{{ (helper_json.res | default(0) | int == 1)\n   if (resident_sensor
          != [] and states(resident_sensor) in invalid_states)\n   else (resident_sensor
          != [] and states(resident_sensor) in ['on', 'true']) }}"
        resident_blocks_open: '{{ resident_now and (resident_flags.closing_trigger
          or ''resident_allow_opening'' not in resident_config) }}'
        was_ventilating: '{{ helper_state_window in [''tlt'', ''opn''] or in_ventilate_position
          }}'
        return_target: '{% if (helper_state_is_shaded or helper_state_shade) and (not
          resident_now or ''resident_allow_shading'' in resident_config) %}shd {%
          elif helper_state_base == ''opn'' and not resident_blocks_open and not helper_state_is_shaded
          and not helper_state_shade %}opn {% elif helper_state_base == ''cls'' or
          resident_blocks_open %}cls {% else %}non{% endif %}'
    - choose:
      - alias: Window opened - Full ventilation (lockout)
        conditions:
        - '{{ contact_opened_now }}'
        - '{{ not in_lockout_position }}'
        sequence:
        - if:
          - *id011
          then:
          - variables:
              will_drive: '{{ state_gates.lock }}'
              log_user: the window was opened, raising the cover out of the way
              drive_plan:
                run: '{{ will_drive }}'
                action_set: up
                target: '{{ effective_lockout_position | int }}'
                target_tilt: '{{ open_tilt_position | int }}'
                delay_s: '{{ 0 if ventilation_flags.start_no_delay else drive_delay_standard
                  }}'
              update_values:
                win: opn
          - *id007
          else:
          - variables:
              log_user: the window was opened, but the ventilation condition refused
                movement
              update_values:
                win: opn
          - *id007
        - stop: Ventilation Start (Full) executed
      - alias: Window opened - Cover already at open position, update win
        conditions:
        - '{{ contact_opened_now }}'
        - '{{ in_lockout_position }}'
        - '{{ helper_state_window != ''opn'' }}'
        sequence:
        - variables:
            update_values:
              win: opn
        - *id007
        - stop: 'Ventilation (full): cover already at open position, win updated'
      - alias: Window tilted - Sun shading takes precedence
        conditions:
        - '{{ shading_over_ventilation }}'
        - '{{ contact_tilted_now }}'
        - '{{ not contact_opened_now }}'
        - '{{ effective_state == ''shd'' }}'
        sequence:
        - variables:
            will_drive: '{{ state_gates.shd and manual_allows_event.vnt }}'
            log_user: the window was tilted, but sun shading takes precedence
            drive_plan: "{{ dict(state_targets.shd, run=will_drive,\n        delay_s=0
              if ventilation_flags.start_no_delay else drive_delay_standard) }}"
            update_values:
              win: tlt
        - *id007
        - stop: 'Ventilation skipped: sun shading takes precedence'
      - alias: Window tilted - Partial ventilation
        conditions:
        - '{{ contact_tilted_now }}'
        - '{{ not contact_opened_now }}'
        - '{{ ''resident_allow_ventilation'' in resident_config or not resident_now
          }}'
        - '{{ not (ventilation_flags.keep_open_on_full_to_tilt and helper_state_window
          == ''opn'' and position_comparisons.current_above_ventilate) }}'
        - '{{ effective_state != ''opn'' }}'
        - or:
          - '{{ position_comparisons.current_below_ventilate }}'
          - and:
            - '{{ is_cover_tilt_enabled_and_possible }}'
            - "{{ position_comparisons.current_below_ventilate or\n   current_position
              == ventilate_position or\n   ((current_position - ventilate_position)
              | abs <= position_tolerance\n    and not in_ventilate_position) }}"
          - '{{ ventilation_flags.if_lower_enabled and (position_comparisons.current_above_ventilate
            or current_position == ventilate_position) }}'
          - and:
            - '{{ helper_state_window == ''opn'' }}'
            - '{{ position_comparisons.current_above_ventilate }}'
          - and:
            - '{{ position_comparisons.current_above_ventilate }}'
            - '{{ effective_state == ''cls'' }}'
            - '{{ closing_target_owned }}'
        sequence:
        - if:
          - *id011
          then:
          - variables:
              will_drive: '{{ not is_paused and manual_allows_event.vnt and force_allows_ventilate
                }}'
              log_user: the window was tilted, going to the ventilation position
              drive_plan:
                run: '{{ will_drive }}'
                action_set: ventilate
                target: '{{ ventilate_position | int }}'
                target_tilt: '{{ ventilate_tilt_position | int }}'
                delay_s: '{{ 0 if ventilation_flags.start_no_delay else drive_delay_standard
                  }}'
              update_values:
                win: tlt
          - *id007
          else:
          - variables:
              log_user: the window was tilted, but the ventilation condition refused
                movement
              update_values:
                win: tlt
          - *id007
        - stop: Ventilation Start (Partial) executed
      - alias: Window tilted - No drive, sync helper window state
        conditions:
        - '{{ contact_tilted_now }}'
        - '{{ not contact_opened_now }}'
        - '{{ helper_state_window != ''tlt'' }}'
        - or:
          - '{{ in_ventilate_position }}'
          - and:
            - '{{ ventilation_flags.keep_open_on_full_to_tilt }}'
            - '{{ helper_state_window == ''opn'' }}'
            - '{{ position_comparisons.current_above_ventilate }}'
          - '{{ effective_state == ''opn'' }}'
        sequence:
        - variables:
            update_values:
              win: tlt
        - *id007
        - stop: 'Ventilation (partial): no drive, helper window state synced'
      - alias: Window closed - Return to background state
        conditions:
        - '{{ not contact_opened_now and not contact_tilted_now }}'
        - '{{ return_target != ''non'' }}'
        - '{{ was_ventilating }}'
        - condition: !input auto_ventilate_end_condition
        sequence:
        - variables:
            will_drive: "{{ not is_paused and manual_allows_event.vnt and\n   {'shd':
              force_allows_shade,\n    'opn': not prevent_flags.opening_after_ventilation_end
              and force_allows_open,\n    'cls': force_allows_close and\n           (is_closing_scheduled
              or resident_blocks_open or\n            in_ventilate_position)}[return_target]
              }}"
            drive_plan: '{{ dict(state_targets[return_target], run=will_drive, delay_s=drive_delay_standard
              if ventilation_flags.delay_enabled else 0) }}'
            log_user: 'the window was closed again, back to: {{ state_labels[return_target]
              }}'
            log_extra: window closed; return_target={{ return_target }}
            update_values: '{% set base = {''win'': ''cls''} %} {{ dict(base, shd=1)
              if return_target == ''shd'' else base }}'
        - *id007
        - stop: 'Ventilation End: Return to background state executed'
  - alias: Resident sensor status change handler
    conditions:
    - '{{ trigger.id == ''t_resident_update'' }}'
    sequence:
    - variables:
        new_resident_status: '{{ 1 if trigger.to_state.state in [''on'', ''true'']
          else 0 }}'
        resident_leaving: '{{ trigger.from_state.state in [''on'', ''true''] and trigger.to_state.state
          in [''off'', ''false''] }}'
        resident_arriving: '{{ trigger.from_state.state in [''off'', ''false''] and
          trigger.to_state.state in [''on'', ''true''] }}'
    - choose:
      - alias: Resident leaving (ON→OFF)
        conditions:
        - '{{ resident_leaving }}'
        sequence:
        - choose:
          - alias: 'Resident leaving: target LOCKOUT (window fully open)'
            conditions:
            - '{{ window_opened_now }}'
            - '{{ is_ventilation_enabled }}'
            - *id011
            sequence:
            - variables:
                will_drive: '{{ state_gates.lock }}'
                log_user: the resident is no longer present, keeping the fully opened
                  window clear
                drive_plan: '{{ dict(state_targets.lock, run=will_drive, delay_s=drive_delay_standard)
                  }}'
                update_values:
                  res: '{{ new_resident_status | int }}'
                  win: opn
            - *id007
          - alias: 'Resident leaving: target VENTILATION (window tilted)'
            conditions:
            - '{{ window_tilted_now }}'
            - '{{ not window_opened_now }}'
            - '{{ effective_state == ''vnt'' }}'
            - '{{ resident_flags.allow_ventilate }}'
            - '{{ is_ventilation_enabled }}'
            - *id011
            sequence:
            - variables:
                will_drive: '{{ state_gates.vnt }}'
                log_user: the resident is no longer present, staying at the ventilation
                  position
                drive_plan: '{{ dict(state_targets.vnt, run=will_drive, delay_s=drive_delay_standard)
                  }}'
                update_values:
                  res: '{{ new_resident_status | int }}'
            - *id007
          default:
          - variables:
              leave_target: '{% if is_ventilation_enabled and window_opened_now %}non
                {% elif helper_state_shade and resident_flags.allow_shade and is_shading_enabled
                %}shd {% elif helper_state_base == ''opn'' and resident_flags.opening_trigger
                and is_up_enabled %}opn {% elif helper_state_base == ''cls'' and is_down_enabled
                %}cls {% else %}non{% endif %}'
              will_drive: '{{ leave_target != ''non'' and state_gates[leave_target]
                }}'
              drive_plan: '{{ dict(state_targets[leave_target], run=will_drive, delay_s=drive_delay_standard)
                if leave_target != ''non'' else {''run'': false} }}'
              log_user: 'the resident is no longer present, target: {{ state_labels[leave_target]
                }}'
              log_extra: resident leaving; target={{ leave_target }}
              update_values: '{% set base = {''res'': new_resident_status | int} %}
                {% if leave_target == ''opn'' %}{{ dict(base, bas=''opn'', ts={''opn'':
                ''now''}) }} {% elif leave_target == ''cls'' %}{{ dict(base, bas=''cls'',
                ts={''cls'': ''now''}) }} {% else %}{{ base }}{% endif %}'
          - *id007
      - alias: Resident arriving (OFF→ON)
        conditions:
        - '{{ resident_arriving }}'
        sequence:
        - choose:
          - alias: 'Resident arriving: window tilted → hold ventilation position'
            conditions:
            - '{{ window_tilted_now }}'
            - '{{ not window_opened_now }}'
            - '{{ effective_state == ''vnt'' }}'
            - '{{ ''resident_allow_ventilation'' in resident_config }}'
            - '{{ is_ventilation_enabled }}'
            - *id011
            sequence:
            - variables:
                will_drive: '{{ state_gates.vnt }}'
                log_user: the resident is present, staying at the ventilation position
                drive_plan: '{{ dict(state_targets.vnt, run=will_drive, delay_s=drive_delay_standard)
                  }}'
                update_values:
                  res: '{{ new_resident_status | int }}'
            - *id007
          default:
          - variables:
              arrive_target: '{% if not (is_ventilation_enabled and window_opened_now)
                and is_down_enabled and resident_flags.closing_trigger %}cls {% else
                %}non{% endif %}'
              will_drive: '{{ arrive_target == ''cls'' and state_gates.cls }}'
              drive_plan: '{{ dict(state_targets.cls, run=will_drive, delay_s=drive_delay_standard)
                if arrive_target == ''cls'' else {''run'': false} }}'
              log_user: '{{ ''the resident is present, closing for privacy'' if arrive_target
                == ''cls'' else ''the resident is present, nothing to change'' }}'
              log_extra: resident arriving; target={{ arrive_target }}
              update_values: '{% set base = {''res'': new_resident_status | int} %}
                {{ dict(base, ts={''cls'': ''now''}) if arrive_target == ''cls'' else
                base }}'
          - *id007
      default:
      - variables:
          update_values:
            res: '{{ new_resident_status | int }}'
      - *id007
  - alias: Force function triggered
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id is match(''t_force_enabled_.*'') }}'
    sequence:
    - variables:
        force_kind: "{{ {'t_force_enabled_open': 'opn',\n    't_force_enabled_close':
          'cls',\n    't_force_enabled_ventilate': 'vnt',\n    't_force_enabled_shading':
          'shd'}.get(trigger.id, 'non') }}"
    - if: '{{ force_kind != ''non'' }}'
      then:
      - variables:
          force_allows_target: "{{ (force_kind == 'opn' and force_allows_open)\n   or
            (force_kind == 'cls' and force_allows_close)\n   or (force_kind == 'vnt'
            and force_allows_ventilate)\n   or (force_kind == 'shd' and force_allows_shade)
            }}"
          log_user: 'force function switched on, target: {{ state_labels[force_kind]
            }}'
          drive_plan:
            run: '{{ not is_paused and force_allows_target }}'
            action_set: '{{ state_targets[force_kind].action_set }}'
            target: '{{ state_targets[force_kind].target | int }}'
            target_tilt: '{{ state_targets[force_kind].target_tilt | int }}'
          update_values:
            frc: '{{ force_kind }}'
      - *id007
    - stop: Force enabled executed
  - alias: Drive to target position after force pause disabled
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id == ''t_force_pause_disabled'' }}'
    sequence:
    - variables:
        resume_state: '{{ effective_state if effective_state in [''lock'', ''vnt'',
          ''shd'', ''cls''] else ''opn'' }}'
        reconcile_state: '{{ resume_state }}'
        log_user: 'force pause is over, back to: {{ state_labels[resume_state] }}'
        log_extra: force pause disabled; resuming to {{ resume_state }}
    - &id015
      alias: 'Reconciliation: evaluate the target''s additional condition'
      choose:
      - alias: 'Reconciliation condition: ventilation or lockout'
        conditions:
        - '{{ reconcile_state in [''lock'', ''vnt''] }}'
        - *id011
        sequence:
        - variables:
            target_condition_ok: true
      - alias: 'Reconciliation condition: opening'
        conditions:
        - '{{ reconcile_state == ''opn'' }}'
        - *id010
        sequence:
        - variables:
            target_condition_ok: true
      - alias: 'Reconciliation condition: closing'
        conditions:
        - '{{ reconcile_state == ''cls'' }}'
        - *id012
        sequence:
        - variables:
            target_condition_ok: true
      - alias: 'Reconciliation condition: shading'
        conditions:
        - '{{ reconcile_state == ''shd'' }}'
        - *id014
        sequence:
        - variables:
            target_condition_ok: true
      default:
      - variables:
          target_condition_ok: false
    - variables:
        will_drive: "{{ target_condition_ok and not is_paused and\n   (resume_state
          != 'cls' or closing_target_owned or\n    helper_state_force == 'cls') }}"
        drive_plan:
          run: '{{ will_drive }}'
          action_set: '{{ state_targets[resume_state].action_set }}'
          target: '{{ state_targets[resume_state].target | int }}'
          target_tilt: '{{ state_targets[resume_state].target_tilt | int }}'
        update_values: {}
    - *id007
  - alias: Return to background position after force disable
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id.startswith(''t_force_disabled'') }}'
    sequence:
    - variables:
        disabled_force: '{% if trigger.id == ''t_force_disabled_open'' %}opn {% elif
          trigger.id == ''t_force_disabled_close'' %}cls {% elif trigger.id == ''t_force_disabled_shading''
          %}shd {% elif trigger.id == ''t_force_disabled_ventilate'' %}vnt {% else
          %}non{% endif %}'
        next_active_force: '{{ live_force }}'
    - choose:
      - alias: 'Force disabled: not the active frc — keep current state'
        conditions:
        - '{{ disabled_force != helper_state_force and helper_state_force != ''non''
          }}'
        sequence:
        - stop: Disabled force ({{ disabled_force }}) was not the active force (frc={{
            helper_state_force }}), keeping current state
      - alias: 'Force disabled: Last Wins → switch to most recent force'
        conditions:
        - '{{ next_active_force != ''non'' }}'
        sequence:
        - variables:
            reconcile_state: '{{ next_active_force }}'
            force_allows_target: "{{ (next_active_force == 'opn' and force_allows_open)\n
              \  or (next_active_force == 'cls' and force_allows_close)\n   or (next_active_force
              == 'vnt' and force_allows_ventilate)\n   or (next_active_force == 'shd'
              and force_allows_shade) }}"
            log_user: 'force function off, another one is still on, target: {{ state_labels[next_active_force]
              }}'
        - *id015
        - variables:
            drive_plan:
              run: '{{ target_condition_ok and not is_paused and force_allows_target
                }}'
              action_set: '{{ state_targets[next_active_force].action_set }}'
              target: '{{ state_targets[next_active_force].target | int }}'
              target_tilt: '{{ state_targets[next_active_force].target_tilt | int
                }}'
            update_values:
              frc: '{{ next_active_force }}'
        - *id007
        - stop: Switched to the most recently activated force
      default:
      - choose:
        - alias: 'Force disabled: recovery enabled — pick target'
          conditions:
          - '{{ is_force_recovery_enabled }}'
          sequence:
          - variables:
              shading_ended_during_force: '{{ helper_state_shade and shading_end_conditions_met
                }}'
              recovery_target: '{% set shade_active = helper_state_shade and not shading_ended_during_force
                %} {% set vent_blocks_shading = is_ventilation_enabled and (window_opened_now
                or (window_tilted_now and not shading_over_ventilation)) %} {% if
                helper_state_base == ''cls'' and not (is_ventilation_enabled and window_any_now)
                %}cls {% elif shade_active and not vent_blocks_shading and resident_flags.allow_shade
                %}shd {% elif window_opened_now and resident_flags.allow_ventilate
                and is_ventilation_enabled %}lock {% elif helper_state_base == ''opn''
                and not (is_ventilation_enabled and window_opened_now) and not shade_active
                and resident_flags.allow_open %}opn {% elif window_tilted_now and
                not window_opened_now and resident_flags.allow_ventilate and is_ventilation_enabled
                %}vnt {% else %}non{% endif %}'
              reconcile_state: '{{ recovery_target }}'
          - *id015
          - choose:
            - alias: 'Force disabled recovery: drive to background target'
              conditions:
              - '{{ recovery_target not in [''lock'', ''vnt'', ''non''] }}'
              - '{{ target_condition_ok }}'
              sequence:
              - variables:
                  will_drive: "{{ not is_paused and\n   {'cls': force_allows_close
                    and closing_target_owned,\n    'shd': force_allows_shade,\n    'lock':
                    force_allows_ventilate,\n    'opn': force_allows_open}[recovery_target]
                    }}"
                  drive_plan: '{{ dict(state_targets[recovery_target], run=will_drive)
                    }}'
                  log_user: 'force function switched off, back to: {{ state_labels[recovery_target]
                    }}{{ '', the sun shading had ended meanwhile'' if shading_ended_during_force
                    else '''' }}'
                  log_extra: force disabled; recovery_target={{ recovery_target }}{{
                    '; shading end conditions met, shd cleared' if shading_ended_during_force
                    else '' }}
                  update_values: '{% set base = {''frc'': ''non''} %} {% if shading_ended_during_force
                    %}{% set base = dict(base, shd=0, ts={''shd'': ''now''}) %}{%
                    endif %} {% if recovery_target == ''shd'' %}{{ base }} {% elif
                    recovery_target == ''lock'' %}{{ dict(base, win=''opn'') }} {%
                    elif recovery_target == ''opn'' %}{{ dict(base, ts=dict(base.ts
                    | default({}), opn=''now'')) }} {% else %}{{ base }}{% endif %}'
              - *id007
              - stop: 'Force recovery: return to background target executed'
            - alias: 'Force disabled recovery: return to ventilation or lockout'
              conditions:
              - '{{ recovery_target in [''lock'', ''vnt''] }}'
              - '{{ target_condition_ok }}'
              sequence:
              - variables:
                  will_drive: '{{ not is_paused and force_allows_ventilate }}'
                  log_user: 'force function switched off, back to: {{ state_labels[recovery_target]
                    }}'
                  drive_plan: '{{ dict(state_targets[recovery_target], run=will_drive)
                    }}'
                  update_values: '{% set base = {''frc'': ''non''} %} {% if shading_ended_during_force
                    %}{{ dict(base, shd=0, ts={''shd'': ''now''}) }} {% elif recovery_target
                    == ''lock'' %}{{ dict(base, win=''opn'') }} {% else %}{{ base
                    }}{% endif %}'
              - *id007
              - stop: Return to Ventilation executed
            default:
            - variables:
                update_values: '{% if shading_ended_during_force %}{{ {''frc'': ''non'',
                  ''shd'': 0, ''ts'': {''shd'': ''now''}} }} {% else %}{{ {''frc'':
                  ''non''} }}{% endif %}'
            - *id007
            - stop: Force cleared, no recovery position matched
        default:
        - variables:
            update_values:
              frc: non
        - *id007
        - stop: Force disabled, no recovery
  - alias: Checking for manual position changes
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id in [''t_manual_position'', ''t_manual_tilt''] }}'
    - '{{ not (trigger.id == ''t_manual_position'' and in_reset_override_position
      and helper_state_manual) }}'
    - '{{ as_timestamp(now()) > helper_ts_drive + drive_time | default(90) + 60 }}'
    - '{{ trigger.from_state is not none and trigger.to_state is not none }}'
    - '{{ trigger.from_state.state not in invalid_states }}'
    - '{{ trigger.to_state.state not in invalid_states }}'
    - or:
      - and:
        - '{{ trigger.id == ''t_manual_position'' }}'
        - '{{ position_source == ''custom_sensor'' }}'
        - '{{ is_number(trigger.from_state.state) }}'
        - '{{ is_number(trigger.to_state.state) }}'
        - '{{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0)))
          | abs > position_tolerance }}'
      - and:
        - '{{ trigger.id == ''t_manual_position'' }}'
        - '{{ position_source == ''current_position_attr'' }}'
        - '{{ trigger.attribute == ''current_position'' }}'
        - '{{ trigger.from_state.attributes.current_position not in invalid_states
          }}'
        - '{{ trigger.to_state.attributes.current_position not in invalid_states }}'
        - '{{ is_number(trigger.from_state.attributes.current_position) }}'
        - '{{ is_number(trigger.to_state.attributes.current_position) }}'
        - or:
          - '{{ ((trigger.to_state.attributes.current_position | float(0)) - (trigger.from_state.attributes.current_position
            | float(0))) | abs > position_tolerance }}'
          - '{{ trigger.from_state.state in [''opening'', ''closing''] }}'
      - and:
        - '{{ trigger.id == ''t_manual_position'' }}'
        - '{{ position_source == ''position_attr'' }}'
        - '{{ trigger.attribute == ''position'' }}'
        - '{{ trigger.from_state.attributes.position not in invalid_states }}'
        - '{{ trigger.to_state.attributes.position not in invalid_states }}'
        - '{{ is_number(trigger.from_state.attributes.position) }}'
        - '{{ is_number(trigger.to_state.attributes.position) }}'
        - or:
          - '{{ ((trigger.to_state.attributes.position | float(0)) - (trigger.from_state.attributes.position
            | float(0))) | abs > position_tolerance }}'
          - '{{ trigger.from_state.state in [''opening'', ''closing''] }}'
      - and:
        - '{{ trigger.id == ''t_manual_tilt'' }}'
        - '{{ trigger.from_state.attributes.current_tilt_position not in invalid_states
          }}'
        - '{{ trigger.to_state.attributes.current_tilt_position not in invalid_states
          }}'
        - '{{ is_number(trigger.from_state.attributes.current_tilt_position | default(none))
          }}'
        - '{{ is_number(trigger.to_state.attributes.current_tilt_position | default(none))
          }}'
        - '{{ ((trigger.to_state.attributes.current_tilt_position | float(0)) - (trigger.from_state.attributes.current_tilt_position
          | float(0))) | abs > tilt_position_tolerance }}'
    sequence:
    - choose:
      - alias: 'Manual: tilted'
        conditions:
        - '{{ trigger.id == ''t_manual_tilt'' }}'
        sequence:
        - variables:
            update_values:
              man: 1
              ts:
                man: now
      - alias: 'Manual: opened'
        conditions:
        - '{{ is_up_enabled }}'
        - or:
          - '{{ in_open_position }}'
          - '{{ position_comparisons.current_above_open or current_position == open_position
            }}'
          - '{{ (is_awning and current_position == 0) or (not is_awning and current_position
            == 100) }}'
        sequence:
        - variables:
            adopt_schedule: "{{ adopt_flags.opening\n   and is_opening_phase\n   and
              helper_state_base != 'opn' }}"
            adopt_label: '{{ ''opening'' if adopt_schedule else '''' }}'
            update_values: "{{ {'man': 1, 'bas': 'opn', 'ts': {'man': 'now', 'opn':
              'now'}}\n   if adopt_schedule else {'man': 1, 'ts': {'man': 'now'}}
              }}"
      - alias: 'Manual: ventilated'
        conditions:
        - '{{ is_ventilation_enabled }}'
        - '{{ in_ventilate_position }}'
        - '{{ not in_open_position }}'
        sequence:
        - variables:
            update_values:
              man: 1
              ts:
                man: now
      - alias: 'Manual: shaded'
        conditions:
        - '{{ is_shading_enabled }}'
        - '{{ in_shading_position }}'
        sequence:
        - variables:
            update_values:
              man: 1
              ts:
                man: now
      - alias: 'Manual: closed'
        conditions:
        - '{{ is_down_enabled }}'
        - '{{ not in_shading_position }}'
        - or:
          - '{{ in_close_position }}'
          - '{{ position_comparisons.current_below_close or current_position == close_position
            }}'
          - '{{ (is_awning and current_position == 100) or (not is_awning and current_position
            == 0) }}'
        sequence:
        - variables:
            adopt_schedule: "{{ adopt_flags.closing\n   and is_closing_phase\n   and
              helper_state_base != 'cls' }}"
            adopt_label: '{{ ''closing'' if adopt_schedule else '''' }}'
            update_values: "{{ {'man': 1, 'bas': 'cls', 'ts': {'man': 'now', 'cls':
              'now'}}\n   if adopt_schedule else {'man': 1, 'ts': {'man': 'now'}}
              }}"
      default:
      - variables:
          update_values:
            man: 1
            ts:
              man: now
    - variables:
        log_user: the cover was moved by hand{{ ' and counts as the scheduled ' ~
          adopt_label if adopt_label | default('') else ', the automation stands back'
          }}
    - *id007
    - choose: []
      default: !input auto_manual_action
    - stop: Manual change detected
  - alias: Reset manual detection
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ not is_reset_disabled }}'
    - '{{ trigger.id in [''t_reset_fixedtime'', ''t_reset_timeout'', ''t_reset_position'']
      }}'
    - '{{ helper_state_manual }}'
    sequence:
    - variables:
        reset_state: '{{ effective_state if effective_state in [''lock'', ''vnt'',
          ''shd'', ''cls''] else ''opn'' }}'
        reconcile_state: '{{ reset_state }}'
        reset_force_allows: "{{ force_allows_ventilate if reset_state in ['lock',
          'vnt']\n   else force_allows_open if reset_state == 'opn'\n   else force_allows_shade
          if reset_state == 'shd'\n   else force_allows_close }}"
    - *id015
    - variables:
        reset_will_drive: "{{ target_condition_ok and not is_paused and reset_force_allows
          and\n   (reset_state != 'cls' or closing_target_owned or\n    helper_state_force
          == 'cls') }}"
        drive_plan: '{{ dict(state_targets[reset_state], run=reset_will_drive, delay_s=drive_delay_standard)
          }}'
        update_values:
          man: 0
        log_user: 'manual override reset, back to: {{ state_labels[reset_state] }}'
        log_extra: manual override reset; resuming to {{ reset_state }}
    - *id007
    - choose: []
      default: !input auto_override_reset_action
    - stop: Reset Manual Override executed
  - alias: Reset shading status that is no longer required - but still saved
    conditions:
    - '{{ trigger.id is defined }}'
    - '{{ trigger.id == ''t_shading_reset'' }}'
    - or:
      - '{{ helper_state_is_shaded }}'
      - '{{ helper_state_pending_start }}'
      - '{{ helper_state_pending_end }}'
    sequence:
    - delay:
        seconds: '{{ (range(0, 60) | random | int) }}'
    - variables:
        log_user: nightly reset, the sun shading is cleared for the new day
        update_values:
          shd: 0
          man: 0
          pnd: non
          ts:
            due: 0
            arm: 0
    - *id007
    - stop: Midnight Reset executed
  default:
  - if:
    - '{{ check_config }}'
    then:
    - repeat:
        for_each:
        - condition: "{{\n  (is_up_enabled or is_down_enabled) and\n  not is_time_field_enabled
            and\n  not is_calendar_enabled and\n  not (is_brightness_enabled and default_brightness_sensor
            != []) and\n  not (is_sun_elevation_enabled and default_sun_sensor !=
            []) and\n  not (resident_sensor != [] and\n       ('resident_opening_enabled'
            in resident_config or\n        'resident_closing_enabled' in resident_config))\n}}"
          message: 'Morning Opening / Evening Closing is enabled but has NO trigger
            source: Time Control is disabled (or the calendar has no entity), no Brightness/Sun
            sensor is configured and no Resident sensor with resident opening/closing
            is set up. The cover will never open or close automatically. For fixed-time
            schedules, enable the ''⏲️ Time Control'' checkbox in ''What should CCA
            control?'' - the Early/Late time fields are the schedule. Configurations
            saved before ~2026.05 must re-enable this checkbox once (breaking change
            2026.07.12)'
        - condition: '{{ check_status_helper_length is not none and check_status_helper_length
            | int < 225 }}'
          message: 'CRITICAL: Cover Status Helper max length is {{ check_status_helper_length
            }}. Required: at least 225 characters (recommended: 254). Increase the
            ''Maximum length'' of the input_text helper. Current length causes data
            truncation and the automation cannot persist state'
        - condition: '{{ state_attr(blind, ''current_position'') is none }}'
          message: Cover entity is missing the required 'current_position' attribute
        - condition: '{{ state_attr(default_sun_sensor, ''elevation'') is none }}'
          message: Sun sensor is missing the required 'elevation' attribute
        - condition: '{{ state_attr(default_sun_sensor, ''azimuth'') is none }}'
          message: Sun sensor is missing the required 'azimuth' attribute
        - condition: '{{ resident_sensor != [] and states(resident_sensor) not in
            [''false'', ''off'', ''true'', ''on''] }}'
          message: 'resident_sensor has invalid state. Must be: on, off, true, or
            false'
        - condition: '{{ shading_custom_sensor != [] and states(shading_custom_sensor)
            not in [''false'', ''off'', ''true'', ''on'', ''unknown'', ''unavailable'']
            }}'
          message: 'Sun Shading Custom Condition Sensor has invalid state. Must be
            binary: on/off'
        - condition: '{{ is_brightness_enabled and (default_brightness_sensor == []
            or not is_number(states(default_brightness_sensor))) }}'
          message: Brightness sensor not configured or has non-numeric state
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_up_sensor == []\n}}"
          message: Sun Elevation Mode is 'dynamic' but Sun Elevation Up Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_down_sensor == []\n}}"
          message: Sun Elevation Mode is 'dynamic' but Sun Elevation Down Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_up_sensor != [] and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Sun Elevation Up Sensor has non-numeric state. Sensor must provide
            numeric values in dynamic mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'dynamic' and\n  sun_elevation_down_sensor != [] and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Sun Elevation Down Sensor has non-numeric state. Sensor must provide
            numeric values in dynamic mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_up_sensor == []\n}}"
          message: Sun Elevation Mode is 'hybrid' but Sun Elevation Up Sensor is not
            configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_down_sensor == []\n}}"
          message: Sun Elevation Mode is 'hybrid' but Sun Elevation Down Sensor is
            not configured. Configure sensor or change mode to 'fixed'
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_up_sensor != [] and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Sun Elevation Up Sensor has non-numeric state. Sensor must provide
            numeric values in hybrid mode
        - condition: "{{\n  is_sun_elevation_enabled and\n  sun_elevation_mode ==
            'hybrid' and\n  sun_elevation_down_sensor != [] and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Sun Elevation Down Sensor has non-numeric state. Sensor must provide
            numeric values in hybrid mode
        - condition: '{{ is_cover_tilt_enabled and state_attr(blind, ''current_tilt_position'')
            is none }}'
          message: Tilt position control enabled but cover does not support 'current_tilt_position'
            attribute. Disable tilt features or check cover integration
        - condition: "{{\n  workday_sensor_today not in [[], none] and\n  states(workday_sensor_today)
            not in ['on', 'off', 'unknown', 'unavailable']\n}}"
          message: 'Workday sensor today has invalid state. Expected: on or off'
        - condition: "{{\n  workday_sensor_tomorrow not in [[], none] and\n  states(workday_sensor_tomorrow)
            not in ['on', 'off', 'unknown', 'unavailable']\n}}"
          message: 'Workday sensor tomorrow has invalid state. Expected: on or off'
        - condition: "{{\n  auto_up_force not in [[], none] and\n  states(auto_up_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Open entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_down_force not in [[], none] and\n  states(auto_down_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Close entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_ventilate_force not in [[], none] and\n  states(auto_ventilate_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Ventilate entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  auto_shading_start_force not in [[], none] and\n  states(auto_shading_start_force)
            not in ['on', 'off', 'true', 'false', 'unknown', 'unavailable']\n}}"
          message: 'Force Shading entity has invalid state. Must be binary: on/off'
        - condition: "{{\n  [\n    auto_up_force not in [[], none] and states(auto_up_force)
            in ['on', 'true'],\n    auto_down_force not in [[], none] and states(auto_down_force)
            in ['on', 'true'],\n    auto_ventilate_force not in [[], none] and states(auto_ventilate_force)
            in ['on', 'true'],\n    auto_shading_start_force not in [[], none] and
            states(auto_shading_start_force) in ['on', 'true']\n  ].count(true) >
            1\n}}"
          message: 'CRITICAL: Multiple force entities are active. Only one force entity
            can be active at a time. Deactivate conflicting force entities'
        - condition: "{{\n  default_sun_sensor not in [[], none] and\n  states(default_sun_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Sun sensor is unavailable. Check sun integration is enabled
        - condition: '{{ forecast_source.use_weather and states(shading_forecast_sensor)
            in [''unknown'', ''unavailable''] }}'
          message: Weather entity is unavailable. Check weather integration
        - condition: '{{ forecast_source.use_sensor and states(shading_forecast_temp_sensor)
            in [''unknown'', ''unavailable''] }}'
          message: Forecast temperature sensor is unavailable
        - condition: '{{ forecast_source.use_sensor and not is_number(states(shading_forecast_temp_sensor))
            }}'
          message: Forecast temperature sensor is non-numeric
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  states(sun_elevation_up_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Dynamic sun elevation up sensor is unavailable. Check sensor configuration
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  states(sun_elevation_up_sensor)
            not in invalid_states and\n  not is_number(states(sun_elevation_up_sensor))\n}}"
          message: Dynamic sun elevation up sensor has non-numeric state
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  is_number(states(sun_elevation_up_sensor))
            and\n  (states(sun_elevation_up_sensor) | float < -90 or states(sun_elevation_up_sensor)
            | float > 90)\n}}"
          message: Dynamic sun elevation up sensor value is outside valid range (-90°
            to 90°)
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  states(sun_elevation_down_sensor)
            in ['unknown', 'unavailable']\n}}"
          message: Dynamic sun elevation down sensor is unavailable. Check sensor
            configuration
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  states(sun_elevation_down_sensor)
            not in invalid_states and\n  not is_number(states(sun_elevation_down_sensor))\n}}"
          message: Dynamic sun elevation down sensor has non-numeric state
        - condition: "{{\n  sun_elevation_down_sensor != [] and\n  is_number(states(sun_elevation_down_sensor))
            and\n  (states(sun_elevation_down_sensor) | float < -90 or states(sun_elevation_down_sensor)
            | float > 90)\n}}"
          message: Dynamic sun elevation down sensor value is outside valid range
            (-90° to 90°)
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  sun_elevation_down_sensor
            != [] and\n  is_number(states(sun_elevation_up_sensor)) and\n  is_number(states(sun_elevation_down_sensor))
            and\n  (states(sun_elevation_up_sensor) | float) <= (states(sun_elevation_down_sensor)
            | float)\n}}"
          message: Dynamic sun elevation up sensor should be higher than down sensor
        - condition: "{{\n  sun_elevation_up_sensor != [] and\n  sun_elevation_down_sensor
            == [] and\n  sun_elevation_up <= sun_elevation_down\n}}"
          message: 'WARNING: Using dynamic sensor for UP but fixed value for DOWN.
            Thresholds may be inconsistent'
        - condition: "{{\n  sun_elevation_up_sensor == [] and\n  sun_elevation_down_sensor
            != [] and\n  sun_elevation_up <= sun_elevation_down\n}}"
          message: 'WARNING: Using dynamic sensor for DOWN but fixed value for UP.
            Thresholds may be inconsistent'
        - condition: "{{\n  is_calendar_enabled and\n  calendar_entity != [] and\n
            \ states(calendar_entity) in ['unknown', 'unavailable']\n}}"
          message: Calendar entity is unavailable. Check calendar integration
        - condition: "{{\n  is_calendar_enabled and\n  calendar_entity != [] and\n
            \ state_attr(calendar_entity, 'message') is none\n}}"
          message: Calendar entity does not have 'message' attribute. Ensure it's
            a valid calendar entity
        - condition: "{{\n  position_source == 'position_attr' and\n  state_attr(blind,
            'position') is none\n}}"
          message: Position source set to 'position' attribute but cover doesn't have
            this attribute
        - condition: "{{\n  position_source == 'current_position_attr' and\n  state_attr(blind,
            'current_position') is none\n}}"
          message: Position source set to 'current_position' attribute but cover doesn't
            have this attribute (try 'position' or custom sensor)
        - condition: "{{\n  position_source == 'custom_sensor' and\n  (custom_position_sensor
            == [] or states(custom_position_sensor) in invalid_states)\n}}"
          message: Custom position sensor selected but not configured or unavailable
        - condition: "{{\n  position_source == 'custom_sensor' and\n  custom_position_sensor
            != [] and\n  not is_number(states(custom_position_sensor))\n}}"
          message: Custom position sensor has non-numeric value
        sequence:
        - if:
          - '{{ repeat.item.condition }}'
          then:
          - action: system_log.write
            data:
              level: '{{ check_config_debuglevel }}'
              message: 'CCA Config issue: {{ repeat.item.message }} - {{ this.entity_id
                }}'
              logger: blueprints.hvorragend.cca
  - if: '{{ enable_logbook }}'
    then:
    - action: logbook.log
      data:
        name: '{{ this.attributes.friendly_name }}'
        entity_id: '{{ this.entity_id }}'
        message: "Branch: No operational branch matched | \nTrigger: {{ trigger.id
          | default('manual') }} | \nEffective: {{ effective_state }} | \nPosition:
          {{ current_position }}% {% if is_cover_tilt_enabled %} / Tilt: {{ current_tilt_position
          }}%{% endif %} | \nHelper: bas={{ helper_json.bas | default('opn') }} shd={{
          helper_json.shd | default(0) }} pnd={{ helper_json.pnd | default('non')
          }} win={{ helper_json.win | default('cls') }} frc={{ helper_json.frc | default('non')
          }} res={{ helper_json.res | default(0) }} man={{ helper_json.man | default(0)
          }} | \nStates: \nopn={{ states(contact_window_opened) if contact_window_opened
          != [] else '-' }} \ntlt={{ states(contact_window_tilted) if contact_window_tilted
          != [] else '-' }}\nres={{ state_resident }} \nsun_elev={{ current_sun_elevation
          | float(default=0) }}°({{ sun_elevation_up_current | float(default=0) |
          round(1) }}°/{{ sun_elevation_down_current | float(default=0) | round(1)
          }})° \nazim={{ current_sun_azimuth | float(default=0) | round(1) }}°\nbri={{
          states(default_brightness_sensor) if default_brightness_sensor != [] else
          '-' }} \nt1={{ states(shading_temperatur_sensor1) if shading_temperatur_sensor1
          != [] else '-' }} \nt2={{ states(shading_temperatur_sensor2) if shading_temperatur_sensor2
          != [] else '-' }}\nupdate={{ update_values | default({}) | to_json }} \n{%
          if log_extra is defined and log_extra %} extra={{ log_extra }}{% endif %}"
  - stop: No operational branch matched (Opening, Closing, Shading, etc. conditions
      not met for current trigger)
trace:
  stored_traces: !input trace_count
