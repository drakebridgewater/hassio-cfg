    or\n   ((recovery_mode == 'outage' or instance_activated) and not is_restart_run)
    }}"
  stale_day: "{{ helper_ts_write > 0 and\n   now().strftime('%Y-%m-%d') != helper_ts_write
    | timestamp_custom('%Y-%m-%d') }}"
  override_expired: "{{ helper_state_manual and (\n     instance_activated or (\n
