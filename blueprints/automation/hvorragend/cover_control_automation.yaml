    elevation: '{{ ''cond_elevation'' in shading_conditions_end_and or ''cond_elevation''
      in shading_conditions_end_or }}'
    brightness: '{{ ''cond_brightness'' in shading_conditions_end_and or ''cond_brightness''
      in shading_conditions_end_or }}'
    temp1: '{{ ''cond_temp1'' in shading_conditions_end_and or ''cond_temp1'' in shading_conditions_end_or
      }}'
    temp2: '{{ ''cond_temp2'' in shading_conditions_end_and or ''cond_temp2'' in shading_conditions_end_or
      }}'
    forecast_temp: '{{ ''cond_forecast_temp'' in shading_conditions_end_and or ''cond_forecast_temp''
      in shading_conditions_end_or }}'
    forecast_weather: '{{ ''cond_forecast_weather'' in shading_conditions_end_and
      or ''cond_forecast_weather'' in shading_conditions_end_or }}'
    custom: '{{ ''cond_custom'' in shading_conditions_end_and or ''cond_custom'' in
      shading_conditions_end_or }}'
  helper_json: "{% set helper_state = states(cover_status_helper) if cover_status_helper
    != [] else 'unavailable' %} {% set helper_raw = helper_state | from_json(default={})
    if helper_state not in invalid_states and helper_state | regex_match(\"((\\[[^\\}]+)?\\{\\s*[^\\}\\{]{3,}?:.*\\}([^\\{]+\\])?)\")
    else {} %} {% set ts_now = as_timestamp(now()) | round(0) %}\n{% set is_v5 = helper_raw.v
    | default(0) == 5 %} {% set is_v6_compact = helper_raw.bas is defined and helper_raw.v
    is defined and helper_raw.v == 6 %}\n{% if is_v5 %}\n  {% set v5_current =\n    'vfull'
    if helper_raw.vfull.a | default(0) == 1 else\n    'vpart' if helper_raw.vpart.a
    | default(0) == 1 else\n    'shade' if helper_raw.shading.a | default(0) == 1
    and helper_raw.shading.p | default(0) == 0 else\n    'close' if helper_raw.close.a
    | default(0) == 1 else\n    'open' if helper_raw.open.a | default(0) == 1 else\n
    \   'none'\n  %}\n\n  {% set v5_shs = helper_raw.shading.p | default(0) | int
    %}\n  {% set v5_she = helper_raw.shading.q | default(0) | int %}\n  {{\n    {\n
    \     'bas': 'cls' if v5_current == 'close' else 'opn',\n      'shd': 1 if v5_current
    == 'shade' else 0,\n      'pnd': 'beg' if v5_shs > 0 else ('end' if v5_she > 0
    else 'non'),\n      'win': 'opn' if v5_current == 'vfull' else ('tlt' if v5_current
    == 'vpart' else 'cls'),\n      'frc': 'non',\n      'res': 0,\n      'man': helper_raw.manual.a
    | default(0),\n      'ts': {\n        'opn': helper_raw.open.t | default(0),\n
    \       'cls': helper_raw.close.t | default(0),\n        'shd': helper_raw.shading.t
    | default(0) if v5_current == 'shade' else 0,\n        'due': v5_shs if v5_shs
    > 0 else v5_she,\n        'arm': 0,\n        'man': helper_raw.manual.t | default(0)\n
    \     },\n      'v': 6,\n      't': ts_now,\n      'd': 0\n    }\n  }}\n{% elif
    is_v6_compact %}\n  {% set raw_ts = helper_raw.ts | default({}) %}\n  {{\n    {\n
    \     'bas': helper_raw.bas | default('opn'),\n      'shd': helper_raw.shd | default(0)
    | int,\n      'pnd': helper_raw.pnd | default('non'),\n      'win': helper_raw.win
    | default('cls'),\n      'frc': helper_raw.frc | default('non'),\n      'res':
    helper_raw.res | default(0) | int,\n      'man': helper_raw.man | default(0) |
    int,\n      'ts': {\n        'opn': raw_ts.opn | default(0) | int,\n        'cls':
    raw_ts.cls | default(0) | int,\n        'shd': raw_ts.shd | default(0) | int,\n
    \       'due': raw_ts.due | default(0) | int,\n        'arm': raw_ts.arm | default(0)
    | int,\n        'man': raw_ts.man | default(0) | int\n      },\n      'v': 6,\n
    \     't': helper_raw.t | default(ts_now) | int,\n      'd': helper_raw.d | default(0)
    | int\n    }\n  }}\n{% else %}\n  {{\n    {\n      'bas': 'opn',\n      'shd':
    0,\n      'pnd': 'non',\n      'win': 'cls',\n      'frc': 'non',\n      'res':
    0,\n      'man': 0,\n      'ts': {\n        'opn': 0,\n        'cls': 0,\n        'shd':
    0,\n        'due': 0,\n        'arm': 0,\n        'man': 0\n      },\n      'v':
    6,\n      't': ts_now,\n      'd': 0\n    }\n  }}\n{% endif %}"
  state_resident: "{{ (helper_json.res | default(0) | int == 1)\n   if (resident_sensor
    != [] and states(resident_sensor) in invalid_states)\n   else (resident_sensor
    != [] and states(resident_sensor) in ['on', 'true']) }}"
  resident_flags:
    opening_trigger: '{{ ''resident_opening_enabled'' in resident_config }}'
    closing_trigger: '{{ ''resident_closing_enabled'' in resident_config }}'
    allow_open: '{{ ''resident_allow_opening'' in resident_config or not state_resident
      }}'
    allow_shade: '{{ ''resident_allow_shading'' in resident_config or not state_resident
      }}'
    allow_ventilate: '{{ ''resident_allow_ventilation'' in resident_config or not
      state_resident }}'
  effective_state: "{% set h = helper_json %} {% set resident_present = state_resident
    %} {% set allow_vent = 'resident_allow_ventilation' in resident_config or not
    resident_present %} {% set allow_shade = 'resident_allow_shading' in resident_config
    or not resident_present %} {% set allow_open = 'resident_allow_opening' in resident_config
    or not resident_present %} {% set privacy_active = resident_present and 'resident_closing_enabled'
    in resident_config %} {% set s_opn = is_ventilation_enabled and contact_window_opened
    != [] and states(contact_window_opened) in ['true', 'on'] %} {% set s_tlt = is_ventilation_enabled
    and contact_window_tilted != [] and states(contact_window_tilted) in ['true',
    'on'] %} {% set w = 'opn' if s_opn else 'tlt' if s_tlt else h.win if (contact_window_opened
    == [] and contact_window_tilted == []) else 'cls' %} {% if h.frc != 'non' %}\n
    \ {{ h.frc }}\n{% elif w == 'opn' %}\n  lock\n{% else %}\n  {% if privacy_active
    %}\n    {% set base_target = 'cls' %}\n  {% elif h.shd | int == 1 and allow_shade
    %}\n    {% set base_target = 'shd' %}\n  {% elif h.bas == 'opn' and not allow_open
    %}\n    {% set base_target = 'cls' %}\n  {% else %}\n    {% set base_target =
    h.bas %}\n  {% endif %}\n  {% set base_open_scheduled = base_target == 'opn' and
    is_opening_scheduled %}\n  {% set shading_wins = base_target == 'shd' and shading_over_ventilation
    %}\n  {% if w == 'tlt' and allow_vent and not base_open_scheduled and not shading_wins
    %}\n    vnt\n  {% else %}\n    {{ base_target }}\n  {% endif %}\n{% endif %}"
  helper_state_force: '{{ helper_json.frc | default(''non'') }}'
  helper_state_resident: '{{ helper_json.res | default(0) | int == 1 }}'
  helper_state_manual: '{{ helper_json.man | default(0) | int == 1 }}'
  helper_state_base: '{{ helper_json.bas | default(''opn'') }}'
  helper_state_window: '{{ helper_json.win | default(''cls'') }}'
  helper_state_shade: '{{ helper_json.shd | default(0) | int == 1 }}'
  helper_ts_open: '{{ helper_json.ts.opn | default(0) | int }}'
  helper_ts_close: '{{ helper_json.ts.cls | default(0) | int }}'
  helper_ts_shade: '{{ helper_json.ts.shd | default(0) | int }}'
  helper_ts_pending_arm: '{{ helper_json.ts.arm | default(0) | int }}'
  helper_ts_man: '{{ helper_json.ts.man | default(0) | int }}'
  helper_ts_pending_due: '{{ helper_json.ts.due | default(0) | int }}'
  configured_entities: "{{ ([blind] if blind != [] else []) +\n   ([cover_status_helper]
