    == 'custom_sensor' and custom_position_sensor != [] else []) +\n   ([contact_window_opened]
    if contact_window_opened != [] else []) +\n   ([contact_window_tilted] if contact_window_tilted
    != [] else []) +\n   ([resident_sensor] if resident_sensor != [] else []) +\n
    \  ([default_brightness_sensor] if default_brightness_sensor != [] else []) +\n
    \  ([default_sun_sensor] if default_sun_sensor != [] else []) +\n   ([shading_forecast_sensor]
    if shading_forecast_sensor != [] else []) +\n   ([shading_forecast_temp_sensor]
    if shading_forecast_temp_sensor != [] else []) +\n   ([shading_temperatur_sensor1]
    if shading_temperatur_sensor1 != [] else []) +\n   ([shading_temperatur_sensor2]
    if shading_temperatur_sensor2 != [] else []) +\n   ([shading_brightness_sensor]
    if shading_brightness_sensor != [] else []) +\n   ([shading_custom_sensor] if
    shading_custom_sensor != [] else []) +\n   ([shading_position_alt_entity] if shading_position_alt_entity
    != [] else []) +\n   ([calendar_entity] if calendar_entity != [] else []) +\n
    \  ([workday_sensor_today] if workday_sensor_today != [] else []) +\n   ([workday_sensor_tomorrow]
    if workday_sensor_tomorrow != [] else []) +\n   ([auto_up_force] if auto_up_force
    != [] else []) +\n   ([auto_down_force] if auto_down_force != [] else []) +\n
    \  ([auto_shading_start_force] if auto_shading_start_force != [] else []) +\n
    \  ([auto_ventilate_force] if auto_ventilate_force != [] else []) +\n   ([force_pause]
    if force_pause != [] else []) +\n   ([instance_active] if instance_active != []
    else []) }}"
  helper_ts_write: '{{ helper_json.t | default(0) | int }}'
  helper_ts_drive: '{{ helper_json.d | default(0) | int }}'
  automation_resumed: "{{ helper_ts_write > 0 and\n   helper_ts_write < as_timestamp(this.last_changed
    | default(0), 0) }}"
  instance_active_on_states: '{{ [''on'', ''true''] if instance_active_value | trim
    == '''' else [instance_active_value | trim] }}'
  instance_activated: "{{ instance_active != [] and states[instance_active] is not
    none and\n   states(instance_active) in instance_active_on_states and\n   helper_ts_write
    < as_timestamp(states[instance_active].last_changed | default(0), 0) }}"
  is_restart_run: "{% set attached = as_timestamp(this.last_changed | default(0),
    0) %} {% set from_state = trigger.from_state if trigger is defined and trigger.from_state
    is defined else none %} {% set outage_began = as_timestamp(from_state.last_changed,
    0)\n     if from_state is not none and from_state.state in invalid_states else
    0 %}\n{{ automation_resumed or\n   as_timestamp(now()) < attached + 300 or\n   (outage_began
    > 0 and outage_began < attached + 300) }}"
  manual_reset_event: "{{ helper_state_manual and trigger is defined and\n   trigger.id
    | default('') in ['t_reset_fixedtime', 't_reset_timeout', 't_reset_position']
    }}"
  recovery_catch_up: "{{ (manual_reset_event and override_expired) or\n   recovery_mode
