max_columns: 4
title: Ethan Chores
path: Chores
sections:
  - type: grid
    cards:
      - square: false
        type: grid
        columns: 1
        cards:
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version ************* --#} 
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Debug: Check if entity exists --#}
                {%- set helper_state = states(dashboard_helper) -%}
                {%- if helper_state == 'unavailable' or helper_state == 'unknown' -%}
                  {{
                    {
                      'type': 'markdown',
                      'content': '## ⚠️ Error\nDashboard helper entity not found: ' ~ dashboard_helper ~ '\nState: ' ~ helper_state
                    }
                  }},
                {%- endif -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set chores_data = state_attr(dashboard_helper, 'chores') | default([]) -%}
                {%- set achievements_data = state_attr(dashboard_helper, 'achievements') | default([]) -%}
                {%- set challenges_data = state_attr(dashboard_helper, 'challenges') | default([]) -%}
                
                {#-- Get points info from core sensors --#}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set points = states(points_eid) | int(default=0) -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                {%- set points_icon = state_attr(points_eid, 'icon') | default('mdi:star') -%}
                
                {#-- Get stats from sensors --#}
                {%- set chores_eid = core_sensors.chores_eid | default('sensor.kc_' ~ kid_name_slug ~ '_chores') -%}
                {%- set weekly_completed = state_attr(chores_eid, 'weekly_completed') | int(default=0) -%}
                {%- set todays_completed = state_attr(chores_eid, 'daily_completed') | int(default=0) -%}
                {%- set all_time_completed = state_attr(chores_eid, 'total_completed') | int(default=0) -%}
                
                {#-- Count overdue chores --#}
                {%- set overdue_count = chores_data | selectattr('status', 'eq', 'overdue') | list | count -%}
                
                {#-- Get highest badge info --#}
                {%- set badges_eid = core_sensors.badges_eid | default('sensor.kc_' ~ kid_name_slug ~ '_badges') -%}
                {%- set highest_badge = states(badges_eid ~ '_highest_badge') | default('None') -%}
                {%- set highest_badge_icon = state_attr(badges_eid ~ '_highest_badge', 'icon') | default('mdi:medal-outline') -%}
                {%- set highest_badge_multiplier = state_attr(badges_eid ~ '_highest_badge', 'points_multiplier') | float(default=1) -%}
                
                {#-- Construct Badge Display Line --#}
                {%- set badge_display_line = "" -%}
                {%- if highest_badge not in ['None', 'unknown', 'Unknown', 'unavailable'] -%}
                  {%- if highest_badge_multiplier > 1 -%}
                    {%- set badge_display_line = "<ha-icon icon='" ~ highest_badge_icon ~ "'></ha-icon> " ~ highest_badge ~ " (x" ~ highest_badge_multiplier|string ~ ")  \n" -%}
                  {%- else -%}
                    {%- set badge_display_line = "<ha-icon icon='" ~ highest_badge_icon ~ "'></ha-icon> " ~ highest_badge ~ "  \n" -%}
                  {%- endif -%}
                {%- endif -%}
                
                {#-- Process Achievements --#}
                {%- set welcome_ns = namespace(achievements_list=[], challenges_list=[]) -%}
                {%- for achievement in achievements_data -%}
                  {%- set achievement_sensor = states(achievement.eid) if achievement.eid else none -%}
                  {%- if achievement_sensor and achievement_sensor != 'unavailable' and achievement_sensor != 'unknown' -%}
                    {%- set progress = states(achievement.eid) | float(default=0) -%}
                    {%- set awarded = state_attr(achievement.eid, 'awarded') | default(false) -%}
                    {%- set reward_points = state_attr(achievement.eid, 'reward_points') | int(default=0) -%}
                    {%- set status = ui_translations.completed if awarded else '⌛ ' ~ progress|round(0) ~ '%' -%}
                    {%- set icon = state_attr(achievement.eid, 'icon') | default('mdi:trophy-award') -%}
                    {%- set welcome_ns.achievements_list = welcome_ns.achievements_list + ["&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" ~ "<ha-icon icon='" ~ icon ~ "'></ha-icon>&nbsp;" ~ achievement.name ~ " (" ~ status ~ ", 💎 " ~ reward_points ~ ")"] -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Process Challenges --#}
                {%- for challenge in challenges_data -%}
                  {%- set challenge_sensor = states(challenge.eid) if challenge.eid else none -%}
                  {%- if challenge_sensor and challenge_sensor != 'unavailable' and challenge_sensor != 'unknown' -%}
                    {%- set progress = states(challenge.eid) | float(default=0) -%}
                    {%- set awarded = state_attr(challenge.eid, 'awarded') | default(false) -%}
                    {%- set reward_points = state_attr(challenge.eid, 'reward_points') | int(default=0) -%}
                    {%- set status = ui_translations.completed if awarded else '⌛ ' ~ progress|round(0) ~ '%' -%}
                    {%- set icon = state_attr(challenge.eid, 'icon') | default('mdi:flag-checkered') -%}
                    {%- set welcome_ns.challenges_list = welcome_ns.challenges_list + ["&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" ~ "<ha-icon icon='" ~ icon ~ "'></ha-icon>&nbsp;" ~ challenge.name ~ " (" ~ status ~ ", 💎 " ~ reward_points ~ ")"] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set achievements_list = welcome_ns.achievements_list -%}
                {%- set challenges_list = welcome_ns.challenges_list -%}
                
                {#-- Create Content --#}
                {%- set content = "## 👋 " ~ (ui_translations.welcome | default('Welcome')) ~ ", " ~ kid_name ~ "! \n" "#### " ~ "<ha-icon icon=" ~ points_icon ~ "></ha-icon>" ~ "&nbsp;&nbsp;" ~ points_label ~ ": &nbsp;&nbsp;" ~ points ~ "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;" ~ badge_display_line ~ " \n" "**📅 " ~ (ui_translations.weekly_completed | default('Weekly Completed')) ~ ":** &nbsp;&nbsp;" ~ weekly_completed ~ "  \n" "**☀️ " ~ (ui_translations.todays_completed | default("Today's Completed")) ~ ":** &nbsp;&nbsp;" ~ todays_completed ~ "  \n\n" -%}
                {%- if achievements_list | length > 0 -%}
                  {%- set content = content ~ "**🏆 " ~ (ui_translations.achievements | default('Achievements')) ~ ":** &nbsp;&nbsp; " ~ ('\n' ~ ('\n'.join(achievements_list)) if achievements_list | length > 0 else "&nbsp;" ~ (ui_translations.none | default('None'))) ~ "  \n" -%}
                {%- endif -%}
                {%- if challenges_list | length > 0 -%}
                  {%- set content = content ~ "**🏁 " ~ (ui_translations.challenges | default('Challenges')) ~ ":** &nbsp;&nbsp; " ~ ('\n' ~ ('\n'.join(challenges_list)) if challenges_list | length > 0 else "&nbsp;" ~ (ui_translations.none | default('None'))) ~ "  \n" -%}
                {%- endif -%}
                {{
                  {
                    'type': 'markdown',
                    'content': content
                  }
                }},
      - type: grid
        square: false
        columns: 1
        cards:
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Chores Section ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set chores_data = state_attr(dashboard_helper, 'chores') | default([]) -%}
                
                {#-- Debug: Check chores data --#}
                {%- if chores_data | length == 0 -%}
                  {{
                    {
                      'type': 'markdown',
                      'content': '## ⚠️ Debug\nNo chores found in dashboard helper.\nChores data length: ' ~ (chores_data | length | string)
                    }
                  }},
                {%- endif -%}
                
                {#-- Get points info --#}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                
                {#-- Preferences --#}
                {%- set pref_column_count = 2 -%}
                {%- set pref_use_overdue_grouping = true -%}
                {%- set pref_use_today_grouping = true -%}
                {%- set pref_use_weekly_grouping = true -%}
                {%- set pref_use_label_grouping = true -%}
                {%- set pref_exclude_label_list = [] -%}
                {%- set pref_exclude_approved = false -%}
                
                {#-- Group chores using namespace to persist variables across loop scope --#}
                {%- set ns = namespace(
                    overdue_chores=[],
                    am_chores=[],
                    pm_chores=[],
                    weekly_chores=[],
                    other_chores=[],
                    label_groups={}
                  ) -%}
                
                {%- for chore in chores_data -%}
                  {%- set chore_eid = chore.eid -%}
                  {%- set claim_button = chore_eid | regex_replace('^sensor\\.kc_(\\w+)_chore_status_(.+)$', 'button.kc_\\1_chore_claim_\\2') -%}
                  {%- set chore_status = chore.status | default('pending') -%}
                  {%- set primary_group = chore.primary_group | default('other') -%}
                  {%- set is_today_am = chore.is_today_am -%}
                  {%- set chore_labels = chore.labels | default([]) -%}
                  
                  {#-- Skip if excluded by label --#}
                  {%- set should_exclude = chore_labels | select('in', pref_exclude_label_list) | list | count > 0 -%}
                  
                  {%- if not should_exclude -%}
                    {%- set allow_multiple = chore.allow_multiple_claims_per_day | default(false) -%}
                    {%- if chore_status == 'approved' and not allow_multiple and pref_exclude_approved -%}
                      {#-- Skip approved chores if configured --#}
                    {%- else -%}
                      {%- set entry = {'chore': chore, 'button': claim_button} -%}
                      {#-- Group by status first (overdue) --#}
                      {%- if chore_status == 'overdue' and pref_use_overdue_grouping -%}
                        {%- set ns.overdue_chores = ns.overdue_chores + [entry] -%}
                      {#-- Group by primary_group from helper --#}
                      {%- elif primary_group == 'today' and pref_use_today_grouping -%}
                        {%- if is_today_am == true or is_today_am == 'true' -%}
                          {%- set ns.am_chores = ns.am_chores + [entry] -%}
                        {%- else -%}
                          {%- set ns.pm_chores = ns.pm_chores + [entry] -%}
                        {%- endif -%}
                      {%- elif primary_group == 'this_week' and pref_use_weekly_grouping -%}
                        {%- set ns.weekly_chores = ns.weekly_chores + [entry] -%}
                      {#-- Group by labels if enabled and labels exist --#}
                      {%- elif pref_use_label_grouping and chore_labels | length > 0 -%}
                        {%- for label in chore_labels -%}
                          {%- if label not in pref_exclude_label_list -%}
                            {%- set existing = ns.label_groups.get(label, []) -%}
                            {%- set ns.label_groups = ns.label_groups | combine({label: existing + [entry]}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- else -%}
                        {#-- Default to other group --#}
                        {%- set ns.other_chores = ns.other_chores + [entry] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Build button groups using namespace for label loop --#}
                {%- set ns2 = namespace(label_group_list=[]) -%}
                {%- for label, chores_list in ns.label_groups.items() -%}
                  {%- set ns2.label_group_list = ns2.label_group_list + [{'name': label, 'chores': chores_list, 'icon': 'mdi:label'}] -%}
                {%- endfor -%}
                {%- set button_groups = [
                    {'name': "!!!!!!!!!!! " ~ (ui_translations.overdue_chores | default('Overdue Chores')) ~ " !!!!!!!!!!!", 'chores': ns.overdue_chores, 'icon': 'mdi:alert-octagon'},
                    {'name': ui_translations.due_this_morning | default('Due This Morning'), 'chores': ns.am_chores, 'icon': 'mdi:alarm'},
                    {'name': ui_translations.due_today | default('Due Today'), 'chores': ns.pm_chores, 'icon': 'mdi:calendar-today'},
                    {'name': ui_translations.due_this_week | default('Due This Week'), 'chores': ns.weekly_chores, 'icon': 'mdi:calendar-week'}
                  ] + ns2.label_group_list + [
                    {'name': ui_translations.upcoming_bonus | default('Upcoming & Bonus'), 'chores': ns.other_chores, 'icon': 'mdi:calendar-clock'}
                  ] -%}

                {#-- Display the overall chores heading card --#}
                {{
                  {
                    'type': 'heading',
                    'icon': 'mdi:broom',
                    'heading': ui_translations.chores | default('Chores'),
                    'heading_style': 'title',
                  }
                }},

                {#-- Loop through the button groups and create all claim buttons --#}
                {%- for group in button_groups -%}
                  {%- if group.chores | length > 0 -%}
                    {{
                      {
                        'type': 'heading',
                        'icon': group.icon,
                        'heading': group.name,
                        'heading_style': 'title',
                      }
                    }},
                    
                    {%- set gc = namespace(cards=[]) -%}
                    {%- for item in group.chores -%}
                      {%- set chore = item.chore -%}
                      {%- set claim_button = item.button -%}
                      {%- set chore_eid = chore.eid -%}
                      {%- set chore_sensor = states(chore_eid) if chore_eid else none -%}
                      
                      {#-- Get chore details from helper data and sensor --#}
                      {%- set chore_name = chore.name | default(state_attr(chore_eid, 'chore_name') | default('Unknown')) -%}
                      {%- set chore_status = chore.status | default('pending') -%}
                      {%- set due_date_str = chore.due_date -%}
                      {%- set due_date = as_datetime(due_date_str).astimezone(now().tzinfo) if due_date_str and due_date_str != 'null' and due_date_str != none else None -%}
                      {%- set recurring = state_attr(chore_eid, 'recurring_frequency') | default('') -%}
                      {%- set today = now().astimezone(now().tzinfo).date() -%}
                      {%- set due_date_short = 
                          (ui_translations.daily | default('Daily')) if recurring == 'daily' and not due_date else 
                          (ui_translations.weekly | default('Weekly')) if recurring == 'weekly' and not due_date else
                          (ui_translations.no_due_date | default('No Due Date')) if not due_date else 
                          (due_date.strftime('%-I:%M %p') if due_date.date() == today else as_timestamp(due_date) | timestamp_custom('%a %b %-d', true)) 
                      -%}
                      {%- set chore_desc = state_attr(chore_eid, 'description') | default('') -%}
                      {%- set shared_chore = chore.shared_chore | default(state_attr(chore_eid, 'shared_chore') | default(false)) -%}
                      {%- set multi_approve = chore.allow_multiple_claims_per_day | default(state_attr(chore_eid, 'allow_multiple_claims_per_day') | default(false)) -%}
                      {%- set points = chore.default_points | default(state_attr(chore_eid, 'default_points') | default(0)) | string -%}
                      {%- set streak = chore.chore_current_streak | default(state_attr(chore_eid, 'chore_current_streak') | default(0)) | string -%}
                      {%- set global_chore_state = chore.global_state | default(state_attr(chore_eid, 'global_state') | default('')) -%}
                      {%- set chore_icon = chore.icon | default(state_attr(chore_eid, 'icon') | default('mdi:checkbox-marked-circle-outline')) -%}
                      
                      {#-- Get last update time from button --#}
                      {%- set button_state = states(claim_button) if claim_button else none -%}
                      {%- if button_state and button_state not in ['unknown', 'unavailable', 'error'] -%}
                        {%- set ts_diff = (now().timestamp() - as_timestamp(button_state)) | float(0) -%}
                        {%- set last_update = (
                            '%.0f minutes ago' % (ts_diff / 60)
                            if ts_diff < 3600 else
                            '%.0f hours ago' % (ts_diff / 3600)
                            if ts_diff < 86400 else
                            '%.0f days ago' % (ts_diff / 86400)
                          ) -%}
                      {%- else -%}
                        {%- set last_update = '' -%}
                      {%- endif -%}
                      
                      {#-- Build display strings --#}
                      {%- set primary = chore_name ~ (' (' ~ (ui_translations.shared_chore | default('S')) ~ ')' if shared_chore else '') -%}
                      {%- set state_map = {
                          'pending': ui_translations.pending | default('Pending'),
                          'claimed': ui_translations.claimed | default('Claimed'),
                          'approved': ui_translations.approved | default('Approved'),
                          'overdue': ui_translations.overdue | default('Overdue')
                      } -%}
                      {%- set chore_state_display = (state_map[chore_status] if chore_status in state_map else chore_status) ~ (' (' ~ (ui_translations.allow_multiple_claims | default('M')) ~ ')' if multi_approve else '') -%}
                      {%- set secondary = points_label ~ ': ' ~ points ~ '\n' ~ (ui_translations.streak | default('Streak')) ~ ': ' ~ streak ~ '\n \n' ~ (ui_translations.status | default('Status')) ~ ': ' ~ chore_state_display ~ '\n' ~ (ui_translations.due | default('Due')) ~ ': ' ~ due_date_short ~ ('\n' ~ (ui_translations.description | default('Description')) ~ ': ' ~ chore_desc if chore_desc and chore_desc not in ['None', 'unknown', 'unavailable', ''] else '') -%}
                      
                      {#-- Set colors and icons --#}
                      {%- set icon_color = (
                            'blue' if chore_status == 'approved' and multi_approve else
                            'green' if chore_status == 'approved' else
                            'yellow' if chore_status == 'partial' else
                            'orange' if chore_status == 'claimed' else
                            'red' if chore_status == 'overdue' else
                            'purple' if '_in_part' in global_chore_state else
                            'grey'
                          ) -%}
                      {%- set badge_color = (
                            'blue' if chore_status == 'approved' and multi_approve else
                            'green' if chore_status == 'approved' or chore_status == 'partial' or chore_status == 'claimed' else
                            'red' if chore_status == 'overdue' else
                            'purple' if '_in_part' in global_chore_state else
                            'grey'
                          ) -%}
                      {%- set badge_icon = (
                            'mdi:check-bold' if chore_status in ['approved', 'partial', 'claimed'] else
                            'mdi:exclamation-thick' if chore_status == 'overdue' else
                            'mdi:account-group' if '_in_part' in global_chore_state else
                            ''
                          ) -%}
                      
                      {#-- Add chore card using namespace --#}
                      {%- set gc.cards = gc.cards + [{
                          'type': 'custom:mushroom-template-card',
                          'entity': claim_button,
                          'primary': primary,
                          'multiline_secondary': 'false',
                          'secondary': secondary,
                          'layout': 'horizontal',
                          'icon': chore_icon,
                          'icon_color': icon_color,
                          'badge_icon': badge_icon,
                          'badge_color': badge_color,
                          'tap_action': {
                            'action': 'toggle'
                          },
                          'hold_action': {
                            'action': 'more-info'
                          }
                      }] -%}
                    {%- endfor -%}
                    
                    {#-- Display the grid card for this group --#}
                    {{
                      {
                        'type': 'grid',
                        'columns': pref_column_count,
                        'square': false,
                        'cards': gc.cards
                      }
                    }},
                  {%- endif -%}
                {%- endfor -%}
      - square: false
        type: grid
        columns: 1
        cards:
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Rewards Section ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set rewards_data = state_attr(dashboard_helper, 'rewards') | default([]) -%}
                
                {#-- Get points info --#}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set current_points = states(points_eid) | int(default=0) -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                
                {#-- Preferences --#}
                {%- set pref_column_count = 2 -%}
                {%- set pref_use_label_grouping = false -%}
                {%- set pref_exclude_label_list = [] -%}
                
                {#-- Group rewards by labels using namespace --#}
                {%- set rns = namespace(reward_groups={}) -%}
                {%- if not pref_use_label_grouping -%}
                  {%- set rns.reward_groups = {'-No Label-': []} -%}
                {%- endif -%}
                
                {%- for reward in rewards_data -%}
                  {%- set reward_eid = reward.eid -%}
                  {%- set reward_sensor = states(reward_eid) if reward_eid else none -%}
                  {%- if reward_sensor and reward_sensor != 'unavailable' and reward_sensor != 'unknown' -%}
                    {%- set reward_labels = reward.labels | default([]) -%}
                    {%- set reward_name = reward.name | default(state_attr(reward_eid, 'reward_name') | default('Unknown')) -%}
                    {%- set reward_cost = reward.cost | default(state_attr(reward_eid, 'cost') | default(0)) -%}
                    {%- set reward_status = reward.status | default('not_claimed') -%}
                    {%- set reward_icon = state_attr(reward_eid, 'icon') | default('mdi:gift') -%}
                    {%- set approvals = reward.approvals | default(state_attr(reward_eid, 'reward_approvals_count') | default(0)) -%}
                    {%- set claims = reward.claims | default(state_attr(reward_eid, 'reward_claims_count') | default(0)) -%}
                    {%- set claim_button = reward_eid | regex_replace('^sensor\\.kc_(\\w+)_reward_status_(.+)$', 'button.kc_\\1_reward_claim_\\2') -%}
                    {%- set entry = {'reward': reward, 'name': reward_name, 'cost': reward_cost, 'icon': reward_icon, 'approvals': approvals, 'claims': claims, 'button': claim_button} -%}
                    
                    {#-- Check if labels should be excluded --#}
                    {%- set should_exclude = reward_labels | select('in', pref_exclude_label_list) | list | count > 0 -%}
                    
                    {%- if not should_exclude -%}
                      {#-- Group by label --#}
                      {%- if pref_use_label_grouping and reward_labels | length > 0 -%}
                        {%- for label in reward_labels -%}
                          {%- if label not in pref_exclude_label_list -%}
                            {%- set existing = rns.reward_groups.get(label, []) -%}
                            {%- set rns.reward_groups = rns.reward_groups | combine({label: existing + [entry]}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- else -%}
                        {%- set existing = rns.reward_groups.get('-No Label-', []) -%}
                        {%- set rns.reward_groups = rns.reward_groups | combine({'-No Label-': existing + [entry]}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set reward_groups = rns.reward_groups -%}
                
                {#-- Display reward groups --#}
                {%- for group_name, rewards_list in reward_groups.items() -%}
                  {%- if rewards_list | length > 0 -%}
                    {{
                      {
                        'type': 'heading',
                        'icon': 'mdi:gift-outline',
                        'heading': group_name if group_name != '-No Label-' else (ui_translations.rewards | default('Rewards')),
                        'heading_style': 'title',
                      }
                    }},
                    
                    {%- set rg = namespace(cards=[]) -%}
                    {%- for item in rewards_list | sort(attribute='cost') -%}
                      {%- set points_needed = item.cost - current_points if item.cost > current_points else 0 -%}
                      {%- set can_claim = "✅" if points_needed == 0 else "❌ " ~ (ui_translations.need | default('Need')) ~ " " ~ points_needed ~ " " ~ (ui_translations.more | default('more')) -%}
                      
                      {%- set rg.cards = rg.cards + [{
                        'type': 'custom:mushroom-template-card',
                        'primary': item.name,
                        'layout': 'horizontal',
                        'secondary': "💰 " ~ (ui_translations.cost | default('Cost')) ~ ": " ~ item.cost|string ~ " | 👍 " ~ item.approvals|string ~ " | 📥 " ~ item.claims|string ~ " | " ~ can_claim,
                        'icon': item.icon,
                        'icon_color': 'green' if points_needed == 0 else 'grey',
                        'tap_action': { 'action': 'call-service', 'service': 'button.press', 'target': {'entity_id': item.button } }
                      }] -%}
                    {%- endfor -%}
                    
                    {{
                      {
                        'type': 'grid',
                        'columns': pref_column_count,
                        'square': true,
                        'cards': rg.cards if rg.cards | length > 0 else [{'type': 'markdown', 'content': ui_translations.no_rewards | default('No rewards available.')}]
                      }
                    }},
                  {%- endif -%}
                {%- endfor -%}
  - type: grid
    cards:
      - square: false
        type: grid
        columns: 1
        cards:
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Showcase Section ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set badges_data = state_attr(dashboard_helper, 'badges') | default([]) -%}
                {%- set rewards_data = state_attr(dashboard_helper, 'rewards') | default([]) -%}
                {%- set bonuses_data = state_attr(dashboard_helper, 'bonuses') | default([]) -%}
                {%- set penalties_data = state_attr(dashboard_helper, 'penalties') | default([]) -%}
                {%- set achievements_data = state_attr(dashboard_helper, 'achievements') | default([]) -%}
                {%- set challenges_data = state_attr(dashboard_helper, 'challenges') | default([]) -%}
                
                {#-- Get points info --#}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set points = states(points_eid) | int(default=0) -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                {%- set points_icon = state_attr(points_eid, 'icon') | default('mdi:star') -%}
                
                {#-- Get stats from sensors --#}
                {%- set chores_eid = core_sensors.chores_eid | default('sensor.kc_' ~ kid_name_slug ~ '_chores') -%}
                {%- set all_time_completed = state_attr(chores_eid, 'total_completed') | int(default=0) -%}
                
                {#-- Get highest badge info --#}
                {%- set badges_eid = core_sensors.badges_eid | default('sensor.kc_' ~ kid_name_slug ~ '_badges') -%}
                {%- set highest_badge = states(badges_eid ~ '_highest_badge') | default('None') -%}
                {%- set highest_badge_icon = state_attr(badges_eid ~ '_highest_badge', 'icon') | default('mdi:medal-outline') -%}
                {%- set highest_badge_multiplier = state_attr(badges_eid ~ '_highest_badge', 'points_multiplier') | float(default=1) -%}
                {%- set all_earned_badges = state_attr(badges_eid ~ '_highest_badge', 'all_earned_badges') | default([], true) -%}
                
                {#-- Construct Badge Display Line --#}
                {%- set badge_display_line = "" -%}
                {%- if highest_badge not in ['None', 'unknown', 'Unknown', 'unavailable'] -%}
                  {%- set badge_display_line = "<ha-icon icon='" ~ highest_badge_icon ~ "'></ha-icon> " ~ highest_badge -%}
                {%- else -%}
                  {%- set badge_display_line = ui_translations.none | default('None') -%}
                {%- endif -%}
                
                {#-- Construct Badge List --#}
                {%- set sc = namespace(badge_list='\n ', reward_progress=[], bonuses=[], penalties=[], achievements=[], challenges=[], total_bonus_points=0, total_penalty_points=0) -%}
                {%- for badge in all_earned_badges -%}
                  {%- set badge_name_normalize = badge | slugify() -%}
                  {%- set badge_entity = 'sensor.kc_' ~ badge_name_normalize ~ '_badge' -%}
                  {%- set badge_icon = state_attr(badge_entity, 'icon') | default('mdi:medal-outline') -%}
                  {%- set sc.badge_list = sc.badge_list ~ "- <ha-icon icon='" ~ badge_icon ~ "'></ha-icon> " ~ badge ~ "  \n" -%}
                {%- endfor -%}
                
                {#-- Collect Reward Progress --#}
                {%- for reward in rewards_data -%}
                  {%- set reward_eid = reward.eid -%}
                  {%- set reward_sensor = states(reward_eid) if reward_eid else none -%}
                  {%- if reward_sensor and reward_sensor != 'unavailable' and reward_sensor != 'unknown' -%}
                    {%- set reward_name = reward.name | default(state_attr(reward_eid, 'reward_name') | default('Unknown Reward')) -%}
                    {%- set reward_icon = state_attr(reward_eid, 'icon') | default('mdi:gift-outline') -%}
                    {%- set claim_count = reward.claims | default(state_attr(reward_eid, 'reward_claims_count') | default(0)) -%}
                    {%- set approval_count = reward.approvals | default(state_attr(reward_eid, 'reward_approvals_count') | default(0)) -%}
                    {%- if claim_count > 0 or approval_count > 0 -%}
                      {%- set sc.reward_progress = sc.reward_progress + [
                        "- <ha-icon icon='" ~ reward_icon ~ "'></ha-icon> **" ~ reward_name ~ ":** &nbsp;&nbsp; " ~ (ui_translations.claims | default('Claims')) ~ ": &nbsp;" 
                        ~ claim_count ~ "&nbsp; |&nbsp; " ~ (ui_translations.approvals | default('Approvals')) ~ ": &nbsp;" ~ approval_count
                      ] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Collect Bonuses Applied --#}
                {%- for bonus in bonuses_data -%}
                  {%- set bonus_eid = bonus.eid -%}
                  {%- set bonus_sensor = bonus_eid | regex_replace('^button\\.kc_', 'sensor.kc_') | regex_replace('_bonus_', '_bonuses_applied_') -%}
                  {%- set bonus_count = states(bonus_sensor) | int(default=0) -%}
                  {%- if bonus_count > 0 -%}
                    {%- set bonus_name = bonus.name | default(state_attr(bonus_sensor, 'bonus_name') | default('Unknown Bonus')) -%}
                    {%- set bonus_icon = state_attr(bonus_sensor, 'icon') | default('mdi:star') -%}
                    {%- set bonus_points = bonus.points | default(state_attr(bonus_sensor, 'bonus_points') | default(0)) -%}
                    {%- set sc.total_bonus_points = sc.total_bonus_points + (bonus_points * bonus_count) -%}
                    {%- set sc.bonuses = sc.bonuses + [
                      "- <ha-icon icon='" ~ bonus_icon ~ "'></ha-icon> **" ~ bonus_name ~ ":** " ~ (ui_translations.applied | default('Applied')) ~ " " 
                      ~ bonus_count ~ " (💰 " ~ (bonus_points * bonus_count) ~ " " ~ points_label ~ ")"
                    ] -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Collect Penalties Applied --#}
                {%- for penalty in penalties_data -%}
                  {%- set penalty_eid = penalty.eid -%}
                  {%- set penalty_sensor = penalty_eid | regex_replace('^button\\.kc_', 'sensor.kc_') | regex_replace('_penalty_', '_penalties_applied_') -%}
                  {%- set penalty_count = states(penalty_sensor) | int(default=0) -%}
                  {%- if penalty_count > 0 -%}
                    {%- set penalty_name = penalty.name | default(state_attr(penalty_sensor, 'penalty_name') | default('Unknown Penalty')) -%}
                    {%- set penalty_icon = state_attr(penalty_sensor, 'icon') | default('mdi:alert') -%}
                    {%- set penalty_points = penalty.points | default(state_attr(penalty_sensor, 'penalty_points') | default(0)) -%}
                    {%- set sc.total_penalty_points = sc.total_penalty_points + (-penalty_points * penalty_count) -%}
                    {%- set sc.penalties = sc.penalties + [
                      "- <ha-icon icon='" ~ penalty_icon ~ "'></ha-icon> **" ~ penalty_name ~ ":** " ~ (ui_translations.applied | default('Applied')) ~ " " 
                      ~ penalty_count ~ " (💥 " ~ (-penalty_points * penalty_count) ~ " " ~ points_label ~ ")"
                    ] -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Collect Achievements --#}
                {%- for achievement in achievements_data -%}
                  {%- set achievement_eid = achievement.eid -%}
                  {%- set achievement_sensor = states(achievement_eid) if achievement_eid else none -%}
                  {%- if achievement_sensor and achievement_sensor != 'unavailable' and achievement_sensor != 'unknown' -%}
                    {%- set name = achievement.name | default(state_attr(achievement_eid, 'achievement_name') | default('Unknown Achievement')) -%}
                    {%- set icon = state_attr(achievement_eid, 'icon') | default('mdi:trophy-award') -%}
                    {%- set progress = states(achievement_eid) | float(default=0) -%}
                    {%- set awarded = state_attr(achievement_eid, 'awarded') | default(false) -%}
                    {%- set reward_points = state_attr(achievement_eid, 'reward_points') | int(default=0) -%}
                    {%- set status = (ui_translations.completed | default('Completed')) if awarded else '⌛ ' ~ progress|round(0) ~ '%' -%}
                    {%- set sc.achievements = sc.achievements + ["- " ~ "<ha-icon icon='" ~ icon ~ "'></ha-icon>&nbsp;" ~ name ~ " (" ~ status ~ ", 💎 " ~ reward_points ~ ")"] -%}
                  {%- endif -%}
                {%- endfor -%}
                
                {#-- Collect Challenges --#}
                {%- for challenge in challenges_data -%}
                  {%- set challenge_eid = challenge.eid -%}
                  {%- set challenge_sensor = states(challenge_eid) if challenge_eid else none -%}
                  {%- if challenge_sensor and challenge_sensor != 'unavailable' and challenge_sensor != 'unknown' -%}
                    {%- set name = challenge.name | default(state_attr(challenge_eid, 'challenge_name') | default('Unknown Challenge')) -%}
                    {%- set icon = state_attr(challenge_eid, 'icon') | default('mdi:flag-checkered') -%}
                    {%- set progress = states(challenge_eid) | float(default=0) -%}
                    {%- set awarded = state_attr(challenge_eid, 'awarded') | default(false) -%}
                    {%- set reward_points = state_attr(challenge_eid, 'reward_points') | int(default=0) -%}
                    {%- set status = "✔️ " ~ (ui_translations.completed | default('Completed')) if awarded else '⌛ ' ~ progress|round(0) ~ '%' -%}
                    {%- set sc.challenges = sc.challenges + ["- " ~ "<ha-icon icon='" ~ icon ~ "'></ha-icon>&nbsp;" ~ name ~ " (" ~ status ~ ", 💎 " ~ reward_points ~ ")"] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set badge_list = sc.badge_list -%}
                {%- set reward_progress = sc.reward_progress -%}
                {%- set bonuses = sc.bonuses -%}
                {%- set penalties = sc.penalties -%}
                {%- set achievements = sc.achievements -%}
                {%- set challenges = sc.challenges -%}
                {%- set total_bonus_points = sc.total_bonus_points -%}
                {%- set total_penalty_points = sc.total_penalty_points -%}
                
                {#-- Create Content --#}
                {%- set pref_show_penalties = true -%}
                {%- set content = 
                  "## 🏅 " ~ kid_name ~ "'s " ~ (ui_translations.showcase | default('Showcase')) ~ "  \n"
                  "<ha-icon icon=" ~ points_icon ~ "></ha-icon>" ~ "&nbsp;&nbsp;**" ~ points_label ~ ":** &nbsp;&nbsp;" ~ points ~ " \n\n"
                  "<ha-icon icon=" ~ 'mdi:broom' ~ "></ha-icon>" ~ "&nbsp;&nbsp;**" ~ (ui_translations.total_completed | default('Total Chores Completed')) ~ ":** &nbsp;&nbsp;" ~ all_time_completed ~ " \n\n"  
                  "**🥇 " ~ (ui_translations.highest_badge_earned | default('Highest Badge Earned')) ~ ":** &nbsp;&nbsp;" ~ badge_display_line ~ "  \n"
                  "**💎 " ~ points_label ~ " " ~ (ui_translations.multiplier | default('Multiplier')) ~ ":** &nbsp;&nbsp;x" ~ highest_badge_multiplier ~ "  \n\n"
                  "**🥇 " ~ (ui_translations.all_earned_badges | default('All Earned Badges')) ~ ":**  " ~ (badge_list if all_earned_badges | length > 0 else "&nbsp;" ~ (ui_translations.none | default('None'))) ~ "  \n"
                  "#### 🎁 " ~ (ui_translations.rewards | default('Rewards')) ~ ": &nbsp;&nbsp;" ~ 
                  ("\n" ~ ('\n'.join(reward_progress)) if reward_progress | length > 0 else (ui_translations.none | default('None'))) ~ "  \n\n"
                  "#### ⭐ " ~ (ui_translations.bonuses_applied | default('Bonuses Applied')) ~ ": &nbsp;&nbsp;" ~ 
                  ("\n" ~ ('\n'.join(bonuses)) ~ "  \n"
                  "**💰 " ~ (ui_translations.total_bonus | default('Total Bonus')) ~ " " ~ points_label ~ ":** &nbsp;&nbsp;" ~ total_bonus_points ~ "  \n"
                  if bonuses | length > 0 else (ui_translations.none | default('None'))) ~ " \n"
                  -%}
                
                {%- if pref_show_penalties -%}
                  {%- set content = content ~ 
                    "#### ⚠️ " ~ (ui_translations.penalties_applied | default('Penalties Applied')) ~ ": &nbsp;&nbsp;" ~ 
                    ("\n" ~ ('\n'.join(penalties))  ~ "  \n"
                    "**💥 " ~ (ui_translations.total_penalty | default('Total Penalty')) ~ " " ~ points_label ~ ":** &nbsp;&nbsp;" ~ total_penalty_points ~ "  \n"
                    if penalties | length > 0 else (ui_translations.none | default('None'))) ~ " \n"
                    -%}
                {%- endif -%}
                
                {%- set content = content ~
                  "#### 🏆 " ~ (ui_translations.achievements | default('Achievements')) ~ ": &nbsp;&nbsp; " ~ 
                  ('\n' ~ ('\n'.join(achievements)) if achievements | length > 0 else "&nbsp;" ~ (ui_translations.none | default('None'))) ~ "  \n"
                  "#### 🏁 " ~ (ui_translations.challenges | default('Challenges')) ~ ": &nbsp;&nbsp; " ~ 
                  ('\n' ~ ('\n'.join(challenges)) if challenges | length > 0 else "&nbsp;" ~ (ui_translations.none | default('None'))) ~ "  \n"
                -%}
                
                {{
                  {
                    'type': 'markdown',
                    'content': content
                  }
                }},
      - type: custom:auto-entities
        card:
          square: false
          type: grid
          columns: 1
        card_param: cards
        filter:
          template: >-
            {#-- Initialize Namespace Variables --#}  

            {%- set ns = namespace(
              Kid_name='', 
              Kid_name_normalize='', 
              badge_sensor_id_prefix='', 
              badges=[], points='', 
              points_label='', 
              points_sensor='', 
              all_time_sensor='', 
              threshold_type='', 
              threshold_display='', 
              points_multiplier='', 
              kids_earned='', 
              earned_text='', 

              BADGE_TITLE='', STATUS='', THRESHOLD='', MULTIPLIER='', 
              EARNED_BY='', NO_BADGES_FOUND='', BADGE_SETUP_PROMPT='', 
              IN_PROGRESS='', EARNED='', REMAINING='', CHORES=''
            ) -%}    

            {#-- ************* Set Translatable Text ************* --#}  

            {%- set ns.BADGE_TITLE = "Badge" -%} 

            {%- set ns.STATUS = "Status" -%} 

            {%- set ns.THRESHOLD = "Threshold" -%}

            {%- set ns.MULTIPLIER = "Multiplier" -%} 

            {%- set ns.EARNED_BY = "Earned By" -%}

            {%- set ns.NO_BADGES_FOUND = "No Badges Found" -%}

            {%- set ns.BADGE_SETUP_PROMPT = "Set up badges to reward milestones
            and keep chores fun!" -%} 

            {%- set ns.IN_PROGRESS = "In Progress" -%} 

            {%- set ns.EARNED = "Earned" -%}

            {%- set ns.REMAINING = "to go!" -%}

            {%- set ns.CHORES = "Chores" -%}

            {#-- ************* End Translatable Text ************* --#}

            {#-- Set Kid_name and normalize --#}  

            {%- set ns.Kid_name = 'Ethan' -%}

            {%- set ns.Kid_name_normalize = ns.Kid_name | slugify() -%}

            {#-- Collect Points --#}  

            {%- set points_sensor = 'sensor.kc_' ~ ns.Kid_name_normalize ~
            '_points' -%}     {%- set ns.points = states(points_sensor) |
            int(default=0) -%}   {%- set ns.points_label =
            state_attr(points_sensor, 'unit_of_measurement') -%}   {%- set
            ns.points_icon = state_attr(points_sensor, 'icon') -%}

            {#-- Collect Total Completed --#}  

            {%- set ns.all_time_sensor = 'sensor.kc_' ~ ns.Kid_name_normalize ~
            '_chores_completed_total' -%} 

            {#-- Badge Sensors --#}  

            {%- set badge_sensors = states.sensor 
                | selectattr('entity_id', 'match', '^sensor\\.kc_.*_badge$') 
                | rejectattr('entity_id', 'search', '_highest_badge$') 
                | list 
            -%}

            {#-- Collect badge attributes --#}  

            {%- for badge_sensor in badge_sensors -%}
                {%- set badge_info = {
                    'entity_id': badge_sensor.entity_id,
                    'name': (state_attr(badge_sensor.entity_id, 'friendly_name') | default('UNKNOWN BADGE')) | regex_replace('^Badge - ', ''),
                    'icon': state_attr(badge_sensor.entity_id, 'icon') | default('mdi:medal-outline'),
                    'description': state_attr(badge_sensor.entity_id, 'description') | default(''),
                    'threshold': states(badge_sensor.entity_id) | float(default=0),
                    'threshold_display': (states(badge_sensor.entity_id) | float(default=0) | round(0)) ~ " " ~ 
                                          (ns.points_label if state_attr(badge_sensor.entity_id, 'threshold_type') == "points" else ns.CHORES),
                    'points_multiplier': state_attr(badge_sensor.entity_id, 'points_multiplier') | float(default=1),
                    'kids_earned': state_attr(badge_sensor.entity_id, 'kids_earned') | default([], true),
                    'earned_text': "✔️ " ~ ns.EARNED if ns.Kid_name in (state_attr(badge_sensor.entity_id, 'kids_earned') | default([], true)) else "⌛ " ~ ns.IN_PROGRESS
                } -%}     
                {%- set ns.badges = ns.badges + [badge_info] -%}
            {%- endfor -%}

            {%- set sorted_badges = ns.badges | sort(reverse=true,
            attribute='threshold') | sort(reverse=true,
            attribute='points_multiplier') -%}

            {%- if sorted_badges | length == 0 -%}
              {{
                {
                  'type': 'markdown',
                  'content': "### 🏅 " ~ ns.NO_BADGES_FOUND ~ " \n" ~ ns.BADGE_SETUP_PROMPT
                }
              }},  
            {%- else -%}
              {%- for badge in sorted_badges -%}
                {%- set required_value = badge.threshold -%}
                {%- set progress_value = ns.points if ns.points_label in badge.threshold_display else states(ns.all_time_sensor) | int(default=0) -%}
                {%- set earned = ns.Kid_name in badge.kids_earned -%}
                {%- set remaining_value = (required_value - progress_value) | round(0) if required_value > progress_value and not earned else 0 -%}
                {%- set remaining_text = " (" ~ remaining_value|string ~ " " ~ ns.REMAINING ~ ")" if remaining_value > 0 else "" -%}

                {%- set content = "## <ha-icon icon=" ~ badge.icon ~ "></ha-icon> " ~ "**" ~ ns.BADGE_TITLE ~ ":** " ~ badge.name ~ "  \n" %}
                {%- if badge.description -%}
                  {%- set content = content ~ "#### 📖 &nbsp;" ~ badge.description ~ "  \n" %}
                {%- endif -%}
                {%- set content = content ~ "**" ~ "🏅 " ~ ns.STATUS ~ ":** &nbsp;" ~ badge.earned_text ~ "  \n" %}
                {%- set content = content ~ "**🎯 " ~ ns.THRESHOLD ~ ":** &nbsp;" ~ badge.threshold_display ~ remaining_text ~ "  \n" %}
                {%- if badge.points_multiplier > 1 -%}
                  {%- set content = content ~ "**💎 " ~ ns.MULTIPLIER ~ ":** &nbsp;x" ~ badge.points_multiplier|string ~ "  \n" %}
                {%- endif -%}
                {%- if badge.kids_earned | count > 0 -%}
                  {%- set content = content ~ "**👥 " ~ ns.EARNED_BY ~ ":** &nbsp;" ~ badge.kids_earned | join(', ') ~ "  \n" %}
                {%- endif -%}


                {{
                  {
                    'type': 'markdown',
                    'content': content
                  }
                }},  
              {%- endfor -%}
            {%- endif -%}
      - square: false
        type: grid
        columns: 1
        cards:
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {#-- Initialize Namespace Variables --#}  

                {%- set ns = namespace(
                  Kid_name='',
                  Kid_name_normalize='',
                  current_points='',
                  points_label='',
                  achievements=[],

                  NO_ACHIEVEMENTS_FOUND='',
                  START_A_ACHIEVEMENT='',
                  ACHIEVEMENT_LABEL='',
                  AWARD_STATUS_LABEL='',
                  EARNED_LABEL='',
                  IN_PROCESS_LABEL='',
                  DESCRIPTION_LABEL='',
                  CRITERIA_LABEL='',
                  GOAL_LABEL='',
                  START_DATE_LABEL='',
                  END_DATE_LABEL='',
                  REWARD_LABEL='',
                  PROGRESS_LABEL='',
                  ASSIGNED_TO_LABEL='',
                  RELATED_CHORE_LABEL='',
                  STREAK_GOAL='',
                  COMPLETION_GOAL='',
                  DAILY_MINIMUM=''
                ) -%}    

                {#-- ************* Set Translatable Text ************* --#}  

                {%- set ns.NO_ACHIEVEMENTS_FOUND = "No Achievements Found" -%} 

                {%- set ns.START_A_ACHIEVEMENT = "Start an achievement to track
                your progress!" -%} 

                {%- set ns.ACHIEVEMENT_LABEL = "Achievement" -%} 

                {%- set ns.AWARD_STATUS_LABEL = "Award Status" -%}  

                {%- set ns.EARNED_LABEL = "Earned" -%}  

                {%- set ns.IN_PROCESS_LABEL = "In Process" -%}  

                {%- set ns.DESCRIPTION_LABEL = "Description" -%}  

                {%- set ns.CRITERIA_LABEL = "Criteria" -%}  

                {%- set ns.GOAL_LABEL = "Goal" -%}  

                {%- set ns.START_DATE_LABEL = "Start Date" -%}  

                {%- set ns.END_DATE_LABEL = "End Date" -%}  

                {%- set ns.REWARD_LABEL = "Reward" -%}  

                {%- set ns.PROGRESS_LABEL = "Progress" -%}  

                {%- set ns.ASSIGNED_TO_LABEL = "Assigned To" -%}  

                {%- set ns.RELATED_CHORE_LABEL = "Related Chore" -%}

                {%- set ns.STREAK_GOAL = "Streak Goal" -%}

