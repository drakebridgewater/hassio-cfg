                  CLEAR_DATE='',
                  SELECT_NEW_DATE_AND_TIME='',
                  TAP_TO_CHANGE_HOLD_TO_SET='',
                  RESET_ALL='',
                  OVERDUE_CHORES='',
                  RESET_OVERDUE_STATUS='',
                  ALLOW_MULTIPLE_CLAIMS='',
                  APPLICABLE_DAYS='',
                  OVERDUE='', 
                  PENDING='', 
                  CLAIMED='', 
                  APPROVED='',
                  TRUE='',
                  FALSE='',
                  NONE=''
                ) -%}  


                {#-- ************* Set Translatable Text ************* --#}  

                {%- set ns.SELECT_CHORE_TO_EDIT_DUE_DATE = "Select Chore to Edit Due Date" -%}

                {%- set ns.CHORE_DETAIL_LABEL = "Chore Detail" -%} 

                {%- set ns.CURRENT_STATUS_LABEL = "Current Status" -%} 

                {%- set ns.GLOBAL_STATUS_LABEL = "Global Status" -%} 

                {%- set ns.SHARED_CHORE_LABEL = "Shared Chore" -%}  

                {%- set ns.VALUE_LABEL = "Value" -%}  

                {%- set ns.DUE_DATE_LABEL = "Due Date" -%}  

                {%- set ns.RECURRENCE_LABEL = "Recurrence" -%}

                {%- set ns.CUSTOM_INTERVAL = "Interval" -%} 

                {%- set ns.NO_CHORE_SELECTED_LABEL = "No Chore Selected or Status Unavailable" -%} 

                {%- set ns.PLUS_NEXT_DUE = "+Next Due" -%}  

                {%- set ns.PLUS_1_DAY = "+1 Day" -%}  

                {%- set ns.PLUS_1_WEEK = "+1 Week" -%}  

                {%- set ns.CLEAR_DATE = "Clear Date" -%}  

                {%- set ns.SELECT_NEW_DATE_AND_TIME = "Select New Date & Time" -%}  

                {%- set ns.TAP_TO_CHANGE_HOLD_TO_SET = "(Tap to Change / Hold to Set)" -%}

                {%- set ns.RESET_ALL = "Reset All" -%}

                {%- set ns.OVERDUE_CHORES = "Overdue Chores" -%}

                {%- set ns.RESET_OVERDUE_STATUS = "Reset Overdue Status" -%}

                {%- set ns.ALLOW_MULTIPLE_CLAIMS = "Allow Multiple Claims" -%}

                {%- set ns.APPLICABLE_DAYS = "Applicable Days" -%}

                {%- set ns.CHORE_ADMIN_ACTIONS = "Chore Admin Actions" -%}

                {%- set ns.OVERDUE = "Overdue" -%}

                {%- set ns.PENDING = "Pending" -%}

                {%- set ns.CLAIMED = "Claimed" -%}

                {%- set ns.APPROVED = "Approved" -%}

                {%- set ns.TRUE = "True" -%}

                {%- set ns.FALSE = "False" -%}

                {%- set ns.NONE = "None" -%}

                {#-- ************* End Translatable Text ************* --#} 

                {#-- Set Kid_name and normalize --#}  

                {%- set ns.Kid_name = 'Ethan' -%}

                {%- set ns.Kid_name_normalize = ns.Kid_name | slugify() -%}

                {#-- Collect Points --#}  

                {%- set points_sensor = 'sensor.kc_' ~ ns.Kid_name_normalize ~
                '_points' -%}     {%- set ns.points = states(points_sensor) |
                int(default=0) -%}   {%- set ns.points_label =
                state_attr(points_sensor, 'unit_of_measurement') -%}   {%- set
                ns.points_icon = state_attr(points_sensor, 'icon') -%}

                {#-- Get Selected Chore from Input Select --#} 

                {%- set ns.chore_select_entity = 'select.kc_' ~
                ns.Kid_name_normalize ~ '_ui_dashboard_chore_list_helper' -%}   {%- set
                ns.chore_selected = states(ns.chore_select_entity) -%}   {%- set
                ns.chore_sensor_id_prefix ='sensor.kc_' ~ ns.Kid_name_normalize
                ~ '_chore_status_' -%}

                {#-- Collect Chore Status Sensor and Details --#}          

                {%- if ns.chore_selected | lower not in ['none', 'unknown',
                'unavailable', ''] -%}

                 {%- set ns.chore_selected_normalize = ns.chore_selected | slugify() -%}
                  
                  {%- set ns.chore_sensor_id = ns.chore_sensor_id_prefix ~ ns.chore_selected_normalize -%}       
                  {%- set ns.current_status = states(ns.chore_sensor_id) | default('Unknown') -%}
                  {%- set ns.global_status = state_attr(ns.chore_sensor_id, 'global_state') | default('Unknown') -%}
                  {%- set state_map = {
                      'pending': ns.PENDING,
                      'claimed': ns.CLAIMED,
                      'approved': ns.APPROVED,
                      'overdue': ns.OVERDUE
                  } -%}
                  {%- set current_status_display = state_map[ns.current_status] if ns.current_status in state_map else ns.current_status -%}
                  {%- set global_status_display = state_map[ns.global_status] if ns.global_status in state_map else ns.global_status -%}
                  {%- set ns.shared_chore = state_attr(ns.chore_sensor_id, 'shared_chore') | string | default('False') -%}
                  {%- set ns.chore_allow_multiple = state_attr(ns.chore_sensor_id, 'allow_multiple_claims_per_day') | string | default('False') -%}
                  {%- set state_map_tf = {
                      'False': ns.FALSE,
                      'True': ns.TRUE
                  } -%}
                  {%- set shared_chore_display = state_map_tf[ns.shared_chore] if ns.shared_chore in state_map_tf else ns.shared_chore -%}
                  {%- set chore_allow_multiple_display = state_map_tf[ ns.chore_allow_multiple] if  ns.chore_allow_multiple in state_map_tf else  ns.chore_allow_multiple -%} 
                  {%- set ns.recurrence = state_attr(ns.chore_sensor_id, 'recurring_frequency') if state_attr(ns.chore_sensor_id, 'recurring_frequency') != 'none' else ns.NONE -%}
                  {%- set ns.chore_value = state_attr(ns.chore_sensor_id, 'default_points') | int(default=0) -%}
                  {%- set ns.chore_icon = state_attr(ns.chore_sensor_id, 'icon') | default('mdi:clipboard-check') -%}
                  {%- set ns.chore_description = state_attr(ns.chore_sensor_id, 'description') | default('') -%}
                  {%- set ns.chore_days = state_attr(ns.chore_sensor_id, 'applicable_days') | default([], true)  -%}
                  {%- set ns.chore_custom_freq_unit = state_attr(ns.chore_sensor_id, 'custom_frequency_unit') | default('')  -%}
                  {%- set ns.chore_custom_freq_int = state_attr(ns.chore_sensor_id, 'custom_frequency_interval') | default('') -%}

                  {#-- Convert and Format Due Date --#}
                  {%- set due_date_str = state_attr(ns.chore_sensor_id, 'due_date') | string-%}
                  {%- set due_date = as_datetime(due_date_str) if due_date_str and due_date_str not in ['None', 'unknown', 'unavailable'] else None -%}
                  {%- set ns.due_date_formatted = as_timestamp(due_date) | timestamp_custom('%a, %b %d, %Y %I:%M %p', true) if due_date else ns.NONE -%}        

                  {%- set ns.select_new_date_and_time_secondary = ns.TAP_TO_CHANGE_HOLD_TO_SET + "\n \n" + state_attr('input_datetime.kc_ui_set_date_helper', 'timestamp') | timestamp_custom('%a, %b %d, %Y %I:%M %p', true) if states('input_datetime.kc_ui_set_date_helper') != 'unknown' else 'No date set' -%}

                  {#-- Store the Markdown content in a variable --#}

                  {%- set ns.content =  "### <ha-icon icon='" ~ ns.chore_icon ~
                  "'></ha-icon> " ~ ns.CHORE_DETAIL_LABEL ~ ": " ~ (ns.chore_selected |
                  title) ~ "  \n" -%} 

                  {%- set ns.content =  ns.content ~ "#### 📖 &nbsp;&nbsp;" ~
                  ns.chore_description ~ "  \n" if ns.chore_description else ns.content
                  -%} 

                  {%- set ns.content = ns.content ~ 
                    "**📌 " ~ ns.CURRENT_STATUS_LABEL ~ ":** &nbsp;" ~ current_status_display ~ "  \n"
                    "**🌍 " ~ ns.GLOBAL_STATUS_LABEL ~ ":** &nbsp;" ~ global_status_display ~ "  \n"
                    "**👥 " ~ ns.SHARED_CHORE_LABEL ~ ":** &nbsp;" ~ shared_chore_display ~ "  \n"
                    "**📥 " ~ ns.ALLOW_MULTIPLE_CLAIMS ~ ":** &nbsp;" ~ chore_allow_multiple_display ~ "  \n"
                    "**💎 " ~ ns.VALUE_LABEL ~ ":** &nbsp;" ~ ns.chore_value ~ " " ~ ns.points_label ~ "  \n\n"
                    "**📅 " ~ ns.DUE_DATE_LABEL ~ ":** &nbsp;" ~ ns.due_date_formatted ~ "  \n"
                    "**🔁 " ~ ns.RECURRENCE_LABEL ~ ":** &nbsp;" ~ ns.recurrence | title ~ "  \n" -%}

                  {%- set ns.content = ns.content ~ (("**🔵 " ~ ns.APPLICABLE_DAYS ~ ":** &nbsp;" ~ ns.chore_days | join(', ') | title) 
                    if ns.chore_days is iterable and ns.chore_days | length > 0 else "") -%}

                  {%- set ns.content = ns.content ~ ("**🔵 " ~ ns.CUSTOM_INTERVAL ~ ":** &nbsp;" ~ ns.chore_custom_freq_int | int ~ " " ~ ns.chore_custom_freq_unit | title 
                    if ns.recurrence == 'custom' else "" ) -%}

                  {%- set ns.content =  ns.content if ns.chore_selected not in ['None', 'unknown', 'unavailable']  else "**🚫 " ~ ns.NO_CHORE_SELECTED_LABEL ~ "**" -%}

                {%- endif -%}

                {#-- Construct Overdue chore reset, chore dropdown, Markdown
                Card for Chore Details, and chore actions --#}  {{
                  {
                    'type': 'heading',
                    'icon': 'mdi:rocket-launch',
                    'heading': ns.CHORE_ADMIN_ACTIONS,
                    'heading_style': 'title',
                  }
                }}, {%- if states.sensor 
                    | selectattr('entity_id', 'match', '^' ~ ns.chore_sensor_id_prefix ~ '.*') 
                    | selectattr('state', 'eq', 'overdue') 
                    | list | length > 0 -%}
                  
                  {{
                    {
                      'type': 'grid',
                      'title': '',
                      'columns': 1,
                      'square': false,
                      'cards': [
                        {
                          'type': 'custom:mushroom-template-card',
                          'primary': ns.RESET_ALL ~ ' ' ~ ns.Kid_name ~ '\'s ' ~ ns.OVERDUE_CHORES,
                          'icon': 'mdi:restore-alert',
                          'icon_color': 'orange',
                          'tap_action': {
                            'action': 'call-service',
                            'service': 'kidschores.reset_overdue_chores',
                            'data': {
                              'kid_name': ns.Kid_name
                            }
                          }
                        }
                      ]
                    }
                  }},
                {%- endif -%}      
                  {{
                      {
                        'type': 'custom:mushroom-select-card',
                        'entity': ns.chore_select_entity,
                        'name': ns.SELECT_CHORE_TO_EDIT_DUE_DATE,
                        'icon': 'mdi:clipboard-edit',
                        'icon_color': 'blue',
                        'secondary_info': 'none'       
                      } 
                  }},
                  
                 {%- if ns.chore_selected | lower not in ['none', 'unknown', 'unavailable', ''] -%}  
                     {{
                      {
                        'type': 'markdown',
                        'content': ns.content
                      }
                    }},
                    {%- if states(ns.chore_sensor_id) | lower in ['overdue'] -%}
                        {{
                          {
                            'type': 'grid',
                            'title': '',
                            'columns': 1,
                            'square': false,
                            'cards': [
                              {
                                'type': 'custom:mushroom-template-card',
                                'primary': ns.RESET_OVERDUE_STATUS,
                                'icon': 'mdi:restore',
                                'icon_color': 'orange',
                                'tap_action': {
                                  'action': 'call-service',
                                  'service': 'kidschores.reset_overdue_chores',
                                  'data': {
                                    'chore_name': ns.chore_selected,
                                    'kid_name': ns.Kid_name
                                  }
                                }
                              }
                            ]
                          }
                        }},
                      {%- endif -%}
                      {{
                        {
                          'type': 'grid',
                          'title': '',
                          'columns': 4,
                          'square': false,
                          'cards': [
                            {
                              'type': 'custom:mushroom-template-card',
                              'primary': ns.PLUS_NEXT_DUE,
                              'icon': 'mdi:calendar-refresh',
                              'icon_color': 'blue',
                              'layout': 'vertical',
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'kidschores.skip_chore_due_date',
                                'data': {
                                  'chore_name': ns.chore_selected
                                }
                              }
                            },
                            {
                              'type': 'custom:mushroom-template-card',
                              'primary': ns.PLUS_1_DAY,
                              'icon': 'mdi:calendar-plus',
                              'icon_color': 'blue',
                              'layout': 'vertical',
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'kidschores.set_chore_due_date',
                                'data': {
                                  'chore_name': ns.chore_selected,
                                  'due_date': (as_datetime(due_date) + timedelta(days=1)).isoformat() if due_date else ''
                                }
                              }
                            },
                            {
                              'type': 'custom:mushroom-template-card',
                              'primary': ns.PLUS_1_WEEK,
                              'icon': 'mdi:calendar-arrow-right',
                              'icon_color': 'blue',
                              'layout': 'vertical',
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'kidschores.set_chore_due_date',
                                'data': {
                                  'chore_name': ns.chore_selected,
                                  'due_date': (as_datetime(due_date) + timedelta(weeks=1)).isoformat() if due_date else ''
                                }
                              }
                            },
                            {
                              'type': 'custom:mushroom-template-card',
                              'primary': ns.CLEAR_DATE,
                              'icon': 'mdi:calendar-remove',
                              'icon_color': 'blue',
                              'layout': 'vertical',
                              'tap_action': {
                                'action': 'call-service',
                                'service': 'kidschores.set_chore_due_date',
                                'data': {
                                  'chore_name': ns.chore_selected,
                                  'due_date': ''
                                }
                              }
                            }
                          ]
                        }
                      }},{{
                      {
                        'type': 'grid',
                        'columns': 1,
                        'square': false,
                        'cards': [
                          {
                            'type': 'custom:mushroom-template-card',
                            'entity': 'input_datetime.kc_ui_set_date_helper',
                            'primary': ns.SELECT_NEW_DATE_AND_TIME,
                            'secondary': ns.select_new_date_and_time_secondary,
                            'multiline_secondary': 'true',
                            'fill_container': 'true',
                            'icon': 'mdi:calendar-edit',
                            'icon_color': 'blue',
                            'tap_action': {
                              'action': 'more-info'
                            },
                            'hold_action': {
                              'action': 'call-service',
                              'service': 'kidschores.set_chore_due_date',
                              'data': {
                                'chore_name': ns.chore_selected,
                                'due_date': states('input_datetime.kc_ui_set_date_helper')
                              }
                            }
                          },
                        ]
                      }
                    }},
                {%- endif -%} {{
                  {
                    'type': 'grid',
                    'columns': 1,
                    'square': false,
                    'cards': [
                      {
                        'type': 'custom:mushroom-template-card',
                        'primary': 'Configure',
                        'fill_container': 'true',
                        'icon': 'mdi:cog',
                        'icon_color': 'blue',
                        'hold_action': {
                          'action': 'more-info'
                        },
                        'tap_action': {
                          'action': 'url',
                          'url_path': '/config/integrations/integration/kidschores',
                        }
                      },
                    ]
                  }
                }}
  - type: grid
    cards:
      - type: grid
        square: false
        columns: 1
        grid_options:
          columns: full
        cards:
          #-- ************* Pluses & Minuses - Heading & Graph ************* --#
          #-- To change kid: update entity below to sensor.kc_{kid_name_slug}_points --#
          - type: heading
            icon: mdi:plus-circle-multiple
            heading: Pluses & Minuses
            heading_style: title
          - type: custom:mini-graph-card
            hours_to_show: 168
            unit: ' '
            entities:
              - entity: sensor.kc_ethan_points
          #-- Bonuses heading --#
          - type: heading
            icon: mdi:star
            heading: Bonuses Applied
            heading_style: title
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 2
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Bonuses ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set bonuses_data = state_attr(dashboard_helper, 'bonuses') | default([]) -%}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                
                {%- if bonuses_data | length > 0 -%}
                  {%- for bonus in bonuses_data -%}
                    {%- set bonus_eid = bonus.eid -%}
                    {%- set bonus_name = bonus.name | default('Unknown') -%}
                    {%- set bonus_points = bonus.points | default(0) -%}
                    {%- set bonuses_applied = bonus.applied | default(0) -%}
                    {%- set bonus_icon = state_attr(bonus_eid, 'icon') | default('mdi:star') -%}
                    
                    {%- set primary = (ui_translations.bonus | default('Bonus')) ~ ": " ~ bonus_name -%}
                    {%- set secondary = 
                      '⭐ ' ~ (ui_translations.bonus | default('Bonus')) ~ ':  ' ~ (bonus_points | string) ~ ' ' ~ points_label ~ '\n' ~
                      '📊 ' ~ (ui_translations.applied | default('Applied')) ~ ':  ' ~ (bonuses_applied | string) ~ ' ' ~ (ui_translations.times | default('times')) -%}
                    {%- set icon_color = 
                      '#00FF00' if bonus_points | int >= 20 else 
                      '#20C997' if bonus_points | int >= 10 else 
                      '#7FFFD4' 
                    -%}
                    
                    {{
                      {
                        'type': 'custom:mushroom-template-card',
                        'entity': bonus_eid,
                        'primary': primary,
                        'secondary': secondary,
                        'multiline_secondary': 'true',
                        'layout': 'vertical',
                        'icon': bonus_icon,
                        'icon_color': icon_color,
                        'tap_action': {
                          'action': 'toggle'
                        },
                        'hold_action': {
                          'action': 'more-info'
                        }
                      }
                    }},
                  {%- endfor -%}
                {%- else -%}
                  {{
                    {
                      'type': 'markdown',
                      'content': (ui_translations.none | default('None'))
                    }
                  }},
                {%- endif -%}
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 6
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Points Buttons ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set points_buttons_data = state_attr(dashboard_helper, 'points_buttons') | default([]) -%}
                
                {#-- Sort buttons by extracting numeric value from name --#}
                {%- set pb = namespace(sorted_buttons=[]) -%}
                {%- for button in points_buttons_data -%}
                  {%- set button_eid = button.eid -%}
                  {%- set button_name_attr = button.name | default(state_attr(button_eid, 'friendly_name') | default('')) -%}
                  {%- set numeric_matches = button_name_attr | regex_findall('([+-]?\\d+(?:\\.\\d+)?)') -%}
                  {%- if numeric_matches | length > 0 -%}
                    {%- set numeric_value = numeric_matches[0] | float -%}
                    {%- set pb.sorted_buttons = pb.sorted_buttons + [{'eid': button_eid, 'name': button_name_attr, 'value': numeric_value}] -%}
                  {%- else -%}
                    {%- set pb.sorted_buttons = pb.sorted_buttons + [{'eid': button_eid, 'name': button_name_attr, 'value': 0}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set sorted_buttons = pb.sorted_buttons | sort(attribute='value') -%}
                
                {%- for button_item in sorted_buttons -%}
                  {%- set button_name = button_item.name -%}
                  {%- set is_positive = button_item.value > 0 -%}
                  {%- set primary = button_name | regex_replace('^Points ', '') -%}
                  {%- set icon = 'mdi:plus-circle' if is_positive else 'mdi:minus-circle' -%}
                  {%- set icon_color = 'green' if is_positive else 'red' -%}
                  {{
                    {
                      'type': 'custom:mushroom-template-card',
                      'entity': button_item.eid,
                      'primary': primary,
                      'icon': icon,
                      'icon_color': icon_color,
                      'layout': 'vertical',
                      'tap_action': {
                        'action': 'toggle'
                      },
                      'hold_action': {
                        'action': 'more-info'
                      },
                      'card_mod': {
                        'style': 'ha-icon { color: ' ~ ('red' if not is_positive else 'green') ~ ' !important; } .icon-container { background-color: ' ~ ('rgba(255,0,0,0.2)' if not is_positive else 'rgba(0,128,0,0.2)') ~ ' !important; }'
                      }
                    }
                  }},
                {%- endfor -%}
          #-- Penalties heading --#
          - type: heading
            icon: mdi:alert-circle
            heading: Penalties Applied
            heading_style: title
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 2
            card_param: cards
            filter:
              template: >-
                {#-- ************* Dashboard Helper Version - Penalties ************* --#}
                {#-- ************* SET KID NAME HERE - ONLY CHANGE NEEDED ************* --#}
                {%- set kid_name = 'Ethan' -%}
                {%- set kid_name_slug = kid_name | slugify() -%}
                {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
                
                {#-- Extract data from dashboard helper --#}
                {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
                {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
                {%- set penalties_data = state_attr(dashboard_helper, 'penalties') | default([]) -%}
                {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
                {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
                
                {%- if penalties_data | length > 0 -%}
                  {%- for penalty in penalties_data -%}
                    {%- set penalty_eid = penalty.eid -%}
                    {%- set penalty_name = penalty.name | default('Unknown') -%}
                    {%- set penalty_points = penalty.points | default(0) -%}
                    {%- set penalties_applied = penalty.applied | default(0) -%}
                    {%- set penalty_icon = state_attr(penalty_eid, 'icon') | default('mdi:alert-circle') -%}
                    
                    {%- set primary = (ui_translations.penalty | default('Penalty')) ~ ": " ~ penalty_name -%}
                    {%- set secondary = 
                      '💥 ' ~ (ui_translations.penalty | default('Penalty')) ~ ':  ' ~ (penalty_points | string) ~ ' ' ~ points_label ~ '\n' ~
                      '📊 ' ~ (ui_translations.applied | default('Applied')) ~ ':  ' ~ (penalties_applied | string) ~ ' ' ~ (ui_translations.times | default('times')) -%}
                    {%- set icon_color = 
                      '#FF4500' if penalty_points | int >= 20 else 
                      '#FFA54F' if penalty_points | int >= 10 else 
                      '#FFD27F' 
                    -%}
                    
                    {{
                      {
                        'type': 'custom:mushroom-template-card',
                        'entity': penalty_eid,
                        'primary': primary,
                        'secondary': secondary,
                        'multiline_secondary': 'true',
                        'layout': 'vertical',
                        'icon': penalty_icon,
                        'icon_color': icon_color,
                        'tap_action': {
                          'action': 'toggle'
                        },
                        'hold_action': {
                          'action': 'more-info'
                        }
                      }
                    }},
                  {%- endfor -%}
                {%- else -%}
                  {{
                    {
                      'type': 'markdown',
                      'content': (ui_translations.none | default('None'))
                    }
                  }},
                {%- endif -%}
            sort:
              method: friendly_name
      - square: false
        type: grid
        cards:
          - type: heading
            icon: mdi:clipboard-text
            heading: 7 Day Activity Log
            heading_style: title
          - type: custom:auto-entities
            card:
              square: false
              type: grid
              columns: 1
            card_param: cards
            filter:
              template: >-
                {%- set ns = namespace(Kid_name='', Kid_name_normalize='',
                entity_list=[]) -%}  

                {#-- Set Kid_name and normalize --#}  

                {%- set ns.Kid_name = 'Ethan' -%}

                {%- set ns.Kid_name_normalize = ns.Kid_name | slugify() -%}

                {#-- Build a list of entities for this kid, excluding unwanted
                sensors --#} {%- set prefix_pattern = '(button|sensor)\\.kc_' ~
                (ns.Kid_name_normalize) ~ '_' -%} {%- set exclude_pattern =
                '^sensor\\.kc_' ~ (ns.Kid_name_normalize) ~
                '_(chore_(claims|approvals|streak)|reward_(claims|approvals))_'
                -%}

                {%- set entities = (states.button | selectattr('entity_id',
                'match', prefix_pattern) | list) +
                                   (states.sensor | selectattr('entity_id', 'match', prefix_pattern) 
                                    | rejectattr('entity_id', 'match', exclude_pattern) | list) -%}

                {%- for entity in entities -%}
                    {%- set ns.entity_list = ns.entity_list + [entity.entity_id] -%}
                {%- endfor -%} {{
                  {
                    'type': 'logbook',
                    'title': '',
                    'hours_to_show': 168,
                    'target': {
                      'entity_id': ns.entity_list
                    },
                  }
                }},
        columns: 1
cards: []
