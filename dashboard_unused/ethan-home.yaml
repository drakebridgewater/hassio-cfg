  # ============================================================
  # REWARDS — Progress Tiles
  # ============================================================
  # ============================================================
  # PENALTIES — Penalties Applied (own section, 1/4 width)
  # ============================================================
  - type: custom:restriction-card
    view_layout:
      grid-area: penalties
    locked: "{{ is_state('input_boolean.parents_management_mode', 'off') }}"
    duration: 30
    locked_icon: mdi:lock
    unlocked_icon: mdi:lock-open-variant
    restrictions: !include ../../restrictions/ethan-tap.yaml
    css_variables: !include ../../restrictions/ethan-css.yaml
    card_mod: !include ../../restrictions/ethan-mod.yaml
    card:
      type: custom:stack-in-card
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(160deg, rgba(100,15,15,0.75) 0%, rgba(140,25,25,0.75) 100%);
            border: 2px solid rgba(255,80,80,0.3);
            border-radius: 18px;
            height: 100%;
            display: flex;
            flex-direction: column;
          }
      cards:
        - type: heading
          icon: mdi:alert-circle
          heading: "⚠️ Penalties"
          heading_style: subtitle

        - type: custom:auto-entities
          card:
            square: false
            type: grid
            columns: 1
          card_param: cards
          filter:
            template: >-
              {%- set kid_name = 'Ethan' -%}
              {%- set kid_name_slug = kid_name | slugify() -%}
              {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%}
              {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
              {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%}
              {%- set penalties_data = state_attr(dashboard_helper, 'penalties') | default([]) -%}
              {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%}
              {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%}
              {%- if penalties_data | length > 0 -%}
                {%- for penalty in penalties_data -%}
                  {%- set penalty_eid = penalty.eid -%}
                  {%- set penalty_name = penalty.name | default('Unknown') -%}
                  {%- set penalty_points = penalty.points | default(0) -%}
                  {%- set penalties_applied = penalty.applied | default(0) -%}
                  {%- set penalty_icon = state_attr(penalty_eid, 'icon') | default('mdi:alert-circle') -%}
                  {%- set primary = (ui_translations.penalty | default('Penalty')) ~ ": " ~ penalty_name -%}
                  {%- set secondary =
                    '💥 ' ~ (penalty_points | string) ~ ' ' ~ points_label ~ '\n' ~
                    '📊 ' ~ (penalties_applied | string) ~ ' ' ~ (ui_translations.times | default('times')) -%}
                  {%- set icon_color =
                    '#FF4500' if penalty_points | int >= 20 else
                    '#FFA54F' if penalty_points | int >= 10 else
                    '#FFD27F' -%}
                  {{
                    {
                      'type': 'custom:mushroom-template-card',
                      'entity': penalty_eid,
                      'primary': primary,
                      'secondary': secondary,
                      'multiline_secondary': 'true',
                      'layout': 'vertical',
                      'icon': penalty_icon,
                      'icon_color': icon_color,
                      'tap_action': {'action': 'toggle'},
                      'hold_action': {'action': 'more-info'}
                    }
                  }},
                {%- endfor -%}
              {%- else -%}
                {{ {'type': 'markdown', 'content': '*None*'} }},
              {%- endif -%}

  - type: custom:stack-in-card
    view_layout:
      grid-area: rewards
    card_mod:
      style:
        .: |
          ha-card {
            background: linear-gradient(160deg, rgba(65,15,105,0.75) 0%, rgba(90,25,145,0.75) 100%);
            border: 2px solid rgba(200,100,255,0.3);
            border-radius: 18px;
          }
        hui-vertical-stack-card$: |
          #root {
            max-height: 250px;
            overflow-y: auto;
          }
    cards:
      - type: custom:auto-entities
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        filter:
          template: >-
            {%- set kid_name = 'Ethan' -%} 
            {%- set kid_name_slug = kid_name | slugify() -%} 
            {%- set dashboard_helper = 'sensor.kc_' ~ kid_name_slug ~ '_ui_dashboard_helper' -%} 
            {%- set ui_translations = state_attr(dashboard_helper, 'ui_translations') | default({}) -%}
            {%- set core_sensors = state_attr(dashboard_helper, 'core_sensors') | default({}) -%} 
            {%- set rewards_data = state_attr(dashboard_helper, 'rewards') | default([]) -%} 
            {%- set points_eid = core_sensors.points_eid | default('sensor.kc_' ~ kid_name_slug ~ '_points') -%} 
            {%- set current_points = states(points_eid) | int(default=0) -%}
            {%- set points_label = state_attr(points_eid, 'unit_of_measurement') | default('Points') -%} 
            {%- set pref_column_count = 3 -%}

            {%- set rns = namespace(reward_groups={'-No Label-': []}) -%} {%- for
            reward in rewards_data -%}
              {%- set reward_eid = reward.eid -%}
              {%- set reward_sensor = states(reward_eid) if reward_eid else none -%}
              {%- if reward_sensor and reward_sensor != 'unavailable' and reward_sensor != 'unknown' -%}
                {%- set reward_name = reward.name | default(state_attr(reward_eid, 'reward_name') | default('Unknown')) -%}
                {%- set reward_cost = reward.cost | default(state_attr(reward_eid, 'cost') | default(0)) -%}
                {%- set reward_icon = state_attr(reward_eid, 'icon') | default('mdi:gift') -%}
                {%- set approvals = reward.approvals | default(state_attr(reward_eid, 'reward_approvals_count') | default(0)) -%}
                {%- set claims = reward.claims | default(state_attr(reward_eid, 'reward_claims_count') | default(0)) -%}
                {%- set claim_button = reward_eid | regex_replace('^sensor\\.kc_(\\w+)_reward_status_(.+)$', 'button.kc_\\1_reward_claim_\\2') -%}
                {%- set entry = {'name': reward_name, 'cost': reward_cost, 'icon': reward_icon, 'approvals': approvals, 'claims': claims, 'button': claim_button} -%}
                {%- set existing = rns.reward_groups.get('-No Label-', []) -%}
                {%- set rns.reward_groups = rns.reward_groups | combine({'-No Label-': existing + [entry]}) -%}
              {%- endif -%}
            {%- endfor -%}

            {%- for group_name, rewards_list in rns.reward_groups.items() -%}
              {%- if rewards_list | length > 0 -%}
                {{ {'type': 'heading', 'icon': 'mdi:gift-outline', 'heading': ui_translations.rewards | default('Rewards') + " (Points: " +states("sensor.kc_ethan_points") + ")", 'heading_style': 'title'} }},
                {%- set rg = namespace(cards=[]) -%}
                {%- for item in rewards_list | sort(attribute='cost') -%}
                  {%- set points_needed = item.cost - current_points if item.cost > current_points else 0 -%}
                  {%- set can_claim = "✅ Ready!" if points_needed == 0 else "❌ Need " ~ points_needed ~ " more" -%}
                  {%- set rg.cards = rg.cards + [{
                    'type': 'custom:mushroom-template-card',
                    'primary': item.name,
                    'layout': 'vertical',
                    'secondary': "💰 " ~ item.cost|string ~ " " ~ points_label ~ "  |  " ~ can_claim,
                    'icon': item.icon,
                    'icon_color': 'green' if points_needed == 0 else 'grey',
                    'badge_icon': 'mdi:check-bold' if points_needed == 0 else '',
                    'badge_color': 'green',
                    'tap_action': {'action': 'call-service', 'service': 'button.press', 'target': {'entity_id': item.button}}
                  }] -%}
                {%- endfor -%}
                {{ {'type': 'grid', 'columns': pref_column_count, 'square': false, 'cards': rg.cards} }},
              {%- else -%}
                {{ {'type': 'markdown', 'content': '*No rewards available.*'} }},
              {%- endif -%}
            {%- endfor -%}
