# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Family Room" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: TV
    modules:
      - default
    sub_button:
      - entity: remote.family_room_samsung_tv
        name: TV
        icon: mdi:television
        show_name: true
      - entity: media_player.q_series_soundbar
        name: Speakers
        icon: mdi:soundbar
        show_name: false
      - entity: media_player.family_room
        name: ''
        icon: phu:apple-tv
  - type: horizontal-stack
    cards:
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_right_tv_lamp
          - name: TV Right
          - icon: hue:play-bar
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_left_tv_lamp
          - name: TV Left
          - icon: hue:play-bar
  - type: custom:bubble-card
    card_type: separator
    name: Lamps
  - type: horizontal-stack
    cards:
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_couch_right_lamp
          - name: Couch Lamp
          - icon: hue:aura
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_couch_left_lamp
          - name: Chair Lamp
          - icon: hue:aura
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.corner_couch_lamp
      - name: Corner Lamp
      - icon: hue:beyond-up
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.shelf_strip
      - name: Shelf Strip
      - icon: hue:friends-of-hue-iq-pendant
  - type: custom:bubble-card
    card_type: separator
    name: Security
  - show_state: false
    show_name: false
    camera_view: auto
    type: picture-entity
    entity: camera.family_room_camera
    tap_action:
      action: call-service
      service: abode.capture_image
      data:
        entity_id: camera.family_room_camera
    aspect_ratio: '9:5'
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.family_room_wall_switch
  - type: vertical-stack
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Ceiling Lights
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_ceiling_lamp_01
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_ceiling_lamp_02
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_ceiling_lamp_03
