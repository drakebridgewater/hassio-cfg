# Shared frame for every view: banner across the top, general (sidebar) on the
# left, page-specific `main` on the right, footer across the bottom.
# `main` holds one nested grid layout-card (layouts/main.yaml) that adds columns
# as the space grows, so no view leaves empty section slots.
# Breakpoints match the cards: 768px is where the navbar becomes a right rail,
# the room bar appears and the sidebar's calendar/weather/media cards show.
# The first matching media query wins, so they run narrowest first.
# The sidebar column keeps a minimum width so its cards fit their boxes; `main`
# is minmax(0, ...) so wide cards (camera, calendar) shrink instead of pushing
# the page into sideways scrolling.
grid-gap: var(--custom-layout-card-padding)
grid-template-columns: minmax(340px, 1fr) minmax(0, 4fr)
# The sidebar is two areas, `sidebar` and `lower`, stacked in the left column.
# `main` spans both plus a 1fr spacer row, so a tall page never pulls the two
# sidebar parts apart.
grid-template-rows: auto auto auto 1fr auto
# layout-card only applies grid-*, place-items and place-content keys.
place-items: start stretch
grid-template-areas: |
  "banner   banner"
  "sidebar  main  "
  "lower    main  "
  ".        main  "
  "footer   footer"
mediaquery:
  # Phone: one column. The top of the sidebar (status, compact weather) stays
  # above the page content; the lower part (calendars, chores) goes below it.
  "(max-width: 767px)":
    grid-gap: calc(var(--custom-layout-card-padding) * 1.7)
    grid-template-columns: minmax(0, 1fr)
    grid-template-rows: auto
    grid-template-areas: |
      "banner "
      "sidebar"
      "main   "
      "lower  "
      "footer "
  # Tablet: narrow general column, main gets 1-2 columns
  "(max-width: 1199px)":
    grid-template-columns: minmax(300px, 1fr) minmax(0, 2fr)
  # Desktop: main gets 2-3 columns
  "(max-width: 2099px)":
    grid-template-columns: minmax(340px, 1fr) minmax(0, 3fr)
