# Room button bar under the status chips: tablet and up. Phones use the navbar
# instead. Bubble pins this card type to the bottom of the screen and places
# each button with translateX in a sideways-scrolling strip; `styles` puts the
# card back in the page flow and lets the buttons wrap. Buttons keep the order
# below (auto_order sorts by translateX, so it has no effect here).
type: conditional
conditions:
  - condition: screen
    media_query: "(min-width: 768px)"
card:
  type: custom:bubble-card
  card_type: horizontal-buttons-stack
  width_desktop: 100%
  auto_order: true
  hide_gradient: true
  rise_animation: false
  styles: |
    .horizontal-buttons-stack-card {
      position: relative !important;
      bottom: auto !important;
      left: auto !important;
      right: auto !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 !important;
    }
    .card-content {
      position: relative !important;
      left: 0 !important;
      top: 0 !important;
      transform: none !important;
      overflow: visible !important;
      width: 100% !important;
      height: auto !important;
      padding: 0 !important;
    }
    .bubble-horizontal-buttons-stack-card-container {
      display: flex !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 8px !important;
      width: 100% !important;
      height: auto !important;
    }
    .bubble-button {
      position: relative !important;
      transform: none !important;
    }
  1_name: Living Room
  1_icon: mdi:sofa
  1_link: /lovelace-main/living-room
  1_entity: light.awning_lights
  1_pir_sensor: binary_sensor.living_room_presence_sensor_occupancy

