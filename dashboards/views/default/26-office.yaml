title: Office
path: office
icon: mdi:desk
subview: true
back_path: /lovelace-main/home
type: custom:grid-layout
layout: !include ../../layouts/frame.yaml

# Room page: the room's main light up top, then its sections from
# sections/rooms/office/ (ported from the GUI by tools/port_gui_rooms.py) in columns.
cards:
  - !include ../../frame/banner.yaml
  - !include ../../frame/sidebar.yaml
  - !include ../../frame/sidebar-lower.yaml
  - !include ../../frame/footer.yaml
  - !include ../../navigation/rooms.yaml

  - type: vertical-stack
    view_layout:
      grid-area: main
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        name: Office
        entity: light.office_lights_group
        force_icon: false
        show_state: true
        show_last_changed: false
        button_action:
          tap_action:
            action: none
        tap_action:
          action: toggle
        sub_button:
          - entity: light.desk_lights_group
            icon: mdi:desk
            tap_action:
              action: more-info
            hold_action:
              action: more-info
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: !include ../../layouts/main.yaml
        cards: !include_dir_list ../../sections/rooms/office
