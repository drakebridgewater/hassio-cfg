# Room page: the room's main light up top, then its sections from
# sections/rooms/office/ (ported from the GUI by tools/port_gui_rooms.py) one section per file.
title: Office
path: office
icon: mdi:desk
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:

  - type: custom:decluttering-card
    template: bubble_chips
    column_span: 4
    variables:
      - chips:
          - entity: binary_sensor.office_multi_sensor_home_security_motion_detection
            icon: mdi:motion-sensor
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: binary_sensor.office_window
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: sensor.office_temperature_sensor_temperature
            show_state: true
            fill_width: false
  - type: grid
    column_span: 4
    cards:
      # Lighting mode first (cards/lighting-mode/), in the wall switch LED colours.
      - !include ../../cards/lighting-mode/office_room.yaml
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        name: Office
        entity: light.office_lights_group
        force_icon: false
        show_state: true
        show_last_changed: false
        button_action:
          tap_action:
            action: none
        tap_action:
          action: toggle
        sub_button:
          - entity: light.desk_lights_group
            icon: mdi:desk
            tap_action:
              action: more-info
            hold_action:
              action: more-info
      - !include ../../sections/rooms/office/01-alerts.yaml
  - type: grid
    cards:
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.office_wall_switch
      - type: custom:decluttering-card
        template: bubble_wled
        variables:
          - device: wled_candles
          - name: Desk Ambiance
          - icon: phu:christmas-tree-v2
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.office_desk_right_lamp
          - name: Desk Right
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.office_behind_monitor_lamp
          - name: Behind Monitor
          - icon: hue:friends-of-hue-iq-pendant
  - type: grid
    cards:
      - !include ../../sections/rooms/office/20-power-strips.yaml
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/rooms.yaml
