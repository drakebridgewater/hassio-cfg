title: Ethan
path: ethan
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:
  # Lighting mode first (cards/lighting-mode/), in the wall switch LED colours.
  - type: grid
    column_span: 4
    cards:
      - !include ../../cards/lighting-mode/ethan_s_room.yaml
      - !include ../../sections/rooms/ethan/01-alerts.yaml
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Bedroom
        icon: mdi:bed
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.ethan_s_bedroom_wall_switch
          - name: Wall Switch
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.toy_chest_strip
          - name: Bed Lights
          - icon: mdi:bed-empty
      - type: custom:decluttering-card
        template: bubble_switch
        variables:
          - entity: switch.ethan_s_door_switch
          - name: White Noise
          - icon: mdi:sleeps

      - type: custom:bubble-card
        card_type: sub-buttons
        sub_button:
          main: []
          bottom:
            - name: Group 1
              buttons_layout: inline
              group:
                - entity: sensor.ethans_bedroom_presence_sensor_light_sensor
                  show_state: true
                  name: Light Level
                  show_name: true
                  content_layout: icon-top
                  icon: mdi:weather-sunny
                - entity: binary_sensor.ethan_s_bedroom_window_sensor_contact
                  name: Window Sensor
                  icon: mdi:window-open
                  content_layout: icon-top
                  show_state: true
                  force_icon: false
            - name: Group 2
              buttons_layout: inline
              group:
                - entity: binary_sensor.ethan_bedroom_occupancy
                  name: Occupancy
                  icon: mdi:motion-sensor
                  show_state: true
                  content_layout: icon-top
                - entity: binary_sensor.ethans_bedroom_presence_sensor_occupancy
                  name: Occupancy
                  icon: mdi:motion-sensor
                  show_state: true
                  content_layout: icon-top
            - name: Group 3
              buttons_layout: inline
              group:
                - entity: sensor.ethans_blinds_battery
                  show_state: true
                  show_name: true
                  name: Blinds Battery
                  content_layout: icon-top
                - entity: cover.ethans_blinds
                  show_state: true
                  show_name: true
                  name: Blinds
                  content_layout: icon-top
          bottom_layout: rows
        rows: 2.325
  - type: grid
    cards:
      - type: custom:routine-editor-card
        routine: morning
        note: Only runs on workdays, and stops once everyone has left.
  - type: grid
    cards:
      - type: custom:routine-editor-card
        routine: bedtime
        note: Only starts when the alarm is disarmed and the bathroom light is off.

  - type: grid
    cards:
      - type: custom:stack-in-card
        cards:
          - type: entities
            title: Scheduling
            entities:
              - type: custom:scheduler-card
                tags: ethan
                title: false
                discover_existing: false
                sort_by:
                  - state
                  - relative-time
                display_options:
                  primary_info: default
                  secondary_info:
                    - relative-time
                  icon: action
                show_header_toggle: false
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/rooms.yaml
