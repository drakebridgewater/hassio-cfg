# Help: for anyone who isn't Drake. Tell the house (broadcast) and shopping side by side,
# then "Something's not working" (tap a tile to fix it), then how the house works.
# Two columns at most so the wide sections span the page and phones stack everything.
# No status card, so the help starts at the top. AdGuard and the critical-sensors
# list moved to Maintenance (98-maintenance.yaml); a Drake-only tile at the bottom links there.
title: Help
path: help
icon: mdi:help-circle-outline
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 2
header: !include ../../header/alert-ticker.yaml
sections:
  - type: grid
    cards:
      - !include ../../sections/pages/help/10-broadcast.yaml
  - type: grid
    cards:
      - !include ../../sections/pages/help/20-shopping.yaml
  - type: grid
    column_span: 2
    cards:
      - !include ../../sections/pages/help/30-not-working.yaml
  - type: grid
    column_span: 2
    cards:
      - !include ../../sections/pages/help/40-how-it-works.yaml
  # Drake only: the link to Maintenance.
  - type: grid
    column_span: 2
    visibility:
      - condition: user
        users:
          - 9edc32828f114914baabce7b9ae21eb3
    cards:
      - !include ../../sections/pages/help/50-maintenance.yaml
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/house.yaml
