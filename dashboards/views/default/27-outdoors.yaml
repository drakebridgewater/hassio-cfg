# Room page: the room's main light up top, then its sections from
# sections/rooms/outdoors/ (ported from the GUI by tools/port_gui_rooms.py) one section per file.
title: Outdoors
path: outdoors
icon: hue:room-outdoors
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        name: Outdoor
        entity: light.front_porch_wall_switch
        force_icon: false
        show_state: true
        show_last_changed: false
        button_action:
          tap_action:
            action: none
        tap_action:
          action: toggle
      - !include ../../sections/rooms/outdoors/00-badges.yaml
      - !include ../../sections/rooms/outdoors/01-alerts.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/10-garbage.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/20-uv-index.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/30-weather.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/40-frontdoor.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/50-backyard.yaml
  - type: grid
    cards:
      - !include ../../sections/rooms/outdoors/60-openuv.yaml
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/rooms.yaml
