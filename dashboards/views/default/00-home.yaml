title: Home
icon: mdi:home
path: home
# background: center / cover no-repeat fixed url('/local/tropical-background.jpg')
type: custom:grid-layout
layout: !include ../../layouts/frame.yaml

cards:
  - !include ../../frame/banner.yaml
  - !include ../../frame/sidebar.yaml
  - !include ../../frame/sidebar-lower.yaml
  - !include ../../frame/footer-home.yaml
  - !include ../../navigation/home.yaml

  - type: custom:layout-card
    layout_type: custom:grid-layout
    view_layout:
      grid-area: main
    layout: !include ../../layouts/main.yaml
    cards:
      # - !include ../../cards/alert-ticker.yaml
      # - !include ../../cards/notification-feed.yaml
      # Rooms, grouped like the GUI dashboard: one stack per floor (a Bubble
      # separator and a 2-wide grid), so the floors sit side by side on wide screens.
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Upstairs
            icon: mdi:home-floor-1
          - type: grid
            columns: 2
            square: false
            cards: !include_dir_list ../../sections/spaces-cards/upstairs
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Downstairs
            icon: mdi:home-floor-b
          - type: grid
            columns: 2
            square: false
            cards: !include_dir_list ../../sections/spaces-cards/downstairs
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Other
            icon: mdi:home-group
          - type: grid
            columns: 2
            square: false
            cards: !include_dir_list ../../sections/spaces-cards/other
