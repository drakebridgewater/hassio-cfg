# Climate, Temperatures tab. The tabs across the top switch to HVAC (41-climate-hvac.yaml)
# and Air quality (42-climate-aqi.yaml).
#   Upstairs and downstairs: one card per floor, its average over a tile per room
#   Outside and unheated: outdoor, garage, attic, crawl space, greenhouse
#   Trends: temperature and humidity, then the attic and crawl space histories
# Cards sit side by side inside a section through grid_options; a section's grid
# has 12 columns per column it spans (so 12 = a quarter of a 4-wide section, and
# on narrower screens the same cards wrap to halves).
title: Climate
path: climate
icon: mdi:thermometer
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:
  - type: grid
    column_span: 4
    cards:
      - !include ../../cards/climate-tabs.yaml
      # Upstairs and downstairs side by side whenever there's room for both.
      - type: custom:layout-card
        layout_type: custom:grid-layout
        grid_options:
          columns: full
        layout:
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))
          grid-gap: 8px
          margin: 0
          padding: 0
          card_margin: 0
        cards:
          - !include ../../sections/climate/temperatures/10-upstairs.yaml
          - !include ../../sections/climate/temperatures/20-downstairs.yaml
      - type: vertical-stack
        grid_options:
          columns: full
        cards:
          - !include ../../sections/climate/temperatures/30-outside.yaml

