# Room page: the room's main light up top, then its sections from
# sections/rooms/family-room/ (ported from the GUI by tools/port_gui_rooms.py) one section per file.
title: Family Room
path: family-room
icon: mdi:theater
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:

  - type: grid
    column_span: 4
    cards:
      - !include ../../sections/rooms/family-room/00-badges.yaml
      - !include ../../sections/rooms/family-room/01-alerts.yaml
  - type: grid
    column_span: 4
    cards:
      # Lighting mode first (cards/lighting-mode/), in the wall switch LED colours.
      - !include ../../cards/lighting-mode/family_room.yaml
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        name: Family Room
        entity: light.family_room_wall_switch
        force_icon: false
        show_state: true
        show_last_changed: false
        tap_action:
          action: more-info
        sub_button:
          - entity: light.family_room_wall_switch
            icon: mdi:light-switch
            tap_action:
              action: more-info
          - icon: mdi:power
            tap_action:
              action: toggle
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: TV
        modules:
          - default
        sub_button:
          - entity: remote.family_room_samsung_tv
            name: TV
            icon: mdi:television
            show_name: true
          - entity: media_player.q_series_soundbar
            name: Speakers
            icon: mdi:soundbar
            show_name: false
          - entity: media_player.family_room
            name: ''
            icon: phu:apple-tv
      - type: horizontal-stack
        cards:
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.family_room_right_tv_lamp
              - name: TV Right
              - icon: hue:play-bar
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.family_room_left_tv_lamp
              - name: TV Left
              - icon: hue:play-bar

  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Lamps
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_couch_right_lamp
          - name: Couch Lamp
          - icon: hue:aura
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_couch_left_lamp
          - name: Chair Lamp
          - icon: hue:aura
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.corner_couch_lamp
          - name: Corner Lamp
          - icon: hue:beyond-up
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.shelf_strip
          - name: Shelf Strip
          - icon: hue:friends-of-hue-iq-pendant
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Wall Switch for Ceiling Lights
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.family_room_wall_switch
          - name: Wall Switch
      - type: custom:bubble-card
        card_type: separator
        name: Individual Ceiling Lights
      - type: horizontal-stack
        cards:
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.family_room_ceiling_lamp_01
              - icon: mdi:numeric-1-circle
              - show_name: false
              - show_state: false
              - show_last_changed: false
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.family_room_ceiling_lamp_02
              - icon: mdi:numeric-2-circle
              - show_name: false
              - show_state: false
              - show_last_changed: false
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.family_room_ceiling_lamp_03
              - icon: mdi:numeric-3-circle
              - show_name: false
              - show_state: false
              - show_last_changed: false

  - type: grid
    cards:
      - !include ../../sections/rooms/family-room/90-air-quality.yaml
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Security
      - show_state: false
        show_name: false
        camera_view: auto
        type: picture-entity
        entity: camera.family_room_camera
        tap_action:
          action: call-service
          service: abode.capture_image
          data:
            entity_id: camera.family_room_camera
        aspect_ratio: '9:5'
  - type: grid
    cards:
      - !include ../../sections/rooms/family-room/20-power.yaml
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/rooms.yaml
