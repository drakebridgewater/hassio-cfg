# Room page: the room's main light up top, then its sections from
# sections/rooms/dining/ (ported from the GUI by tools/port_gui_rooms.py) one section per file.
title: Dining Room
path: dining
icon: mdi:table-furniture
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 4
header: !include ../../header/alert-ticker.yaml
sections:
  - type: grid
    column_span: 4
    cards:
      - !include ../../sections/rooms/dining/00-chips.yaml
      # Lighting mode first (cards/lighting-mode/), in the wall switch LED colours.
      - !include ../../cards/lighting-mode/main_area.yaml
      - !include ../../cards/scenes/main.yaml
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Lighting
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.vaulted_light
          - name: Light
      - type: custom:decluttering-card
        template: bubble_switch
        variables:
          - entity: fan.ceiling_fan
          - name: Fan
          - icon: mdi:ceiling-fan
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.dining_room_ambience
          - name: Dining Ambience
          - icon: hue:table-wash
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.stair_ambience_01
          - name: Stair Ambience
          - icon: hue:table-wash
  
  - type: grid
    cards:
      - type: custom:bubble-card
        card_type: separator
        name: Entryway
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.stairs_wall_switch
          - name: Stairs
          - icon: phu:chandelier
      - type: custom:decluttering-card
        template: bubble_light
        variables:
          - entity: light.upstairs_hallway_wall_switch
          - name: Hallway
          - icon: mdi:ceiling-light
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/rooms.yaml
