# Cleaning: a full-screen vacuum page, no header or status card. Controls on the left
# (status, labelled actions, clean one room), the live map on the right; on phones
# they stack. From 900px the page doesn't scroll (cards/scroll-lock.yaml).
title: Cleaning
path: cleaning
icon: mdi:vacuum-outline
subview: true
back_path: /lovelace-main/home
type: sections
max_columns: 2
sections:
  - type: grid
    column_span: 1
    cards: !include_dir_list ../../sections/pages/cleaning/col1
  - type: grid
    column_span: 1
    cards: !include_dir_list ../../sections/pages/cleaning/col2
  - type: grid
    cards:
      - !include ../../frame/footer.yaml
      - !include ../../navigation/house.yaml
      - !include ../../cards/scroll-lock.yaml
