# One room in a floor's temperature card (Climate page, Temperatures tab). Room name,
# temperature, a line saying how it compares with the thermostat, and the room's
# 24-hour trend (custom_fields.graph, added by decluttering-templates/temp_tile.yaml).
# Tap anywhere for the sensor's more-info. Variables:
#   compare  true to tint against the thermostat's setting: blue a degree or more below
#            the heat setting, orange a degree or more above the cool setting
# stack-in-card strips child cards' background and radius, so the tint goes through
# --tile-bg and is re-applied with !important (as in status_tile.yaml).
temp_tile:
  show_name: true
  show_icon: false
  show_state: false
  show_label: true
  triggers_update:
    - climate.thermostat
  tap_action:
    action: more-info
  hold_action:
    action: more-info
  variables:
    compare: true
    # { tone, note } for this reading against the thermostat.
    verdict: >-
      [[[ const n = Number(entity?.state);
          if (!entity || ['unavailable', 'unknown'].includes(entity.state) || !Number.isFinite(n))
            return { tone: 'neutral', note: 'No signal' };
          if (!variables.compare) return { tone: 'neutral', note: '' };
          const t = hass.states['climate.thermostat'];
          const at = t?.attributes || {};
          let low = null, high = null;
          if (t?.state === 'heat_cool') { low = at.target_temp_low; high = at.target_temp_high; }
          else if (t?.state === 'heat') low = at.temperature;
          else if (t?.state === 'cool') high = at.temperature;
          else return { tone: 'neutral', note: 'Thermostat off' };
          if (low != null && low - n >= 1) return { tone: 'cool', note: `${Math.round(low - n)}° below setting` };
          if (high != null && n - high >= 1) return { tone: 'heat', note: `${Math.round(n - high)}° above setting` };
          return { tone: 'neutral', note: 'In range' }; ]]]
  label: '[[[ return variables.verdict.note ]]]'
  custom_fields:
    temp: >-
      [[[ const n = Number(entity?.state);
          return Number.isFinite(n) && !['unavailable', 'unknown'].includes(entity.state) ? `${n.toFixed(1)}°` : '–'; ]]]
  extra_styles: |
    ha-card { background: var(--tile-bg) !important; border-radius: 12px !important; }
  styles:
    card:
      - '--tone': >-
          [[[ return { cool: 'var(--blue-color)', heat: 'var(--deep-orange-color)' }[variables.verdict.tone]
                ?? 'var(--secondary-text-color)' ]]]
      - '--tile-bg': >-
          [[[ return variables.verdict.tone === 'neutral'
                ? 'color-mix(in srgb, var(--primary-text-color) 6%, transparent)'
                : 'color-mix(in srgb, var(--tone) 16%, transparent)' ]]]
      - border: none
      - padding: 10px 12px 0
      - overflow: hidden
    grid:
      - grid-template-areas: '"n" "temp" "l" "graph"'
      - grid-template-columns: minmax(0, 1fr)
      - justify-items: start
      - row-gap: 2px
    name:
      - font-size: 13px
      - color: var(--secondary-text-color)
      - justify-self: start
      - max-width: 100%
      - overflow: hidden
      - text-overflow: ellipsis
    label:
      - font-size: 12px
      - color: var(--secondary-text-color)
      - justify-self: start
      - min-height: 15px
    custom_fields:
      temp:
        - font-family: var(--code-font-family, monospace)
        - font-size: 20px
        - font-weight: 600
        - font-variant-numeric: tabular-nums
        - color: >-
            [[[ return variables.verdict.tone === 'neutral' ? 'var(--primary-text-color)' : 'var(--tone)' ]]]
      graph:
        - justify-self: stretch
        - margin: 4px -12px 0
