# Media players shown in the navbar's media bar (navbar-card `media_player.players`).
# A player shows while it plays and for 10 minutes after it pauses, so you can resume it
# from the bar; with several at once the bar becomes a swipeable carousel.
# Jellyfin, Cast, Alexa and voice-satellite players are left out: they repeat the devices below.

# Music Assistant speakers
- entity: media_player.living_room_2
  show: "[[[ const s = states['media_player.living_room_2']; return s?.state === 'playing' || (s?.state === 'paused' && Date.now() - new Date(s.last_changed) < 600000) ]]]"
- entity: media_player.family_room_2
  show: "[[[ const s = states['media_player.family_room_2']; return s?.state === 'playing' || (s?.state === 'paused' && Date.now() - new Date(s.last_changed) < 600000) ]]]"
