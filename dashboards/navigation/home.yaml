# Home view bar: one entry per page group (no Home button on Home).
type: custom:decluttering-card
template: navbar
view_layout:
  grid-area: footer
variables:
  - routes:
      - url: /lovelace-main/security
        icon: mdi:shield-home
        label: Security
      - icon: mdi:floor-plan
        label: Rooms
        tap_action:
          action: open-popup
        popup: !include rooms-popup.yaml
      - url: /lovelace-main/calendar
        icon: mdi:calendar
        label: Planning
      - url: /lovelace-main/cleaning
        icon: mdi:home-variant
        label: House
