# Home view bar: one entry per page group (no Home button on Home).
type: custom:decluttering-card
template: navbar
variables:
  - routes:
      - url: /lovelace-main/security
        icon: mdi:shield-home
        label: Security
      - url: /lovelace-main/calendar
        icon: mdi:calendar
        label: Planning
      - url: /cod-chores_ops
        icon: mdi:checkbox-marked-circle-auto-outline
        label: Chores
      - url: /lovelace-main/climate
        icon: mdi:home-variant
        label: House
      # Kitchen tablet only (tablet-route.yaml).
      - !include tablet-route.yaml
