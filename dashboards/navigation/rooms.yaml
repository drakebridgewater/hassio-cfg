# Rooms pages bar.
type: custom:decluttering-card
template: navbar
variables:
  - routes:
      # Home goes to the page made for the device: Tablet from 768px wide
      # (tablets and desktops, navbar.isDesktop), Home on phones.
      - url: /lovelace-main/tablet
        icon: mdi:home
        label: Home
        hidden: '[[[ return !navbar.isDesktop ]]]'
      - url: /lovelace-main/home
        icon: mdi:home
        label: Home
        hidden: '[[[ return navbar.isDesktop ]]]'
      - url: /lovelace-main/ethan
        icon: mdi:teddy-bear
        label: Ethan
      - url: /lovelace-main/garage
        icon: mdi:garage
        label: Garage
      - url: /lovelace-main/greenhouse
        icon: mdi:greenhouse
        label: Greenhouse
      - url: /lovelace-main/bathrooms
        icon: mdi:toilet
        label: Bathrooms
      - icon: mdi:floor-plan
        label: Rooms
        tap_action:
          action: open-popup
        popup: !include rooms-popup.yaml
      # Kitchen tablet only (tablet-route.yaml).
      - !include tablet-route.yaml
