# Dimmable light (brightness only): wall dimmers, light groups.
bubble_light:
  default:
    - name: null
    - icon: null
  card:
    type: custom:decluttering-card
    template: bubble_control
    variables:
      - entity: '[[entity]]'
      - name: '[[name]]'
      - icon: '[[icon]]'
      - button_type: slider
      - slider: brightness
