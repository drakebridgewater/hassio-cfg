# Dimmable light (brightness only): wall dimmers, light groups.
bubble_light:
  default:
    - name: null
    - icon: null
    - show_name: true
    - show_state: true
    - show_last_changed: true
  card:
    type: custom:decluttering-card
    template: bubble_control
    variables:
      - entity: '[[entity]]'
      - name: '[[name]]'
      - icon: '[[icon]]'
      - button_type: slider
      - slider: brightness
      - show_name: '[[show_name]]'
      - show_state: '[[show_state]]'
      - show_last_changed: '[[show_last_changed]]'
