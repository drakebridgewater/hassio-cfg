# Air quality card (from the GUI Air page): 0-100 score ring with advice,
# temperature and humidity, a 24h trend, and one tile per pollutant.
# Every room uses this template; only the data changes.
#   name, subtitle   header text
#   temp, humid      entity ids for the header readings and the trend graph
#   score            {pm25, voc, voc_max, co2}: inputs to the score; omit any the room lacks
#   tiles            list of {name, entity, unit, good, mod, high, scale, decimals}
aq_room:
  default:
    - subtitle: Climate · Air Quality
    - score: {}
  card:
    type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          background: var(--ha-card-background, #0f2845);
          border-radius: 22px;
          padding: 0;
          box-shadow: none;
          border: none;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          entity: '[[temp]]'
          variables:
            name: '[[name]]'
            subtitle: '[[subtitle]]'
            temp: '[[temp]]'
            humid: '[[humid]]'
            score: '[[score]]'
          tap_action:
            action: more-info
          show_icon: false
          show_name: false
          show_label: false
          show_state: false
          styles:
            card:
              - background: transparent
              - border: none
              - border-radius: 22px 22px 0 0
              - padding: 20px 20px 14px 20px
              - box-shadow: none
              - cursor: pointer
            grid:
              - grid-template-areas: '"body"'
              - grid-template-columns: 1fr
            custom_fields:
              body:
                - justify-self: stretch
                - width: 100%
          custom_fields:
            body: |
              [[[
                const num = (id) => {
                  if (!id) return null;
                  const n = parseFloat(states[id]?.state);
                  return isNaN(n) ? null : n;
                };
                const unit = (id, fallback) => states[id]?.attributes?.unit_of_measurement || fallback;

                // Score: PM2.5 (40) + CO2 (35) + VOC (25), rescaled to whichever inputs the room has
                const sc = variables.score || {};
                const pm25 = num(sc.pm25), co2 = num(sc.co2), voc = num(sc.voc);
                const parts = [];
                if (pm25 !== null) parts.push([40, Math.min(1, Math.max(0, pm25 / 35))]);
                if (co2 !== null) parts.push([35, Math.min(1, Math.max(0, (co2 - 400) / 1600))]);
                if (voc !== null) parts.push([25, Math.min(1, Math.max(0, voc / (sc.voc_max || 300)))]);
                const weight = parts.reduce((a, p) => a + p[0], 0);
                const score = weight ? Math.max(0, Math.round(100 - parts.reduce((a, p) => a + p[0] * p[1], 0) * 100 / weight)) : 0;

                let scoreColor = '#86efac', scoreLabel = 'Good', advice = 'Air quality is good';
                if (score < 80) { scoreColor = '#fde68a'; scoreLabel = 'Moderate'; advice = 'Air quality is moderate'; }
                if (score < 60) { scoreColor = '#fdba74'; scoreLabel = 'Poor'; advice = 'Consider ventilating'; }
                if (score < 40) { scoreColor = '#fca5a5'; scoreLabel = 'Bad'; advice = 'Ventilate now'; }
                if (pm25 !== null && pm25 > 12) advice = 'Particles elevated';
                if (voc !== null && voc > (sc.voc_max || 300) * 0.66) advice = 'VOCs detected';
                if (co2 !== null && co2 > 1000) advice = 'CO2 high - open a window';
                if (co2 !== null && co2 > 1500) advice = 'CO2 very high - ventilate';
                if (!weight) { scoreLabel = 'No data'; advice = 'Sensors unavailable'; scoreColor = '#6e87a8'; }

                const temp = num(variables.temp), humid = num(variables.humid);
                const radius = 42;
                const circ = 2 * Math.PI * radius;
                const dashOffset = circ - (score / 100) * circ;
                const r = parseInt(scoreColor.slice(1, 3), 16);
                const g = parseInt(scoreColor.slice(3, 5), 16);
                const b = parseInt(scoreColor.slice(5, 7), 16);

                return `
                  <div style="display:flex;flex-direction:column;width:100%;font-family:Google Sans, Roboto, system-ui, sans-serif;color:#ffffff;text-align:left;box-sizing:border-box;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;">
                      <div>
                        <div style="font-size:15px;color:#ffffff;font-weight:500;">${variables.name}</div>
                        <div style="font-size:11px;color:#6e87a8;margin-top:2px;">${variables.subtitle}</div>
                      </div>
                      <div style="background:rgba(${r},${g},${b},0.12);border:1px solid rgba(${r},${g},${b},0.35);border-radius:999px;padding:5px 12px;font-size:11px;color:${scoreColor};display:flex;align-items:center;gap:6px;">
                        <span style="width:6px;height:6px;background:${scoreColor};border-radius:50%;"></span>${scoreLabel}
                      </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                      <div>
                        <div style="display:flex;align-items:baseline;gap:6px;">
                          <span style="font-size:54px;font-weight:400;color:${scoreColor};line-height:1;">${score}</span>
                          <span style="font-size:14px;color:#a8c0e0;">/ 100</span>
                        </div>
                        <div style="font-size:12px;color:#a8c0e0;margin-top:6px;">${advice}</div>
                        <div style="display:flex;gap:14px;margin-top:14px;">
                          <div>
                            <div style="display:flex;align-items:baseline;gap:4px;">
                              <span style="font-size:24px;font-weight:400;color:#ffffff;">${temp === null ? '—' : temp.toFixed(1)}</span>
                              <span style="font-size:11px;color:#a8c0e0;">${unit(variables.temp, '°')}</span>
                            </div>
                            <div style="font-size:10px;color:#6e87a8;margin-top:2px;">TEMPERATURE</div>
                          </div>
                          <div style="width:1px;background:#1e3a5f;"></div>
                          <div>
                            <div style="display:flex;align-items:baseline;gap:4px;">
                              <span style="font-size:24px;font-weight:400;color:#ffffff;">${humid === null ? '—' : humid.toFixed(0)}</span>
                              <span style="font-size:11px;color:#a8c0e0;">%</span>
                            </div>
                            <div style="font-size:10px;color:#6e87a8;margin-top:2px;">HUMIDITY</div>
                          </div>
                        </div>
                      </div>
                      <div style="position:relative;width:100px;height:100px;flex-shrink:0;">
                        <svg viewBox="0 0 100 100" style="transform:rotate(-90deg);width:100%;height:100%;">
                          <circle cx="50" cy="50" r="${radius}" fill="none" stroke="#1e3a5f" stroke-width="8"/>
                          <circle cx="50" cy="50" r="${radius}" fill="none" stroke="${scoreColor}" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"/>
                        </svg>
                        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                          <div style="font-size:11px;color:#a8c0e0;">SCORE</div>
                          <div style="font-size:11px;color:${scoreColor};font-weight:500;">${score}%</div>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              ]]]
        - type: custom:mini-graph-card
          entities:
            - entity: '[[temp]]'
              name: Temp
              color: '#fde68a'
            - entity: '[[humid]]'
              name: Humidity
              color: '#a8c0e0'
              y_axis: secondary
          hours_to_show: 24
          points_per_hour: 2
          line_width: 2
          animate: true
          smoothing: true
          height: 60
          show:
            name: false
            icon: false
            state: false
            legend: true
            labels: false
            fill: fade
          card_mod:
            style: |
              ha-card {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                padding: 0 14px !important;
                margin: 0 6px 14px 6px;
              }
        - type: custom:button-card
          variables:
            tiles: '[[tiles]]'
          tap_action:
            action: none
          show_icon: false
          show_name: false
          show_label: false
          show_state: false
          styles:
            card:
              - background: transparent
              - border: none
              - border-radius: 0 0 22px 22px
              - padding: 0 20px 20px 20px
              - box-shadow: none
            grid:
              - grid-template-areas: '"tiles"'
              - grid-template-columns: 1fr
            custom_fields:
              tiles:
                - justify-self: stretch
                - width: 100%
          custom_fields:
            tiles: |
              [[[
                const tiles = variables.tiles || [];
                const thresh = (v, t) => {
                  const pct = Math.min(100, (v / t.high) * 100);
                  if (v <= t.good) return { label: 'GOOD', color: '#86efac', pct };
                  if (v <= t.mod) return { label: 'MOD', color: '#fde68a', pct };
                  if (v <= t.high) return { label: 'HIGH', color: '#fdba74', pct };
                  return { label: 'V.HIGH', color: '#fca5a5', pct: 100 };
                };
                const tile = (t) => {
                  const raw = parseFloat(states[t.entity]?.state);
                  const unit = t.unit || states[t.entity]?.attributes?.unit_of_measurement || '';
                  const ok = !isNaN(raw);
                  const v = ok ? raw * (t.scale || 1) : 0;
                  const st = ok ? thresh(v, t) : { label: 'N/A', color: '#6e87a8', pct: 0 };
                  const shown = ok ? Number(v.toFixed(t.decimals || 0)).toLocaleString() : '—';
                  return `
                    <div style="padding:0 6px;min-width:0;overflow:hidden;cursor:pointer;"
                         onclick="this.dispatchEvent(new CustomEvent('hass-more-info', {bubbles: true, composed: true, detail: {entityId: '${t.entity}'}}))">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:4px;">
                        <span style="font-size:11px;color:#a8c0e0;font-weight:500;white-space:nowrap;">${t.name}</span>
                        <span style="font-size:9px;color:${st.color};white-space:nowrap;">${st.label}</span>
                      </div>
                      <div style="display:flex;align-items:baseline;gap:4px;">
                        <span style="font-size:22px;font-weight:400;color:#ffffff;line-height:1;white-space:nowrap;">${shown}</span>
                        <span style="font-size:10px;color:#6e87a8;white-space:nowrap;">${unit}</span>
                      </div>
                      <div style="height:3px;background:#1e3a5f;border-radius:2px;overflow:hidden;margin-top:8px;">
                        <div style="height:100%;width:${st.pct}%;background:${st.color};"></div>
                      </div>
                    </div>
                  `;
                };
                const cols = Math.min(3, Math.max(1, tiles.length));
                return `
                  <div style="padding-top:14px;border-top:1px solid #1e3a5f;">
                    <div style="display:grid;grid-template-columns:repeat(${cols},1fr);row-gap:14px;column-gap:8px;width:100%;font-family:Google Sans, Roboto, system-ui, sans-serif;">
                      ${tiles.map(tile).join('')}
                    </div>
                  </div>
                `;
              ]]]
