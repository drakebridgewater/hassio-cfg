# Color light. One slider: brightness by default, or `slider: hue` for color
# or `slider: white_temp` for warmth.
bubble_light_color:
  default:
    - name: null
    - icon: null
    - slider: brightness
    - show_name: true
    - show_state: true
    - show_last_changed: true
  card:
    type: custom:decluttering-card
    template: bubble_control
    variables:
      - entity: '[[entity]]'
      - name: '[[name]]'
      - icon: '[[icon]]'
      - button_type: slider
      - slider: '[[slider]]'
      - show_name: '[[show_name]]'
      - show_state: '[[show_state]]'
      - show_last_changed: '[[show_last_changed]]'
