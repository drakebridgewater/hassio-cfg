# Home room card (sections/spaces-cards/). Every room renders through this template so
# all cards look and behave alike, modelled on the stock area card: one row with the room
# icon and name, "temperature · humidity" under the name, and Bubble badges on the icon for
# anything out of range (see ARCHITECTURE.md). A faint ring around the icon shows the
# room's lighting mode in its wall switch LED 4 colour (sensor.lighting_mode_<zone>):
# green automatic, orange manual, yellow blinking when the motion automation is off.
# Tapping anywhere opens the room page (or a pop-up, for `popup` hashes).
# Variables:
#   name, icon, color ("r, g, b" tint), popup (room page path or pop-up hash), entity (occupancy sensor)
#   temp, humid, extra (optional reading entities), zone (LED zone, e.g. main_area), badges (list)
room_card:
  default:
    - temp: ''
    - humid: ''
    - extra: ''
    - zone: ''
    - badges: []
  card:
    type: custom:bubble-card
    card_type: button
    button_type: state
    entity: '[[entity]]'
    name: '[[name]]'
    icon: '[[icon]]'
    show_name: true
    show_icon: true
    show_state: true
    show_attribute: false
    show_last_changed: false
    scrolling_effect: false
    use_accent_color: false
    force_icon: true
    tap_action:
      action: navigate
      navigation_path: '[[popup]]'
    hold_action:
      action: none
    button_action:
      tap_action:
        action: navigate
        navigation_path: '[[popup]]'
      hold_action:
        action: none
    modules:
      - bubble_badges
    bubble_badges:
      badges: '[[badges]]'
    # Area-card style secondary line: the readings replace the occupancy state text.
    styles: |-
      ${(() => {
        const el = card.querySelector('.bubble-state');
        if (!el) return '';
        const fmt = (st) => st && !['unavailable', 'unknown'].includes(st.state) ? hass.formatEntityState(st) : null;
        // One span per reading with " · " between, so a parent can stack them
        // (--room-card-sep / --room-card-state-display below).
        const html = [
          fmt(hass.states['[[temp]]']),
          fmt(hass.states['[[humid]]']),
          fmt(hass.states['[[extra]]']),
        ].filter(Boolean).map((t) => `<span>${t}</span>`).join('<span class="sep"> · </span>');
        if (el.innerHTML !== html) el.innerHTML = html;
        return '';
      })()}
      /* Size hooks: a parent can enlarge the cards by setting these (the tablet
         hero does, in sections/tablet/10-hero.yaml). Fallbacks are Bubble's sizes. */
      .bubble-container { height: var(--room-card-height, 56px) !important; }
      .bubble-icon-container {
        width: var(--room-card-icon-size, 42px) !important; height: var(--room-card-icon-size, 42px) !important;
        min-width: var(--room-card-icon-size, 42px) !important; min-height: var(--room-card-icon-size, 42px) !important;
      }
      .bubble-icon { --mdc-icon-size: var(--room-card-glyph-size, 24px) !important; }
      /* Bubble fixes the name's line height at 18px; a bigger --room-card-name-size
         needs --room-card-name-line too, or descenders (g, y) are clipped. */
      .bubble-name {
        font-size: var(--room-card-name-size, 13px) !important;
        line-height: var(--room-card-name-line, 18px) !important;
      }
      .bubble-state { font-size: var(--room-card-state-size, 12px) !important; }
      /* Layout hooks: name and readings side by side, readings stacked (the
         tablet hero sets these). Fallbacks keep the stock name-over-readings
         layout; the align ones inherit when unset. */
      .bubble-name-container {
        flex-direction: var(--room-card-flow, column) !important;
        align-items: var(--room-card-items, normal) !important;
        justify-content: var(--room-card-justify, center) !important;
        gap: var(--room-card-gap, 0px);
      }
      .bubble-name { flex: var(--room-card-name-flex, 0 1 auto); min-width: 0; text-align: var(--room-card-name-align) !important; }
      .bubble-state {
        display: var(--room-card-state-display, flow-root) !important;
        flex-direction: column; align-items: flex-end; flex: none;
        text-align: var(--room-card-state-align) !important;
      }
      .bubble-state .sep { display: var(--room-card-sep, inline); }
      /* --room-card-base: optional layer under the room tint, so a parent can
         darken the cards over a bright background (the tablet hero does). */
      .bubble-button-card-container {
        background: linear-gradient(135deg, rgba([[color]], 0.2) 0%, rgba([[color]], 0.3) 100%),
          var(--room-card-base, none) !important;
      }
      .bubble-icon-container {
        ${(() => {
          const m = hass.states['sensor.lighting_mode_[[zone]]']?.state;
          if (m === 'auto') return 'box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--green-color) 40%, transparent) !important;';
          if (m === 'manual') return 'box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange-color) 85%, transparent) !important;';
          if (m === 'degraded') return 'box-shadow: 0 0 0 2px var(--yellow-color) !important; animation: room-mode-blink 2s ease-in-out infinite;';
          return '';
        })()}
      }
      @keyframes room-mode-blink { 50% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--yellow-color) 20%, transparent); } }
