# Fixed navigation bar along the bottom of the screen on every device
# (phones get the full-width bar, wider screens a floating one).
# Views include their page group's bar from dashboards/navigation/, which only
# passes `routes`, so the bar's look is defined once here.
navbar:
  card:
    type: custom:navbar-card
    desktop:
      position: bottom
      min_width: 768
      show_labels: true
      show_popup_label_backgrounds: true
    mobile:
      show_labels: true
      show_popup_label_backgrounds: true
    # Media bar above the navbar while anything plays (see navigation/media-players.yaml).
    media_player:
      album_cover_background: true
      players: !include ../navigation/media-players.yaml
    layout:
      # Media and Rooms light up while you're on one of their pages.
      reflect_child_state: true
      auto_padding:
        enabled: true
    haptic:
      tap_action: true
      url: true
    styles: |
      .navbar-popup-backdrop {
        background: rgba(0, 0, 0, 0.8);
      }
    routes: '[[routes]]'
