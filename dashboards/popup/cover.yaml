type: custom:bubble-card
card_type: pop-up
hash: '#cover'
button_type: name
name: Covers
cards:
  - type: custom:auto-entities
    card_param: cards
    card:
      type: grid
      columns: 2
      square: false
    filter:
      include:
        - domain: cover
          options:
            type: custom:bubble-card
            card_type: button
            button_type: state
    sort:
      method: state
      reverse: true
