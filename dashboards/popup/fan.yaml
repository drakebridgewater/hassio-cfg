type: vertical-stack
cards:
- type: custom:bubble-card
  card_type: pop-up
  hash: '#fan'
  button_type: name
  name: Fans
- type: custom:auto-entities
  card_param: cards
  card:
    type: grid
    columns: 2
    square: false
  filter:
    include:
      - domain: fan
        options:
          type: custom:bubble-card
          card_type: button
          button_type: state
  sort:
    method: state