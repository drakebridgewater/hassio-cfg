type: vertical-stack
cards: 
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#aqi-overview'
    button_type: state
    icon:  mdi:weather-dust
    name: AQI
    force_icon: false
    show_state: false
    show_last_changed: false
    show_attribute: false
    bg_opacity: '35'
    button_action:
      tap_action:
        action: none
    tap_action:
      action: toggle
  - type: custom:mushroom-template-card
    primary: AQI
    secondary: |+
      {{states('sensor.airnow_aqi')}} aqi
    icon: mdi:blur
    entity: sensor.airnow_aqi
    icon_color: blue

    badge_icon: |+
      {% if int(states('sensor.airnow_aqi'))>=100 -%}
        mdi:alert
      {%- elif int(states('sensor.airnow_aqi'))>=50 -%}
        mdi:alert-circle-outline
      {%- else %}
        
      {%- endif %}
    badge_color: |+
      {% if int(states('sensor.airnow_aqi'))>=301 -%}
        maroon
      {%- elif int(states('sensor.airnow_aqi'))>=201 -%}
        purple
      {%- elif int(states('sensor.airnow_aqi'))>=151 -%}
        red
      {%- elif int(states('sensor.airnow_aqi'))>=101 -%}
        orange
      {%- elif int(states('sensor.airnow_aqi'))>=51 -%}
        yellow
      {%- else %}
        green
      {%- endif %}
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    double_tap_action:
      action: none
  - type: custom:mushroom-template-card
    primary: PM2.5
    secondary: |+
