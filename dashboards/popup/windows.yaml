type: custom:bubble-card
card_type: pop-up
hash: '#window'
button_type: name
name: Window Sensors
cards:
  # Header card (window status chip opens this pop-up), styled like the Climate thermostat card
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: binary_sensor.window_open_group
    name: Windows
    icon: mdi:window-closed-variant
    show_state: true
    show_last_changed: true
    tap_action:
      action: more-info
    button_action:
      tap_action:
        action: more-info
    sub_button:
      main: []
      bottom:
        - entity: binary_sensor.any_door_open_group
          name: Doors
          show_name: true
          show_state: true
          state_background: false
          tap_action:
            action: navigate
            navigation_path: '#door'
  - type: custom:auto-entities
    card_param: cards
    # A one-column layout-card rather than a built-in grid/stack: Bubble Card warms up
    # built-in card types from pop-up configs and errors on this wrapper's missing
    # `cards` (auto-entities fills them); custom types are skipped.
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: minmax(0, 1fr)
        grid-gap: var(--vertical-stack-card-gap, 8px)
        margin: 0
        padding: 0
        card_margin: 0
    # List the group's members, so the group entity itself stays out.
    # Edit the group to change the list.
    filter:
      include:
        - group: binary_sensor.window_open_group
          options:
            type: custom:bubble-card
            card_type: button
            button_type: state
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: state
      reverse: true
