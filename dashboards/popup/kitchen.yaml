type: custom:bubble-card
card_type: pop-up
hash: '#kitchen'
button_type: switch
name: Kitchen
entity: light.kitchen_lights_group
force_icon: false
show_state: true
show_last_changed: false
show_attribute: true
attribute: max_color_temp_kelvin
bg_opacity: '35'
button_action:
  tap_action:
    action: none
tap_action:
  action: toggle
sub_button:
  - entity: light.kitchen_wall_switch
    icon: mdi:lightbulb-fluorescent-tube-outline
    show_name: false
    show_state: false
    tap_action:
      action: toggle
  - entity: fan.ceiling_fan
    icon: mdi:ceiling-fan
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  - entity: light.vaulted_light
    icon: mdi:ceiling-fan-light
    tap_action:
      action: toggle
    hold_action:
      action: more-info
cards: !include_dir_list ../sections/rooms/kitchen
