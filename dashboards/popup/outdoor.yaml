type: vertical-stack
cards: 
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#outdoors'
    button_type: switch
    name: Outdoor
    entity: light.front_porch_wall_switch
    force_icon: false
    show_state: true
    show_last_changed: false
    bg_opacity: '35'
    button_action:
      tap_action:
        action: none
    tap_action:
      action: toggle

  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: sensor.airnow_aqi
        icon_color: |+
          {% if int(states('sensor.airnow_aqi'))>=100 -%}
            red
          {%- elif int(states('sensor.airnow_aqi'))>=50 -%}
            yellow
          {%- else %}
            green
          {%- endif %}
        icon:  |+
          {% if int(states('sensor.airnow_aqi'))>=100 -%}
            mdi:alert
          {%- elif int(states('sensor.airnow_aqi'))>=50 -%}
            mdi:weather-dust
          {%- else %}
            mdi:leaf
          {%- endif %}
        content: 'AQI {{states(''sensor.airnow_aqi'')}}'
        # content_info: none
        tap_action:
          action: navigate
      #     navigation_path: "#aqi-overview"
