type: vertical-stack
cards: 
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#family'
    button_type: switch
    name: Family Room
    entity: light.family_room_lights_group
    force_icon: false
    show_state: true
    show_last_changed: false
    tap_action:
      action: more-info
    sub_button:
      - entity: light.family_room_wall_switch
        icon: mdi:light-switch
        tap_action:
          action: more-info
      - icon: mdi:power
        tap_action:
          action: toggle
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: input_boolean.lighting_automation_blocker_family_room
        content_info: name
        icon_color: red
        icon: mdi:auto-mode
        name: Automation
        tap_action:
          action: toggle
        use_entity_picture: false
      - type: template
        entity: binary_sensor.athom_family_room_presence_sensor_occupancy
        icon_color: |-
          {% if states('binary_sensor.athom_family_room_presence_sensor_occupancy') == 'on' -%}
            red
          {%- else %}
            grey
          {%- endif %}
        icon: mdi:motion-sensor
        content: |-
          {% if states('binary_sensor.athom_family_room_presence_sensor_occupancy') == 'off' -%}
            No Motion detected
          {% elif states('binary_sensor.athom_family_room_presence_sensor_occupancy') == 'on' -%}
            Motion Detected
          {%- else %}
            Motion Error
          {%- endif %}
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.basement_sliding_door
        icon_color: |-
          {% if states('binary_sensor.basement_sliding_door') == 'on' -%}
            red
          {%- else %}
            grey
          {%- endif %}
        icon: mdi:door-sliding
        content: |-
          {% if states('binary_sensor.basement_sliding_door') == 'off' -%}
            Door Closed
          {% elif states('binary_sensor.basement_sliding_door') == 'on' -%}
            Door Open
          {%- else %}
            Door Error
          {%- endif %}
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.acurite_tower_family_room_temperature


  - type: custom:bubble-card
    card_type: separator
    name: TV
    modules:
      - default
    sub_button:
      - entity: remote.family_room_samsung_tv
        name: TV
        icon: mdi:television
        show_name: true
      - entity: media_player.q_series_soundbar
        name: Speakers
        icon: mdi:soundbar
        show_name: false
      - entity: media_player.family_room
        name: ""
        icon: phu:apple-tv
  - type: horizontal-stack
    cards:
      - entity: light.family_room_right_tv_lamp
        name: TV Right
        icon: hue:play-bar
        type: custom:bubble-card
        card_type: button
        button_type: slider
        show_state: true
        show_last_changed: true
        show_attribute: false
        tap_action:
          action: more-info
        sub_button:
          - icon: mdi:power
            tap_action:
              action: toggle
      - entity: light.family_room_left_tv_lamp
        name: TV Left
        icon: hue:play-bar
        type: custom:bubble-card
        card_type: button
        button_type: slider
        show_state: true
        show_last_changed: true
        show_attribute: false
        tap_action:
          action: more-info
        sub_button:
          - icon: mdi:power
            tap_action:
              action: toggle
