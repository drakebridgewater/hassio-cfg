type: custom:bubble-card
card_type: pop-up
hash: '#door'
button_type: name
name: Door Sensors
icon: mdi:door
cards:
  # Header card (door status chip opens this pop-up), styled like the Climate thermostat card
  - type: custom:bubble-card
    card_type: button
    button_type: name
    sub_button:
      main: []
      bottom:
        - entity: lock.front_front_door
          name: Front Lock
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: more-info
        - entity: cover.garage_door
          name: Garage
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: more-info
        - entity: binary_sensor.window_open_group
          name: Windows
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: navigate
            navigation_path: '#window'
  - type: custom:auto-entities
    card_param: cards
    card:
      type: grid
      columns: 1
      square: false
    # List the group's members, so the group itself and stray door sensors
    # (fridge doors, duplicate lock sensors) stay out. Edit the group to change the list.
    filter:
      include:
        - group: binary_sensor.any_door_open_group
          options:
            type: custom:bubble-card
            card_type: button
            button_type: state
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: state
      reverse: true
