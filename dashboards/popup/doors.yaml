type: custom:bubble-card
card_type: pop-up
hash: '#door'
button_type: name
name: Door Sensors
icon: mdi:door
cards:
  # Header card (door status chip opens this pop-up), styled like the Climate thermostat card
  - type: custom:bubble-card
    card_type: button
    button_type: name
    sub_button:
      main: []
      bottom:
        - entity: lock.front_door
          name: Front Lock
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: more-info
        - entity: cover.garage_door
          name: Garage
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: more-info
        - entity: binary_sensor.window_open_group
          name: Windows
          show_name: false
          show_state: true
          state_background: false
          tap_action:
            action: navigate
            navigation_path: '#window'
  - type: custom:auto-entities
    card_param: cards
    # A one-column layout-card rather than a built-in grid/stack: Bubble Card warms up
    # built-in card types from pop-up configs and errors on this wrapper's missing
    # `cards` (auto-entities fills them); custom types are skipped.
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: minmax(0, 1fr)
        grid-gap: var(--vertical-stack-card-gap, 8px)
        margin: 0
        padding: 0
        card_margin: 0
    # List the group's members, so the group itself and stray door sensors
    # (fridge doors, duplicate lock sensors) stay out. Edit the group to change the list.
    filter:
      include:
        - group: binary_sensor.any_door_open_group
          options:
            type: custom:bubble-card
            card_type: button
            button_type: state
      exclude:
        - state: unavailable
        - state: unknown
    sort:
      method: state
      reverse: true
