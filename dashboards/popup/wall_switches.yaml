  - type: custom:bubble-card
    card_type: separator
    name: Hallways
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.upstairs_hallway_wall_switch
        - name: Upstairs
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.basement_hallway_wall_switch
        - name: Downstairs
  - type: custom:bubble-card
    card_type: separator
