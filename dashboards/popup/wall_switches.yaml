type: custom:bubble-card
hash: '#wall_switches'
card_type: pop-up
button_type: name
name: All Lights 
force_icon: false
show_state: true
show_last_changed: false
show_attribute: true
attribute: max_color_temp_kelvin
bg_opacity: '35'
button_action:
  tap_action:
    action: none
tap_action:
  action: toggle
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Upstairs
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.awning_wall_switch
        - name: Awning
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.master_bedroom_wall_switch
        - name: Bedroom
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.master_bedroom_closet_wall_switch
        - name: Master Closet
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.kitchen_wall_switch
        - name: Kitchen

    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.vaulted_light
        - name: Dining Room

    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.stairs_wall_switch
        - name: Stairs

    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.awning_wall_switch
        - name: Awning
  - type: custom:bubble-card
    card_type: separator
    name: Downstairs
  - type: grid
    columns: 2
    square: false
    cards:

    - type: custom:decluttering-card
      template: bubble_light
      variables:
