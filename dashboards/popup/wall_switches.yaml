type: vertical-stack
cards: 
  - type: custom:bubble-card
    hash: '#wall_switches'
    card_type: pop-up
    button_type: name
    name: All Lights 
    force_icon: false
    show_state: true
    show_last_changed: false
    show_attribute: true
    attribute: max_color_temp_kelvin
    bg_opacity: '35'
    button_action:
      tap_action:
        action: none
    tap_action:
      action: toggle


  - type: custom:bubble-card
    card_type: separator
    name: Upstairs
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      entity: light.awning_wall_switch
      name: Awning
      show_state: true
      show_last_changed: true
      show_attribute: false
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      sub_button:
        - entity: light.awning_wall_switch
          name: ""
          icon: mdi:power
          tap_action:
            action: toggle
          hold_action:
            action: more-info
