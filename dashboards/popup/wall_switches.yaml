  - type: custom:bubble-card
    card_type: separator
    name: Garage
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:decluttering-card
      template: bubble_light
      variables:
        - entity: light.garage_wall_switch
        - name: Garage
