# Who's home pop-up (the status card's Who's away tile opens it). A live map of the
# grown-ups, then one row per person (button-card template person_tile): picture with
# a green ring while home, where they are and since when, and a detail line (today's
# work or school from packages/work_school.yaml, the drive home while at work from
# packages/drive_home.yaml, Shawna's leave-by time on work mornings, the street when away, moving or not, phone battery).
# Ethan and Abby have no phones, so their rows read their school and
# daycare sensors. Each row ends its detail with the share of the year at work, school
# or daycare (packages/time_share.yaml). Guests last. Tap a person for their details and map.
# The old version (static map images, Mushroom cards) is in dashboard_unused/.
type: custom:bubble-card
card_type: pop-up
hash: '#people_overview'
button_type: name
entity: binary_sensor.home_occupied
name: Who's home
icon: mdi:home-account
show_state: false
show_last_changed: false
show_attribute: false
button_action:
  tap_action:
    action: none
cards:
  - type: map
    entities:
      - person.drake
      - person.shawna
    hours_to_show: 0
    theme_mode: auto
    aspect_ratio: '16:7'
    fit_zones: false
    card_mod:
      style: |
        ha-card { border: none; border-radius: 16px; overflow: hidden; }

  - type: custom:button-card
    template: person_tile
    entity: person.drake
    triggers_update:
      - sensor.home_drake_distance
      - sensor.home_drake_direction_of_travel
      - sensor.drake_s_pixel_11_pro_geocoded_location
      - sensor.drake_s_pixel_11_pro_battery_level
      - sensor.drake_s_pixel_11_pro_battery_state
      - sensor.drake_s_pixel_11_pro_detected_activity
      - sensor.drake_work_today
      - sensor.drake_drive_home
      - sensor.drake_share_of_year_at_work
    variables:
      distance: sensor.home_drake_distance
      direction: sensor.home_drake_direction_of_travel
      place: sensor.drake_s_pixel_11_pro_geocoded_location
      battery: sensor.drake_s_pixel_11_pro_battery_level
      charging: sensor.drake_s_pixel_11_pro_battery_state
      activity: sensor.drake_s_pixel_11_pro_detected_activity
      schedule: sensor.drake_work_today
      drive: sensor.drake_drive_home
      year: sensor.drake_share_of_year_at_work

  - type: custom:button-card
    template: person_tile
    entity: person.shawna
    triggers_update:
      - sensor.home_shawna_distance
      - sensor.home_shawna_direction_of_travel
      - sensor.shawnas_iphone_geocoded_location_2
      - sensor.shawnas_iphone_battery_level_2
      - sensor.shawnas_iphone_battery_state_2
      - sensor.shawnas_iphone_activity_2
      - sensor.shawna_work_today
      - sensor.shawna_drive_home
      - sensor.shawna_share_of_year_at_work
      - binary_sensor.shawna_leave_for_work
    variables:
      distance: sensor.home_shawna_distance
      direction: sensor.home_shawna_direction_of_travel
      place: sensor.shawnas_iphone_geocoded_location_2
      battery: sensor.shawnas_iphone_battery_level_2
      charging: sensor.shawnas_iphone_battery_state_2
      activity: sensor.shawnas_iphone_activity_2
      schedule: sensor.shawna_work_today
      drive: sensor.shawna_drive_home
      year: sensor.shawna_share_of_year_at_work
      morning: binary_sensor.shawna_leave_for_work

  # Ethan: at school from binary_sensor.ethan_at_school (a grown-up's morning stop
  # there), otherwise wherever the grown-ups are.
  - type: custom:button-card
    template: person_tile
    entity: person.ethan
    triggers_update:
      - binary_sensor.ethan_at_school
      - sensor.ethan_school_today
      - sensor.time_at_school_today_ethan
      - sensor.ethan_share_of_year_at_school
      - binary_sensor.home_occupied
    variables:
      home: >-
        [[[ return hass.states['binary_sensor.ethan_at_school']?.state !== 'on'
              && hass.states['binary_sensor.home_occupied']?.state === 'on' ]]]
      status: >-
        [[[ if (hass.states['binary_sensor.ethan_at_school']?.state === 'on') {
              const d = new Date(hass.states['binary_sensor.ethan_at_school'].last_changed);
              return `At school since ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
            return variables.home ? 'Home' : 'Out with the grown-ups'; ]]]
      detail: >-
        [[[ const w = hass.states['sensor.ethan_school_today'];
            const parts = [];
            const over = w?.attributes?.end && new Date(w.attributes.end) < new Date();
            if (w?.attributes?.expected && w.attributes.summary && !over) parts.push(w.attributes.summary);
            const h = Number(hass.states['sensor.time_at_school_today_ethan']?.state);
            if (hass.states['binary_sensor.ethan_at_school']?.state === 'on' && h > 0) parts.push(`${h.toFixed(1)} h there today`);
            const y = hass.states['sensor.ethan_share_of_year_at_school']?.state;
            if (y && !['unknown', 'unavailable'].includes(y)) parts.push(`${y}% of the year at school`);
            return parts.join(' · '); ]]]
    tap_action:
      action: more-info
      entity: binary_sensor.ethan_at_school

  # Abby: at daycare from binary_sensor.abby_at_daycare (a grown-up's 3-minute stop
  # there before noon), otherwise wherever the grown-ups are.
  - type: custom:button-card
    template: person_tile
    entity: person.abby
    triggers_update:
      - binary_sensor.abby_at_daycare
      - sensor.abby_share_of_year_at_daycare
      - binary_sensor.home_occupied
    variables:
      home: >-
        [[[ return hass.states['binary_sensor.abby_at_daycare']?.state !== 'on'
              && hass.states['binary_sensor.home_occupied']?.state === 'on' ]]]
      status: >-
        [[[ if (hass.states['binary_sensor.abby_at_daycare']?.state === 'on') {
              const d = new Date(hass.states['binary_sensor.abby_at_daycare'].last_changed);
              return `At daycare since ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }
            return variables.home ? 'Home' : 'Out with the grown-ups'; ]]]
      detail: >-
        [[[ const y = hass.states['sensor.abby_share_of_year_at_daycare']?.state;
            return y && !['unknown', 'unavailable'].includes(y) ? `${y}% of the year at daycare` : ''; ]]]
    tap_action:
      action: more-info
      entity: binary_sensor.abby_at_daycare

  # Guests: guest mode (asks before switching) and the named guest while they're here.
  - type: heading
    heading: Guests
    heading_style: subtitle
  - type: custom:button-card
    template: action_tile
    entity: input_boolean.guest_mode
    name: Guest mode
    icon: mdi:account-group-outline
    variables:
      'on': '[[[ return entity?.state === "on" ]]]'
    label: >-
      [[[ return entity?.state === 'on'
            ? 'On, for people staying over. Tap to turn it off.'
            : 'Off. Tap to turn it on when people are staying over.' ]]]
    tap_action:
      action: toggle
      confirmation:
        text: '[[[ return entity?.state === "on" ? "Turn guest mode off?" : "Turn guest mode on?" ]]]'
  - type: conditional
    conditions:
      - condition: state
        entity: person.named_guest
        state: home
    card:
      type: custom:button-card
      template: person_tile
      entity: person.named_guest
      triggers_update:
        - person.named_guest
