type: vertical-stack
cards:
- type: custom:bubble-card
  card_type: pop-up
  hash: '#mosture'
  button_type: name
  name: Mosture Sensors
- type: custom:auto-entities
  card_param: cards
  card:
    type: grid
    columns: 2
    square: false
  filter:
    include:
      - domain: binary_sensor
        attributes:
          device_class: moisture
        options:
          type: custom:bubble-card
          card_type: button
          button_type: state
  sort:
    method: state
    reverse: true