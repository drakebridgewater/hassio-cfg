type: custom:bubble-card
card_type: pop-up
hash: '#holiday'
button_type: switch
name: Holiday
entity: light.holiday_lights
force_icon: false
show_state: true
show_last_changed: false
show_attribute: true
bg_opacity: '35'
button_action:
  tap_action:
    action: none
tap_action:
  action: toggle
sub_button:
  - name: Toggle button
    icon: mdi:power
    tap_action:
      action: toggle
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.next_holiday
    show_attribute: false
    force_icon: false
    show_last_changed: false
    sub_button:
      - entity: sensor.next_holiday
        show_attribute: true
        attribute: days_until_next_holiday
        icon: mdi:calendar-clock
        name: Days
        show_name: true
    show_state: true
  - type: custom:mushroom-light-card
    entity: light.holiday_lights
    name: All Holiday Lights
    tap_action: 
      action: more-info
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.roof_lights
  - type: custom:decluttering-card
    template: bubble_light_effect
    variables:
      - entity: light.wled_christmas_tree
      - palette: select.wled_christmas_tree_color_palette
      - preset: select.wled_christmas_tree_preset
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.outdoor_holiday_switch
