type: custom:stack-in-card
card_mod:
  style: |
    ha-card {
      background-color: rgba(139, 195, 74, 0.25) !important;
      background: linear-gradient(135deg, rgba(139, 195, 74, 0.2) 0%, rgba(76, 175, 80, 0.3) 100%);
      padding: 3px !important;
    }
cards:
  # MINIMAL VIEW - Button card (always visible)
  - type: custom:bubble-card
    card_type: button
    button_type: state
    name: Kitchen
    entity: binary_sensor.athom_presence_sensor_9bd3a3_occupancy
    icon: mdi:countertop-outline
    show_attribute: true
    show_state: true
    show_name: true
    show_icon: true
    scrolling_effect: false
    use_accent_color: false
    show_last_changed: false
    tap_action:
      action: navigate
      navigation_path: "#kitchen"
    double_tap_action:
      action: call-service
      service: input_boolean.toggle
      target:
        entity_id: input_boolean.kitchen_view_expanded
    hold_action:
      action: none
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#kitchen"
      double_tap_action:
        action: call-service
        service: input_boolean.toggle
        target:
          entity_id: input_boolean.kitchen_view_expanded
      hold_action:
        action: none
    sub_button:
      main:
        - entity: sensor.living_room_temperature_sensor_temperature
          show_state: true
          show_icon: false
          show_background: false
        - entity: sensor.thermostat_humidity
          show_icon: false
          show_state: true
          show_background: false
          visibility:
            - condition: screen
              media_query: "(min-width: 768px)"
        - entity: sensor.athom_presence_sensor_9bd3a3_light_sensor
          show_icon: false
          show_state: true
          show_background: false
          visibility:
            - condition: screen
              media_query: "(min-width: 768px)"
        - entity: binary_sensor.kitchen_door
        - entity: binary_sensor.kitchen_window
        - entity: input_boolean.kitchen_view_expanded
          icon: mdi:chevron-up
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.kitchen_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.kitchen_view_expanded
              state: 'on'
        - entity: input_boolean.kitchen_view_expanded
          icon: mdi:chevron-down
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.kitchen_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.kitchen_view_expanded
              state: 'off'
      bottom_layout: rows
    styles: ""
    modules:
      - bubble_badges
      - sub_button_coloring
    conditional_icon:
      advanced_settings:
        color_true: amber
      conditions:
        - condition: state
          entity_id: input_boolean.lighting_automation_blocker_kitchen
          state: "on"
      icon_true: mdi:alert-outline
      icon_false: mdi:account-group
    badges:
      main_icon:
        badge_1:
          color: red
          icon: mdi:lightbulb-auto
          condition:
            - condition: state
              entity_id: input_boolean.lighting_automation_blocker_kitchen
              state: "on"
        badge_2:
          color: blue
          icon: mdi:snowflake-alert
          condition:
            - condition: numeric_state
              entity_id: sensor.thermostat_temperature
              below: 69
        badge_3:
          color: orange
          icon: mdi:fire
          condition:
            - condition: numeric_state
              entity_id: sensor.thermostat_temperature
              above: 72
    bubble_badges:
      badges:
        - animation: glow
          name: Temp high
          target: sub_button
          color: orange
          icon: mdi:fire
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              above: 72
        - animation: glow
          name: Temp low
          target: sub_button
          color: cyan
          icon: mdi:snowflake-alert
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              below: 69
        - color: deep-orange
          name: occupied
          target: main_icon
          icon: mdi:motion-sensor
          condition:
            - condition: state
              entity_id: binary_sensor.athom_presence_sensor_9bd3a3_occupancy
              state:
                - "on"
        - color: red
          name: Lighting Auto
          target: main_icon
          icon: mdi:lightbulb-auto-outline
          condition:
            - condition: state
              entity_id: input_boolean.lighting_automation_blocker_kitchen
              state:
                - "on"
          animation: fade
    conditional_states:
      states:
        - animation: glow
          name: Temp
          target: main_icon
          color: cyan
          icon: mdi:snowflake-alert
          condition:
            - condition: state
              entity_id: binary_sensor.athom_presence_sensor_9bd3a3_occupancy
              below: "on"
          entity: sensor.wirelesstag_main_freezer_temperature
    force_icon: false
    rows: 1.01
    sub_button_coloring:
      button_3:
        condition:
          - condition: state
            entity_id: binary_sensor.kitchen_door
            state:
              - "on"
        icon_color: "#9f0000"
      button_4:
        condition:
          - condition: state
            entity_id: binary_sensor.dinning_room_window
            state:
              - "on"
        icon_color: "#9f0000"

  # BOTTOM SUB-BUTTONS - Hide when expanded
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.kitchen_view_expanded
        state: 'off'
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      sub_button:
        main: []
        bottom:
          - name: Lights
            buttons_layout: inline
            group:
              - entity: light.kitchen_wall_switch
                icon: hue:bulb-group-ceiling-round
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
              - entity: light.kitchen_cabinet_light_strip
                icon: phu:light-strip
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
                
              - entity: light.kitchen_sink_lamp
                icon: mdi:globe-light
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
                
              - entity: light.pantry_left_lamp
                icon: hue:go
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
                
              - entity: light.pantry_right_lamp
                icon: hue:go
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
              - entity: input_boolean.lighting_automation_blocker_kitchen
                icon: mdi:lightbulb-auto
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                show_state: false
                state_background: true
                show_background: true
                show_name: false

  # MORE VIEW - Expanded inline view (toggleable)
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.kitchen_view_expanded
        state: 'on'
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - entity: light.kitchen_wall_switch
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Kitchen Wall Switch
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: fan.ceiling_fan
          type: custom:bubble-card
          card_type: button
          button_type: switch
          name: Ceiling Fan
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.vaulted_light
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Vaulted Light
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.kitchen_cabinet_light_strip
          type: custom:bubble-card
          card_type: button
          button_type: switch
          name: Cabinet Light Strip
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.kitchen_sink_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Sink Lamp
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.pantry_left_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Pantry Left
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.pantry_right_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Pantry Right
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle

