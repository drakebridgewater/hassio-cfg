# Dining Room card. Layout, badges and actions come from decluttering-templates/room_card.yaml.
type: custom:decluttering-card
template: room_card
variables:
  - name: Dining Room
  - icon: mdi:table-furniture
  - color: 255, 193, 7
  - popup: '#dining'
  - entity: binary_sensor.kitchen_motion_sensor_occupancy
  - temp: sensor.dining_room_temperature_sensor_temperature
  - humid: sensor.dining_room_temperature_sensor_humidity
  - blocker: input_boolean.lighting_automation_blocker_kitchen
  - badges:
      - name: Window open
        target: main_icon
        icon: mdi:window-open-variant
        color: red
        animation: pulse
        condition:
          - condition: state
            entity_id: binary_sensor.dinning_room_window
            state: 'on'
      - name: Too warm
        target: main_icon
        icon: mdi:fire
        color: orange
        animation: glow
        condition:
          - condition: numeric_state
            entity_id: sensor.dining_room_temperature_sensor_temperature
            above: 72
      - name: Too cold
        target: main_icon
        icon: mdi:snowflake-alert
        color: cyan
        animation: glow
        condition:
          - condition: numeric_state
            entity_id: sensor.dining_room_temperature_sensor_temperature
            below: 69
      - name: Occupied
        target: main_icon
        icon: mdi:motion-sensor
        color: green
        condition:
          - condition: state
            entity_id: binary_sensor.kitchen_motion_sensor_occupancy
            state: 'on'
