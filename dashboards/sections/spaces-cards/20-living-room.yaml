type: custom:stack-in-card
card_mod:
  style: |
    ha-card {
      background-color: rgba(33, 150, 243, 0.25) !important;
      background: linear-gradient(135deg, rgba(33, 150, 243, 0.2) 0%, rgba(63, 81, 181, 0.3) 100%);
      padding: 3px !important;
    }
cards:
  # MINIMAL VIEW - Button card (always visible)
  - type: custom:bubble-card
    card_type: button
    button_type: state
    name: Living Room
    entity: binary_sensor.living_room_presence_sensor_occupancy
    icon: mdi:sofa-outline
    show_attribute: true
    show_state: true
    show_name: true
    show_icon: true
    scrolling_effect: false
    use_accent_color: false
    show_last_changed: false
    tap_action:
      action: navigate
      navigation_path: "#living-room"
    double_tap_action:
      action: call-service
      service: input_boolean.toggle
      target:
        entity_id: input_boolean.living_room_view_expanded
    hold_action:
      action: none
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#living-room"
      double_tap_action:
        action: call-service
        service: input_boolean.toggle
        target:
          entity_id: input_boolean.living_room_view_expanded
      hold_action:
        action: none
    sub_button:
      main:
        - entity: sensor.wirelesstag_main_freezer_temperature
          show_state: true
          show_icon: false
          show_background: false
          icon: ""
        - entity: sensor.wirelesstag_main_freezer_humidity
          show_icon: false
          show_state: true
          show_background: false
          visibility:
            - condition: screen
              media_query: "(min-width: 768px)"
        - entity: sensor.living_room_presence_sensor_light_sensor
          show_icon: false
          show_state: true
          show_background: false
          visibility:
            - condition: screen
              media_query: "(min-width: 768px)"
        - entity: binary_sensor.awning_left_window
        - entity: binary_sensor.awning_right_window
        - entity: input_boolean.living_room_view_expanded
          icon: mdi:chevron-up
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.living_room_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.living_room_view_expanded
              state: 'on'
        - entity: input_boolean.living_room_view_expanded
          icon: mdi:chevron-down
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.living_room_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.living_room_view_expanded
              state: 'off'
      bottom_layout: rows
    styles: ""
    modules:
      - bubble_badges
      - sub_button_coloring
    bubble_badges:
      badges:
        - animation: glow
          name: Temp high
          target: sub_button
          color: orange
          icon: mdi:fire
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              above: 72
        - animation: glow
          name: Temp low
          target: sub_button
          color: cyan
          icon: mdi:snowflake-alert
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              below: 69
        - color: deep-orange
          name: occupied
          target: main_icon
          icon: mdi:motion-sensor
          condition:
            - condition: state
              entity_id: binary_sensor.living_room_presence_sensor_occupancy
              state:
                - "on"
        - color: red
          name: Lighting Auto
          target: main_icon
          icon: mdi:lightbulb-auto-outline
          condition:
            - condition: state
              entity_id: input_boolean.lighting_automation_blocker_living_room
              state:
                - "on"
          animation: fade
    force_icon: false
    rows: 1.01
    sub_button_coloring:
      button_4:
        condition:
          - condition: state
            entity_id: binary_sensor.awning_left_window
            state:
              - "on"
        icon_color: "#9f0000"
      button_5:
        condition:
          - condition: state
            entity_id: binary_sensor.awning_right_window
            state:
              - "on"
        icon_color: "#9f0000"

  # BOTTOM SUB-BUTTONS - Hide when expanded
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.living_room_view_expanded
        state: 'off'
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      sub_button:
        main: []
        bottom:
          - name: Lights
            buttons_layout: inline
            group:
              - entity: light.awning_left_lamp
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
                icon: mdi:light-recessed
                show_state: false
                show_name: false
              - entity: light.awning_right_lamp
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                scrolling_effect: true
                icon: mdi:light-recessed
                show_name: false
              - entity: fan.main_air_circulator
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
              - entity: input_boolean.lighting_automation_blocker_living_room
                icon: mdi:lightbulb-auto
                tap_action:
                  service: ""
                  action: toggle
                hold_action:
                  action: more-info
                show_state: false
                state_background: true
                show_background: true
                show_name: false

  # MORE VIEW - Expanded inline view (toggleable)
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.living_room_view_expanded
        state: 'on'
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - entity: light.awning_left_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Awning Left
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.awning_right_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Awning Right
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: fan.main_air_circulator
          type: custom:bubble-card
          card_type: button
          button_type: switch
          name: Air Circulator
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.entertainment_center_backdrop
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Behind TV
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.living_room_tv_left_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: TV Left
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.living_room_tv_right_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: TV Right
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.yeelight_pulley_lamp
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Pulley Lamp
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.yeelight_theater_left
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Theater Left
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle

  # DETAILED VIEW - Popup (triggered by hash navigation)
  # - type: vertical-stack
  #   cards: !include ../../views/living_room/living-room.yaml
  
  # - type: vertical-stack
  #   cards: !include ../../popup/living_room_remote.yaml
