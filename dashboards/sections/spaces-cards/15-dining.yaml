type: custom:stack-in-card
card_mod:
  style: |
    ha-card {
      background-color: rgba(255, 193, 7, 0.25) !important;
      background: linear-gradient(135deg, rgba(255, 193, 7, 0.2) 0%, rgba(255, 152, 0, 0.3) 100%);
      padding: 3px !important;
    }
cards:
  # MINIMAL VIEW - Button card (always visible)
  - type: custom:bubble-card
    card_type: button
    button_type: state
    name: Dining Room
    entity: binary_sensor.kitchen_motion_sensor_occupancy
    icon: mdi:table-furniture
    show_attribute: true
    show_state: true
    show_name: true
    show_icon: true
    scrolling_effect: false
    use_accent_color: false
    show_last_changed: false
    tap_action:
      action: none
    double_tap_action:
      action: call-service
      service: input_boolean.toggle
      target:
        entity_id: input_boolean.dining_view_expanded
    hold_action:
      action: none
    button_action:
      tap_action:
        action: none
      double_tap_action:
        action: call-service
        service: input_boolean.toggle
        target:
          entity_id: input_boolean.dining_view_expanded
      hold_action:
        action: none
    sub_button:
      main:
        - entity: sensor.dining_room_temperature_sensor_temperature
          show_state: true
          show_icon: false
          show_background: false
        - entity: sensor.kitchen_motion_sensor_illuminance
          show_state: true
          show_icon: false
          show_background: false
          visibility:
            - condition: screen
              media_query: "(min-width: 768px)"
        - entity: binary_sensor.dinning_room_window
        - entity: input_boolean.dining_view_expanded
          icon: mdi:chevron-up
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.dining_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.dining_view_expanded
              state: 'on'
        - entity: input_boolean.dining_view_expanded
          icon: mdi:chevron-down
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.dining_view_expanded
          show_name: false
          show_state: false
          show_background: false
          visibility:
            - condition: state
              entity: input_boolean.dining_view_expanded
              state: 'off'
      bottom_layout: rows
    styles: ""
    modules:
      - bubble_badges
      - sub_button_coloring
    bubble_badges:
      badges:
        - animation: glow
          name: Temp high
          target: sub_button
          color: orange
          icon: mdi:fire
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.dining_room_temperature_sensor_temperature
              above: 72
        - animation: glow
          name: Temp low
          target: sub_button
          color: blue
          icon: mdi:snowflake-alert
          sub_button_index: 1
          condition:
            - condition: numeric_state
              entity_id: sensor.dining_room_temperature_sensor_temperature
              below: 69
        - color: deep-orange
          name: occupied
          target: main_icon
          icon: mdi:motion-sensor
          condition:
            - condition: state
              entity_id: binary_sensor.kitchen_motion_sensor_occupancy
              state:
                - "on"
        - color: red
          name: Lighting Auto
          target: main_icon
          icon: mdi:lightbulb-auto-outline
          condition:
            - condition: state
              entity_id: input_boolean.lighting_automation_blocker_kitchen
              state:
                - "on"
          animation: fade
    conditional_states:
      states: []
    force_icon: false
    rows: 1.01
    sub_button_coloring:
      button_3:
        condition:
          - condition: state
            entity_id: binary_sensor.dinning_room_window
            state:
              - "on"
        icon_color: "#9f0000"

  # BOTTOM SUB-BUTTONS - Hide when expanded
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.dining_view_expanded
        state: 'off'
    card:
      type: custom:bubble-card
      card_type: sub-buttons
      sub_button:
        main: []
        bottom:
          - entity: light.vaulted_light
            tap_action:
              service: ""
              action: toggle
            hold_action:
              action: more-info
            show_name: false
          - entity: fan.ceiling_fan
            tap_action:
              service: ""
              action: toggle
            hold_action:
              action: more-info
            show_name: false
          - entity: light.dining_room_ambience
            icon: hue:table-wash
            show_name: false
            tap_action:
              service: ""
              action: toggle
            hold_action:
              action: more-info
          - entity: light.stair_ambience_01
            icon: hue:table-wash
            show_name: false
            tap_action:
              service: ""
              action: toggle
            hold_action:
              action: more-info
          - entity: light.stairs_wall_switch
            icon: phu:chandelier
            show_name: false
            tap_action:
              service: ""
              action: toggle
            hold_action:
              action: more-info

  # MORE VIEW - Expanded inline view (toggleable)
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.dining_view_expanded
        state: 'on'
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - entity: light.vaulted_light
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Vaulted Light
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: fan.ceiling_fan
          type: custom:bubble-card
          card_type: button
          button_type: switch
          name: Ceiling Fan
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.dining_room_ambience
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Dining Ambience
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.stair_ambience_01
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Stair Ambience
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
        - entity: light.stairs_wall_switch
          type: custom:bubble-card
          card_type: button
          button_type: slider
          name: Stairs
          show_name: true
          show_last_updated: true
          sub_button:
            - name: Toggle button
              icon: mdi:power
              tap_action:
                action: toggle
