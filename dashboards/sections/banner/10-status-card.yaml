# Status card on every view, the first section under the alert ticker (frame/status-section.yaml);
# it replaced the badges.
# No panel: a grid of floating state icons (button-card-templates/active/status_tile.yaml),
# then a row for a delivered package.
# Icons for doors, windows, wall switches and guest mode only appear while on.
# Presence, alarm, garage and front door follow visibility/disarmed.yaml.
# Garage, front door, doors and windows pulse when they should be shut, by the rules in
# button-card-templates/active/close_up.yaml (shared with the tablet hero).
# Phones get 4 icon-and-word columns; from 768px each icon has its name and more text.
type: custom:stack-in-card
mode: vertical
grid_options:
  columns: full
# No panel: the icons float on the page background.
card_mod:
  style: |
    ha-card { background: none !important; box-shadow: none !important; border: none !important; }
cards:
  # One grid for every width (layout-card, so the power tile can span 2 columns):
  # 4 columns on phones, 3 from 768px (about 500px with the sidebar), 6 from 1280px.
  # Dense packing lets later tiles fill the gaps around the wide one.
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-auto-flow: row dense
      grid-gap: 8px
      margin: 0
      padding: 0
      card_margin: 0
      mediaquery:
        "(min-width: 1280px)":
          grid-template-columns: repeat(6, minmax(0, 1fr))
        "(min-width: 768px)":
          grid-template-columns: repeat(3, minmax(0, 1fr))
    cards: !include status-tiles.yaml

  # A package Frigate has seen for 2 minutes; tap for the front door camera.
  - type: custom:button-card
    entity: binary_sensor.package_delivered
    visibility:
      - condition: state
        entity: binary_sensor.package_delivered
        state: "on"
    icon: mdi:package-variant-closed
    show_name: false
    show_state: false
    show_label: true
    label: >-
      [[[ const where = entity?.attributes?.where ?? 'front door';
          const at = new Date(entity?.last_changed).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          return `<span>Package at the ${where}</span><span class="when">${at}</span>` ]]]
    tap_action:
      action: more-info
      entity: camera.frontdoor
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - border-top: 1px solid var(--divider-color)
        - border-radius: 0
        - margin-top: 4px
        - padding: 8px 14px
        - box-sizing: border-box
      grid:
        - grid-template-areas: '"i l"'
        - grid-template-columns: 24px minmax(0, 1fr)
        - column-gap: 8px
      icon:
        - width: 20px
        - color: var(--amber-color)
      label:
        - justify-self: stretch
        - display: flex
        - font-size: 14px
        - color: var(--primary-text-color)
    extra_styles: |
      #label .when { margin-left: auto; font-family: var(--code-font-family, monospace); font-size: 12px; color: var(--secondary-text-color); }
