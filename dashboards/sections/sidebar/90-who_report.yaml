type: custom:stack-in-card
visibility:
  - condition: screen
    media_query: "(min-width: 768px)"
cards:
  - type: vertical-stack
    cards:
      - type: custom:bubble-card
        card_type: separator
        button_type: state
        name: "Who's away "
        icon: mdi:home-export-outline
        sub_button:
          - entity: input_boolean.guest_mode
            icon: mdi:plus
            tap_action:
              action: navigate
              navigation_path: "#people_overview"
        modules:
          - default
      - square: false
        type: grid
        columns: 2
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: state
            modules:
              - default
            entity: person.drake
          - type: custom:bubble-card
            card_type: button
            button_type: state
            modules:
              - default
            entity: person.shawna
            force_icon: false
            show_last_changed: false
            show_last_updated: false
            show_attribute: false
            attribute: editable
          - type: custom:bubble-card
            card_type: button
            button_type: state
            modules:
              - default
            entity: binary_sensor.ethan_at_daycare
          - type: custom:bubble-card
            card_type: button
            button_type: state
            modules:
              - default
            entity: binary_sensor.abby_at_daycare
            force_icon: false
            show_last_changed: false
            show_last_updated: false
            show_attribute: false
      - type: custom:bubble-card
        card_type: button
        button_type: switch
        modules:
          - default
        entity: input_boolean.guest_mode
        name: ""
        icon: mdi:account-multiple-plus
        show_state: true
        show_last_changed: false
        show_attribute: false
        attribute: editable
        tap_action:
          action: toggle

