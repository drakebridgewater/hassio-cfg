type: vertical-stack
visibility:
  - condition: screen
    media_query: "(min-width: 768px)"
cards:
  - clock_style: digital
    clock_size: large
    show_seconds: true
    no_background: false
    type: clock
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.wirelesstag_outdoor_temperature
        show_state: true
        show_name: true
        show_label: false
        show_icon: false
        label: label
        name: Outdoor
        styles:
          state:
            - font-size: min(3vw, 7em);
          grid:
            - grid-template-areas: '"i" "n" "s"'
          name:
            - text-transform: uppercase
            - letter-spacing: 0.5em
            - font-familly: cursive
        tap_action: none
      - type: custom:button-card
        entity: sensor.living_room_temperature_sensor_temperature
        show_state: true
        show_name: true
        show_label: false
        show_icon: false
        label: label
        name: Indoor
        styles:
          state:
            - font-size: min(3vw, 7em);
          grid:
            - grid-template-areas: '"i" "n" "s"'
          name:
            - text-transform: uppercase
            - letter-spacing: 0.5em
            - font-familly: cursive
        tap_action: none


  # - type: custom:simple-weather-card
  #   entity: weather.pirateweather
  #   name: Home
  #   primary_info:
  #     - extrema
  #     - wind_speed
  #   secondary_info:
  #     - precipitation
  #     - precipitation_probability
  - type: custom:clock-weather-card
    entity: weather.pirateweather  # replace with your weather providers's entity id
    sun_entity: sun.sun
    temperature_sensor: sensor.wirelesstag_outdoor_temperature
    humidity_sensor: sensor.wirelesstag_outdoor_humidity
    weather_icon_type: fill
    animated_icon: true
    forecast_rows: 2
    locale: en-GB
    time_pattern: HH:mm
    time_format: 12
    hide_today_section: false
    hide_forecast_section: false
    show_humidity: false
    hide_clock: true
    hide_date: true
    hourly_forecast: false
    use_browser_time: true
    time_zone: null
    show_decimal: true
    apparent_sensor: sensor.home_realfeel_temperature_max_0d
    aqi_sensor: sensor.home_air_quality_0d
    condition: screen
    media_query: "(min-width: 1200px)"