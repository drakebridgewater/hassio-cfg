type: vertical-stack
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.ridwell_pickup_tomorrow
        state: 'on'
      - condition: state
        entity: input_boolean.ridwell_taken_out
        state: 'off'
    card: 
      type: custom:bubble-card
      card_type: button
      modules:
        - default
      button_type: state
      entity: calendar.ridwell
      name: Ridwell - Put bags outside
      icon: mdi:delete-circle-outline
      show_attribute: true
      show_state: false
      show_name: true
      attribute: message
      sub_button:
        - entity: input_boolean.ridwell_taken_out
          name: Complete?
          icon: mdi:checkbox-blank-outline
          show_name: true
          tap_action:
            action: toggle
          double_tap_action:
            action: more-info
      styles: |
        .bubble-icon {
          color: green !important;
        }
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.tomorrow_monday
        state: 'on'
      - condition: state
        entity: input_boolean.garbage_taken_out
        state: 'off'
    card: 
      type: custom:bubble-card
      card_type: button
      modules:
        - default
      button_type: state
      entity: calendar.ridwell
      name: Garbage, Reycycling, and Compost
      icon: mdi:recycle
      show_attribute: true
      show_state: false
      show_name: true
      attribute: message
      sub_button:
        - entity: input_boolean.garbage_taken_out
          name: Complete?
          icon: mdi:checkbox-blank-outline
          show_name: true
          tap_action:
            action: toggle
          double_tap_action:
            action: more-info
      styles: |
        .bubble-icon {
          color: green !important;
        }
