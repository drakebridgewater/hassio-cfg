# Upcoming: goodnight scene at night, birthdays (tablet and up). Garbage/Ridwell
# take-out reminders live in the AlertTicker banner (dashboards/cards/alert-ticker.yaml).
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Upcoming
    sub_button:
      main:
        - entity: todo.shopping_list
          name: ""
          icon: mdi:cart-variant
          show_state: true
          tap_action:
            action: navigate
            navigation_path: /todo?entity_id=todo.shopping_list
      bottom: []

  - type: custom:bubble-card
    card_type: button
    button_type: switch
    entity: scene.goodnight
    name: Activate Goodnight Scene
    modules:
      - default
    visibility:
      - condition: time
        after: "20:00:00"
        before: "05:00:00"

  - type: custom:calendar-card-pro
    visibility:
      - condition: screen
        media_query: "(min-width: 768px)"
    entities:
      - entity: calendar.birthdays
    days_to_show: 30
    compact_events_to_show: 1
    filter_duplicates: true
    language: en
    title: 🎂 Upcoming Birthdays
    title_font_size: 18px
    title_color: "#baf1ff"
    vertical_line_width: 5px
    day_spacing: 5px
    event_spacing: 2px
    additional_card_spacing: 2px
    day_separator_color: "#baf1ff80"
    month_separator_color: var(--secondary-text-color)
    today_indicator: pulse
    date_vertical_alignment: top
    weekday_color: "#baf1ff"
    day_font_size: 18px
    day_color: "#baf1ff"
    month_color: "#baf1ff"
    show_countdown: true
    event_color: "#baf1ff"
    show_time: false
    time_24h: false
    time_font_size: 11px
    time_color: "#baf1ff"
    show_location: false
    remove_location_country: true
    location_font_size: 10px
    row_spacing: 10px
    weather:
      position: date
      date:
        show_conditions: true
        show_high_temp: true
        show_low_temp: false
        show_uv_index: false
        uv_index_threshold: 0
        icon_size: 14px
        font_size: 12px
        color: var(--primary-text-color)
      event:
        show_conditions: true
        show_temp: true
        show_uv_index: false
        uv_index_threshold: 0
        icon_size: 14px
        font_size: 12px
        color: var(--primary-text-color)
    tap_action:
      action: navigate
      navigation_path: /lovelace-main/calendar
    hold_action:
      action: navigate
      navigation_path: /lovelace-main/calendar
    refresh_interval: 15
    refresh_on_navigate: false
