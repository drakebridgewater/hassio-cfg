# Tablet landing page in one card, modelled on the satellite kiosk screensaver.
# The whole page lives in this sky card and fills the screen without scrolling:
#   one top row: alarm (left edge) · entry pills (centre) · notices (right edge,
#   variables.notices)
#   alert ticker in the space above the clock (fixed, so alerts never move anything)
#   today's calendar (left) · clock, date, grocery button and what to wear (centre) · rooms (right, one
#   scrolling column with a "More rooms" button while some are out of view)
#   outside and inside readings along the bottom (the navbar floats in the gap between)
# Smaller cards switch to two columns, then one scrolling column (extra_styles).
# The sky follows weather.pirateweather and the sun (variables.sky, from the shared
# `sky` template in button-card-templates/active/sky.yaml): its colours,
# sun, stars, and drifting clouds, rain, snow, fog, wind or lightning (the
# `fx` layer). The moon is worked out for the home's location, so it shows
# only while it's up, where it is in the sky, at its real phase. Pale skies
# (fog, snow) switch the glass to a darker tint for contrast; every pill reads
# --hero-glass. The clock uses the
# browser's time and re-renders every minute through sensor.time.
# Templates inside custom_fields cards run in this card's context, so they
# name their entity explicitly instead of using `entity`.
# Text sizes use container units (cqi) so the hero fits any tablet width.
type: custom:button-card
entity: sensor.time
show_name: false
show_icon: false
show_state: false
show_label: false
tap_action:
  action: none
hold_action:
  action: none
triggers_update:
  - sensor.time
  - sun.sun
  - weather.pirateweather
  - alarm_control_panel.default
  - cover.garage_door
  - binary_sensor.any_door_open_group
  - binary_sensor.window_open_group
  - lock.front_front_door
  - binary_sensor.front_door
  - sensor.airnow_aqi
  # Outside and inside readings (custom_fields.weather)
  - sensor.wirelesstag_outdoor_temperature
  - sensor.wirelesstag_outdoor_humidity
  - sensor.living_room_temperature_sensor_temperature
  - sensor.thermostat_humidity
  - climate.thermostat
  - calendar.birthdays
  - calendar.united_states_or
  - todo.kitchen_mealie_grocery
  - sensor.daily_weather_forecast
  - sensor.moon_phase
  # Radon notice (variables.notices)
  - sensor.radon_status
  # Work and school notices (variables.notices)
  - sensor.drake_work_today
  - sensor.shawna_work_today
  - sensor.ethan_school_today
  # Indoor air quality (variables.notices)
  - sensor.thermostat_air_quality_index
  - sensor.thermostat_voc
  - sensor.thermostat_co2
  - sensor.view_plus_pm2_5
  - sensor.view_plus_volatile_organic_compounds_parts
  - sensor.view_plus_carbon_dioxide
  - sensor.apollo_air_1_f8b340_pm_2_5mm_weight_concentration
  - sensor.apollo_air_1_f8b340_sen55_voc
  - sensor.apollo_air_1_f8b340_co2
grid_options:
  columns: full
# close_up: when the entry pills pulse (button-card-templates/active/close_up.yaml).
template:
  - sky
  - close_up
variables:
  # Notices for the top-right corner (custom_fields.notices): things worth a
  # glance that aren't alarms. Each is { icon, title, detail, level, go }:
  #   level  'attention' (amber) · 'warn' (orange) · 'alert' (red); sorts the list
  #   go     page path or pop-up hash to open on tap
  # To add one, push it below and add its entities to triggers_update.
  notices: |
    [[[
      const list = [];
      const num = (id) => { const n = parseFloat(hass.states[id]?.state); return isNaN(n) ? null : n; };

      // Air quality: the worst room, only when it isn't good. Same 0-100 score
      // and bands as the room air cards (decluttering-templates/aq_room.yaml).
      // The Ecobee derives its VOC and CO2 from one 0-500 IAQ index, so its
      // room scores from `iaq` alone (IAQ 100 = 80, 150 = 60, 200 = 40), and it
      // follows the Ecobee app: Clean up to 100, Fair to 200 (no notice; the
      // app says no need for concern), Poor above 200.
      const rooms = [
        { name: 'Living Room', go: '/lovelace-main/living-room', iaq: 'sensor.thermostat_air_quality_index',
          voc: 'sensor.thermostat_voc', voc_max: 5000, co2: 'sensor.thermostat_co2' },
        { name: 'Family Room', go: '/lovelace-main/family-room', pm25: 'sensor.view_plus_pm2_5',
          voc: 'sensor.view_plus_volatile_organic_compounds_parts', voc_max: 300, co2: 'sensor.view_plus_carbon_dioxide' },
        { name: 'Master Bedroom', go: '/lovelace-main/master-bedroom',
          pm25: 'sensor.apollo_air_1_f8b340_pm_2_5mm_weight_concentration',
          voc: 'sensor.apollo_air_1_f8b340_sen55_voc', voc_max: 300, co2: 'sensor.apollo_air_1_f8b340_co2' },
      ];
      const air = rooms.map((r) => {
        const pm25 = num(r.pm25), co2 = num(r.co2), voc = num(r.voc), iaq = num(r.iaq);
        const parts = [];
        if (iaq !== null) parts.push([100, Math.min(1, Math.max(0, (iaq - 50) / 250))]);
        else {
          if (pm25 !== null) parts.push([40, Math.min(1, Math.max(0, pm25 / 35))]);
          if (co2 !== null) parts.push([35, Math.min(1, Math.max(0, (co2 - 400) / 1600))]);
          if (voc !== null) parts.push([25, Math.min(1, Math.max(0, voc / r.voc_max))]);
        }
        const weight = parts.reduce((a, p) => a + p[0], 0);
        if (!weight) return null;
        const score = Math.max(0, Math.round(100 - parts.reduce((a, p) => a + p[0] * p[1], 0) * 100 / weight));
        let why = '';
        if (pm25 !== null && pm25 > 12) why = 'particles';
        if (voc !== null && voc > r.voc_max * 0.66) why = 'VOCs';
        if (co2 !== null && co2 > 1000) why = 'CO₂';
        return { ...r, score, why, iaq, quiet: iaq !== null && iaq <= 200 };
      }).filter((r) => r && !r.quiet).sort((a, b) => a.score - b.score)[0];
      if (air && air.score < 80) {
        const band = air.iaq !== null ? ['Poor', 'warn']
          : air.score < 40 ? ['Bad', 'alert'] : air.score < 60 ? ['Poor', 'warn'] : ['Moderate', 'attention'];
        list.push({
          icon: 'mdi:air-filter', title: `${band[0]} air`, level: band[1], go: air.go,
          detail: `${air.name} · ${air.score}/100${air.why ? ' · ' + air.why : ''}`,
        });
      }

      // Radon (packages/radon.yaml): while the current level or the 24h max is at
      // the EPA action level (4 pCi/L), with both numbers and the trend.
      const rn = hass.states['sensor.radon_status'];
      if (rn && (['high', 'very_high'].includes(rn.state) || ['high', 'very_high'].includes(rn.attributes.max_24h_band))) {
        const very = rn.state === 'very_high' || rn.attributes.max_24h_band === 'very_high';
        list.push({
          icon: 'mdi:radioactive', title: very ? 'Radon very high' : 'Radon high', level: very ? 'alert' : 'warn',
          go: '/lovelace-main/family-room', detail: rn.attributes.summary,
        });
      }

      // Work and school: only when someone is off on a day they'd normally go
      // (packages/work_school.yaml); a normal weekday shows nothing.
      [
        ['sensor.drake_work_today', 'mdi:briefcase-off', 'Drake is off today'],
        ['sensor.shawna_work_today', 'mdi:briefcase-off', 'Shawna is off today'],
        ['sensor.ethan_school_today', 'mdi:home-account', 'No school today'],
      ].forEach(([id, icon, title]) => {
        const s = hass.states[id];
        if (s?.state !== 'off' || s.attributes.expected !== true) return;
        list.push({ icon, title, level: 'attention', go: '#people_overview',
          detail: s.attributes.reason || (id.includes('ethan') ? 'Ethan' : 'No work event today') });
      });

      const rank = { alert: 0, warn: 1, attention: 2 };
      return list.sort((a, b) => rank[a.level] - rank[b.level]);
    ]]]
custom_fields:
  # Weather effects behind everything. Clouds, fog, haze and lightning are CSS
  # (extra_styles); rain, snow and wind streaks are drawn on a canvas by a small
  # particle loop kept on the card element (this._heroFx). It reads the latest
  # weather on every frame, so the markup below only changes with the classes.
  fx: |
    [[[
      const sky = variables.sky;
      const k = sky.kind;
      const precip = sky.state === 'lightning' ? '' : {
        rain: 'rain', pour: 'pour', storm: 'pour', snow: sky.state === 'snowy-rainy' ? 'mix' : 'snow',
        wind: 'wind',
      }[k] || '';
      const fx = (this._heroFx = this._heroFx || {});
      fx.p = { precip, push: sky.push, gust: sky.gust - sky.mph, mph: sky.mph };
      const card = this;
      if (!fx.running) {
        fx.running = true;
        fx.parts = [];
        fx.splashes = [];
        fx.last = performance.now();
        const R = Math.random;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
        const spawn = (p, w, h, top) => {
          const z = 0.25 + R() * 0.75; // depth: far (small, slow, faint) to near
          if (p.type === 'snow') {
            return { type: 'snow', z, x: R() * w * 1.4 - w * 0.2, y: top ? -10 - R() * h * 0.3 : R() * h,
              r: (0.7 + z * 2.6) * (0.6 + R() * 0.8), ph: R() * 6.28, sw: 8 + R() * 22, fr: 0.4 + R() * 1.2,
              flat: 0.65 + R() * 0.35, rot: R() * 3.14 };
          }
          if (p.type === 'wind') {
            return { type: 'wind', z, x: -300 - R() * w, y: R() * h, len: 80 + R() * 220,
              amp: 4 + R() * 14, ph: R() * 6.28, a: 0.04 + z * 0.08 };
          }
          return { type: 'rain', z, x: R() * w * 1.6 - w * 0.3, y: top ? -40 - R() * h * 0.4 : R() * h,
            len: (8 + z * 22) * (0.6 + R() * 0.8), sp: (0.85 + R() * 0.3), a: 0.1 + z * 0.35 * (0.6 + R() * 0.6) };
        };
        const step = (t) => {
          if (!card.isConnected) { fx.running = false; return; }
          const p = fx.p;
          const canvas = card.shadowRoot && card.shadowRoot.querySelector('#fx canvas');
          if (!canvas || !p.precip || reduce.matches) {
            if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            fx.parts = [];
            fx.last = t;
            setTimeout(() => requestAnimationFrame(step), 1000);
            return;
          }
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          const w = canvas.clientWidth, h = canvas.clientHeight;
          if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
          }
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const dt = Math.min(0.05, (t - fx.last) / 1000);
          fx.last = t;
          // Gusts: a slow wandering swell on top of the steady wind.
          const gustNow = p.gust * (0.5 + 0.5 * Math.sin(t / 2300) * Math.sin(t / 830));
          const wind = (p.push === 0 ? 1 : Math.sign(p.push)) * gustNow + p.push;
          const area = w * h;
          const want = {
            rain: [['rain', area / 2600]], pour: [['rain', area / 900]],
            snow: [['snow', area / 5200]], mix: [['snow', area / 9000], ['rain', area / 4200]],
            wind: [['wind', area / 45000]],
          }[p.precip] || [];
          for (const [type, n] of want) {
            const have = fx.parts.filter((q) => q.type === type).length;
            const target = Math.min(1400, Math.round(n));
            for (let i = have; i < target; i++) fx.parts.push(spawn({ type }, w, h, false));
            if (have > target) {
              let drop = have - target;
              fx.parts = fx.parts.filter((q) => q.type !== type || drop-- <= 0);
            }
          }
          fx.parts = fx.parts.filter((q) => want.some(([type]) => type === q.type));
          ctx.lineCap = 'round';
          for (const q of fx.parts) {
            if (q.type === 'rain') {
              const vy = (650 + 650 * q.z) * q.sp * (p.precip === 'pour' ? 1.25 : 1);
              const vx = wind * 16 * (0.55 + 0.45 * q.z);
              q.x += vx * dt; q.y += vy * dt;
              const v = Math.hypot(vx, vy);
              ctx.strokeStyle = `rgba(215, 228, 245, ${q.a})`;
              ctx.lineWidth = 0.5 + q.z * 1.1;
              ctx.beginPath();
              ctx.moveTo(q.x, q.y);
              ctx.lineTo(q.x - (vx / v) * q.len, q.y - (vy / v) * q.len);
              ctx.stroke();
              if (q.y > h) {
                if (q.z > 0.7 && fx.splashes.length < 80) fx.splashes.push({ x: q.x, y: h - 2 - R() * 6, age: 0, s: q.z });
                Object.assign(q, spawn({ type: 'rain' }, w, h, true));
              } else if (q.x < -60 || q.x > w + 60) {
                Object.assign(q, spawn({ type: 'rain' }, w, h, true));
                q.x = vx > 0 ? -R() * 40 : w + R() * 40;
                q.y = R() * h;
              }
            } else if (q.type === 'snow') {
              const vy = (22 + 55 * q.z);
              const sway = Math.sin(t / 1000 * q.fr + q.ph) * q.sw;
              const vx = wind * 5 * (0.5 + 0.5 * q.z) + sway;
              q.x += vx * dt; q.y += vy * dt; q.rot += dt * q.fr;
              ctx.save();
              ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(1, q.flat);
              ctx.fillStyle = `rgba(255, 255, 255, ${0.08 + q.z * 0.12})`;
              ctx.beginPath(); ctx.arc(0, 0, q.r * 2.2, 0, 6.283); ctx.fill();
              ctx.fillStyle = `rgba(255, 255, 255, ${0.35 + q.z * 0.55})`;
              ctx.beginPath(); ctx.arc(0, 0, q.r, 0, 6.283); ctx.fill();
              ctx.restore();
              if (q.y > h + 10 || q.x < -40 || q.x > w + 40) {
                Object.assign(q, spawn({ type: 'snow' }, w, h, true));
                if (Math.abs(wind) > 3 && R() < 0.5) { q.x = wind > 0 ? -10 : w + 10; q.y = R() * h; }
              }
            } else {
              const dir = p.push === 0 ? 1 : Math.sign(p.push);
              const vx = dir * (180 + p.mph * 22 + gustNow * 15) * (0.6 + 0.4 * q.z);
              q.x += Math.abs(vx) * dt; // progress along the wind; drawn mirrored for a leftward wind
              ctx.strokeStyle = `rgba(255, 255, 255, ${q.a})`;
              ctx.lineWidth = 1 + q.z;
              ctx.beginPath();
              for (let i = 0; i <= 12; i++) {
                const sx = dir > 0 ? q.x - (q.len * i) / 12 : w - q.x + (q.len * i) / 12;
                const sy = q.y + Math.sin(sx / 60 + q.ph + t / 900) * q.amp;
                i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
              }
              ctx.stroke();
              if (q.x - q.len > w + 20) Object.assign(q, spawn({ type: 'wind' }, w, h, true));
            }
          }
          // Splashes: tiny rings where near drops land.
          for (const s of fx.splashes) {
            s.age += dt;
            const k2 = s.age / 0.28;
            ctx.strokeStyle = `rgba(215, 228, 245, ${0.35 * (1 - k2) * s.s})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + k2 * 7 * s.s, 0.6 + k2 * 1.6, 0, 3.3, 6.1); ctx.stroke();
          }
          fx.splashes = fx.splashes.filter((s) => s.age < 0.28);
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      // Clouds come from cloud_coverage, whatever the condition says: more,
      // bigger clouds as it rises, and a grey veil once it's mostly overcast.
      // Each cloud is three overlapping puffs; positions are seeded by index so
      // they don't jump around between renders.
      const cover = Math.max(sky.cover, sky.wet ? 0.75 : 0);
      const seed = (i, n) => { const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return x - Math.floor(x); };
      const count = cover < 0.05 ? 0 : Math.round(2 + cover * 9);
      const tone = sky.night ? '165, 175, 195' : ['rain', 'pour', 'storm'].includes(k) ? '205, 210, 220' : '255, 255, 255';
      const alpha = sky.night ? 0.28 : 0.55;
      const blobs = [];
      for (let i = 0; i < count; i++) {
        const x = seed(i, 1) * 100, y = 4 + seed(i, 2) * 58;
        const cw = 12 + seed(i, 3) * 16 + cover * 12, ch = cw * (0.28 + seed(i, 5) * 0.14);
        const a = (alpha * (0.55 + 0.45 * seed(i, 4))).toFixed(2);
        for (const [dx, dy, sw, sh] of [[0, 0, 1, 1], [-0.38, 0.25, 0.62, 0.8], [0.34, 0.18, 0.58, 0.75]]) {
          blobs.push(`radial-gradient(ellipse ${(cw * sw).toFixed(1)}% ${(ch * sh).toFixed(1)}% at ${(x + dx * cw).toFixed(1)}% ${(y + dy * ch).toFixed(1)}%,`
            + ` rgba(${tone}, ${a}) 0%, rgba(${tone}, ${(a * 0.55).toFixed(2)}) 45%, transparent 72%)`);
        }
      }
      if (cover > 0.6) {
        const v = ((cover - 0.6) * 1.1).toFixed(2);
        blobs.push(`linear-gradient(180deg, rgba(${tone}, ${v}) 0%, rgba(${tone}, ${(v * 0.5).toFixed(2)}) 70%, transparent 100%)`);
      }
      const cls = [
        count ? 'clouds' : '',
        ['pour', 'storm'].includes(k) ? 'dark' : '',
        k === 'storm' ? 'storm' : '',
        k === 'fog' ? 'fog' : '',
        sky.haze && sky.aqi > 100 ? 'smoke' : '',
      ].join(' ');
      // Clouds drift with the wind: faster in a breeze, direction from the bearing.
      const dur = Math.round(Math.max(18, 120 - sky.mph * 5));
      return `<div class="fx ${cls}" style="--drift-dur:${dur}s; --drift-dir:${sky.push < 0 ? 'reverse' : 'normal'};`
        + ` --haze:${sky.haze ? sky.haze.rgb : '0,0,0'}; --clouds:${blobs.join(', ') || 'none'}"><canvas></canvas></div>`;
    ]]]
  # The moon at its real phase while it's above the horizon, placed by its
  # azimuth and altitude (styles.custom_fields.moon). Two turns: the lit shape
  # so its bright side faces the sun, and the face (maria, rayed craters) so
  # lunar north points the way it does in your sky. The disc darkens toward
  # the limb, the terminator is soft, and the dark side shows a faint
  # earthshine copy of the face. Clouds drift over it. By day it shows only
  # when at least a sixth of it is lit, paler and without the glow.
  moon: |
    [[[
      const { night, moon, cover, wet } = variables.sky;
      if (!moon.up || wet || cover > 0.9 || moon.illum < (night ? 0.02 : 0.16)) return '';
      const p = moon.phase;
      // Drawn lit on the right while waxing (limb at -90°), the left while waning (+90°).
      const turn = ((p < 0.5 ? -90 : 90) - moon.tilt).toFixed(1);
      const face = moon.pa.toFixed(1);
      const fade = night ? 1 : 0.55;
      const waxing = p < 0.5, crescent = p < 0.25 || p > 0.75;
      const rx = (Math.abs(Math.cos(2 * Math.PI * p)) * 50).toFixed(2);
      const outer = waxing ? 1 : 0, inner = waxing ? (crescent ? 0 : 1) : (crescent ? 1 : 0);
      const lit = `M50 0 A50 50 0 0 ${outer} 50 100 A${rx} 50 0 0 ${inner} 50 0 Z`;
      const glow = night ? ((0.15 + moon.illum * 0.5) * (1 - cover * 0.8)).toFixed(2) : 0;
      // The near side with north up as seen from the northern hemisphere
      // (Crisium on the right, Tycho at the bottom), soft-edged.
      const maria = [
        [36, 30, 13, 11, -10], [58, 29, 8, 7.5, 0], [65, 44, 10, 7.5, -25], [81, 35, 5.5, 4.5, 0],
        [75, 58, 5.5, 9, 15], [64, 62, 4.5, 4.5, 0], [21, 50, 12, 21, 12], [41, 66, 9, 6.5, 0],
        [24, 67, 5, 5, 0], [47, 16, 20, 3.5, -4], [48, 40, 4.5, 3.5, 0], [30, 44, 7, 9, 0],
      ].map(([cx, cy, ex, ey, r]) => `<ellipse cx="${cx}" cy="${cy}" rx="${ex}" ry="${ey}" transform="rotate(${r} ${cx} ${cy})"/>`).join('');
      const rays = [0, 32, 75, 118, 160, 205, 248, 292, 330].map((a) => {
        const t = a * Math.PI / 180, l = 14 + (a % 3) * 6;
        return `<line x1="43" y1="84" x2="${(43 + Math.sin(t) * l).toFixed(1)}" y2="${(84 - Math.cos(t) * l).toFixed(1)}"/>`;
      }).join('');
      const spots = [[43, 84, 2.2, 0.95], [36, 47, 2, 0.8], [16, 38, 1.4, 0.9], [24, 46, 1.4, 0.6], [62, 73, 1.6, 0.5], [70, 18, 1.4, 0.45]]
        .map(([cx, cy, r, a]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(255,255,255,${a})"/>`).join('');
      const pits = [[40, 17, 2.2], [57, 76, 3], [30, 82, 3.4], [72, 70, 2.6], [52, 90, 2.4], [84, 50, 2], [12, 60, 2.4]]
        .map(([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(110,120,148,0.25)"/>`
          + `<path d="M${cx - r} ${cy} A${r} ${r} 0 0 0 ${cx + r} ${cy}" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.6"/>`).join('');
      const faceGroup = (id) => `<g transform="rotate(${face} 50 50)">`
        + `<g fill="rgba(112,124,156,0.42)" filter="url(#${id})">${maria}</g>`
        + `<g stroke="rgba(255,255,255,0.22)" stroke-width="0.7" stroke-linecap="round">${rays}</g>${pits}${spots}</g>`;
      return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible;opacity:${((1 - cover * 0.6) * fade).toFixed(2)};`
        + `filter:drop-shadow(0 0 ${Math.round(6 + moon.illum * 18)}px rgba(220,230,255,${glow}))">`
        + `<defs>`
        + `<radialGradient id="hero-moon-limb" cx="46%" cy="44%" r="56%">`
        + `<stop offset="0" stop-color="#f8f9ff"/><stop offset="0.6" stop-color="#e8ecf8"/><stop offset="1" stop-color="#bfc7dc"/></radialGradient>`
        + `<filter id="hero-moon-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>`
        + `<filter id="hero-moon-edge"><feGaussianBlur stdDeviation="1.1"/></filter>`
        + `<clipPath id="hero-moon-disc"><circle cx="50" cy="50" r="50"/></clipPath>`
        + `<mask id="hero-moon-lit" maskUnits="userSpaceOnUse" x="-5" y="-5" width="110" height="110">`
        + `<path d="${lit}" fill="white" transform="rotate(${turn} 50 50)" filter="url(#hero-moon-edge)"/></mask></defs>`
        + `<g clip-path="url(#hero-moon-disc)">`
        // Earthshine: the dark side, faintly showing the same face.
        + `<circle cx="50" cy="50" r="50" fill="rgba(190,202,232,0.12)"/>`
        + `<g opacity="0.25">${faceGroup('hero-moon-soft')}</g>`
        + `<g mask="url(#hero-moon-lit)"><circle cx="50" cy="50" r="50" fill="url(#hero-moon-limb)"/>${faceGroup('hero-moon-soft')}</g>`
        + `</g></svg>`;
    ]]]
  alarm:
    card:
      type: custom:button-card
      entity: alarm_control_panel.default
      layout: icon_name_state2nd
      show_state: true
      name: |
        [[[ const a = hass.states['alarm_control_panel.default'];
            return a ? (hass.formatEntityState ? hass.formatEntityState(a) : a.state) : 'Alarm'; ]]]
      state_display: Alarmo
      tap_action:
        action: navigate
        navigation_path: /lovelace-main/security
      hold_action:
        action: more-info
      # Anything but disarmed (arming, armed, entry delay, triggered): a solid
      # red pill with a slow, wide glow pulse, readable from across the room.
      styles:
        card:
          - background: >-
              [[[ return hass.states['alarm_control_panel.default']?.state === 'disarmed'
                ? 'none' : 'rgba(211, 47, 47, 0.92)' ]]]
          - box-shadow: none
          - border: none
          - border-radius: 999px
          - padding: >-
              [[[ return hass.states['alarm_control_panel.default']?.state === 'disarmed'
                ? '0' : '10px 28px 10px 16px' ]]]
          - animation: >-
              [[[ return hass.states['alarm_control_panel.default']?.state === 'disarmed'
                ? 'none' : 'hero-alarm-pulse 2.6s ease-in-out infinite' ]]]
          - width: auto
          - overflow: visible
        grid:
          - grid-template-areas: '"i n" "i s"'
          - grid-template-columns: auto auto
          - column-gap: 12px
        icon:
          - width: clamp(28px, 4cqi, 44px)
