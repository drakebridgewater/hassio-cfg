        - operator: template
          value: '[[[ return (hass.states["alarm_control_panel.default"]?.state || "").startsWith("armed_") ]]]'
          icon: mdi:shield-lock
      extra_styles: |
        @keyframes hero-alarm-pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.85), 0 0 18px 4px rgba(244, 67, 54, 0.6);
                     filter: brightness(1); }
          50% { box-shadow: 0 0 0 26px rgba(244, 67, 54, 0), 0 0 60px 24px rgba(244, 67, 54, 0.75);
                filter: brightness(1.25); }
