# Spaces the HVAC doesn't serve: no average, and not compared with the thermostat.
# One card: the floor header (button-card floor_temps) over a tile per room
# (decluttering temp_tile: reading, comparison and 24-hour trend; tap for more-info).
type: custom:stack-in-card
cards:
  - type: custom:button-card
    template: floor_temps
    triggers_update:
      - sensor.wirelesstag_outdoor_temperature
      - sensor.garage_temperature_sensor_temperature
      - sensor.acurite_tower_attic_sensor_temperature
      - sensor.crawl_space_temperature_sensor_temperature
      - sensor.living_room_greenhouse_temperature
    variables:
      title: Outside and unheated
      icon: mdi:home-roof
      compare: false
      rooms:
        - sensor.wirelesstag_outdoor_temperature
        - sensor.garage_temperature_sensor_temperature
        - sensor.acurite_tower_attic_sensor_temperature
        - sensor.crawl_space_temperature_sensor_temperature
        - sensor.living_room_greenhouse_temperature
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr))
      grid-gap: 8px
      margin: 0
      padding: 0 16px 16px
      card_margin: 0
    cards:
      - type: custom:decluttering-card
        template: temp_tile
        variables:
          - entity: sensor.wirelesstag_outdoor_temperature
          - name: Outdoor
          - compare: false
      - type: custom:decluttering-card
        template: temp_tile
        variables:
          - entity: sensor.garage_temperature_sensor_temperature
          - name: Garage
          - compare: false
      - type: custom:decluttering-card
        template: temp_tile
        variables:
          - entity: sensor.acurite_tower_attic_sensor_temperature
          - name: Attic
          - compare: false
      - type: custom:decluttering-card
        template: temp_tile
        variables:
          - entity: sensor.crawl_space_temperature_sensor_temperature
          - name: Crawl Space
          - compare: false
      - type: custom:decluttering-card
        template: temp_tile
        variables:
          - entity: sensor.living_room_greenhouse_temperature
          - name: Greenhouse
          - compare: false
