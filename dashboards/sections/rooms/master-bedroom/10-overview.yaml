type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: input_boolean.lighting_automation_blocker_master_bedroom
        content_info: name
        icon_color: red
        icon: mdi:auto-mode
        name: Automation
        tap_action:
          action: toggle
        use_entity_picture: false
      - type: template
        entity: binary_sensor.master_bedroom_motion_sensor_occupancy
        icon_color: |-
          {% if states('binary_sensor.master_bedroom_motion_sensor_occupancy') == 'on' -%}
            red
          {%- else %}
            grey
          {%- endif %}
        icon: mdi:motion-sensor
        content: |-
          {% if states('binary_sensor.master_bedroom_motion_sensor_occupancy') == 'off' -%}
            No Motion detected
          {% elif states('binary_sensor.master_bedroom_motion_sensor_occupancy') == 'on' -%}
            Motion Detected
          {%- else %}
            Motion Error
          {%- endif %}
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.master_bedroom_window
        icon_color: |-
          {% if states('binary_sensor.master_bedroom_window') == 'on' -%}
            red
          {%- else %}
            grey
          {%- endif %}
        icon: mdi:motion-sensor
        content: |-
          {% if states('binary_sensor.master_bedroom_window') == 'off' -%}
            Window Closed
          {% elif states('binary_sensor.master_bedroom_window') == 'on' -%}
            Window Open
          {%- else %}
            Window Error
          {%- endif %}
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.master_bedroom_temperature_temperature
  - type: custom:decluttering-card
    template: bubble_light_temp
    variables:
      - entity: light.drake_s_bedside_lamp
      - name: "Drake's Bedside"
  - type: custom:decluttering-card
    template: bubble_light_temp
    variables:
      - entity: light.shawna_s_bedside_lamp
      - name: "Shawna's Bedside"
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.master_bedroom_dresser_lamp
      - name: Dresser
      - icon: mdi:dresser
  - type: custom:decluttering-card
    template: bubble_switch
    variables:
      - entity: switch.master_bedroom_grow_lamp
      - name: Grow Lamp
      - icon: mdi:flower
  - type: custom:bubble-card
    card_type: button
    entity: fan.master_bedroom_fan
    show_state: true
    show_last_changed: true
    show_attribute: true
    attribute: temperature
    tap_action:
      action: more-info
    sub_button:
      - entity: switch.master_bedroom_fan_horizontally_oscillating
        tap_action:
          action: toggle
      - entity: fan.master_bedroom_fan
        icon: mdi:minus
        tap_action:
          action: call-service
          service: fan.decrease_speed
          target:
            entity_id: fan.master_bedroom_fan
      - entity: fan.master_bedroom_fan
        icon: mdi:plus
        tap_action:
          action: call-service
          service: fan.increase_speed
          target:
            entity_id: fan.master_bedroom_fan
      - entity: fan.master_bedroom_fan
        icon: mdi:power
        tap_action:
          action: toggle
    button_type: state
  - entity: media_player.master_bedroom
    name: Google Home
    type: custom:bubble-card
    card_type: media-player
    show_state: true
    show_last_updated: true
    show_attribute: true
    attribute: assumed_state
    card_layout: large
    scrolling_effect: false
    show_icon: true
    force_icon: true
    show_name: false
    show_last_changed: true
    columns: 2
    rows: 1
    tap_action:
      action: toggle
    hide:
      play_pause_button: true
      volume_button: true
      previous_button: true
      next_button: true
      power_button: true
