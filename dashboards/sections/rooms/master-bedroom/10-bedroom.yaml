# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Master Bedroom" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: button
    button_type: switch
    sub_button:
      main: []
      bottom: []
    entity: input_boolean.lighting_automation_blocker_master_bedroom
    name: Block Master Bedroom Automations
    icon: mdi:close-octagon
    show_state: true
    show_last_changed: true
    show_attribute: false
    tap_action:
      action: toggle
    modules:
      - inline_confirmation
    inline_confirmation:
      icon_confirmation: true
      card_confirmation: true
    flat_style:
      card_styles:
        prime_color:
          - 25
          - 203
          - 1
  - type: custom:bubble-card
    card_type: separator
    name: Bedroom
    icon: mdi:bed-king-outline
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.master_bedroom_wall_switch
      - name: Wall Switch
  - type: custom:decluttering-card
    template: bubble_light_temp
    variables:
      - entity: light.drake_s_bedside_lamp
      - name: Drake's Lamp
  - type: custom:decluttering-card
    template: bubble_light_temp
    variables:
      - entity: light.shawna_s_bedside_lamp
      - name: Shawna's Lamp
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.master_bedroom_dresser_lamp
      - name: Dresser Lamp
  - type: custom:bubble-card
    card_type: button
    entity: fan.master_bedroom_fan
    show_state: true
    show_last_changed: true
    show_attribute: true
    attribute: temperature
    tap_action:
      action: more-info
    sub_button:
      - entity: switch.master_bedroom_fan_horizontally_oscillating
        tap_action:
          action: toggle
      - entity: fan.master_bedroom_fan
        icon: mdi:minus
        tap_action:
          action: call-service
          service: fan.decrease_speed
          target:
            entity_id: fan.master_bedroom_fan
      - entity: fan.master_bedroom_fan
        icon: mdi:plus
        tap_action:
          action: call-service
          service: fan.increase_speed
          target:
            entity_id: fan.master_bedroom_fan
      - entity: fan.master_bedroom_fan
        icon: mdi:power
        tap_action:
          action: toggle
    button_type: state
  - type: custom:decluttering-card
    template: bubble_switch
    variables:
      - entity: switch.master_bedroom_grow_lamp
      - name: Grow Light
      - icon: mdi:flower
  - type: custom:bubble-card
    card_type: separator
    name: Bathroom
    icon: phu:rooms-bathroom
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.master_bathroom_wall_switch
      - name: Bathroom
  - type: custom:bubble-card
    card_type: separator
    name: Closet
    icon: mdi:hanger
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.master_bedroom_closet_wall_switch
      - name: Closet
