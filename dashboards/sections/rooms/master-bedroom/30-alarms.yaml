# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Master Bedroom" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Alarms
    icon: mdi:clock-outline
    sub_button:
      main: []
      bottom: []
  - type: custom:bubble-card
    card_type: button
    button_type: state
    sub_button:
      main:
        - entity: input_boolean.drake_s_sunrise_alarm
          force_icon: false
          show_name: false
          show_state: true
      bottom: []
    entity: input_datetime.drake_s_alarm_clock
    icon: mdi:weather-sunset-up
    show_last_changed: false
    show_last_updated: false
  - type: custom:bubble-card
    card_type: separator
    name: Scheduling
    icon: mdi:clock-outline
  - type: custom:scheduler-card
    tags: masterBedroom
    title: false
    discover_existing: false
    sort_by:
      - state
      - relative-time
    display_options:
      primary_info: default
      secondary_info:
        - relative-time
      icon: action
    show_header_toggle: false
