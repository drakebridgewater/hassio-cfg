# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Ethan" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Bedroom
    icon: mdi:bed
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.ethan_s_bedroom_wall_switch
      - name: Wall Switch
  - type: custom:decluttering-card
    template: bubble_switch
    variables:
      - entity: switch.ethan_s_door_switch
      - name: White Noise
      - icon: mdi:sleep
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.toy_chest_strip
      - name: Bed Lights
      - icon: mdi:bed-empty
  - type: custom:decluttering-card
    template: bubble_switch
    variables:
      - entity: fan.ethan_s_cribside
      - name: Fan
  - type: custom:bubble-card
    card_type: sub-buttons
    sub_button:
      main: []
      bottom:
        - entity: input_boolean.lighting_automation_blocker_ethan_s_room
          name: Automations
          icon: mdi:lightbulb-auto-outline
          show_name: true
          tap_action:
            action: toggle
    rows: 0.938
    styles: |-
      .bubble-sub-button-1 {
        background-color: ${hass.states['input_boolean.lighting_automation_blocker_ethan_s_room'].state === 'on' ? '' : 'red'} !important;
      }
      .bubble-sub-button-1 > ha-icon {
        color: blue
      }
