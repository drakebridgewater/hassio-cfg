# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Ethan" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:stack-in-card
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, rgba(135,15,45,0.92) 0%, rgba(175,175,5,0.92) 100%);
          border: 1px solid rgba(100,100,220,0.25);
          border-radius: 18px;
          padding: 4px;
        }
    cards:
      - type: custom:button-card
        entity: input_datetime.ethan_s_alarm_clock
        update_interval: 60
        show_name: false
        show_state: false
        show_icon: false
        tap_action:
          action: none
        styles:
          card:
            - background: transparent
            - box-shadow: None
            - border: none
            - padding: 15px 5px 10px 5px
          grid:
            - grid-template-areas: '". dot time clock target . " ". minus minus clock plus ."'
            - grid-template-columns: .1fr min-content min-content auto 1fr .1fr
            - grid-template-rows: 1fr auto
          custom_fields:
            clock:
              - justify-self: center
            dot:
              - justify-self: end
              - align-self: start
              - margin-top: 25px
              - margin-right: 8px
            time:
              - justify-self: start
              - align-self: start
              - margin-right: 14px
            target:
              - justify-self: start
              - align-self: start
            minus:
              - grid-column: 1 / 3
              - justify-self: end
              - align-self: end
              - margin-right: -34px
              - margin-bottom: 6px
              - z-index: 2
            plus:
              - justify-self: start
              - align-self: end
              - margin-left: -34px
              - margin-bottom: 6px
              - z-index: 2
        custom_fields:
          dot:
            card:
              type: custom:button-card
              entity: automation.ethan_s_morning_routine
              show_name: false
              show_icon: false
              tap_action:
                action: toggle
              styles:
                card:
                  - width: 14px
                  - height: 14px
                  - border-radius: 50%
                  - padding: 0
                  - margin: 0
                  - border: none
              state:
                - value: 'on'
                  styles:
                    card:
                      - background: '#4caf50'
                      - box-shadow: 0 0 8px rgba(76, 175, 80, 0.6)
                - value: 'off'
                  styles:
                    card:
                      - background: '#f44336'
                      - animation: blink 1.2s infinite
              extra_styles: |
                @keyframes blink {
                  0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(244, 67, 54, 0.6); }
                  50% { opacity: 0.3; box-shadow: none; }
                }
          time: |
            [[[
              const now = new Date();
              let h = now.getHours();
              let m = now.getMinutes();
              const ampm = h >= 12 ? 'PM' : 'AM';
              h = h % 12 || 12;
              m = m.toString().padStart(2, '0');
              return `<div style="font-size:22px; font-weight:800; color:white; line-height:1; margin-top:20px; text-align:left; white-space:nowrap;">${h}:${m} <span style="font-size:14px">${ampm}</span></div>`;
            ]]]
          target: "[[[\n  const now = new Date();\n  const curH = now.getHours(); const curM = now.getMinutes();\n  const\
            \ state = entity ? entity.state : '07:00:00';\n  const parts = state.split(':');\n  const tgtH = parseInt(parts[0])\
            \ || 7;\n  const tgtM = parseInt(parts[1]) || 0;\n  const tgtH12 = tgtH % 12 || 12;\n  const tgtMStr = tgtM.toString().padStart(2,\
            \ '0');\n  const tgtAmpm = tgtH >= 12 ? 'PM' : 'AM';\n  \n  let diffM = (tgtH * 60 + tgtM) - (curH * 60 + curM);\n\
            \  if (diffM < 0) diffM += 24 * 60; \n  const diffHrs = Math.floor(diffM / 60);\n  const diffMins = diffM % 60;\n\
            \  let countStr = '';\n  if (diffHrs > 0) countStr += `${diffHrs}h `;\n  countStr += `${diffMins}m`;\n  \n  return\
            \ `\n    <div style=\"text-align:left; margin-left:14px; margin-top:20px;\">\n      <div style=\"font-size:22px;\
            \ font-weight:800; color:rgba(255,190,50,0.9); line-height:1;\">${tgtH12}:${tgtMStr} <span style=\"font-size:14px\"\
            >${tgtAmpm}</span></div>\n      <div style=\"font-size:15px; font-weight:600; color:rgba(255,255,255,0.7); margin-top:6px;\"\
            >in ${countStr}</div>\n    </div>\n  `;\n]]]\n"
          minus:
            card:
              type: custom:button-card
              entity: input_datetime.ethan_s_alarm_clock
              name: '-5'
              show_icon: false
              tap_action:
                action: perform-action
                perform_action: script.add_minutes_to_input_datetime
                data:
                  entity_id: input_datetime.ethan_s_alarm_clock
                  minutes: -5
              styles:
                card:
                  - width: 36px
                  - height: 36px
                  - border-radius: 50%
                  - background: rgba(30,30,80,0.9)
                  - box-shadow: 0 0 0 2px rgba(100,100,220,0.5)
                  - font-size: 14px
                  - font-weight: bold
                  - color: white
                  - padding: 0
          plus:
            card:
              type: custom:button-card
              entity: input_datetime.ethan_s_alarm_clock
              name: '+5'
              show_icon: false
              tap_action:
                action: perform-action
                perform_action: script.add_minutes_to_input_datetime
                data:
                  entity_id: input_datetime.ethan_s_alarm_clock
                  minutes: 5
              styles:
                card:
                  - width: 36px
                  - height: 36px
                  - border-radius: 50%
                  - background: rgba(30,30,80,0.9)
                  - box-shadow: 0 0 0 2px rgba(100,100,220,0.5)
                  - font-size: 14px
                  - font-weight: bold
                  - color: white
                  - padding: 0
          clock: |
            [[[
              const now = new Date();
              const curH = now.getHours(); const curMin = now.getMinutes();
              const curHAngle = (curH % 12) * 30 + curMin * 0.5;
              const curMAngle = curMin * 6;
              const state = entity ? entity.state : '07:00:00';
              const parts = state.split(':');
              const almH = parseInt(parts[0]) || 7;
              const almM = parseInt(parts[1]) || 0;
              const almHAngle = (almH % 12) * 30 + almM * 0.5;
              const almMAngle = almM * 6;
              const toRad = a => a * Math.PI / 180;
              const hx = (len, a) => (50 + len * Math.sin(toRad(a))).toFixed(2);
              const hy = (len, a) => (50 - len * Math.cos(toRad(a))).toFixed(2);
              const markers = [...Array(12)].map((_, i) => {
                const a = i * 30;
                const r = 45; const ri = i % 3 === 0 ? 37 : 40;
                const sw = i % 3 === 0 ? 2.5 : 1.5;
                return `<line x1="${(50+ri*Math.sin(toRad(a))).toFixed(2)}" y1="${(50-ri*Math.cos(toRad(a))).toFixed(2)}" x2="${(50+r*Math.sin(toRad(a))).toFixed(2)}" y2="${(50-r*Math.cos(toRad(a))).toFixed(2)}" stroke="#666" stroke-width="${sw}"/>`;
              }).join('');
              return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:128px;height:128px;display:block;margin:0 auto;">
                <circle cx="50" cy="50" r="48" fill="#12122a" stroke="#3a3a7a" stroke-width="2.5"/>
                ${markers}
                <line x1="50" y1="50" x2="${hx(26,almHAngle)}" y2="${hy(26,almHAngle)}" stroke="rgba(255,180,0,0.5)" stroke-width="5" stroke-linecap="round"/>
                <line x1="50" y1="50" x2="${hx(38,almMAngle)}" y2="${hy(38,almMAngle)}" stroke="rgba(255,180,0,0.38)" stroke-width="3" stroke-linecap="round"/>
                <line x1="50" y1="50" x2="${hx(26,curHAngle)}" y2="${hy(26,curHAngle)}" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
                <line x1="50" y1="50" x2="${hx(38,curMAngle)}" y2="${hy(38,curMAngle)}" stroke="white" stroke-width="3" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="3.5" fill="white"/>
              </svg>`;
            ]]]
    visibility:
      - condition: time
        after: 05:00:00
        before: 08:00:00
