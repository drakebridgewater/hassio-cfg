# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Living Room" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:mushroom-entity-card
    entity: automation.applet_tv_auto_pause
  - type: custom:bubble-card
    card_type: separator
    name: Entertainment Center
  - type: custom:mini-media-player
    entity: media_player.living_room
    toggle_power: false
    volume_stateless: true
    group: false
    source: icon
    sound_mode: icon
    replace_mute: next
    artwork: material
    info: short
  - type: vertical-stack
    cards:
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.tv_lights_group
          - name: All
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.entertainment_center_backdrop
          - icon: hue:lightstrip-tv
      - type: horizontal-stack
        cards:
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.living_room_tv_left_lamp
              - icon: hue:floor-shade
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.living_room_tv_right_lamp
              - icon: hue:floor-shade
      - type: horizontal-stack
        cards:
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.yeelight_pulley_lamp
              - name: Couch Left
              - icon: hue:floor-shade
          - type: custom:decluttering-card
            template: bubble_light_color
            variables:
              - entity: light.yeelight_theater_left
              - name: Couch Right
              - icon: hue:floor-shade
