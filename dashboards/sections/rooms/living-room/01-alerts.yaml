# Generated by dashboards/tools/gen_room_alerts.py from the room card's badges.
type: custom:bubble-card
card_type: sub-buttons
hide_main_background: true
sub_button:
  main: []
  bottom:
    - name: Alerts
      buttons_layout: inline
      justify_content: start
      group:
        - name: Window open
          icon: mdi:window-open-variant
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.awning_left_window
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.awning_right_window
                  state: 'on'
        - name: Air quality poor
          icon: mdi:smog
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.thermostat_air_quality_index
                  above: 200
                - condition: numeric_state
                  entity_id: sensor.thermostat_voc
                  above: 10000
                - condition: numeric_state
                  entity_id: sensor.thermostat_co2
                  above: 2000
        - name: Air quality high
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.thermostat_air_quality_index
                      above: 150
                    - condition: numeric_state
                      entity_id: sensor.thermostat_voc
                      above: 5000
                    - condition: numeric_state
                      entity_id: sensor.thermostat_co2
                      above: 1500
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.thermostat_air_quality_index
                          above: 200
                        - condition: numeric_state
                          entity_id: sensor.thermostat_voc
                          above: 10000
                        - condition: numeric_state
                          entity_id: sensor.thermostat_co2
                          above: 2000
        - name: Air quality moderate
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.thermostat_air_quality_index
                      above: 100
                    - condition: numeric_state
                      entity_id: sensor.thermostat_voc
                      above: 1500
                    - condition: numeric_state
                      entity_id: sensor.thermostat_co2
                      above: 1000
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.thermostat_air_quality_index
                          above: 150
                        - condition: numeric_state
                          entity_id: sensor.thermostat_voc
                          above: 5000
                        - condition: numeric_state
                          entity_id: sensor.thermostat_co2
                          above: 1500
        - name: Too warm
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              above: 74
        - name: Too cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              below: 67
        - name: Occupied
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.living_room_presence_sensor_occupancy
              state: 'on'
styles: |-
      .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-2 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-3 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-4 ha-icon { background: var(--yellow-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-5 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-6 ha-icon { background: var(--cyan-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-7 ha-icon { background: var(--green-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
view_layout:
  grid-column: 1 / -1
