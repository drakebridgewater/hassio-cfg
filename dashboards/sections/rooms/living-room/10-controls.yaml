# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Living Room" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:decluttering-card
    template: bubble_chips
    variables:
      - chips:
          - entity: input_boolean.lighting_automation_blocker_living_room
            name: Automation
            icon: mdi:auto-mode
            show_name: true
            show_state: false
            state_background: true
            fill_width: false
            tap_action:
              action: toggle
          - entity: binary_sensor.living_room_presence_sensor_occupancy
            icon: mdi:motion-sensor
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: binary_sensor.awning_left_window
            icon: mdi:blinds-horizontal-closed
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: binary_sensor.awning_right_window
            icon: mdi:blinds-horizontal-closed
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: binary_sensor.dinning_room_window
            icon: mdi:blinds-horizontal-closed
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: sensor.living_room_presence_sensor_light_sensor
            show_state: true
            fill_width: false
          - entity: sensor.wirelesstag_main_freezer_temperature
            show_state: true
            fill_width: false
          - entity: cover.big_window_blinds
            name: Blinds
            show_state: true
            state_background: true
            fill_width: false
          - entity: sensor.big_window_blinds_battery
            show_state: true
            fill_width: false
  - type: custom:bubble-card
    card_type: button
    entity: fan.main_air_circulator
    show_state: true
    show_last_changed: true
    show_attribute: true
    attribute: temperature
    sub_button:
      - entity: switch.main_air_circulator_horizontally_oscillating
        tap_action:
          action: toggle
      - entity: fan.main_air_circulator
        icon: mdi:minus
        tap_action:
          action: call-service
          service: fan.decrease_speed
          target:
            entity_id: fan.main_air_circulator
      - entity: fan.main_air_circulator
        icon: mdi:plus
        tap_action:
          action: call-service
          service: fan.increase_speed
          target:
            entity_id: fan.main_air_circulator
      - entity: fan.main_air_circulator
        icon: mdi:power
        tap_action:
          action: toggle
    button_type: state
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.awning_left_lamp
      - icon: hue:friends-of-hue-iq-pendant
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.awning_right_lamp
