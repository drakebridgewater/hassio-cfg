# The room's chips in one row that wraps (dashboards/ARCHITECTURE.md, Room pages).
# Alerts first: each shows only while its condition holds, and the styles below colour
# them by position (.bubble-sub-button-N), so add new alerts at the top of the list
# and renumber, and add status chips at the end.
type: custom:bubble-card
card_type: sub-buttons
hide_main_background: true
grid_options:
  columns: full
sub_button:
  main: []
  bottom:
    - name: Chips
      buttons_layout: inline
      justify_content: start
      group:
        - name: Window open
          icon: mdi:window-open-variant
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.awning_left_window
                  state: 'on'
                - condition: state
                  entity_id: binary_sensor.awning_right_window
                  state: 'on'
        - name: Air quality poor
          icon: mdi:smog
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.thermostat_air_quality_index
                  above: 200
                - condition: numeric_state
                  entity_id: sensor.thermostat_voc
                  above: 10000
                - condition: numeric_state
                  entity_id: sensor.thermostat_co2
                  above: 2000
        - name: Air quality high
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.thermostat_air_quality_index
                      above: 150
                    - condition: numeric_state
                      entity_id: sensor.thermostat_voc
                      above: 5000
                    - condition: numeric_state
                      entity_id: sensor.thermostat_co2
                      above: 1500
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.thermostat_air_quality_index
                          above: 200
                        - condition: numeric_state
                          entity_id: sensor.thermostat_voc
                          above: 10000
                        - condition: numeric_state
                          entity_id: sensor.thermostat_co2
                          above: 2000
        - name: Air quality moderate
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.thermostat_air_quality_index
                      above: 100
                    - condition: numeric_state
                      entity_id: sensor.thermostat_voc
                      above: 1500
                    - condition: numeric_state
                      entity_id: sensor.thermostat_co2
                      above: 1000
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.thermostat_air_quality_index
                          above: 150
                        - condition: numeric_state
                          entity_id: sensor.thermostat_voc
                          above: 5000
                        - condition: numeric_state
                          entity_id: sensor.thermostat_co2
                          above: 1500
        - name: Too warm
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              above: 74
        - name: Too cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.living_room_temperature_sensor_temperature
              below: 67
        - name: Occupied
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.living_room_presence_sensor_occupancy
              state: 'on'
        - entity: binary_sensor.dinning_room_window
          icon: mdi:blinds-horizontal-closed
          show_name: true
          show_state: true
          state_background: true
          fill_width: false
          tap_action:
            action: more-info
        - entity: sensor.living_room_presence_sensor_light_sensor
          show_state: true
          fill_width: false
        - entity: cover.big_window_blinds
          name: Blinds
          show_state: true
          state_background: true
          fill_width: false
        - entity: sensor.big_window_blinds_battery
          show_state: true
          fill_width: false
styles: |
  .card-content, .type-custom-bubble-card, .bubble-sub-buttons-container { height: auto !important; min-height: 0; }
  .bubble-sub-button-bottom-container { position: relative; bottom: auto; min-width: 0; max-width: 100%; flex-wrap: wrap; }
  .bubble-sub-button-alignment-lane { flex: 1 1 100%; min-width: 0; max-width: 100%; flex-wrap: wrap; }
  .bubble-sub-button-group.display-inline { flex-wrap: wrap; min-width: 0; width: 100%; }
  .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-2 ha-icon { background: var(--red-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-3 ha-icon { background: var(--orange-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-4 ha-icon { background: var(--yellow-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-5 ha-icon { background: var(--orange-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-6 ha-icon { background: var(--cyan-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-7 ha-icon { background: var(--green-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
