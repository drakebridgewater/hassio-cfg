# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Office" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Power Strips
    icon: phu:smart-power-strip
  - type: custom:bubble-card
    card_type: button
    entity: switch.office_office_power_strip
    show_last_updated: true
    sub_button:
      main:
        - entity: sensor.office_office_power_strip_energy
          show_icon: true
          show_state: true
          scrolling_effect: true
          show_background: false
        - name: Toggle button
          tap_action:
            action: toggle
      bottom: []
    button_type: switch
  - type: custom:bubble-card
    card_type: button
    entity: switch.office_desk_power_switch
    show_last_updated: true
    sub_button:
      main:
        - entity: sensor.office_desk_power_switch_energy_2
          show_icon: true
          show_state: true
          scrolling_effect: true
          show_background: false
        - name: Toggle button
          tap_action:
            action: toggle
          entity: switch.office_desk_power_switch
      bottom: []
    button_type: switch
