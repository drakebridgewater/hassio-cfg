# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Office" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:decluttering-card
    template: bubble_chips
    variables:
      - chips:
          - entity: input_boolean.lighting_automation_blocker_office_room
            name: Automation
            icon: mdi:auto-mode
            show_name: true
            show_state: false
            state_background: true
            fill_width: false
            tap_action:
              action: toggle
          - entity: binary_sensor.office_multi_sensor_home_security_motion_detection
            icon: mdi:motion-sensor
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: binary_sensor.office_window
            show_name: true
            show_state: true
            state_background: true
            fill_width: false
            tap_action:
              action: more-info
          - entity: sensor.office_temperature_sensor_temperature
            show_state: true
            fill_width: false
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.office_wall_switch
  - type: custom:decluttering-card
    template: bubble_light_effect
    variables:
      - entity: light.wled_candles
      - name: Desk Ambiance
      - icon: phu:christmas-tree-v2
      - palette: select.wled_candles_color_palette
      - preset: select.wled_candles_preset
  - type: custom:decluttering-card
    template: bubble_light
    variables:
      - entity: light.office_desk_right_lamp
      - name: Desk Right
  - type: custom:decluttering-card
    template: bubble_light_color
    variables:
      - entity: light.office_behind_monitor_lamp
      - name: Behind Monitor
      - icon: hue:friends-of-hue-iq-pendant
