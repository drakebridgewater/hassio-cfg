type: custom:decluttering-card
template: bubble_chips
variables:
  - chips:
      - entity: input_boolean.lighting_automation_blocker_kitchen
        name: Automation
        icon: mdi:auto-mode
        show_name: true
        show_state: false
        state_background: true
        fill_width: false
        tap_action:
          action: toggle
      - entity: binary_sensor.kitchen_motion_sensor_occupancy
        icon: mdi:motion-sensor
        show_state: true
        state_background: true
        fill_width: false
      - entity: binary_sensor.dinning_room_window
        icon: mdi:window-closed-variant
        show_state: true
        state_background: true
        fill_width: false
      - entity: sensor.dining_room_temperature_sensor_temperature
        show_state: true
        fill_width: false
      - entity: sensor.kitchen_motion_sensor_illuminance
        show_state: true
        fill_width: false
