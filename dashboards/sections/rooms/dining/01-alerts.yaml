# Generated by dashboards/tools/gen_room_alerts.py from the room card's badges.
type: custom:bubble-card
card_type: sub-buttons
hide_main_background: true
sub_button:
  main: []
  bottom:
    - name: Alerts
      buttons_layout: inline
      justify_content: start
      group:
        - name: Window open
          icon: mdi:window-open-variant
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.dinning_room_window
              state: 'on'
        - name: Too warm
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.dining_room_temperature_sensor_temperature
              above: 74
        - name: Too cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.dining_room_temperature_sensor_temperature
              below: 67
        - name: Occupied
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.kitchen_motion_sensor_occupancy
              state: 'on'
styles: |-
      .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-2 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-3 ha-icon { background: var(--cyan-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-4 ha-icon { background: var(--green-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
view_layout:
  grid-column: 1 / -1
