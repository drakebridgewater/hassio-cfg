# Generated by dashboards/tools/port_gui_rooms.py from the GUI "outdoor" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    sub_button:
      main:
        - entity: sensor.airnow_aqi
          name: Air Quality
          show_name: true
          show_state: false
          icon: mdi:alert
          state_background: false
          show_background: false
          visibility:
            - condition: numeric_state
              entity: sensor.airnow_aqi
              above: 200
        - entity: sensor.openuv_current_uv_index
          show_name: false
          show_state: true
          icon: mdi:alert
          state_background: false
          show_background: false
          visibility:
            - condition: numeric_state
              entity: sensor.openuv_current_uv_index
              above: 2
        - entity: weather.pirateweather
          show_state: true
          show_attribute: true
          attribute: temperature
          state_background: false
          show_background: false
      bottom: []
    name: Weather
    modules:
      - sub_button_coloring
      - icon_animations
    animated_weather_icon:
      weather_entity: weather.pirateweather
    icon: ''
    sub_button_coloring:
      button_1:
        condition:
          - condition: numeric_state
            entity_id: sensor.airnow_aqi
            above: 200
        icon_color: red
      button_2:
        condition:
          - condition: numeric_state
            entity_id: sensor.openuv_current_uv_index
            above: 2
        icon_color: red
  - type: custom:mini-graph-card
    name: Air Quailty (24h)
    icon: mdi:air-filter
    entities:
      - entity: sensor.airnow_aqi
        show_legend_state: true
    smoothing: false
    align_icon: left
    align_state: center
    hours_to_show: 24
    points_per_hour: 1
    aggregate_func: avg
    lower_bound: 0
    upper_bound: 350
    show:
      labels: true
      labels_secondary: true
      icon: true
      name: true
      state: true
      name_adaptive_color: true
    color_thresholds:
      - value: 0
        color: '#00bf08'
      - value: 51
        color: '#fff103'
      - value: 101
        color: '#ffa203'
      - value: 151
        color: '#ad0000'
      - value: 201
        color: '#6b00bf'
      - value: 300
        color: '#bf00bd'
