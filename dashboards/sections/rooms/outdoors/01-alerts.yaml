# Generated by dashboards/tools/gen_room_alerts.py from the room card's badges.
type: custom:bubble-card
card_type: sub-buttons
sub_button:
  main: []
  bottom:
    - name: Alerts
      buttons_layout: inline
      justify_content: start
      group:
        - name: Air quality poor
          icon: mdi:smog
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.airnow_aqi
                  above: 150
                - condition: numeric_state
                  entity_id: sensor.airnow_pm2_5
                  above: 75
                - condition: numeric_state
                  entity_id: sensor.airnow_o3
                  above: 150
        - name: Air quality high
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.airnow_aqi
                      above: 100
                    - condition: numeric_state
                      entity_id: sensor.airnow_pm2_5
                      above: 35
                    - condition: numeric_state
                      entity_id: sensor.airnow_o3
                      above: 100
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.airnow_aqi
                          above: 150
                        - condition: numeric_state
                          entity_id: sensor.airnow_pm2_5
                          above: 75
                        - condition: numeric_state
                          entity_id: sensor.airnow_o3
                          above: 150
        - name: Air quality moderate
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.airnow_aqi
                      above: 50
                    - condition: numeric_state
                      entity_id: sensor.airnow_pm2_5
                      above: 12
                    - condition: numeric_state
                      entity_id: sensor.airnow_o3
                      above: 50
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.airnow_aqi
                          above: 100
                        - condition: numeric_state
                          entity_id: sensor.airnow_pm2_5
                          above: 35
                        - condition: numeric_state
                          entity_id: sensor.airnow_o3
                          above: 100
        - name: Hot
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.wirelesstag_outdoor_temperature
              above: 80
        - name: Cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.wirelesstag_outdoor_temperature
              below: 40
        - name: Motion
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.porch_motion_motion_detection
              state: 'on'
styles: |-
      .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-2 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-3 ha-icon { background: var(--yellow-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-4 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-5 ha-icon { background: var(--cyan-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-6 ha-icon { background: var(--green-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
view_layout:
  grid-column: 1 / -1
