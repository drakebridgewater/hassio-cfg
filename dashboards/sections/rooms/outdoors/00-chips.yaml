# The room's chips in one row that wraps (dashboards/ARCHITECTURE.md, Room pages).
# Alerts first: each shows only while its condition holds, and the styles below colour
# them by position (.bubble-sub-button-N), so add new alerts at the top of the list
# and renumber, and add status chips at the end.
type: custom:bubble-card
card_type: sub-buttons
hide_main_background: true
grid_options:
  columns: full
sub_button:
  main: []
  bottom:
    - name: Chips
      buttons_layout: inline
      justify_content: start
      group:
        - name: Air quality poor
          icon: mdi:smog
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.airnow_aqi
                  above: 150
                - condition: numeric_state
                  entity_id: sensor.airnow_pm2_5
                  above: 75
                - condition: numeric_state
                  entity_id: sensor.airnow_o3
                  above: 150
        - name: Air quality high
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.airnow_aqi
                      above: 100
                    - condition: numeric_state
                      entity_id: sensor.airnow_pm2_5
                      above: 35
                    - condition: numeric_state
                      entity_id: sensor.airnow_o3
                      above: 100
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.airnow_aqi
                          above: 150
                        - condition: numeric_state
                          entity_id: sensor.airnow_pm2_5
                          above: 75
                        - condition: numeric_state
                          entity_id: sensor.airnow_o3
                          above: 150
        - name: Air quality moderate
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.airnow_aqi
                      above: 50
                    - condition: numeric_state
                      entity_id: sensor.airnow_pm2_5
                      above: 12
                    - condition: numeric_state
                      entity_id: sensor.airnow_o3
                      above: 50
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.airnow_aqi
                          above: 100
                        - condition: numeric_state
                          entity_id: sensor.airnow_pm2_5
                          above: 35
                        - condition: numeric_state
                          entity_id: sensor.airnow_o3
                          above: 100
        - name: Hot
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.wirelesstag_outdoor_temperature
              above: 80
        - name: Cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.wirelesstag_outdoor_temperature
              below: 40
        - name: Motion
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.porch_motion_motion_detection
              state: 'on'
        - entity: sensor.openuv_max_uv_index
          name: Max
          show_name: true
          show_state: true
          fill_width: false
styles: |
  .card-content, .type-custom-bubble-card, .bubble-sub-buttons-container { height: auto !important; min-height: 0; }
  .bubble-sub-button-bottom-container { position: relative; bottom: auto; min-width: 0; max-width: 100%; flex-wrap: wrap; }
  .bubble-sub-button-alignment-lane { flex: 1 1 100%; min-width: 0; max-width: 100%; flex-wrap: wrap; }
  .bubble-sub-button-group.display-inline { flex-wrap: wrap; min-width: 0; width: 100%; }
  .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-2 ha-icon { background: var(--orange-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-3 ha-icon { background: var(--yellow-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-4 ha-icon { background: var(--orange-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-5 ha-icon { background: var(--cyan-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
  .bubble-sub-button-6 ha-icon { background: var(--green-color); color: #fff !important;
    border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
