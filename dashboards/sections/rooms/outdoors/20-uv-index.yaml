# Generated by dashboards/tools/port_gui_rooms.py from the GUI "outdoor" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:mini-graph-card
    name: UV Index
    icon: mdi:sun-clock
    entities:
      - entity: sensor.openuv_current_uv_index
        show_legend_state: true
    smoothing: false
    align_icon: left
    align_state: center
    hours_to_show: 12
    points_per_hour: 6
    aggregate_func: avg
    lower_bound: 60
    upper_bound: 80
    show:
      labels: true
      labels_secondary: true
      icon: true
      name: true
      state: true
      name_adaptive_color: true
    color_thresholds:
      - value: 67
        color: '#5cb0ff'
      - value: 70
        color: '#de9e00'
      - value: 74
        color: '#d43400'
  - type: entities
    title: Sun
    entities:
      - entity: sensor.sun_next_dawn
      - entity: sensor.sun_next_dusk
      - entity: sensor.sun_next_midnight
      - entity: sensor.sun_next_noon
      - entity: sensor.sun_next_rising
      - entity: sensor.sun_next_setting
