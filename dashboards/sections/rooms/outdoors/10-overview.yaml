type: custom:mushroom-chips-card
chips:
  - type: template
    entity: sensor.airnow_aqi
    icon_color: |+
      {% if int(states('sensor.airnow_aqi'))>=100 -%}
        red
      {%- elif int(states('sensor.airnow_aqi'))>=50 -%}
        yellow
      {%- else %}
        green
      {%- endif %}
    icon:  |+
      {% if int(states('sensor.airnow_aqi'))>=100 -%}
        mdi:alert
      {%- elif int(states('sensor.airnow_aqi'))>=50 -%}
        mdi:weather-dust
      {%- else %}
        mdi:leaf
      {%- endif %}
    content: 'AQI {{states(''sensor.airnow_aqi'')}}'
    # content_info: none
    tap_action:
      action: navigate
