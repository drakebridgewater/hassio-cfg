# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Kitchen" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: custom:decluttering-card
template: bubble_chips
variables:
  - chips:
      - entity: sensor.thermostat_temperature
        show_name: true
        show_state: true
        fill_width: false
      - entity: binary_sensor.kitchen_motion_sensor_occupancy
        name: Motion
        icon: mdi:motion-sensor
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
        tap_action:
          action: more-info
      - entity: binary_sensor.kitchen_window
        name: Window
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
        tap_action:
          action: more-info
      - entity: binary_sensor.kitchen_door
        name: Patio
        icon: mdi:door
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
      - entity: input_boolean.lighting_automation_blocker_kitchen
        name: Automation
        icon: mdi:auto-mode
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
        tap_action:
          action: toggle
