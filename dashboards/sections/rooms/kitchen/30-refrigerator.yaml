# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Kitchen" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Refrigerator
  - type: custom:bubble-card
    card_type: button
    sub_button:
      main: []
      bottom:
        - name: Sensors
          buttons_layout: inline
          group:
            - entity: water_heater.hz526153_freezer
              show_name: false
              name: Freezer
              show_state: false
              show_attribute: true
              attribute: current_temperature
              icon: mdi:thermometer
              show_last_changed: false
            - entity: water_heater.hz526153_fridge
              name: Fridge
              show_name: false
              icon: mdi:thermometer
              show_attribute: true
              attribute: current_temperature
            - entity: sensor.hz526153_ice_maker_bucket_status
              show_last_changed: false
              show_state: true
              show_name: true
              name: Ice
        - name: Automatically grouped
          buttons_layout: inline
          group:
            - entity: binary_sensor.hz526153_door_status_any_open
              name: ''
              show_state: true
              show_name: false
              fill_width: false
            - entity: sensor.hz526153_door_status
              show_name: false
              name: ''
              show_last_changed: false
              show_state: true
              show_last_updated: false
              show_attribute: false
              fill_width: false
            - entity: switch.hz526153_fridge_ice_boost
              name: Ice Boost
              show_name: true
              icon: mdi:snowflake-alert
              fill_width: false
            - entity: select.hz526153_convertable_drawer_mode
              sub_button_type: select
              show_name: true
              name: Drawer Mode
      bottom_layout: rows
    button_type: state
    entity: sensor.hz526153_current_temperature_fridge
    name: Refrigerator
    show_last_changed: false
    show_attribute: false
    show_state: false
    icon: mdi:fridge-outline
    button_action: {}
    rows: 2.406
  - type: custom:bubble-card
    card_type: button
    button_type: state
    card_layout: large-2-rows
    name: Refrigerator
    entity: sensor.hz526153_current_temperature_fridge
    icon: mdi:fridge
    show_state: false
    sub_button:
      - entity: sensor.hz526153_current_temperature_fridge
        icon: mdi:fridge-top
        show_background: false
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.hz526153_current_temperature_freezer
        icon: mdi:fridge-bottom
        show_state: true
        show_background: false
      - entity: binary_sensor.hz526153_door_status_any_open
        icon: mdi:fridge-alert
        show_background: true
        show_state: true
        show_attribute: false
        show_name: false
      - entity: sensor.hz526153_water_filter_status
        show_state: true
        show_background: false
        icon: mdi:water
      - entity: sensor.hz526153_ice_maker_bucket_status_state_full_fridge
        icon: mdi:delete-variant
        show_background: false
        show_state: true
        tap_action:
          action: more-info
  - type: custom:bubble-card
    card_type: button
    name: Fridge
    button_type: state
    entity: water_heater.hz526153_fridge
    sub_button:
      - entity: water_heater.hz526153_fridge
        name: Normal
        icon: mdi:air-filter
        tap_action:
          action: call-service
          service: water_heater.set_operation_mode
          data:
            operation_mode: Normal
          target:
            entity_id: water_heater.hz526153_fridge
        show_name: true
      - entity: water_heater.hz526153_fridge
        name: TURBO
        icon: mdi:car-turbocharger
        tap_action:
          action: call-service
          service: water_heater.set_operation_mode
          data:
            operation_mode: Turbo Cool
          target:
            entity_id: water_heater.hz526153_fridge
        show_name: true
  - type: custom:bubble-card
    card_type: button
    name: Freezer
    button_type: state
    entity: water_heater.hz526153_freezer
    sub_button:
      - entity: water_heater.hz526153_freezer
        name: Normal
        icon: mdi:air-filter
        tap_action:
          action: call-service
          service: water_heater.set_operation_mode
          data:
            operation_mode: Normal
          target:
            entity_id: water_heater.hz526153_freezer
        show_name: true
      - entity: water_heater.hz526153_freezer
        name: TURBO
        icon: mdi:car-turbocharger
        tap_action:
          action: call-service
          service: water_heater.set_operation_mode
          data:
            operation_mode: Turbo Freeze
          target:
            entity_id: water_heater.hz526153_freezer
        show_name: true
  - type: custom:bubble-card
    card_type: separator
    name: Kitchen Sink
  - type: custom:bubble-card
    card_type: button
    button_type: state
    sub_button:
      main:
        - entity: sensor.flo_under_kitchen_sink_temperature
          show_state: true
          show_background: false
          fill_width: true
          content_layout: icon-left
        - entity: sensor.flo_under_kitchen_sink_humidity
          show_state: true
          show_background: false
          visibility:
            - condition: numeric_state
              entity: sensor.flo_under_kitchen_sink_battery
              above: 25
        - entity: sensor.flo_under_kitchen_sink_battery
          show_state: true
          show_background: false
          visibility:
            - condition: numeric_state
              entity: sensor.flo_under_kitchen_sink_battery
              below: 25
      bottom: []
    entity: binary_sensor.flo_under_kitchen_sink_water_detected
    name: Kitchen Sink
    rows: 1
    modules:
      - bubble_badges
    bubble_badges:
      badges:
        - name: sink-bat
          target: main_icon
          entity: sensor.flo_under_kitchen_sink_battery
          color: red
          condition:
            - condition: numeric_state
              entity_id: sensor.flo_under_kitchen_sink_battery
              below: 20
              above: 0
          animation: glow
