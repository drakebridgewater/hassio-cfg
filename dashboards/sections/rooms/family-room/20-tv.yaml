type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: TV
    modules:
      - default
    sub_button:
      - entity: remote.family_room_samsung_tv
        name: TV
        icon: mdi:television
        show_name: true
      - entity: media_player.q_series_soundbar
        name: Speakers
        icon: mdi:soundbar
        show_name: false
      - entity: media_player.family_room
        name: ""
        icon: phu:apple-tv
  - type: horizontal-stack
    cards:
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_right_tv_lamp
          - name: TV Right
          - icon: hue:play-bar
      - type: custom:decluttering-card
        template: bubble_light_color
        variables:
          - entity: light.family_room_left_tv_lamp
          - name: TV Left
          - icon: hue:play-bar
