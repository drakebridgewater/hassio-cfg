# Generated by dashboards/tools/port_gui_rooms.py from the GUI "Family Room" page.
# Edit the page in the GUI and re-run the script; changes made here are overwritten.
type: custom:decluttering-card
template: bubble_chips
variables:
  - chips:
      - entity: input_boolean.lighting_automation_blocker_family_room
        name: Automations
        icon: mdi:auto-mode
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
      - entity: binary_sensor.basement_sliding_door
        name: Slider
        icon: mdi:door-sliding
        show_name: true
        show_state: true
        state_background: true
        fill_width: false
      - entity: binary_sensor.athom_family_room_presence_sensor_pir_sensor
        show_state: true
        state_background: true
        fill_width: false
      - entity: sensor.acurite_tower_family_room_temperature
        show_name: true
        show_state: true
        fill_width: false
      - entity: sensor.acurite_tower_family_room_humidity
        show_name: true
        show_state: true
        fill_width: false
      - entity: sensor.athom_family_room_presence_sensor_light_sensor
        show_name: true
        show_state: true
        fill_width: false
