# Generated by dashboards/tools/gen_room_alerts.py from the room card's badges.
type: custom:bubble-card
card_type: sub-buttons
hide_main_background: true
sub_button:
  main: []
  bottom:
    - name: Alerts
      buttons_layout: inline
      justify_content: start
      group:
        - name: Door open
          icon: mdi:door-sliding-open
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.basement_sliding_door
              state: 'on'
        - name: Air quality poor
          icon: mdi:smog
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.view_plus_pm2_5
                  above: 75
                - condition: numeric_state
                  entity_id: sensor.view_plus_volatile_organic_compounds_parts
                  above: 300
                - condition: numeric_state
                  entity_id: sensor.view_plus_carbon_dioxide
                  above: 2000
                - condition: numeric_state
                  entity_id: sensor.view_plus_radon
                  above: 296
        - name: Air quality high
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.view_plus_pm2_5
                      above: 35
                    - condition: numeric_state
                      entity_id: sensor.view_plus_volatile_organic_compounds_parts
                      above: 200
                    - condition: numeric_state
                      entity_id: sensor.view_plus_carbon_dioxide
                      above: 1200
                    - condition: numeric_state
                      entity_id: sensor.view_plus_radon
                      above: 148
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.view_plus_pm2_5
                          above: 75
                        - condition: numeric_state
                          entity_id: sensor.view_plus_volatile_organic_compounds_parts
                          above: 300
                        - condition: numeric_state
                          entity_id: sensor.view_plus_carbon_dioxide
                          above: 2000
                        - condition: numeric_state
                          entity_id: sensor.view_plus_radon
                          above: 296
        - name: Air quality moderate
          icon: mdi:weather-dust
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: and
              conditions:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.view_plus_pm2_5
                      above: 12
                    - condition: numeric_state
                      entity_id: sensor.view_plus_volatile_organic_compounds_parts
                      above: 100
                    - condition: numeric_state
                      entity_id: sensor.view_plus_carbon_dioxide
                      above: 800
                    - condition: numeric_state
                      entity_id: sensor.view_plus_radon
                      above: 74
                - condition: not
                  conditions:
                    - condition: or
                      conditions:
                        - condition: numeric_state
                          entity_id: sensor.view_plus_pm2_5
                          above: 35
                        - condition: numeric_state
                          entity_id: sensor.view_plus_volatile_organic_compounds_parts
                          above: 200
                        - condition: numeric_state
                          entity_id: sensor.view_plus_carbon_dioxide
                          above: 1200
                        - condition: numeric_state
                          entity_id: sensor.view_plus_radon
                          above: 148
        - name: Too warm
          icon: mdi:fire
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.view_plus_temperature
              above: 74
        - name: Too cold
          icon: mdi:snowflake-alert
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: numeric_state
              entity_id: sensor.view_plus_temperature
              below: 67
        - name: Occupied
          icon: mdi:motion-sensor
          show_name: true
          fill_width: false
          tap_action:
            action: none
          visibility:
            - condition: state
              entity_id: binary_sensor.athom_family_room_presence_sensor_occupancy
              state: 'on'
styles: |-
      .bubble-sub-button-1 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-2 ha-icon { background: var(--red-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-3 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-4 ha-icon { background: var(--yellow-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-5 ha-icon { background: var(--orange-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-6 ha-icon { background: var(--cyan-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
      .bubble-sub-button-7 ha-icon { background: var(--green-color); color: #fff !important;
        border-radius: 50%; padding: 4px; --mdc-icon-size: 16px; box-sizing: content-box; }
view_layout:
  grid-column: 1 / -1
