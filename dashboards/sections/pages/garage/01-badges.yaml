type: custom:decluttering-card
template: bubble_chips
variables:
  - chips:
      - entity: binary_sensor.home_occupied
        show_state: true
        fill_width: false
      - entity: alarm_control_panel.default
        show_state: true
        state_background: true
        fill_width: false
      - entity: cover.garage_door
        show_state: true
        state_background: true
        fill_width: false
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - entity: lock.og_u_bolt_pro
        show_state: true
        state_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: lock.og_u_bolt_pro
            state_not: 'locked'
      - entity: binary_sensor.front_door
        show_state: true
        state_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: binary_sensor.front_door
            state_not: 'off'
      - entity: binary_sensor.garage_portal
        show_state: true
        state_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: binary_sensor.garage_portal
            state_not: 'off'
      - entity: binary_sensor.whole_house_motion_group
        icon: mdi:motion-sensor
        show_state: true
        state_background: true
        fill_width: false
      - entity: binary_sensor.window_open_group
        show_state: true
        state_background: true
        fill_width: false
        visibility:
          - condition: state
            entity: binary_sensor.window_open_group
            state: 'on'
