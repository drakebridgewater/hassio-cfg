# Every control says what it does. Start, Keep cleaning and Pause swap with the
# vacuum's state (conditional cards: layout-card ignores `visibility`).
type: custom:layout-card
grid_options:
  columns: full
layout_type: custom:grid-layout
layout:
  grid-template-columns: repeat(2, minmax(0, 1fr))
  grid-gap: 8px
  margin: 0
  padding: 0
  card_margin: 0
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: vacuum.roborock_q5
        state_not: cleaning
      - condition: state
        entity: vacuum.roborock_q5
        state_not: paused
    card:
        type: custom:button-card
        template: action_tile
        entity: vacuum.roborock_q5
        name: Start
        label: Clean the whole house
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.roborock_q5
  - type: conditional
    conditions:
      - condition: state
        entity: vacuum.roborock_q5
        state: paused
    card:
        type: custom:button-card
        template: action_tile
        entity: vacuum.roborock_q5
        name: Keep cleaning
        label: Pick up where it paused
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: vacuum.roborock_q5
  - type: conditional
    conditions:
      - condition: state
        entity: vacuum.roborock_q5
        state: cleaning
    card:
        type: custom:button-card
        template: action_tile
        entity: vacuum.roborock_q5
        name: Pause
        label: Stop for now, stay put
        icon: mdi:pause
        tap_action:
          action: perform-action
          perform_action: vacuum.pause
          target:
            entity_id: vacuum.roborock_q5
  - type: custom:button-card
    template: action_tile
    entity: vacuum.roborock_q5
    name: Go home
    label: Stop and drive back to the dock
    icon: mdi:home-import-outline
    tap_action:
      action: perform-action
      perform_action: vacuum.return_to_base
      target:
        entity_id: vacuum.roborock_q5
  - type: custom:button-card
    template: action_tile
    entity: vacuum.roborock_q5
    name: Spot clean
    label: Clean a small square around it
    icon: mdi:target
    tap_action:
      action: perform-action
      perform_action: vacuum.clean_spot
      target:
        entity_id: vacuum.roborock_q5
  - type: custom:button-card
    template: action_tile
    entity: vacuum.roborock_q5
    name: Find it
    label: It says where it is, out loud
    icon: mdi:map-marker-radius-outline
    variables:
      tone: neutral
    tap_action:
      action: perform-action
      perform_action: vacuum.locate
      target:
        entity_id: vacuum.roborock_q5
