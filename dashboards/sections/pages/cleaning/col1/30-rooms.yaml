# Clean one room: tap a room and the vacuum goes and cleans just that room
# (vacuum.clean_area; its rooms are mapped to HA areas in the vacuum's entity options,
# its "Hall" to Entryway). The room it's cleaning right now is highlighted.
type: vertical-stack
grid_options:
  columns: full
cards:
  - type: heading
    heading: Clean one room
    heading_style: subtitle
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-gap: 8px
      margin: 0
      padding: 0
      card_margin: 0
    cards:
      - type: custom:button-card
        template: action_tile
        entity: vacuum.roborock_q5
        name: Kitchen
        icon: mdi:fridge-outline
        triggers_update:
          - sensor.roborock_q5_current_room
        variables:
          'on': >-
            [[[ return entity?.state === 'cleaning'
                && hass.states['sensor.roborock_q5_current_room']?.state === 'Kitchen' ]]]
        label: '[[[ return variables.on ? "Cleaning now" : "Tap to clean" ]]]'
        tap_action:
          action: perform-action
          perform_action: vacuum.clean_area
          target:
            entity_id: vacuum.roborock_q5
          data:
            cleaning_area_id:
              - kitchen
          confirmation:
            text: Clean the kitchen now?
