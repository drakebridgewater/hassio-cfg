# For Drake: the way into Maintenance (98-maintenance.yaml), which nothing else links to.
# Only Drake sees this; 99-help.yaml hides its section from everyone else.
type: vertical-stack
grid_options:
  columns: full
cards:
  - type: heading
    heading: For Drake
    heading_style: title
  - type: custom:button-card
    template: action_tile
    name: Maintenance
    icon: mdi:wrench-outline
    label: AdGuard, sensors that stopped reporting, water leaks and Frigate
    tap_action:
      action: navigate
      navigation_path: /lovelace-main/maintenance
