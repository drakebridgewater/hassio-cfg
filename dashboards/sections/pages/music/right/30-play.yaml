# Quick play: plays the picked playlist in the picked room (script.music_play_picked).
type: custom:button-card
template: action_tile
entity: script.music_play_picked
name: Play
icon: mdi:play
# Echo rooms go through Spotify, the rest through Music Assistant (packages/music.yaml).
label: >-
  [[[ const room = states['input_select.music_room'].state;
      const echo = room.endsWith('Echo');
      const where = room.charAt(0).toLowerCase() + room.slice(1);
      return `${states['input_select.music_playlist'].state} ${echo ? 'on' : 'in'} ${where} · via ${echo ? 'Spotify' : 'Music Assistant'}` ]]]
triggers_update:
  - input_select.music_playlist
  - input_select.music_room
tap_action:
  action: perform-action
  perform_action: script.music_play_picked
styles:
  card:
    - min-height: 56px
    - height: 100%
  label:
    - white-space: nowrap
    - overflow: hidden
    - text-overflow: ellipsis
grid_options:
  columns: 12
  rows: 1
