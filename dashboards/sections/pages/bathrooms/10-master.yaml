# Master bathroom: lighting mode, the wall switch, then every sensor in the area.
# Temperature and humidity come from a Wireless Tag; the shower flag is a threshold on its humidity.
- type: heading
  heading_style: title
  heading: Master bathroom
  badges:
    - type: entity
      entity: sensor.master_bathroom_temperature
      show_state: true
      show_icon: true
    - type: entity
      entity: sensor.master_bathroom_humidity
      show_state: true
      show_icon: true
- !include ../../../cards/lighting-mode/master_bathroom.yaml
- type: custom:decluttering-card
  template: bubble_light
  variables:
    - entity: light.master_bathroom_wall_switch
    - name: Master bathroom
- type: tile
  entity: binary_sensor.master_bathroom_motion_sensor_occupancy
  name: Occupancy
- type: tile
  entity: binary_sensor.master_bathroom_window
  name: Window
- type: tile
  entity: binary_sensor.master_bathroom_shower_active
  name: Shower
  icon: mdi:shower-head
- type: tile
  entity: binary_sensor.master_bathroom_toilet_water_leak_detected
  name: Toilet leak
- type: tile
  entity: sensor.master_bathroom_motion_sensor_illuminance
  name: Illuminance
- type: tile
  entity: sensor.master_bathroom_wall_switch_power
  name: Light power
