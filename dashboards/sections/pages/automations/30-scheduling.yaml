type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Scheduling
    icon: mdi:clock-outline
  - type: entities
    entities:
      - type: custom:fold-entity-row
        head:
          type: section
          label: Scheduling (General)
        entities:
          - type: custom:scheduler-card
            tags: general
            include:
              - light
              - fan
              - sun
              - switch
              - input_boolean
              - scene
              - binary_sensor
              - alarm_control_panel
              - input_number
              - person
              - vacuum
            title: false
            discover_existing: false
            sort_by:
              - state
              - relative-time
            display_options:
              primary_info: default
              secondary_info:
                - relative-time
              icon: action
            show_header_toggle: false
      - type: custom:fold-entity-row
        head:
          type: section
          label: Scheduling (Automation Disabler)
        entities:
          - type: custom:scheduler-card
            tags: Auto-Automation
            include:
              - input_boolean
              - input_number
      - type: custom:fold-entity-row
        head:
          type: section
          label: Scheduling (Holiday)
        entities:
          - type: custom:scheduler-card
            tags: holiday
            include:
              - light
              - sun
              - switch
              - input_boolean
              - scene
              - binary_sensor
              - input_number
              - person
            title: false
            discover_existing: false
            sort_by:
              - state
              - relative-time
            display_options:
              primary_info: default
              secondary_info:
                - relative-time
              icon: action
            show_header_toggle: false
      - type: custom:fold-entity-row
        head:
          type: section
          label: Scheduling (Grow)
        entities:
          - type: custom:scheduler-card
            tags: grow
            include:
              - light
              - sun
              - switch
            title: false
            discover_existing: false
            sort_by:
              - state
              - relative-time
            display_options:
              primary_info: default
              secondary_info:
                - relative-time
              icon: action
            show_header_toggle: false
      - type: custom:fold-entity-row
        head:
          type: section
          label: Notifications Settings
        entities:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - entity_id: /^.*_notify$/
                  options:
                    type: custom:mushroom-template-card
                    primary: |
                      {{ state_attr(entity, 'friendly_name') }}
                    secondary: |
                      {{ area_name('this.entity_id') }} - {{ states(entity) }}
                    icon: |
                      {{ state_attr(entity, 'icon') }}
                    features_position: bottom
                    tap_action:
                      action: more-info
                    color: |
                      {% if is_state(entity, 'on') %}
                        red
                      {% else %}
                        disabled
                      {% endif %}
      - type: custom:fold-entity-row
        head:
          type: section
          label: Motion Trigger Illuminace Min
        entities:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - name: /^.* illuminance cutoff$/
                  options:
                    type: custom:mushroom-template-card
                    primary: |
                      {{ state_attr(entity, 'friendly_name') }}
                    secondary: |
                      {{ area_name('this.entity_id') }} - {{ states(entity) }}
                    icon: |
                      {{ state_attr(entity, 'icon') }}
                    features_position: bottom
                    tap_action:
                      action: more-info
                    color: |
                      {% if is_state(entity, 'on') %}
                        red
                      {% else %}
                        disabled
                      {% endif %}
      - type: custom:fold-entity-row
        head:
          type: section
          label: Illuminace
        entities:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
                  options:
                    type: custom:mushroom-template-card
                    primary: |
                      {{ state_attr(entity, 'friendly_name') }}
                    secondary: |
                      {{ area_name('this.entity_id') }} - {{ states(entity) }}
                    icon: |
                      {{ state_attr(entity, 'icon') }}
                    features_position: bottom
                    tap_action:
                      action: more-info
                    color: |
                      {% if is_state(entity, 'on') %}
                        red
                      {% else %}
                        disabled
                      {% endif %}
      - type: custom:fold-entity-row
        head:
          type: section
          label: Occupancy
        entities:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: occupancy
                  options:
                    type: custom:mushroom-template-card
                    primary: |
                      {{ state_attr(entity, 'friendly_name') }}
                    secondary: |
                      {{ area_name('this.entity_id') }} - {{ states(entity) }}
                    icon: |
                      {{ state_attr(entity, 'icon') }}
                    features_position: bottom
                    tap_action:
                      action: more-info
                    color: |
                      {% if is_state(entity, 'on') %}
                        red
                      {% else %}
                        disabled
                      {% endif %}
            sort:
              method: state
              reverse: true
      - type: custom:fold-entity-row
        head:
          type: section
          label: How long to keep lights on without motion
        entities:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              show_header_toggle: false
            filter:
              include:
                - name: /^.* OFF Duration$/
                  options:
                    type: custom:mushroom-number-card
                    layout: horizontal
                    display_mode: buttons
              exclude: []
            sort:
              method: domain
