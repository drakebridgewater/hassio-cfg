# The alarm first on Security (after the panic card, which only shows during a panic):
# the status card's alarm tile opens this page. Alarmo's card shows the state and the
# arm/disarm buttons; the keypad opens when a code is needed (code policy stays in Alarmo).
type: custom:alarmo-card
entity: alarm_control_panel.default
name: Alarm
keep_keypad_visible: false
button_scale_actions: 1.2
button_scale_keypad: 1.4
states: {}
show_messages: true
show_ready_indicator: true
show_bypassed_sensors: true
use_code_dialog: true
hide_keypad: false
