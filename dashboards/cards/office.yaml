
- type: custom:mushroom-chips-card
  chips:
    - type: entity
      entity: input_boolean.lighting_automation_blocker_office_room
      content_info: name
      icon_color: red
      icon: mdi:auto-mode
      name: Automation
      tap_action:
        action: toggle
      use_entity_picture: false
    - type: template
      entity: binary_sensor.office_multi_sensor_home_security_motion_detection
      icon_color: |-
        {% if states('binary_sensor.office_multi_sensor_home_security_motion_detection') == 'on' -%}
          red
        {%- else %}
          grey
        {%- endif %}
      icon: mdi:motion-sensor
      content: |-
        {% if states('binary_sensor.office_multi_sensor_home_security_motion_detection') == 'off' -%}
          No Motion detected
        {% elif states('binary_sensor.office_multi_sensor_home_security_motion_detection') == 'on' -%}
          Motion Detected
        {%- else %}
          Motion Error
        {%- endif %}
      tap_action:
        action: more-info
    - type: template
      entity: binary_sensor.office_window
      icon_color: |-
        {% if states('binary_sensor.office_window') == 'on' -%}
          red
        {%- else %}
          grey
        {%- endif %}
      icon: |-
        {% if states('binary_sensor.office_window') == 'off' -%}
          mdi:blinds-horizontal-closed
        {% elif states('binary_sensor.office_window') == 'on' -%}
          mdi:blinds-horizontal
        {%- else %}
          mdi:window-close
        {%- endif %}
      content: |-
        {% if states('binary_sensor.office_window') == 'off' -%}
          Window Closed
        {% elif states('binary_sensor.office_window') == 'on' -%}
          Window Open
        {%- else %}
          Window Error
        {%- endif %}
      tap_action:
        action: more-info
    - type: entity
      entity: sensor.office_temperature_sensor_temperature

- entity: light.office_wall_switch
  type: custom:bubble-card
  card_type: button
  button_type: slider
  show_last_updated: true
  sub_button:
    - name: Toggle button
      icon: mdi:lightbulb
      tap_action:
        action: toggle


- entity: light.office_behind_monitor_lamp
  name: Behind Monitor
  icon: hue:friends-of-hue-iq-pendant
  type: custom:bubble-card
  card_type: button
  button_type: slider
  show_last_updated: true
  sub_button:
    - name: Toggle button
      icon: mdi:lightbulb
      tap_action:
        action: toggle
- entity: light.office_desk_right_lamp
  name: Desk Right
  type: custom:bubble-card
  card_type: button
  button_type: slider
  show_last_updated: true
  sub_button:
    - name: Toggle button
      icon: mdi:lightbulb
      tap_action:
        action: toggle

- type: custom:bubble-card
  button_type: switch
  card_type: button
  entity: light.wled_candles
  name: Desk Ambiance
  select_attribute: effect_list
  attribute: effect
  rows: 1.719
  button_action:
    tap_action:
      action: more-info
  icon: phu:christmas-tree-v2
  use_accent_color: false
  force_icon: false
  show_state: false
  show_last_updated: true
  show_attribute: true
  sub_button:
    main:
      - entity: light.wled_candles
        icon: mdi:power
        tap_action:
          action: toggle
    bottom:
      - entity: select.wled_candles
        name: Colors
        icon: mdi:palette
        show_icon: false
        show_name: true
        sub_button_type: select
      - entity: select.wled_candles
        icon: hue:scene-concentrate
        name: Presets
        show_name: true
        show_icon: false
        show_attribute: false
        sub_button_type: select

- type: custom:bubble-card
  card_type: media-player
  entity: media_player.office
  name: Google Home
  hide:
    play_pause_button: false
  card_layout: large



