# Lighting mode for the family room zone (button-card template lighting_mode).
# Same blockers and automations as sensor.lighting_mode_family_room.
type: custom:button-card
template: lighting_mode
entity: sensor.lighting_mode_family_room
grid_options:
  columns: 24
variables:
  blockers:
    - input_boolean.lighting_automation_blocker_family_room
  automations:
    - automation.lighting_family_room_auto
