# Lighting mode for the master bathroom zone (button-card template lighting_mode).
# Same blockers and automations as sensor.lighting_mode_master_bathroom.
type: custom:button-card
template: lighting_mode
entity: sensor.lighting_mode_master_bathroom
grid_options:
  columns: 24
variables:
  blockers:
    - input_boolean.lighting_automation_blocker_master_bathroom
  automations:
    - automation.lighting_master_bathroom_sensor_light
  title: Master bathroom lighting
