# Lighting mode control on the room pages (button-card template lighting_mode).
# One script sets a zone's mode: the same blockers the switch-button hold and the
# cube flip, so the LED 4 colour (sensor.lighting_mode_<zone>) follows.

lighting_mode:
  input_boolean:
    # The entertainment center's blocker: the Apple TV lighting automation's by-pass
    # (it pauses while this is on). Scenes on the TV lights turn it on until the
    # alarm next changes (pyscript/scene_rooms.py).
    lighting_automation_blocker_entertainment_center:
      name: Lighting Automation Blocker - Entertainment Center
      icon: mdi:television-ambient-light

  # The Outdoor zone's mode, for LED 4 on the porch and deck switches. The other
  # zones' sensors are UI template helpers; this one lives here. Config hold on any
  # of the three switches toggles the blocker.
  template:
    - sensor:
        - name: Lighting Mode - Outdoor
          unique_id: lighting_mode_outdoor
          icon: mdi:outdoor-lamp
          state: >
            {% if is_state('input_boolean.lighting_automation_blocker_all', 'on') %}manual
            {% elif is_state('input_boolean.lighting_automation_blocker_outdoor', 'on') %}manual
            {% elif is_state('automation.holiday_away_lighting', 'off') %}degraded
            {% else %}auto{% endif %}

  script:
    lighting_set_zone_mode:
      alias: Lighting - Set zone mode
      icon: mdi:lightbulb-auto-outline
      mode: queued
      fields:
        mode:
          description: auto or manual
          example: auto
        blockers:
          description: The zone's blocker input_booleans
          example: input_boolean.lighting_automation_blocker_office_room
        automations:
          description: The zone's motion automations, turned back on with auto
          example: automation.lighting_office_sensor_light
      sequence:
        - if: "{{ mode == 'manual' }}"
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: "{{ blockers }}"
          else:
            - action: input_boolean.turn_off
              target:
                entity_id: "{{ blockers }}"
            - if: "{{ automations | default([]) | count > 0 }}"
              then:
                - action: automation.turn_on
                  target:
                    entity_id: "{{ automations }}"
