mqtt:
  sensor:
    - name: "Front Door Recognition"
      state_topic: "double-take/cameras/frontdoor"
      value_template: "{{ value_json.name }}"
    - name: "Front Door Recognition"
      state_topic: "double-take/cameras/driveway"
      value_template: "{{ value_json.name }}"
    - name: "Front Door Recognition"
      state_topic: "double-take/cameras/garage"
      value_template: "{{ value_json.name }}"
    
    - name: "Last Recognition Match"
      state_topic: "double-take/matches/+/state"
      value_template: "{{ value_json.name }}"

