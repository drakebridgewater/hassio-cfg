#################################  History  ###################################
history:
  exclude:
    domains:
      - automation
      - update
    entity_globs:
      - sensor.sun*
      - weather.*
      - sensor.browser_*
      - sensor.*uptime
      - sensor.time*
      - input_text.*
    entities:
      - sensor.date
      - sensor.last_boot
      - sun.sun
#################################  Recorder  ###################################
recorder:
  db_url: sqlite:///home-assistant_v2.db?cache=shared&journal_mode=wal&timeout=30000
  purge_keep_days: 30
  commit_interval: 30  # Increased from 5 to reduce database writes
  auto_purge: true
  
  # Use SQLite WAL mode for better performance
  db_max_retries: 10
  db_retry_wait: 3
  auto_repack: true

  # Exclude filter: these entities are never written to the DB at all.
  # NOTE: this also stops long-term statistics for anything listed here,
  # so power/energy and air-quality weight sensors are deliberately kept.
  exclude:
    domains:
      - automation
      - update
      - script            # script.led_set + inovelli_blue_led = ~643k rows/30d
      - calendar          # calendar.inbox alone = 44 MB of attributes
      - persistent_notification
    entity_globs:
      # --- UniFi Dream Machine Pro diagnostics: ~3.2M rows/30d ---
      - sensor.dream_machine_pro_*
      # --- Screek mmWave per-frame target coordinates: ~2.5M rows/30d ---
      - sensor.screek_human_sensor_*_target*
      # --- Jellyfin now-playing: 596 MB of attributes, the single worst offender ---
      - sensor.jellyha_now_playing_*
      # --- Frigate diagnostics (fps / cpu / gpu load): ~1.4M rows/30d ---
      - sensor.frigate_*
      - sensor.*_detect_cpu_usage
      - sensor.*_ffmpeg_cpu_usage
      - sensor.*_capture_cpu_usage
      - sensor.*_detection_fps
      # --- Radio/link noise: ~800k rows/30d ---
      - sensor.*_rssi
      - sensor.*_signal_strength
      - sensor.*_linkquality
      # --- BLE proximity estimates: ~320k rows/30d ---
      - sensor.*_estimated_distance
      # --- Mirrors the existing history/logbook excludes ---
      - sensor.sun*
      - weather.*
      - sensor.browser_*
      - sensor.*uptime
      - sensor.time*
      - input_text.*
    entities:
      # Oversized attributes - already refused by the recorder with a warning
      - sensor.drake_s_pixel_11_pro_active_notification_count
      - media_player.jellyha_home_user   # 176 MB of attributes
      - sensor.date
      - sensor.last_boot
      - sun.sun


#################################  Logbook  ###################################
logbook:
  exclude:
    domains:
      - automation
      - update
      - device_tracker
      - persistent_notification
      - scene
      - script
    entity_globs:
      - sensor.sun*
      - weather.*
      - sensor.browser_*
      - sensor.*uptime
      - sensor.time*
      - input_text.*
      - sensor.*_battery
      - sensor.*_link_quality
    entities:
      - sensor.date
      - sensor.last_boot # Comes from 'systemmonitor' sensor platform
      - sun.sun # Don't record sun data

#################################  InfluxDB  ###################################
influxdb:
  max_retries: 3
  default_measurement: state
  tags_attributes:
    - friendly_name
    - hidden
  measurement_attr: unit_of_measurement
  exclude:
    entities:
      - zone.home
    domains:
      - persistent_notification
      - person
      - automation
      - camera

prometheus:
  namespace: homeassistant
  filter:
    include_domains:
      - sensor
      - binary_sensor
      - switch
      - light
      - climate
      - cover
      - device_tracker
    exclude_entities:
      - zone.home
    exclude_domains:
      - persistent_notification
      - person
      - automation
      - camera
  override_metric: homeassistant_sensor_state

#################################  TraktTV  ###################################
trakt_tv:
  language: en # Prefered language for movie/show title
  timezone: America/Los_Angeles # Prefered timezone
  sensors:
    upcoming:
      show:
        days_to_fetch: 30
        max_medias: 10
      movie:
        days_to_fetch: 45
        max_medias: 5
    recommendation:
      show:
        max_medias: 3
      movie:
        max_medias: 3
