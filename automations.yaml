- id: '1777173013844'
  alias: 'Notification: Apply Global LED on state change'
  description: 'Reacts to changes in sensor.active_global_notification (the global
    priority queue) and calls script.led_set with the appropriate color/effect for
    the active notification, or clears LED 1 (bottom) if no notification is active.
    Targets Inovelli VZM31-SN switches via explicit entity lists (NOT a light group
    — Zanix doesn''t expand light groups properly). Heartbeat automation re-triggers
    this every 5 minutes when active.


    ONE COLOR PER STATE: every state the priority sensor can emit gets its own colour
    on Led 1, so the bar is readable on sight rather than by elimination. Only one
    global notification is ever displayed at a time (the sensor is a priority queue),
    so the risk is misremembering a colour, not telling two apart side by side. Orange
    (hue 21) and yellow (hue 42) are the one genuinely confusable pair in this palette,
    so they are additionally separated by effect: Front Door pulses, Fridge slow-blinks.
    Red is reserved for the alarm/critical tier and blue for the switch''s own firmware
    default state, which leaves exactly seven usable colours for seven states - there
    is no spare, so adding a state means picking a new axis (effect or brightness),
    not a new colour.


    SANCTUARY POLICY: the four sanctuary switches (Master Bedroom, Master Closet,
    Master Bathroom, Ethan''s Bedroom) only receive the three perimeter-breach alerts
    — Garage Door Open (the overhead door, cover.garage_door), Front Door Open, and
    Garage Entry Door Open (the walk-through contact, binary_sensor.garage_portal)
    — and only ever at brightness 1. Low-urgency notifications (kitchen door, slider,
    windows, fridge) go to the twelve non-sanctuary switches only, so a bedroom bar
    never lights for a fridge left ajar. Each perimeter branch therefore makes TWO
    led_set calls: the twelve at full brightness, the four at brightness 1. The Idle
    branch still releases all sixteen — a switch that stopped being a target still
    has to be cleared.'
  triggers:
  - entity_id: sensor.active_global_notification
    trigger: state
  actions:
  - alias: Branch on active notification state
    choose:
    - alias: Garage Door Open (the overhead door itself, cover.garage_door) → WHITE
        pulse. Sanctuary-eligible, and the HIGHEST priority entry in the queue - an
        open overhead door is the largest exposure in the house.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Garage Door Open
      sequence:
      - alias: Non-sanctuary switches at tier default brightness
        action: script.led_set
        data:
          color: white
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
      - alias: Sanctuary switches at brightness 1
        action: script.led_set
        data:
          color: white
          effect: pulse
          tier: global
          brightness: 1
          switch_entity:
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.master_bathroom_wall_switch
          - light.ethan_s_bedroom_wall_switch
    - alias: Front Door Open → ORANGE pulse. Sanctuary-eligible. Second in the queue.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Front Door Open
      sequence:
      - alias: Non-sanctuary switches at tier default brightness
        action: script.led_set
        data:
          color: orange
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
      - alias: Sanctuary switches at brightness 1
        action: script.led_set
        data:
          color: orange
          effect: pulse
          tier: global
          brightness: 1
          switch_entity:
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.master_bathroom_wall_switch
          - light.ethan_s_bedroom_wall_switch
    - alias: Garage Entry Door Open (the walk-through contact, binary_sensor.garage_portal)
        → PURPLE pulse. Sanctuary-eligible. Third in the queue; split out from Front
        Door so the two no longer share orange.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Garage Entry Door Open
      sequence:
      - alias: Non-sanctuary switches at tier default brightness
        action: script.led_set
        data:
          color: purple
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
      - alias: Sanctuary switches at brightness 1
        action: script.led_set
        data:
          color: purple
          effect: pulse
          tier: global
          brightness: 1
          switch_entity:
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.master_bathroom_wall_switch
          - light.ethan_s_bedroom_wall_switch
    - alias: Kitchen Door Open → TEAL pulse. NOT sanctuary-eligible.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Kitchen Door Open
      sequence:
      - action: script.led_set
        data:
          color: teal
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
    - alias: Slider Open → MAGENTA pulse. NOT sanctuary-eligible. Split out from Kitchen
        Door so the two no longer share teal.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Slider Open
      sequence:
      - action: script.led_set
        data:
          color: magenta
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
    - alias: Windows Open → GREEN pulse. NOT sanctuary-eligible. Green is the most
        benign colour in the palette and open windows are usually deliberate.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Windows Open
      sequence:
      - action: script.led_set
        data:
          color: green
          effect: pulse
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
    - alias: Fridge Open → YELLOW slow blink, brightness override since mixed colour.
        NOT sanctuary-eligible. Fires from input_boolean.fridge_open_too_long via
        the fridge debounce state machine (2 minutes continuously open). The slow
        blink also keeps it distinct from Front Door's orange pulse.
      conditions:
      - condition: state
        entity_id: sensor.active_global_notification
        state:
        - Fridge Open
      sequence:
      - action: script.led_set
        data:
          brightness: 100
          color: yellow
          effect: slow_blink
          tier: global
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
    default:
    - alias: No notification → release the global tier LED on ALL sixteen switches.
        The global tier paints Led 1 (bottom), so the release has to target Led 1.
        Uses 'Clear' (the blueprint word for the firmware's clear_effect), not 'Off'
        at duration 255 - the latter latches an indefinite "paint nothing" notification
        on Led 1 rather than releasing it, which permanently blanks Led 1's share
        of the normal level bar. All sixteen are cleared even though only twelve receive
        the low-urgency alerts, because the sanctuary four still need releasing after
        a perimeter alert ends.
      action: script.inovelli_blue_led_zigbee2mqtt
      metadata: {}
      data:
        led: Led 1
        effect: Clear
        color: 0
        level: 0
        duration: 0
        target:
          entity_id:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.ethan_s_bedroom_wall_switch
          - light.master_bathroom_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
  mode: queued
  max: 5
- id: '1777173089332'
  alias: 'Notification: Global tier heartbeat refresh'
  description: Every 5 minutes, if there is an active global notification, re-applies
    the LED state by triggering the apply automation. Protects against firmware timeout
    (5 min default), Z2M restarts, mesh hiccups, or HA reloads. Conditional on active
    state to avoid unnecessary Z2M traffic when nothing is happening.
  triggers:
  - minutes: /5
    platform: time_pattern
  conditions:
  - alias: Skip heartbeat if no notification is active
    condition: template
    value_template: '{{ states(''sensor.active_global_notification'') not in [''Idle'',
      ''unknown'', ''unavailable''] }}'
  actions:
  - alias: Re-trigger apply automation to refresh LED 7 (bypasses its trigger requirement)
    data:
      skip_condition: true
    target:
      entity_id: automation.notification_apply_global_led_on_state_change
    action: automation.trigger
  mode: single
- id: '1777214875542'
  alias: 'Notification: Apply Mode LED on state change'
  description: 'Iterates over all 16 Inovelli VZM31-SN switches. For each, looks up
    its zone (embedded in for_each list), reads the zone''s mode sensor (sensor.lighting_mode_<zone>),
    and applies the correct LED 4 color: auto=green solid, manual=orange solid, degraded=yellow
    SLOW BLINK, unmapped=dark, unknown=white sentinel. Triggered by any zone mode
    sensor changing OR the global kill switch toggling.


    WHY DEGRADED BLINKS: orange (hue 21) and yellow (hue 42) are close on the Inovelli
    hue wheel and at brightness 30 orange desaturates toward amber, making solid manual
    and solid degraded indistinguishable on the bar. The blink carries the distinction
    instead of the hue, so the "an automation is switched off" warning is actually
    readable. Do not change degraded back to solid without also moving one of the
    two hues.'
  triggers:
  - entity_id:
    - sensor.lighting_mode_main_area
    - sensor.lighting_mode_family_room
    - sensor.lighting_mode_office_room
    - sensor.lighting_mode_upstairs_hallway
    - sensor.lighting_mode_master_bedroom
    - sensor.lighting_mode_ethan_s_room
    - sensor.lighting_mode_master_bathroom
    - sensor.lighting_mode_basement_bathroom
    - sensor.lighting_mode_basement_hallway
    - sensor.lighting_mode_garage
    - sensor.lighting_mode_stairs
    platform: state
  - entity_id: input_boolean.lighting_automation_blocker_all
    platform: state
  actions:
  - alias: 'Iterate all 16 switches; lookup zone, read zone mode, apply correct color
      (Option I: dark for unmapped)'
    repeat:
      for_each:
      - switch: light.family_room_wall_switch
        zone: family_room
      - switch: light.kitchen_wall_switch
        zone: main_area
      - switch: light.awning_wall_switch
        zone: main_area
      - switch: light.office_wall_switch
        zone: office_room
      - switch: light.upstairs_hallway_wall_switch
        zone: upstairs_hallway
      - switch: light.master_bedroom_wall_switch
        zone: master_bedroom
      - switch: light.master_bedroom_closet_wall_switch
        zone: master_bedroom
      - switch: light.ethan_s_bedroom_wall_switch
        zone: ethan_s_room
      - switch: light.master_bathroom_wall_switch
        zone: master_bathroom
      - switch: light.basement_bathroom_wall_switch
        zone: basement_bathroom
      - switch: light.basement_hallway_wall_switch
        zone: basement_hallway
      - switch: light.garage_wall_switch
        zone: garage
      - switch: light.basement_deck_wall_switch
        zone: unmapped
      - switch: light.upstairs_deck_wall_switch
        zone: unmapped
      - switch: light.front_porch_wall_switch
        zone: unmapped
      - switch: light.stairs_wall_switch
        zone: stairs
      sequence:
      - choose:
        - alias: Unmapped → LED 4 dark via 'off' effect
          conditions:
          - condition: template
            value_template: '{{ repeat.item.zone == ''unmapped'' }}'
          sequence:
          - data:
              effect: 'off'
              switch_entity: '{{ repeat.item.switch }}'
              tier: mode
            action: script.led_set
        - alias: Mode = auto → green solid
          conditions:
          - condition: template
            value_template: '{{ states(''sensor.lighting_mode_'' ~ repeat.item.zone)
              == ''auto'' }}'
          sequence:
          - data:
              color: green
              effect: solid
              switch_entity: '{{ repeat.item.switch }}'
              tier: mode
            action: script.led_set
        - alias: Mode = manual → orange solid
          conditions:
          - condition: template
            value_template: '{{ states(''sensor.lighting_mode_'' ~ repeat.item.zone)
              == ''manual'' }}'
          sequence:
          - data:
              color: orange
              effect: solid
              switch_entity: '{{ repeat.item.switch }}'
              tier: mode
              brightness: 30
            action: script.led_set
        - alias: Mode = degraded → yellow solid
          conditions:
          - condition: template
            value_template: '{{ states(''sensor.lighting_mode_'' ~ repeat.item.zone)
              == ''degraded'' }}'
          sequence:
          - data:
              color: yellow
              effect: slow_blink
              switch_entity: '{{ repeat.item.switch }}'
              tier: mode
              brightness: 30
            action: script.led_set
        default:
        - alias: Unknown / unavailable mode → white sentinel
          data:
            color: white
            effect: solid
            switch_entity: '{{ repeat.item.switch }}'
            tier: mode
          action: script.led_set
  max: 5
  mode: queued
- id: '1777214900330'
  alias: 'Notification: Mode tier heartbeat refresh'
  description: Every 5 minutes, unconditionally re-applies the mode LED state by triggering
    the apply automation. Unlike global-tier heartbeat (which is conditional on active
    notification), mode tier is always-on and always has a state to refresh. Protects
    against power loss, Z2M restart, or firmware glitch even though mode tier uses
    indefinite duration.
  triggers:
  - minutes: /5
    platform: time_pattern
  actions:
  - alias: Re-trigger apply automation to refresh LED 4
    data:
      skip_condition: true
    target:
      entity_id: automation.notification_apply_mode_led_on_state_change
    action: automation.trigger
  mode: single
- id: '1777240821645'
  alias: 'Notification: Update today high temp from forecast'
  description: Fetches the daily forecast from weather.thermostat (Ecobee) and stores
    today's high temperature in input_number.today_high_temp. Used by sensor.active_global_notification
    to gate windows/doors notifications based on whether the day is climate-meaningful
    (extreme cold/hot). Runs hourly + on HA startup.
  triggers:
  - hours: /1
    platform: time_pattern
  - event: start
    platform: homeassistant
  actions:
  - alias: Fetch daily forecast from weather.thermostat
    data:
      type: daily
    response_variable: forecast_data
    target:
      entity_id: weather.thermostat
    action: weather.get_forecasts
  - alias: Extract today's high and write to input_number
    target:
      entity_id: input_number.today_high_temp
    data:
      value: '{{ forecast_data[''weather.thermostat''].forecast[0].temperature | int(70)
        }}'
    action: input_number.set_value
  mode: single
- id: '1777240880596'
  alias: 'Notification: Fridge open debounce state machine'
  description: Three-state machine for fridge debounce. (1) Fridge opens → start a
    2-minute timer. (2) Fridge closes → cancel timer and clear 'too long' boolean.
    (3) Timer finishes (fridge open 2+ min continuously) → raise the boolean. The
    boolean is read by sensor.active_global_notification to fire the 'Fridge Open'
    notification.
  triggers:
  - entity_id: binary_sensor.hz526153_door_status_any_open
    platform: state
  - event_data:
      entity_id: timer.fridge_open_debounce
    event_type: timer.finished
    platform: event
  actions:
  - alias: Branch on which trigger fired
    choose:
    - alias: Fridge opened → start 2-minute timer (boolean stays off until expires)
      conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''state'' and trigger.entity_id ==
          ''binary_sensor.hz526153_door_status_any_open'' and trigger.to_state.state
          == ''on'' }}'
      sequence:
      - data:
          duration: 00:02:00
        target:
          entity_id: timer.fridge_open_debounce
        action: timer.start
    - alias: Fridge closed → cancel timer and clear boolean
      conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''state'' and trigger.entity_id ==
          ''binary_sensor.hz526153_door_status_any_open'' and trigger.to_state.state
          == ''off'' }}'
      sequence:
      - target:
          entity_id: timer.fridge_open_debounce
        action: timer.cancel
      - target:
          entity_id: input_boolean.fridge_open_too_long
        action: input_boolean.turn_off
    - alias: Timer finished → fridge has been open 2 min, raise boolean
      conditions:
      - condition: template
        value_template: '{{ trigger.platform == ''event'' and trigger.event.event_type
          == ''timer.finished'' }}'
      sequence:
      - target:
          entity_id: input_boolean.fridge_open_too_long
        action: input_boolean.turn_on
  mode: queued
- id: '1777258340744'
  alias: 'Notification: Apply Critical LED on state change'
  description: 'Reacts to changes in sensor.active_critical_notification (Tier 3 priority
    queue based on alarm state) and calls script.led_set with the appropriate color/effect
    for the active critical state. Tier 3 critical uses LED ''All'' (whole bar override).
    Triggered=red fast_blink, Armed Away/Home=red solid. On Disarm: 1) sends effect:clear
    (wrapper substitutes color:Red automatically because firmware quirk requires non-zero
    color for whole-bar Clear Effect), 1.5) wait 3 seconds for firmware to settle,
    2) re-triggers mode apply automation to restore LED 4 per-zone color, 3) re-triggers
    global apply automation to restore LED 1 active notification. The 3-second delay
    prevents the firmware from suppressing individual LED commands while it''s still
    processing the whole-bar override removal. Heartbeat re-triggers every 5 minutes
    when armed.'
  triggers:
  - entity_id: sensor.active_critical_notification
    trigger: state
  - alias: Repaint on sunrise/sunset so a whole-bar override painted in daylight at
      level 100 gets re-applied at the sanctuary night level after dark. The critical
      heartbeat is gated on 'armed', so without this nothing re-applies once disarmed.
    entity_id: sun.sun
    trigger: state
  actions:
  - alias: Branch on active critical notification state
    choose:
    - alias: Triggered → red fast_blink at 100% (true emergency)
      conditions:
      - condition: state
        entity_id: sensor.active_critical_notification
        state: Triggered
      sequence:
      - action: script.led_set
        data:
          color: red
          effect: fast_blink
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.ethan_s_bedroom_wall_switch
          - light.master_bathroom_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
          tier: critical
    - alias: Armed Away → red solid (full bar, indefinite)
      conditions:
      - condition: state
        entity_id: sensor.active_critical_notification
        state:
        - Armed Away
        - Armed Night
        - Armed Vacation
      sequence:
      - action: script.led_set
        data:
          color: red
          effect: solid
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.ethan_s_bedroom_wall_switch
          - light.master_bathroom_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
          tier: critical
    - alias: Armed Home → red solid (same as Armed Away — simplified)
      conditions:
      - condition: state
        entity_id: sensor.active_critical_notification
        state: Armed Home
      sequence:
      - action: script.led_set
        data:
          color: red
          effect: solid
          switch_entity:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.ethan_s_bedroom_wall_switch
          - light.master_bathroom_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
          tier: critical
    default:
    - alias: Disarmed - 0) Release the whole-bar override with a real clear_effect.
        'Clear' is the Zanix blueprint's own vocabulary word and is what maps to the
        firmware's clear_effect; 'Clear Effect' misses the lookup and publishes an
        invalid enum. This step used to send effect 'Off' at duration 255, which is
        not a release at all - it latches a whole-bar notification that paints nothing,
        forever. A whole-bar notification outranks every individual-LED notification,
        so that is what was hiding the mode (LED 4) and global (LED 1) tiers whenever
        the alarm had been armed at least once since the last power cycle.
      action: script.inovelli_blue_led_zigbee2mqtt
      metadata: {}
      data:
        led: All
        effect: Clear
        color: 0
        level: 0
        duration: 0
        target:
          entity_id:
          - light.family_room_wall_switch
          - light.kitchen_wall_switch
          - light.awning_wall_switch
          - light.office_wall_switch
          - light.upstairs_hallway_wall_switch
          - light.master_bedroom_wall_switch
          - light.master_bedroom_closet_wall_switch
          - light.ethan_s_bedroom_wall_switch
          - light.master_bathroom_wall_switch
          - light.basement_bathroom_wall_switch
          - light.basement_hallway_wall_switch
          - light.garage_wall_switch
          - light.basement_deck_wall_switch
          - light.upstairs_deck_wall_switch
          - light.front_porch_wall_switch
          - light.stairs_wall_switch
    - alias: Disarmed - 1) Cancel critical override with effect:clear (wrapper sends
        color:Red automatically due to firmware quirk)
      action: script.led_set
      data:
        effect: clear
        switch_entity:
        - light.family_room_wall_switch
        - light.kitchen_wall_switch
        - light.awning_wall_switch
        - light.office_wall_switch
        - light.upstairs_hallway_wall_switch
        - light.master_bedroom_wall_switch
        - light.master_bedroom_closet_wall_switch
        - light.ethan_s_bedroom_wall_switch
        - light.master_bathroom_wall_switch
        - light.basement_bathroom_wall_switch
        - light.basement_hallway_wall_switch
        - light.garage_wall_switch
        - light.basement_deck_wall_switch
        - light.upstairs_deck_wall_switch
        - light.front_porch_wall_switch
        - light.stairs_wall_switch
        tier: critical
      enabled: false
    - alias: Disarmed - 1.5) Wait for firmware to settle out of override state before
        sending individual LED commands
      delay:
        seconds: 3
    - alias: Disarmed - 2) Re-apply mode tier (LED 4 returns to per-zone color)
      action: automation.trigger
      target:
        entity_id: automation.notification_apply_mode_led_on_state_change
      data:
        skip_condition: true
    - alias: Disarmed - 3) Re-apply global tier (LED 1 returns to current notification
        or clear)
      action: automation.trigger
      target:
        entity_id: automation.notification_apply_global_led_on_state_change
      data:
        skip_condition: true
  max: 5
  mode: queued
  trace:
    stored_traces: 250
- id: '1777258393938'
  alias: 'Notification: Critical tier heartbeat refresh'
  description: Every 5 minutes, if there is an active critical notification (alarm
    armed or triggered), re-applies the LED state by triggering the apply automation.
    Conditional on active state to avoid unnecessary Z2M traffic when alarm is disarmed.
    Mirrors the global tier heartbeat pattern.
