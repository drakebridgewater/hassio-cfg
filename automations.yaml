- id: '1782103688340'
  alias: Security - Critical Alarm Alert Driver
  description: Fires the critical actionable alert script on Alarmo pending and triggered.
    The Disarm action is HA_DISARM_ME, deliberately not Alarmo's reserved ALARMO_DISARM
    (Alarmo handles that itself with skip_code, which raced this automation and dropped
    attribution). The tapping person is resolved from the event context user_id, which
    mobile_app binds to that phone's registration, and the alarm is disarmed with their
    internal Alarmo code. An unrecognised device, or a tap while the alarm is not pending
    or triggered, does nothing. Any disarm clears the alert on both phones.
  triggers:
  - entity_id: alarm_control_panel.default
    to: pending
    id: pending
    trigger: state
  - entity_id: alarm_control_panel.default
    to: triggered
    id: triggered
    trigger: state
  - event_type: mobile_app_notification_action
    event_data:
      action: HA_DISARM_ME
    id: disarm
    trigger: event
  - entity_id: alarm_control_panel.default
    to: disarmed
    id: cleared
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: Alert on entry delay and on trigger
      conditions:
      - condition: trigger
        id:
        - pending
        - triggered
      sequence:
      - action: script.security_critical_alert
        data:
          phase: '{{ trigger.id }}'
    - alias: Disarm as the tapping person, only while the alarm is live
      conditions:
      - condition: trigger
        id: disarm
      - condition: state
        entity_id: alarm_control_panel.default
        state:
        - pending
        - triggered
      sequence:
      - variables:
          tapper_code: >-
            {% set map = {
                 '9edc32828f114914baabce7b9ae21eb3': 'input_text.alarmo_code_drake',
                 '79f6891d0d1b40a798e2407ca48889aa': 'input_text.alarmo_code_shawna'
               } %}
            {% set helper = map.get(trigger.event.context.user_id) %}
            {{ states(helper) if helper else '' }}
      - if:
        - condition: template
          value_template: '{{ tapper_code | string is match(''^[0-9]{4,32}$'') }}'
        then:
        - action: alarmo.disarm
          data:
            entity_id: alarm_control_panel.default
            code: '{{ tapper_code }}'
        else:
        - action: system_log.write
          data:
            level: warning
            logger: automation.security_critical_alarm_alert_driver
            message: 'HA_DISARM_ME ignored: user_id {{ trigger.event.context.user_id }}
              has no valid Alarmo code mapped.'
    - alias: Clear the alert on both phones however the alarm was disarmed
      conditions:
      - condition: trigger
        id: cleared
      sequence:
      - parallel:
        - action: notify.mobile_app_drake_s_pixel_11_pro
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: alarmo_security
        - action: notify.mobile_app_shawnas_iphone
          continue_on_error: true
          data:
            message: clear_notification
            data:
              tag: alarmo_security
  mode: parallel
  max: 10
- id: '1782243414971'
  alias: HVAC Schedule
  description: Today's forecast high selects a band; the band supplies the HVAC mode
    and the literal alarm state picks the setpoint column within it. Bands are [low,
    high) — a high of exactly 80 uses the 80+ row. Off only when a window is open
    2+ min or a door 10+ min. Resumes when binary_sensor.house_sealed turns on (every
    door and window shut 20+ min), and re-checks on alarm transitions, HA start and
    a daily 04:30 refresh. The thermostat is only touched — and a notification only
    sent — when the band's target actually differs from what is already set, so open/close
    cycles and manual changes stay silent.
  triggers:
  - id: occupancy
    trigger: state
    entity_id: alarm_control_panel.default
    to:
    - disarmed
    - armed_home
    - armed_night
    - armed_away
    - armed_vacation
  - id: occupancy
    trigger: homeassistant
    event: start
  - id: occupancy
    trigger: time
    at: 04:30:00
  - id: opened
    trigger: state
    entity_id: binary_sensor.window_open_group
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - id: opened
    trigger: state
    entity_id: binary_sensor.any_door_open_group
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - id: sealed
    trigger: state
    entity_id: binary_sensor.house_sealed
    from: 'off'
    to: 'on'
  - id: manual_while_open
    trigger: state
    entity_id: climate.thermostat
    to:
    - heat
    - cool
    - heat_cool
  conditions: []
  actions:
  - choose:
    - alias: Open long enough while the HVAC is running — shut it down
      conditions:
      - condition: trigger
        id: opened
      - condition: template
        value_template: '{{ is_open }}'
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.thermostat
          state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: 'off'
      - data:
          category: HVAC Events
          title: Notification
          message: HVAC off — door/window opened (was {{ prev_text }}).
        action: ticker.notify
    - alias: Sealed or occupancy changed — apply the band, only if it differs
      conditions:
      - condition: trigger
        id:
        - occupancy
        - sealed
      - condition: template
        value_template: '{{ not is_open }}'
      - condition: template
        value_template: '{{ needs_change }}'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: '{{ target_mode }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ target_mode == ''heat_cool'' }}'
          sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.thermostat
            data:
              target_temp_low: '{{ setpoint[0] }}'
              target_temp_high: '{{ setpoint[1] }}'
        default:
        - action: climate.set_temperature
          target:
            entity_id: climate.thermostat
          data:
            temperature: '{{ setpoint }}'
      - data:
          category: HVAC Events
          title: Notification
          message: HVAC {{ target_mode }} / {{ occupancy }} — {{ (setpoint[0] ~ '–'
            ~ setpoint[1]) if target_mode == 'heat_cool' else setpoint }}°F (band
            {{ row.label }}, forecast high {{ high }}°F). Was {{ prev_text }}.
        action: ticker.notify
    - alias: Someone turned the HVAC on while the house is open
      conditions:
      - condition: trigger
        id: manual_while_open
      - condition: template
        value_template: '{{ is_open }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: A door or window is open but the HVAC was just set to {{ states('climate.thermostat')
            }}. Check which are open.
  mode: single
  variables:
    alarm_entity: alarm_control_panel.default
    climate_entity: climate.thermostat
    forecast_entity: sensor.daily_weather_forecast
    fallback_high: 65
    occupancy: '{{ states(alarm_entity) }}'
    today_high: "{% set fc = state_attr(forecast_entity, 'forecast') or [] %} {% set
      ns = namespace(t = none) %} {% for f in fc if ns.t is none %}\n  {% if f.datetime
      is defined and f.temperature is defined\n        and as_local(as_datetime(f.datetime)).date()
      == now().date() %}\n    {% set ns.t = f.temperature %}\n  {% endif %}\n{% endfor
      %} {{ ns.t if ns.t is not none\n   else (fc[0].temperature if fc and fc[0].temperature
      is defined else none) }}"
    high: '{{ today_high | float(fallback_high) | round | int }}'
    bands:
    - label: <50
      max: 50
      mode: heat
      disarmed: 71
      armed_home: 71
      armed_night: 66
      armed_away: 63
      armed_vacation: 58
    - label: 50-60
      max: 60
      mode: heat
      disarmed: 71
      armed_home: 71
      armed_night: 67
      armed_away: 64
      armed_vacation: 60
    - label: 60-74
      max: 74
      mode: heat_cool
      disarmed:
      - 69
      - 73
      armed_home:
      - 69
      - 74
      armed_night:
      - 67
      - 72
      armed_away:
      - 62
      - 76
      armed_vacation:
      - 58
      - 82
    - label: 74-80
      max: 80
      mode: cool
      disarmed: 71
      armed_home: 71
      armed_night: 69
      armed_away: 75
      armed_vacation: 80
    - label: 80+
      max: 999
      mode: cool
      disarmed: 71
      armed_home: 71
      armed_night: 69
      armed_away: 76
      armed_vacation: 83
    band_index: "{{ [ bands | map(attribute='max') | select('le', high) | list | count,\n
      \    bands | count - 1 ] | min }}"
    row: '{{ bands[band_index] }}'
    target_mode: '{{ row.mode }}'
    setpoint: '{{ row.get(occupancy, row.disarmed) }}'
    is_open: "{{ is_state('binary_sensor.window_open_group', 'on')\n   or is_state('binary_sensor.any_door_open_group',
      'on') }}"
    prev_mode: '{{ states(climate_entity) }}'
    prev_set: "{{ [ state_attr(climate_entity, 'target_temp_low'),\n     state_attr(climate_entity,
      'target_temp_high') ]\n   if prev_mode == 'heat_cool'\n   else [ state_attr(climate_entity,
      'temperature') ] }}"
    want_set: '{{ setpoint if target_mode == ''heat_cool'' else [setpoint] }}'
    prev_text: "{{ prev_mode if prev_mode == 'off'\n     or prev_set | select('none')
      | list | count > 0\n   else prev_mode ~ ' ' ~ (prev_set | map('float', 0) |
      map('round', 0) | map('int')\n     | join('–')) ~ '°F' }}"
    needs_change: "{{ prev_mode != target_mode\n   or (prev_set | map('float', -999)
      | map('round', 0) | list)\n      != (want_set | map('float', -999) | map('round',
      0) | list) }}"
