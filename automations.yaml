- id: '1695133842578'
  alias: Time - Every 10 minutes
  description: Triggers every 10 minutes and executes actions conditionally
  triggers:
  - trigger: time_pattern
    minutes: /10
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - alias: Every 20 minutes
    if:
    - condition: template
      value_template: '{{ now().minute % 20 == 0 or trigger.platform == ''homeassistant''
        }}'
    then:
    - action: system_log.write
      data:
        message: 20-minute interval actions executing.
  - alias: Every 30 minutes
    if:
    - condition: template
      value_template: '{{ now().minute % 30 == 0 or trigger.platform == ''homeassistant''
        }}'
    then:
    - action: system_log.write
      data:
        message: 30-minute interval actions executing.
  - alias: Every 1 hour (Sun Up)
    if:
    - condition: template
      value_template: '{{ now().minute % 60 == 0 or trigger.platform == ''homeassistant''
        }}'
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    then:
    - action: homeassistant.update_entity
      data:
        entity_id:
        - sensor.openuv_current_uv_level
        - binary_sensor.openuv_protection_window
  - alias: Every 4 hours (Sun Up)
    if:
    - condition: template
      value_template: '{{ now().hour % 4 == 0 and now().minute == 0 or trigger.platform
        == ''homeassistant'' }}'
    - condition: state
      entity_id: sun.sun
      state: above_horizon
    then:
    - action: homeassistant.update_entity
      data:
        entity_id:
        - sensor.openuv_max_uv_index
        - sensor.openuv_current_ozone_level
  - alias: Daycare Travel Time Update
    if:
    - condition: time
      after: '16:00:00'
      before: '17:30:00'
    then:
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.ethan_at_daycare
          state: 'on'
        - condition: zone
          entity_id: person.drake
          zone: zone.work
      then:
      - service: ticker.notify
        data:
          category: Parents
          title: Time to Pick up Ethan
          message: Leave work in {{ (today_at("17:30") | as_timestamp - now()  | as_timestamp
            - ( states('sensor.drake_iphone_idevice_travel_time_daycare')|float *60))
            |  timestamp_custom("%Hh%Mm", false) }} to pick up Ethan. The Drive will
            take {{  states('sensor.drake_iphone_idevice_travel_time_daycare') }}m
      enabled: true
    - if:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.ethan_at_daycare
          state: 'on'
        - condition: zone
          entity_id: person.drake
          zone: zone.home
      then:
      - service: ticker.notify
        data:
          category: Parents
          title: Time to Pick up Ethan
          message: Leave work in {{ (today_at("17:30") | as_timestamp - now()  | as_timestamp
            - ( states('sensor.drake_iphone_idevice_travel_time_daycare')|float *60))
            |  timestamp_custom("%Hh%Mm", false) }} to pick up Ethan. The Drive will
            take {{  states('sensor.drake_iphone_idevice_travel_time_daycare') }}m
    else:
    - data:
        notification_id: AlertPickUpEthan
      action: persistent_notification.dismiss
  - data:
      entity_id: camera.family_room_camera
    action: abode.capture_image
  - data:
      entity_id: camera.front_door_camera
    action: abode.capture_image
- id: '1695531132893'
  alias: Alarm State - Side Effects
  description: 'Reacts to Alarmo state changes (away/home/disarmed) and runs all the
    non-LED side effects: cameras on/off, climate presets by season, lights, garage
    covers, fans, switches, notifications, media stop. LED behavior is handled separately
    by automation.notification_apply_critical_led_on_state_change. Mirroring to Abode
    is handled separately by automation.alarm_alarmo_to_abode_sync.'
  triggers:
  - id: away
    entity_id:
    - alarm_control_panel.default
    to: armed_away
    for:
      hours: 0
      minutes: 0
      seconds: 0
    trigger: state
  - id: home
    entity_id:
    - alarm_control_panel.default
    to: armed_home
    trigger: state
  - id: night
    entity_id:
    - alarm_control_panel.default
    to:
    - armed_night
    trigger: state
  - id: inactive
    entity_id:
    - alarm_control_panel.default
    to: disarmed
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'on'
      - condition: trigger
        id:
        - away
        - home
        - night
    then:
    - action: universal_notifier.send
      metadata: {}
      data:
        priority: false
        bold_prefix: false
        targets: mobile_drake
        message: Guest mode is on and the alarm changed to {{ trigger.to_state.state
          }}. Disarming.
    - action: alarmo.disarm
      data:
        entity_id: alarm_control_panel.default
        code: '{{ states(''input_text.alarmo_code_system'') }}'
      continue_on_error: true
    else:
    - choose:
      - conditions:
        - condition: trigger
          id: away
        - condition: state
          entity_id: binary_sensor.home_occupied
          state: 'off'
          enabled: false
        sequence:
        - target:
            floor_id:
