- id: '1687543330752'
  alias: Notification - Doorbell rang
  description: Sends interactive iOS notification with snapshot + 4 action buttons
    (View / Talk / Reply / Unlock) when doorbell is pressed. Critical at night.
  triggers:
  - entity_id: binary_sensor.front_door_doorbell
    from:
    to: 'on'
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: zone
      entity_id: person.drake
      zone: zone.home
    - condition: zone
      entity_id: person.shawna
      zone: zone.home
  actions:
  - action: persistent_notification.create
    data:
      message: Doorbell
      notification_id: doorbell
  - action: script.ring_keypad_ding_dong
    metadata: {}
    data: {}
    continue_on_error: true
  - action: media_player.play_media
    target:
      device_id:
      - d1c83e3e359f6742f2a2b1e2a1db34b9
      - 25a68f3dad657cd6fc4c062cd57287d9
    data:
      media:
        media_content_id: amzn_sfx_doorbell_chime_01
        media_content_type: sound
        metadata: {}
    continue_on_error: true
  - alias: Send actionable notification to iPhones
    action: notify.all_iphones
    data:
      title: "\U0001F514 Front Door"
      message: Someone is at the front door
      data:
        tag: doorbell-{{ now().strftime('%Y%m%d%H%M%S') }}
        group: doorbell
        url: /lovelace
        entity_id: camera.frontdoor
        attachment:
          content-type: jpeg
          hide-thumbnail: false
        push:
          sound:
            name: default
            critical: '{{ 1 if (now().hour >= 21 or now().hour < 7) else 0 }}'
            volume: 1
          interruption-level: '{{ ''critical'' if (now().hour >= 21 or now().hour
            < 7) else ''time-sensitive'' }}'
        actions:
        - action: DOORBELL_VIEW
          title: "\U0001F441 View Live"
          icon: sfsymbols:eye
          destructive: false
        - action: DOORBELL_TALK
          title: "\U0001F5E3 Be Right There"
          icon: sfsymbols:speaker.wave.2
          destructive: false
        - action: DOORBELL_REPLY
          title: "\U0001F4AC Quick Reply"
          icon: sfsymbols:bubble.left.fill
          destructive: false
        - action: DOORBELL_UNLOCK
          title: "\U0001F513 Unlock Door"
          icon: sfsymbols:lock.open.fill
          destructive: true
  mode: single
