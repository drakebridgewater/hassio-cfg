  mode: single
- id: '1777348509599'
  alias: Guest Mode - 24h Reminder
  description: 'When input_boolean.guest_mode has been on for 24 continuous hours,
    push an actionable notification to Drake''s iPhone asking whether to keep guest
    mode on or turn it off. Re-arms automatically every 24h while guest mode stays
    on (mode: restart on the trigger ensures a fresh 24h timer if guest mode is toggled
    off and back on). Tapping ''Turn Off'' flips input_boolean.guest_mode to off;
    tapping ''Keep On'' dismisses and the 24h cycle restarts. Goal is to prevent stale
    guest_mode state without forcing an arbitrary auto-expiry.'
  triggers:
  - platform: state
    entity_id: input_boolean.guest_mode
    to: 'on'
    for:
      hours: 24
  conditions: []
  actions:
  - service: ticker.notify
    data:
      category: Guest
      title: Guest Mode still on
      message: Guest mode has been on for 24 hours. Keep it on or turn it off?
      data:
        tag: guest_mode_24h_reminder
        actions:
        - action: GUEST_MODE_TURN_OFF
          title: Turn Off
          destructive: true
        - action: GUEST_MODE_KEEP_ON
          title: Keep On
    alias: Send actionable notification to Drake iPhone
  - alias: Wait for tap
    wait_for_trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: GUEST_MODE_TURN_OFF
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: GUEST_MODE_KEEP_ON
    timeout:
      hours: 24
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
          == ''GUEST_MODE_TURN_OFF'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.guest_mode
  mode: restart
- id: '1777470361572'
  alias: Lighting - Master Bathroom Blocker Reset on Motion
  description: When the lighting automation blocker turns on (typically from the Inovelli
    down-tap), wait until the room has been unoccupied for at least 2 minutes (covering
    the motion sensor's clear timeout), then wait for the next fresh off->on occupancy
    transition, then clear the blocker. This guarantees the lights stay off while
    the user is still in the room after tapping the switch, and resume normal motion
    behavior on the next entry. Mode 'restart' so a manual blocker re-toggle starts
    a fresh wait.
  triggers:
  - entity_id: input_boolean.lighting_automation_blocker_master_bathroom
    from: 'off'
    platform: state
    to: 'on'
  actions:
  - alias: Wait for sensor to be off for 2 minutes (sensor timeout buffer)
    wait_for_trigger:
    - entity_id: binary_sensor.master_bathroom_motion_sensor_occupancy
      for: 00:02:00
      from: 'on'
      platform: state
      to: 'off'
    continue_on_timeout: false
    timeout: '12:00:00'
  - alias: Wait for fresh motion entry
    wait_for_trigger:
    - entity_id: binary_sensor.master_bathroom_motion_sensor_occupancy
      from: 'off'
      platform: state
      to: 'on'
    continue_on_timeout: false
    timeout: '24:00:00'
  - action: input_boolean.turn_off
    data: {}
    target:
      entity_id: input_boolean.lighting_automation_blocker_master_bathroom
  mode: restart
- id: '1777849960816'
  alias: Doorbell - Action Handler
  description: Handles button taps from the doorbell actionable notification. Routes
    DOORBELL_VIEW / DOORBELL_TALK / DOORBELL_REPLY / DOORBELL_UNLOCK to the right
