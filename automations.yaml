  triggers:
  - entity_id: alarm_control_panel.default
    platform: state
    to: disarmed
  conditions:
  - condition: state
    entity_id: input_boolean.panic_active
    state: 'on'
  actions:
  - action: script.panic_stand_down
  mode: single
- id: '1780682672870'
  alias: 'Laundry: Unified Washer Actionable Flow & Nag'
  description: ''
  triggers:
  - entity_id: sensor.washer_current_status
    to: end
