- id: '1638317576424'
  alias: Presence - Away
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.home_occupied
    to: 'off'
    from: 'on'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  actions:
  - action: alarmo.arm
    metadata: {}
    data:
      mode: away
      entity_id: alarm_control_panel.default
      skip_delay: true
      force: true
      code: '{{ states(''input_text.alarmo_code_system'') }}'
  mode: single
- id: '1670179035186'
  alias: Guest Mode
  description: 'Reacts to input_boolean.guest_mode being toggled and to person.named_guest
    entering/leaving zone.home. On enable: marks device_tracker.guest as home and
    blocks lighting automations in the office (guest sleeping space) and basement
    bathroom. On disable: reverses both. Goal: guest_mode is programmatically determined
    (calendar today, future device-less detection like BLE/MAC/facial recognition);
    no guest device should ever be required.'
  triggers:
  - id: enabled
    entity_id:
    - input_boolean.guest_mode
    from: 'off'
    to: 'on'
    platform: state
  - id: disabled
    entity_id:
    - input_boolean.guest_mode
    from: 'on'
    to: 'off'
    platform: state
  - entity_id: person.named_guest
    zone: zone.home
    event: enter
    id: named_guest_enabled
    platform: zone
  - entity_id: person.named_guest
    zone: zone.home
    event: leave
    id: named_guest_disabled
    platform: zone
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: enabled
      sequence:
      - data:
          dev_id: guest
          location_name: home
        action: device_tracker.see
    - conditions:
      - condition: trigger
        id: disabled
      sequence:
      - data:
          dev_id: guest
          location_name: not_home
        enabled: true
        action: device_tracker.see
  - choose:
    - conditions:
      - condition: trigger
        id:
        - enabled
        - named_guest_enabled
      sequence:
      - data: {}
        action: input_boolean.turn_on
        target:
          entity_id:
          - input_boolean.lighting_automation_blocker_office_room
          - input_boolean.lighting_automation_blocker_basement_bathroom
    - conditions:
      - condition: trigger
        id:
        - disabled
        - named_guest_disabled
      sequence:
      - data: {}
        target:
          entity_id:
          - input_boolean.lighting_automation_blocker_office_room
          - input_boolean.lighting_automation_blocker_basement_bathroom
        action: input_boolean.turn_off
  mode: single
- id: '1670181006472'
  alias: Presence - Trigger When Entering Home
  description: Disarms Alarmo when a household member arrives home, attributing the
    disarm to the specific person via their internal Alarmo user (Drake_Internal /
    Shawna_Internal, so the Alarmo log separates auto-disarms from typed keypad PINs)
    AND a logbook.log entry (so HA's logbook shows who). Codes live in
    input_text.alarmo_code_<name> helpers; anyone without a valid helper code falls
    back to the System user. Guest mode disarm sends an actionable notification to
    Drake with a re-arm escape hatch.
  triggers:
  - platform: zone
    entity_id: person.drake
    zone: zone.home
    event: enter
    id: person_drake
  - platform: zone
    entity_id: person.shawna
    zone: zone.home
    event: enter
    id: person_shawna
  - platform: zone
    entity_id: person.ethan
    zone: zone.home
    event: enter
    id: person_ethan
  - platform: zone
    entity_id: person.abby
    zone: zone.home
    event: enter
    id: person_abby
  - platform: zone
    entity_id: person.named_guest
    zone: zone.home
    event: enter
    id: person_named_guest
  - platform: state
    entity_id:
    - input_boolean.guest_mode
    to: 'on'
    from: 'off'
    id: guest_mode_enabled
  - platform: state
    entity_id:
    - binary_sensor.home_occupied
    to: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: home_occupied
  conditions: []
  actions:
  - alias: Determine actor and code based on trigger
    variables:
      actor_name: '{% if trigger.id == ''person_drake'' %}Drake{% elif trigger.id
        == ''person_shawna'' %}Shawna{% elif trigger.id == ''person_ethan'' %}Ethan{%
        elif trigger.id == ''person_abby'' %}Abby{% elif trigger.id == ''person_named_guest''
        %}Guest{% elif trigger.id == ''guest_mode_enabled'' %}Guest Mode{% else %}Household{%
        endif %}'
      actor_code: >-
        {% set map = {
             'person_drake': 'input_text.alarmo_code_drake',
             'person_shawna': 'input_text.alarmo_code_shawna',
             'person_named_guest': 'input_text.alarmo_code_guest'
           } %}
        {% set code = states(map.get(trigger.id, 'input_text.alarmo_code_system')) %}
        {{ code if code is match('^[0-9]{4,32}$') else states('input_text.alarmo_code_system') }}
      actor_entity: '{% if trigger.id.startswith(''person_'') %}{{ trigger.entity_id
        }}{% else %}automation.presence_trigger_when_entering_home{% endif %}'
  - alias: Log attribution to HA logbook (always, even if alarm wasn't actually armed)
    action: logbook.log
    data:
      name: '{{ actor_name }}'
      message: '{% if trigger.id.startswith(''person_'') %}arrived home — auto-disarm
        requested{% elif trigger.id == ''guest_mode_enabled'' %}guest mode enabled
        — auto-disarm requested{% else %}home occupied — auto-disarm requested{% endif
        %}'
      entity_id: alarm_control_panel.default
      domain: alarm_control_panel
  - alias: Only disarm if alarm is actually armed
    if:
    - condition: state
      entity_id: alarm_control_panel.default
      state:
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation
      - armed_custom_bypass
      - arming
      - pending
    then:
    - action: alarmo.disarm
      data:
        entity_id: alarm_control_panel.default
        code: '{{ actor_code }}'
      continue_on_error: true
  - alias: Guest-mode-specific actionable notification flow
    if:
    - condition: trigger
      id: guest_mode_enabled
    then:
    - service: ticker.notify
      data:
        category: Guest
        title: Alarm Disarmed (Guest Mode)
        message: Guest mode just turned on, so the alarm was disarmed. Stay disarmed,
          or re-arm and turn guest mode off?
        data:
          tag: guest_mode_disarm
          actions:
          - action: GUEST_DISARM_REARM
            title: Re-arm & turn off Guest Mode
            destructive: true
          - action: GUEST_DISARM_STAY
            title: Stay Disarmed
      alias: Notify Drake iPhone with re-arm option
    - alias: Wait for tap
      wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: GUEST_DISARM_REARM
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: GUEST_DISARM_STAY
      timeout:
        minutes: 30
      continue_on_timeout: true
    - alias: If user chose re-arm, re-arm Alarmo and turn off guest mode
      choose:
      - conditions:
        - condition: template
          value_template: '{{ wait.trigger is not none and wait.trigger.event.data.action
            == ''GUEST_DISARM_REARM'' }}'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guest_mode
        - action: alarmo.arm
          data:
            entity_id: alarm_control_panel.default
            mode: away
            code: '{{ states(''input_text.alarmo_code_system'') }}'
            force: true
            skip_delay: true
  mode: queued
  max: 5
