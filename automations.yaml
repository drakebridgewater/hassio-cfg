  - minutes: /5
    platform: time_pattern
  conditions:
  - alias: Skip heartbeat if alarm is disarmed
    condition: template
    value_template: '{{ states(''sensor.active_critical_notification'') not in [''Disarmed'',
      ''unknown'', ''unavailable''] }}'
  actions:
  - alias: Re-trigger apply automation to refresh critical LED state (bypass trigger
      requirement)
    action: automation.trigger
