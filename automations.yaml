          action: fan.turn_off
          continue_on_error: true
        - target:
            area_id: garage
            floor_id:
            - basement
            - main
          data: {}
          action: switch.turn_off
          continue_on_error: true
        - data: {}
          target:
            area_id: garage
          action: cover.close_cover
          continue_on_error: true
        - data: {}
          enabled: true
          action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.lighting_automation_blocker_master_closet
            - input_boolean.lighting_automation_blocker_kitchen
            - input_boolean.lighting_automation_blocker_stairs
            - input_boolean.lighting_automation_blocker_basement_bathroom
            - input_boolean.lighting_automation_blocker_basement_hallway
            - input_boolean.lighting_automation_blocker_family_room
            - input_boolean.lighting_automation_blocker_master_bathroom
            - input_boolean.lighting_automation_blocker_office_room
          continue_on_error: true
        - action: universal_notifier.send
          metadata: {}
          data:
            targets: mobile_drake
            priority: false
            bold_prefix: false
            title: Alarm Updated
            message: '**ARMED**'
        - metadata: {}
          data: {}
          action: media_player.media_stop
          target:
            floor_id:
            - basement
            - main
          continue_on_error: true
      - conditions:
        - condition: trigger
          id: night
        sequence:
        - action: universal_notifier.send
          metadata: {}
          data:
            targets: mobile_drake
            priority: false
            bold_prefix: false
            title: Alarm Updated
            message: Armed Night
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            floor_id:
            - basement
            - main
          continue_on_error: true
        - data: {}
          enabled: true
          action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.lighting_automation_blocker_office_room
            - input_boolean.lighting_automation_blocker_family_room
            - input_boolean.lighting_automation_blocker_basement_hallway
            - input_boolean.lighting_automation_blocker_basement_bathroom
            - input_boolean.lighting_automation_blocker_kitchen
            - input_boolean.lighting_automation_blocker_garage
            - input_boolean.lighting_automation_blocker_stairs
          continue_on_error: true
      - conditions:
        - condition: trigger
          id: home
        sequence:
        - action: universal_notifier.send
          metadata: {}
          data:
            targets: mobile_drake
            priority: false
            bold_prefix: false
            title: Alarm Updated
            message: Armed Home
        - action: light.turn_off
          metadata: {}
          data: {}
          target:
            floor_id:
            - basement
            - main
          continue_on_error: true
        - data: {}
          enabled: true
          action: input_boolean.turn_off
          target:
            entity_id:
            - input_boolean.lighting_automation_blocker_office_room
            - input_boolean.lighting_automation_blocker_family_room
            - input_boolean.lighting_automation_blocker_basement_hallway
            - input_boolean.lighting_automation_blocker_basement_bathroom
            - input_boolean.lighting_automation_blocker_kitchen
            - input_boolean.lighting_automation_blocker_garage
            - input_boolean.lighting_automation_blocker_stairs
          continue_on_error: true
      - conditions:
        - condition: trigger
          id: inactive
        sequence:
        - action: universal_notifier.send
          metadata: {}
          data:
            targets: mobile_drake
            priority: false
            bold_prefix: false
            title: Alarm Updated
            message: Inactive
        - data: {}
          enabled: true
          action: input_boolean.turn_off
