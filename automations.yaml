- id: '1736262664324'
  alias: Ethan's Bedtime Routine
  description: "This automation is set to start at a specific time we've chosen for
    Ethan's bedtime. It only runs if our alarm system is disarmed and Ethan's bedroom
    light is off.\nHere's the step-by-step flow:\n1. Initial Warning (5 min before
    cleanup): It broadcasts a message saying, \"Ethan bedtime is soon. Let's have
    5 more minutes of play then we can clean up.\" \n2. Cleanup Prompt: After 5 minutes,
    it broadcasts, \"Time to clean up. Let's make sure all our toys are put in our
    room or in the bins.\" \n3. Bath Decision Point: After another 5 minutes, it asks,
    \"Ethan, did you get everything cleaned up. Do you want to take a bath?\"\n    \n
    \   a. If the bath light is turned on within 5 minutes: The automation assumes
    a\n    bath is happening. It will then announce, \"Looks like we're taking a bath!\",\n
    \   give a 15-minute warning (after 3 min delay), a 10-minute warning (after\n
    \   another 5 min delay), and then repeatedly prompt \"Ethan, time to get out
    of\n    the bath\" every 5 minutes until the bath light is turned off.\n  \n    b.
    If the bath light remains off: The automation assumes no bath. It\n    broadcasts,
    \"Ethan, let's skip bath tonight and read a book! Let's go\n    downstairs, get
    ready for bed, and pick out a book.\" It then waits for the\n    downstairs light
    to turn on, announces \"So many book choices...\", and waits\n    for that light
    to turn off. \n\n4. Final Wind-down: Regardless of the bath choice, it then broadcasts,
    \"Don't forget to brush your teeth. Goodnight Ethan.\" \n5. Optional Snack/Milk:
    After a 5-minute delay, if Ethan's bedroom light is still off, it offers, \"Would
    you like one last snack or milk before bed?\"\nThis routine aims to provide gentle,
    timed prompts to help Ethan transition smoothly through his evening activities."
  triggers:
  - at: input_datetime.ethan_s_bedtime
    platform: time
  conditions:
  - condition: state
    entity_id: alarm_control_panel.default
    state: disarmed
  - condition: device
    type: is_off
    device_id: c8d90d418ff1048266a66863b81ddf34
    entity_id: 45210a8d951016e08349e3759de2023e
    domain: light
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: 'Ethan bedtime is soon. Let''s have 5 more minutes of play then we can
        clean up. '
    enabled: false
    alias: 5m warning
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    enabled: false
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: Time to clean up. Let's make sure all our toys are put in our room or
        in the bins.  Then we can decide if we'll take a bath today
    enabled: true
    alias: clean up -> 5m-> bath
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: It's now bath time if you'd like to take a bath.
    enabled: true
    alias: Bath time
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: Ethan, 10 minutes until it's pajamas and a book time! Would you like
        a snack while we read?
    enabled: true
    alias: 10->book
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: Ethan, Let's get ready for bed with a book
    enabled: true
    alias: book time
  - delay:
      hours: 0
      minutes: 13
      seconds: 0
      milliseconds: 0
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: '2 more minutes of books until we head to bed. '
    enabled: true
    alias: book time
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - alias: Goodnight
    action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: Goodnight Ethan! Don't forget to brush your teeth
    enabled: true
  - if:
    - condition: device
      type: is_off
      device_id: c8d90d418ff1048266a66863b81ddf34
      entity_id: 45210a8d951016e08349e3759de2023e
      domain: light
    then:
    - wait_for_trigger:
      - type: turned_on
        device_id: c8d90d418ff1048266a66863b81ddf34
        entity_id: 45210a8d951016e08349e3759de2023e
        domain: light
        trigger: device
        for:
          hours: 0
          minutes: 0
          seconds: 0
      timeout:
        hours: 0
        minutes: 5
        seconds: 0
        milliseconds: 0
    enabled: false
  - choose:
    - conditions:
      - condition: device
        type: is_on
        device_id: c8d90d418ff1048266a66863b81ddf34
        entity_id: 45210a8d951016e08349e3759de2023e
        domain: light
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: Looks like we're taking a bath!
      - delay:
          hours: 0
          minutes: 3
          seconds: 0
          milliseconds: 0
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: Ethan, 15 more minutes of bathtime
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: Ethan, 10 minutes of bathtime
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - repeat:
          until:
          - condition: device
            type: is_off
            device_id: c8d90d418ff1048266a66863b81ddf34
            entity_id: 45210a8d951016e08349e3759de2023e
            domain: light
          sequence:
          - delay:
              hours: 0
              minutes: 5
              seconds: 0
              milliseconds: 0
          - action: input_text.set_value
            target:
              entity_id: input_text.broadcast_message
            data:
              value: 'Ethan, time to get out of the bath. '
    - conditions:
      - condition: device
        type: is_off
        device_id: c8d90d418ff1048266a66863b81ddf34
        entity_id: 45210a8d951016e08349e3759de2023e
        domain: light
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: Ethan, let's skip bath tonight and read a book! Let's go downstairs,
            get ready for bed, and pick out a book.
      - wait_for_trigger:
        - type: turned_on
          device_id: 3e9a9933634c5a379e9d694574f55695
          entity_id: 3b70fdf99e17508232a9e8d4b3eca2c3
          domain: light
          trigger: device
        timeout:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: input_text.set_value
        target:
          entity_id: input_text.broadcast_message
        data:
          value: So many book choices. What are you going to choose tonight?
      - wait_for_trigger:
        - type: turned_off
          device_id: 3e9a9933634c5a379e9d694574f55695
          entity_id: 3b70fdf99e17508232a9e8d4b3eca2c3
          domain: light
          trigger: device
        timeout:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
    enabled: false
  - action: input_text.set_value
    target:
      entity_id: input_text.broadcast_message
    data:
      value: Don't forget to brush your teeth. Goodnight Ethan
    enabled: false
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
    enabled: false
  mode: single
