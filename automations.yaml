            tag: doorbell-unlocked
  mode: parallel
  variables:
    announce_target_map:
      All Echo Devices: media_player.all_echo_devices
      Family Room Echo: media_player.family_room_echo
      Living Room Echo: media_player.drake_s_echo
    echo_target: '{{ announce_target_map[states(''input_select.doorbell_announce_target'')]
      | default(''media_player.drake_s_echo'') }}'
- id: '1777854761693'
  alias: Panic - Stand Down on Disarm
  description: Fires when Alarmo is disarmed during an active panic event. The disarm
    acts as the universal 'stop' signal — happens via Ring keypad code or dashboard.
